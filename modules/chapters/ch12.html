the system to test for leaks.", "trap_note": "", "image_data_uri": "", "word_choices": ["soap-water solution", "oxyacetylene mixture", "inert gas", "butane solution"], "correct_choice_index": 2, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Leak Detection Methods, Dry Nitrogen & Trace Gas Rules", "context_quote": "If the system does not contain refrigerant, an inert gas (such as nitrogen or carbon dioxide) is used to pressurize the system to check for leaks. It is always preferable to use an inert gas for leak detection before charging an empty system with more refrigerant to detect a leak. Refrigerants are much more expensive than nitrogen or carbon dioxide. If the entire refrigerant charge has not leaked out, however, use the refrigerant already in the system to test for leaks.", "context_source": "Chapter 12, Section 12.3: Locating and Repairing Refrigerant Leaks (Textbook p. 233)"}, {"id": "s4", "section_id": "12.5", "card_type": "concept", "front": "Which evacuation method involves charging a unit with nitrogen to absorb moisture? - [?]", "back": "Triple evacuation", "guided_prefix": "In Charging a Unit, answer 'Which evacuation method involves charging a unit with nitrogen to absorb moisture' - the verified term or value is", "guided_blank": "Triple evacuation", "guided_suffix": ".", "trap_note": "", "image_data_uri": "", "word_choices": ["Triple evacuation", "Vapor evacuation", "Deep evacuation", "Passive evacuation"], "correct_choice_index": 0, "is_epa_608": false, "epa_608_category": "", "epa_608_topic": "", "context_quote": "Triple evacuation is an evacuation method in which a technician uses a vacuum pump to pull a vacuum of 1500 microns three times. After the first and second vacuum, the technician charges the system back up to a pressure between 0 psig and 3 psig with nitrogen. When the vacuum is drawn on the system, moisture evaporates into water vapor. When small amounts of nitrogen are charged into the system, some of the moisture (in vapor form) remaining in the system is absorbed into the nitrogen.", "context_source": "Chapter 12, Section 12.4: Evacuating a System (Textbook p. 240)"}, {"id": "s5", "section_id": "12.2", "card_type": "concept", "front": "Concept Completion (Redistributing Refrigerant): When charging a unit with refrigerant, the technician should put the low- and high-side service valves in [?].", "back": "mid-position", "guided_prefix": "When charging a unit with refrigerant, the technician should put the low- and high-side service valves in", "guided_blank": "mid-position", "guided_suffix": ".", "trap_note": "", "image_data_uri": "", "word_choices": ["front-seated position", "any position", "back-seated position", "mid-position"], "correct_choice_index": 3, "is_epa_608": true, "epa_608_category": "Type II", "epa_608_topic": "Liquid Receiver Pump-Down, Service Valves & Filter-Drier Replacement", "context_quote": "4. Zero the digital charging scale. 5. Close the high-side valve on the gauge manifold. 6. Put the low-side service valve and high-side service valve in the mid-position. 7. Start the compressor and then open the refrigerant cylinder valve to add refrigerant to the low side of the system.", "context_source": "Chapter 12, Section 12.5: Charging a System (Textbook p. 245)"}, {"id": "s6", "section_id": "12.1", "card_type": "concept", "front": "What is the superheat of a unit if the refrigerant temperature in the suction line is 58°F, its pressure in the evaporator is 60 psig, and its temperature in the evaporator is 34°F? - [?]", "back": "24°F.", "guided_prefix": "In Checking Refrigerant Charge, the superheat of a system if the refrigerant temperature in the suction line is 58°F, its pressure in the evaporator is 60 psig, and its temperature in the evaporator is 34°F is", "guided_blank": "24°F.", "guided_suffix": ".", "trap_note": "", "image_data_uri": "", "word_choices": ["32°F.", "24°F.", "26°F.", "28°F."], "correct_choice_index": 1, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Saturation, Temperature-Pressure (T/P) Chart, Superheat & Subcooling", "context_quote": "This practice will prevent ambient air from affecting the temperature reading. Superheat/subcooling calculators are useful for this step, Figure 12-3. 9. Subtract evaporator saturation temperature, determined by the pressure measurement, from the temperature of the suction line near the compressor to determine the superheat value. 10. Compare the calculated superheat value to the target superheat for the measured wet-bulb and dry-bulb temperatures.", "context_source": "Chapter 12, Section 12.1: Checking Refrigerant Charge (Textbook p. 223)"}, {"id": "s7", "section_id": "12.1", "card_type": "term", "front": "Concept Completion (Checking Refrigerant Charge): The process of pumping a unit's entire refrigerant charge into the liquid receiver is called a(n) [?].", "back": "pump-down", "guided_prefix": "The process of pumping a unit's entire refrigerant charge into the liquid receiver is called a(n)", "guided_blank": "pump-down", "guided_suffix": ".", "trap_note": "", "image_data_uri": "", "word_choices": ["triple evacuation", "pump-down", "evacuation", "recovery"], "correct_choice_index": 1, "is_epa_608": true, "epa_608_category": "Type II", "epa_608_topic": "Liquid Receiver Pump-Down, Service Valves & Filter-Drier Replacement", "context_quote": "A pump-down is a procedure that involves relocating a system's entire refrigerant charge into its liquid receiver. With the liquid receiver service valve front seated, refrigerant will not be able to exit the liquid receiver. The compressor is used to pump most of the system's refrigerant into the liquid receiver. Pump-down procedures are useful when repairing leaks, adjusting low-side pressure controls, and replacing components, such as various valves and filter-driers.", "context_source": "Chapter 12, Section 12.2: Redistributing Refrigerant (Textbook p. 223)"}, {"id": "s8", "section_id": "12.1", "card_type": "concept", "front": "Concept Completion (Checking Refrigerant Charge): To determine a unit's subcooling value, the liquid line temperature should be subtracted from the [?] temperature.", "back": "condenser", "guided_prefix": "To determine a system's subcooling value, the liquid line temperature should be subtracted from the", "guided_blank": "condenser", "guided_suffix": "temperature.", "trap_note": "", "image_data_uri": "", "word_choices": ["suction line", "compressor", "condenser", "evaporator"], "correct_choice_index": 2, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Saturation, Temperature-Pressure (T/P) Chart, Superheat & Subcooling", "context_quote": "5. To determine the subcooling value, subtract the measured liquid line temperature from saturation temperature value. 6. Saturation temperature - Liquid line temperature = Subcooling 7. Look up the manufacturer subcooling value. 8. Compare the calculated subcooling value with manufacturer specifications. Note the difference, if any. If subcooling is too low, it may indicate that there is not enough refrigerant in the system. If subcooling is too high, it may indicate that there is too much refrigerant in the system.", "context_source": "Chapter 12, Section 12.1: Checking Refrigerant Charge (Textbook p. 221)"}, {"id": "s9", "section_id": "12.2", "card_type": "concept", "front": "Concept Completion (Redistributing Refrigerant): Many recovery cylinders use a [?] as a safety component to turn off the recovery machine when the cylinder is 80% full.", "back": "liquid level switch", "guided_prefix": "Many recovery cylinders use a", "guided_blank": "liquid level switch", "guided_suffix": "as a safety device to turn off the recovery machine when the cylinder is 80% full.", "trap_note": "", "image_data_uri": "", "word_choices": ["pressure relief valve", "liquid level switch", "low-side float", "filter-drier"], "correct_choice_index": 1, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Recovery Cylinders, 80% Fill Limit, Tare Weight & DOT Shipping", "context_quote": "If a recovery cylinder has a liquid level switch or high-pressure switch that is wired to the recovery machine, the machine will turn off when the recovery cylinder becomes 80% full, Figure 12-12. However, it is not good to rely on this function for turning off a recovery machine. It is designed as a safety precaution, not a regular shutoff. The mechanical parts of these safety devices could malfunction and cause unsafe conditions. Turning off a recovery machine manually is the preferred, and safest, method.", "context_source": "Chapter 12, Section 12.2: Redistributing Refrigerant (Textbook p. 231)"}, {"id": "s10", "section_id": "12.2", "card_type": "concept", "front": "Compute the tare weight of a cylinder if its total weight is 590 lb and the weight of refrigerant in the cylinder is 450 lb. - [?]", "back": "140 lb", "guided_prefix": "In Redistributing Refrigerant, answer 'Compute the tare weight of a cylinder if its total weight is 590 lb and the weight of refrigerant in the cylinder is 450 lb' - the verified term or value is", "guided_blank": "140 lb", "guided_suffix": ".", "trap_note": "", "image_data_uri": "", "word_choices": ["590 lb", "450 lb", "140 lb", "1,040 lb"], "correct_choice_index": 2, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Recovery Cylinders, 80% Fill Limit, Tare Weight & DOT Shipping", "context_quote": "Find the cylinder's tare weight (weight of the empty cylinder) and calculate the total maximum weight the recovery cylinder and refrigerant can weigh. 6. Switch on the recovery machine. 7. As the recovery machine is operating, make sure the weight of refrigerant in the cylinder does not exceed the safe limit. 8. Watch the gauges on the gauge manifold for a vacuum reading.", "context_source": "Chapter 12, Section 12.2: Redistributing Refrigerant (Textbook p. 226)"}, {"id": "s11", "section_id": "12.2", "card_type": "term", "front": "Concept Completion (Redistributing Refrigerant): Subcooling denotes the amount of [?] removed from a refrigerant after it has condensed.", "back": "sensible heat", "guided_prefix": "Subcooling refers to the amount of", "guided_blank": "sensible heat", "guided_suffix": "removed from a refrigerant after it has condensed.", "trap_note": "", "image_data_uri": "", "word_choices": ["sensible heat", "pressure", "latent heat", "volume"], "correct_choice_index": 0, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Saturation, Temperature-Pressure (T/P) Chart, Superheat & Subcooling", "context_quote": "Subcooling is used for checking refrigerant charge in a system that uses a thermostatic expansion valve as its metering device. Subcooling refers to the amount of heat removed from a refrigerant after it has condensed. It is equal to the temperature drop of refrigerant in the liquid line from high-side saturation temperature, which is the temperature at which high-side refrigerant vapor condenses into a liquid.", "context_source": "Chapter 12, Section 12.1: Checking Refrigerant Charge (Textbook p. 221)"}, {"id": "s12", "section_id": "12.2", "card_type": "term", "front": "Concept Completion (Redistributing Refrigerant): Pressure that is greater than atmospheric pressure is termed [?] pressure.", "back": "positive", "guided_prefix": "Pressure that is greater than atmospheric pressure is termed", "guided_blank": "positive", "guided_suffix": "pressure.", "trap_note": "", "image_data_uri": "", "word_choices": ["vacuum", "negative", "high-side", "positive"], "correct_choice_index": 3, "is_epa_608": false, "epa_608_category": "", "epa_608_topic": "", "context_quote": "The following inert gases may be used for developing pressures in refrigeration lines: carbon dioxide, nitrogen, and argon. These three inert gases are safe if used with a pressure regulator and a pressure-relief valve. At the start of testing, a positive pressure (greater than atmospheric pressure) of 5-30 psig is necessary throughout the refrigeration system. Large leaks may be detected by an audible hissing sound or may easily be found using a bubble solution or ultrasonic detector.", "context_source": "Chapter 12, Section 12.3: Locating and Repairing Refrigerant Leaks (Textbook p. 233)"}, {"id": "s13", "section_id": "12.2", "card_type": "concept", "front": "Concept Completion (Redistributing Refrigerant): Two-part epoxy resin kits generally include one tube filled with epoxy and another tube filled with a(n) [?].", "back": "hardener", "guided_prefix": "Two-part epoxy resin kits generally include one tube filled with epoxy and another tube filled with a(n)", "guided_blank": "hardener", "guided_suffix": ".", "trap_note": "", "image_data_uri": "", "word_choices": ["burner fuel", "acid solution", "glue", "hardener"], "correct_choice_index": 3, "is_epa_608": false, "epa_608_category": "", "epa_608_topic": "", "context_quote": "Epoxy resin is a thermosetting polymer that forms a strong adhesive. It may be used to repair cracks and leaks in evaporators and joints. Epoxy resin has good adhesion qualities when used with aluminum, steel, copper, and many plastics. The most effective type of epoxy resin is the two-part system. This consists of an epoxy resin and a hardener in two jars or tubes, Figure 12-15. These two paste-like substances harden at room temperature when mixed together. One-part epoxies must be heated to harden, Figure 12-16.", "context_source": "Chapter 12, Section 12.3: Locating and Repairing Refrigerant Leaks (Textbook p. 236)"}, {"id": "s14", "section_id": "12.3", "card_type": "concept", "front": "Concept Check (Locating and Repairing Refrigerant Leaks): Identify the missing technical term - The liquid receiver service valve (king valve) should be front seated so as to perform a [?].", "back": "Verified Rule (TRUE): The liquid receiver service valve (king valve) should be front seated so as to perform a pump-down.", "guided_prefix": "The liquid receiver service valve (king valve) should be front seated so as to perform a", "guided_blank": "pump-down", "guided_suffix": ".", "trap_note": "", "image_data_uri": "", "word_choices": ["condenser", "low-pressure", "vacuum", "pump-down"], "correct_choice_index": 3, "is_epa_608": true, "epa_608_category": "Type II", "epa_608_topic": "Liquid Receiver Pump-Down, Service Valves & Filter-Drier Replacement", "context_quote": "A pump-down is a procedure that involves relocating a system's entire refrigerant charge into its liquid receiver. With the liquid receiver service valve front seated, refrigerant will not be able to exit the liquid receiver. The compressor is used to pump most of the system's refrigerant into the liquid receiver. Pump-down procedures are useful when repairing leaks, adjusting low-side pressure controls, and replacing components, such as various valves and filter-driers.", "context_source": "Chapter 12, Section 12.2: Redistributing Refrigerant (Textbook p. 223)"}, {"id": "s15", "section_id": "12.2", "card_type": "exam_trap", "front": "Exam Trap Check (Redistributing Refrigerant): Complete the corrected rule - Passive [?] is NOT generally used on larger units.", "back": "FALSE on Exam — True rule: Passive recovery is NOT generally used on larger units.", "guided_prefix": "Passive", "guided_blank": "recovery", "guided_suffix": "is NOT generally used on larger units.", "trap_note": "Common Misconception (FALSE on Exam): Do NOT accept the claim that passive recovery is generally used on larger units.", "image_data_uri": "", "word_choices": ["recovery", "charged", "hardener", "positive"], "correct_choice_index": 0, "is_epa_608": true, "epa_608_category": "Type I", "epa_608_topic": "Type I Passive (System-Dependent) Recovery & 15 lb Limit", "context_quote": "Passive recovery is a process of recovering vapor refrigerant from a system using that system's static pressure to force vapor refrigerant into an unpressurized recovery container. The passive recovery method is generally used on smaller systems with charges of 5 lb of refrigerant or less.", "context_source": "Chapter 12, Section 12.2: Redistributing Refrigerant (Textbook p. 224)"}, {"id": "s16", "section_id": "12.2", "card_type": "concept", "front": "Concept Check (Redistributing Refrigerant): Identify the missing technical term - Zeotropic refrigerant blends should properly be [?] as a liquid.", "back": "Verified Rule (TRUE): Zeotropic refrigerant blends should properly be charged as a liquid.", "guided_prefix": "Zeotropic refrigerant blends should properly be", "guided_blank": "charged", "guided_suffix": "as a liquid.", "trap_note": "", "image_data_uri": "", "word_choices": ["140 lb", "charged", "passive", "harden"], "correct_choice_index": 1, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Refrigerant Blends, Temperature Glide, Fractionation & Bubble/Dew Points", "context_quote": "Pure refrigerants, such as R-134a, should be vapor charged to prevent compressor slugging. Zeotropic refrigerant blends (400 series refrigerants) should always be liquid charged. The different refrigerants that make up a zeotropic refrigerant blend vaporize at different temperatures. For this reason, if a zeotropic blend is charged into a system as a vapor, the individual refrigerants will fractionate (split into their component refrigerants).", "context_source": "Chapter 12, Section 12.5: Charging a System (Textbook p. 243)"}, {"id": "s17", "section_id": "12.2", "card_type": "exam_trap", "front": "Exam Trap Check (Redistributing Refrigerant): Complete the corrected rule - The amount of refrigerant that a cylinder cannot safely hold is 90% of the [?] of water that it can hold.", "back": "FALSE on Exam — True rule: The amount of refrigerant that a cylinder cannot safely hold is 90% of the volume of water that it can hold. (The maximum amount of refrigerant that may be stored in a recovery cylinder is equal to 80% of the cylinder's water capacity by weight.)", "guided_prefix": "The amount of refrigerant that a cylinder cannot safely hold is 90% of the", "guided_blank": "volume", "guided_suffix": "of water that it can hold.", "trap_note": "Common Misconception (FALSE on Exam): Do NOT accept the claim that the amount of refrigerant that a cylinder can safely retain is 90% of the volume of water that it can retain. Related verified rule: The maximum amount of refrigerant that may be stored in a recovery cylinder is equal to 80% of the cylinder's water capacity by weight.", "image_data_uri": "", "word_choices": ["140 lb", "charged", "harden", "volume"], "correct_choice_index": 3, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Recovery Cylinders, 80% Fill Limit, Tare Weight & DOT Shipping", "context_quote": "AHRI Guideline K takes into account that each refrigerant has a different density. Since refrigerants have different densities, their weights will vary at 80% water capacity. Remember that water capacity is the weight of the volume of a full cylinder. If liquid refrigerant fills 80% of a cylinder and is less dense than water, it will weigh less than the same volume of water. If the refrigerant is denser than water, it will weigh more than the same volume of water. The denser a refrigerant is, the more it can weigh while being safely stored in a cylinder.", "context_source": "Chapter 12, Section 12.2: Redistributing Refrigerant (Textbook p. 230)"}, {"id": "s18", "section_id": "12.3", "card_type": "concept", "front": "Concept Check (Locating and Repairing Refrigerant Leaks): Identify the missing technical term - A unit should have [?] flowing nitrogen within before a leak is fixed by brazing.", "back": "Verified Rule (TRUE): A unit should have low-pressure flowing nitrogen within before a leak is fixed by brazing.", "guided_prefix": "A unit should have", "guided_blank": "low-pressure", "guided_suffix": "flowing nitrogen within before a leak is fixed by brazing.", "trap_note": "", "image_data_uri": "", "word_choices": ["pump-down", "vacuum", "mid-position", "low-pressure"], "correct_choice_index": 3, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Leak Detection Methods, Dry Nitrogen & Trace Gas Rules", "context_quote": "To repair a leak, recover the refrigerant from that part of the system. In some cases, the entire refrigerant charge will have to be recovered from the system. After recovering the refrigerant, check the system pressure to be sure it is 0 psig (neither having pressure nor being in vacuum). Purge the system with an inert gas, such as nitrogen, prior to brazing to flush any debris from the tubing. During brazing, arrange for a continuous low-pressure flow of nitrogen (1-2 psi) to pass through the part of the system being brazed. This prevents oxides from forming inside the tubing during brazing.", "context_source": "Chapter 12, Section 12.3: Locating and Repairing Refrigerant Leaks (Textbook p. 235)"}, {"id": "s19", "section_id": "12.2", "card_type": "exam_trap", "front": "Exam Trap Check (Redistributing Refrigerant): Complete the corrected rule - Two-part epoxy resins must NOT be heated in order to [?].", "back": "FALSE on Exam — True rule: Two-part epoxy resins must NOT be heated in order to harden. (Two-part epoxy resin kits generally include one tube filled with epoxy and another tube filled with a(n) hardener.)", "guided_prefix": "Two-part epoxy resins must NOT be heated in order to", "guided_blank": "harden", "guided_suffix": ".", "trap_note": "Common Misconception (FALSE on Exam): Do NOT accept the claim that two-part epoxy resins must be heated so as to harden. Related verified rule: Two-part epoxy resin kits generally include one tube filled with epoxy and another tube filled with a(n) hardener.", "image_data_uri": "", "word_choices": ["charged", "harden", "volume", "140 lb"], "correct_choice_index": 1, "is_epa_608": false, "epa_608_category": "", "epa_608_topic": "", "context_quote": "Epoxy resin is a thermosetting polymer that forms a strong adhesive. It may be used to repair cracks and leaks in evaporators and joints. Epoxy resin has good adhesion qualities when used with aluminum, steel, copper, and many plastics. The most effective type of epoxy resin is the two-part system. This consists of an epoxy resin and a hardener in two jars or tubes, Figure 12-15. These two paste-like substances harden at room temperature when mixed together. One-part epoxies must be heated to harden, Figure 12-16.", "context_source": "Chapter 12, Section 12.3: Locating and Repairing Refrigerant Leaks (Textbook p. 236)"}, {"id": "s20", "section_id": "12.4", "card_type": "exam_trap", "front": "Exam Trap Check (Evacuating a System): Complete the corrected rule - Longer vacuum pump service lines are NOT more effective at pulling a vacuum than [?] service lines.", "back": "FALSE on Exam — True rule: Longer vacuum pump service lines are NOT more effective at pulling a vacuum than shorter service lines. (Vacuum pump service lines should have a large diameter to increase evacuation efficiency.)", "guided_prefix": "Longer vacuum pump service lines are NOT more effective at pulling a vacuum than", "guided_blank": "shorter", "guided_suffix": "service lines.", "trap_note": "Common Misconception (FALSE on Exam): Do NOT accept the claim that longer vacuum pump service lines are more reliable at pulling a vacuum than shorter service lines. Related verified rule: Vacuum pump service lines should have a large diameter to increase evacuation efficiency.", "image_data_uri": "", "word_choices": ["140 lb", "charged", "passive", "shorter"], "correct_choice_index": 3, "is_epa_608": false, "epa_608_category": "", "epa_608_topic": "", "context_quote": "A few key practices help evacuation jobs go more smoothly and easily. Several of these practices are the same as when performing recovery procedures, such as using short, large-diameter hoses and adding heat to the compressor and other places moisture might freeze. Vacuum pump service lines should be as large in diameter as possible and as short as necessary to negate any pressure drop. Considering pressure drop is very important. Evacuation may take up to eight times longer with a 1/4\" line than with a 1/2\" line. It may take twice as long using a 6' line than with a 3' line, Figure 12-19.", "context_source": "Chapter 12, Section 12.4: Evacuating a System (Textbook p. 238)"}, {"id": "s21", "section_id": "12.2", "card_type": "exam_trap", "front": "Exam Trap Check (Redistributing Refrigerant): Complete the corrected rule - To release refrigerant dissolved in compressor oil, an oxyacetylene torch should NOT be used to [?] the compressor.", "back": "FALSE on Exam — True rule: To release refrigerant dissolved in compressor oil, an oxyacetylene torch should NOT be used to heat the compressor.", "guided_prefix": "To release refrigerant dissolved in compressor oil, an oxyacetylene torch should NOT be used to", "guided_blank": "heat", "guided_suffix": "the compressor.", "trap_note": "Common Misconception (FALSE on Exam): Do NOT accept the claim that to release refrigerant dissolved in compressor oil, an oxyacetylene torch should properly be used to heat the compressor.", "image_data_uri": "", "word_choices": ["140 lb", "heat", "harden", "inlet"], "correct_choice_index": 1, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Phosgene Gas, Oxygen/Air Explosion Ban & Refrigerant Asphyxiation Safety", "context_quote": "Never use an open flame from a torch to warm a compressor or other part of a system to increase the system pressure. Using a torch to simply warm parts of a system is dangerous and could cause damage.", "context_source": "Chapter 12, Section 12.2: Redistributing Refrigerant (Textbook p. 225)"}, {"id": "s22", "section_id": "12.1", "card_type": "concept", "front": "Concept Check (Chapter Review): Identify the missing technical term - Vapor recovery must be used in combination with liquid recovery to recover a unit's entire [?] charge.", "back": "Verified Rule (TRUE): Vapor recovery must be used in combination with liquid recovery to recover a unit's entire refrigerant charge.", "guided_prefix": "Vapor recovery must be used in combination with liquid recovery to recover a unit's entire", "guided_blank": "refrigerant", "guided_suffix": "charge.", "trap_note": "", "image_data_uri": "", "word_choices": ["refrigerant", "subcooling", "condenser", "inert gas"], "correct_choice_index": 0, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "General Refrigerant Recovery, Charging & Leak-Check Procedures", "context_quote": "The liquid recovery method is an active recovery process that uses a recovery machine to recover refrigerant in liquid form from the high side of a refrigeration system. Liquid recovery moves more refrigerant faster than vapor recovery. However, since not all the refrigerant in a system is in liquid form, liquid recovery must be followed by vapor recovery to remove a system's entire refrigerant charge.", "context_source": "Chapter 12, Section 12.2: Redistributing Refrigerant (Textbook p. 227)"}, {"id": "s23", "section_id": "12.1", "card_type": "concept", "front": "Concept Check (Checking Refrigerant Charge): Identify the missing technical term - Push-pull liquid recovery should not be used in units with less than [?] of refrigerant charge.", "back": "Verified Rule (TRUE): Push-pull liquid recovery should not be used in units with less than 5 lb of refrigerant charge.", "guided_prefix": "Push-pull liquid recovery should not be used in units with less than", "guided_blank": "5 lb", "guided_suffix": "of refrigerant charge.", "trap_note": "", "image_data_uri": "", "word_choices": ["inert gas", "24°F.", "5 lb", "condenser"], "correct_choice_index": 2, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "General Refrigerant Recovery, Charging & Leak-Check Procedures", "context_quote": "The push-pull liquid recovery method uses a recovery cylinder's vapor valve and a liquid valve at the same time. The recovery cylinder's vapor valve is connected to the recovery machine's inlet. The recovery cylinder's liquid valve is connected to the high side of a refrigeration system. The push-pull recovery method cannot be used in the following circumstances: If a system's charge is under a minimum amount of refrigerant, usually 5-10 lb (refer to the operating manual for your recovery machine model).", "context_source": "Chapter 12, Section 12.2: Redistributing Refrigerant (Textbook p. 229)"}, {"id": "s24", "section_id": "12.1", "card_type": "exam_trap", "front": "Exam Trap Check (Checking Refrigerant Charge): Complete the corrected rule - The refrigerant charge in a system with a fixed orifice metering device should NOT be checked by [?].", "back": "FALSE on Exam — True rule: The refrigerant charge in a system with a fixed orifice metering device should NOT be checked by subcooling. (Then the system has an excessive refrigerant charge in situations where a system using a capillary tube or fixed orifice metering device has low superheat.)", "guided_prefix": "The refrigerant charge in a system with a fixed orifice metering device should NOT be checked by", "guided_blank": "subcooling", "guided_suffix": ".", "trap_note": "Common Misconception (FALSE on Exam): Do NOT accept the claim that the refrigerant charge in a unit with a fixed orifice metering device should be checked by subcooling. Related verified rule: Then the system has an excessive refrigerant charge in situations where a system using a capillary tube or fixed orifice metering device has low superheat.", "image_data_uri": "", "word_choices": ["pump-down", "subcooling", "condenser", "inert gas"], "correct_choice_index": 1, "is_epa_608": true, "epa_608_category": "Type I", "epa_608_topic": "Type I Small Appliance Capillary Tubes & Domestic Circuit Recovery", "context_quote": "There are several ways to determine if a refrigeration system has the right amount of refrigerant. The following sections cover two of the most common processes: checking charge by subcooling and checking charge by superheat. The subcooling method is generally used to check the charge in systems with thermostatic expansion valves. The superheat method is used to check the charge in systems with fixed orifice metering devices, such as capillary tubes.", "context_source": "Chapter 12, Section 12.1: Checking Refrigerant Charge (Textbook p. 221)"}, {"id": "s25", "section_id": "12.2", "card_type": "exam_trap", "front": "Exam Trap Check (Chapter Review): Complete the corrected rule - Active recovery does NOT use an HVACR unit's compressor to pump [?] into a recovery cylinder.", "back": "FALSE on Exam — True rule: Active recovery does NOT use an HVACR unit's compressor to pump refrigerant into a recovery cylinder. (Passive recovery may involve using the compressor to pump refrigerant out of the system.)", "guided_prefix": "Active recovery does NOT use an HVACR unit's compressor to pump", "guided_blank": "refrigerant", "guided_suffix": "into a recovery cylinder.", "trap_note": "Common Misconception (FALSE on Exam): Do NOT accept the claim that active recovery uses an HVACR unit's compressor to pump refrigerant into a recovery cylinder. Related verified rule: Passive recovery may involve using the compressor to pump refrigerant out of the system.", "image_data_uri": "", "word_choices": ["hardener", "sensible heat", "refrigerant", "mid-position"], "correct_choice_index": 2, "is_epa_608": true, "epa_608_category": "Type I", "epa_608_topic": "Type I Passive (System-Dependent) Recovery & 15 lb Limit", "context_quote": "Active recovery uses a recovery machine's compressor to draw out a system's refrigerant charge. Passive recovery methods are generally used less frequently than active recovery methods.", "context_source": "Chapter 12, Section 12.2: Redistributing Refrigerant (Textbook p. 224)"}, {"id": "s26", "section_id": "12.2", "card_type": "concept", "front": "Concept Check (Chapter Review): Identify the missing technical term - The amount of heat added to a [?] after it has evaporated is termed superheat.", "back": "Verified Rule (TRUE): The amount of heat added to a refrigerant after it has evaporated is termed superheat.", "guided_prefix": "The amount of heat added to a", "guided_blank": "refrigerant", "guided_suffix": "after it has evaporated is termed superheat.", "trap_note": "", "image_data_uri": "", "word_choices": ["hardener", "sensible heat", "mid-position", "refrigerant"], "correct_choice_index": 3, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Saturation, Temperature-Pressure (T/P) Chart, Superheat & Subcooling", "context_quote": "Superheat is commonly used for checking refrigerant charge in systems with a capillary tube or fixed orifice metering device. Superheat refers to the amount of heat added to a refrigerant after it has evaporated. It is the sensible heat over saturation temperature. The procedure consists of comparing the superheat calculated from measured values to the target superheat based on those values.", "context_source": "Chapter 12, Section 12.1: Checking Refrigerant Charge (Textbook p. 222)"}, {"id": "s27", "section_id": "12.2", "card_type": "concept", "front": "Concept Check (Redistributing Refrigerant): Identify the missing technical term - Recovery machines are not utilized during [?] recovery.", "back": "Verified Rule (TRUE): Recovery machines are not utilized during passive recovery.", "guided_prefix": "Recovery machines are not utilized during", "guided_blank": "passive", "guided_suffix": "recovery.", "trap_note": "", "image_data_uri": "", "word_choices": ["140 lb", "harden", "passive", "charged"], "correct_choice_index": 2, "is_epa_608": true, "epa_608_category": "Type I", "epa_608_topic": "Type I Passive (System-Dependent) Recovery & 15 lb Limit", "context_quote": "Passive recovery is a process of recovering vapor refrigerant from a system using that system's static pressure to force vapor refrigerant into an unpressurized recovery container. The passive recovery method is generally used on smaller systems with charges of 5 lb of refrigerant or less.", "context_source": "Chapter 12, Section 12.2: Redistributing Refrigerant (Textbook p. 224)"}, {"id": "s28", "section_id": "12.2", "card_type": "exam_trap", "front": "Exam Trap Check (Redistributing Refrigerant): Complete the corrected rule - To stop contaminants from damaging a recovery machine's compressor, an in-line refrigerant recovery bag is NOT placed between the unit and the machine's [?].", "back": "FALSE on Exam — True rule: To stop contaminants from damaging a recovery machine's compressor, an in-line refrigerant recovery bag is NOT placed between the unit and the machine's inlet. (Active recovery methods use a recovery machine to recover refrigerant from a system.)", "guided_prefix": "To stop contaminants from damaging a recovery machine's compressor, an in-line refrigerant recovery bag is NOT placed between the unit and the machine's", "guided_blank": "inlet", "guided_suffix": ".", "trap_note": "Common Misconception (FALSE on Exam): Do NOT accept the claim that to stop contaminants from damaging a recovery machine's compressor, an in-line refrigerant recovery bag is placed between the system and the machine's inlet. Related verified rule: Active recovery methods use a recovery machine to recover refrigerant from a system.", "image_data_uri": "", "word_choices": ["140 lb", "inlet", "harden", "heat"], "correct_choice_index": 1, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Recovery Equipment, Low-Loss Fittings & Manifold Gauge Rules", "context_quote": "To protect the recovery machine's compressor, always place an in-line filter-drier between the refrigeration system and the recovery machine's inlet port. This will prevent contamination or particulates in a refrigeration system from entering the recovery machine.", "context_source": "Chapter 12, Section 12.2: Redistributing Refrigerant (Textbook p. 230)"}, {"id": "s29", "section_id": "12.3", "card_type": "exam_trap", "front": "Exam Trap Check (Locating and Repairing Refrigerant Leaks): Complete the corrected rule - If a system is able to hold a [?], then the system does NOT have a leak.", "back": "FALSE on Exam — True rule: If a system is able to hold a vacuum, then the system does NOT have a leak.", "guided_prefix": "If a system is able to hold a", "guided_blank": "vacuum", "guided_suffix": ", then the system does NOT have a leak.", "trap_note": "Common Misconception (FALSE on Exam): Do NOT accept the claim that then the system has a leak in situations where a system is able to hold a vacuum.", "image_data_uri": "", "word_choices": ["pump-down", "low-pressure", "140 lb", "vacuum"], "correct_choice_index": 3, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Deep Vacuum Evacuation (500 Microns), Triple Evacuation & Moisture Checks", "context_quote": "Low head pressure, low suction pressure, and a lack of cooling are all good indicators that a system has a leak. Most refrigerant recovery machines include a leak detection feature. The recovery machine pulls a vacuum on the system and uses a software algorithm that holds the vacuum for a predetermined time. If the refrigeration system does not hold the vacuum, an alarm will sound.", "context_source": "Chapter 12, Section 12.3: Locating and Repairing Refrigerant Leaks (Textbook p. 232)"}, {"id": "s30", "section_id": "12.2", "card_type": "exam_trap", "front": "Exam Trap Check (Chapter Review): Complete the corrected rule - Adding [?] to a system is NOT called recovering the unit.", "back": "FALSE on Exam — True rule: Adding refrigerant to a system is NOT called recovering the unit. (Adding refrigerant to a refrigeration system is called charging.)", "guided_prefix": "Adding", "guided_blank": "refrigerant", "guided_suffix": "to a system is NOT called recovering the unit.", "trap_note": "Common Misconception (FALSE on Exam): Do NOT accept the claim that adding refrigerant to a unit is called recovering the unit. Related verified rule: Adding refrigerant to a refrigeration system is called charging.", "image_data_uri": "", "word_choices": ["hardener", "mid-position", "refrigerant", "sensible heat"], "correct_choice_index": 2, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "General Refrigerant Recovery, Charging & Leak-Check Procedures", "context_quote": "Charging a system means adding refrigerant to a refrigeration system. Any time a system has been opened, repaired, and evacuated, it must be charged with refrigerant before being put back into service. This is usually done by charging the proper weight of refrigerant back into the system.", "context_source": "Chapter 12, Section 12.5: Charging a System (Textbook p. 242)"}], "match_pairs": [{"id": "m1", "term": "80% water capacity by weight", "definition": "In Redistributing Refrigerant, the maximum amount of refrigerant that a recovery cylinder should contain is [this concept].", "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Recovery Cylinders, 80% Fill Limit, Tare Weight & DOT Shipping"}, {"id": "m2", "term": "recovery cylinder", "definition": "Vapor refrigerant is pulled from the [this concept], during push-pull liquid recovery.", "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Recovery Cylinders, 80% Fill Limit, Tare Weight & DOT Shipping"}, {"id": "m3", "term": "inert gas", "definition": "If the entire refrigerant charge has leaked out of a system, then a(n) [this concept] should be used to pressurize the system to test for leaks.", "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Leak Detection Methods, Dry Nitrogen & Trace Gas Rules"}, {"id": "m4", "term": "mid-position", "definition": "When charging a unit with refrigerant, the technician should put the low- and high-side service valves in [this concept].", "is_epa_608": true, "epa_608_category": "Type II", "epa_608_topic": "Liquid Receiver Pump-Down, Service Valves & Filter-Drier Replacement"}, {"id": "m5", "term": "pump-down", "definition": "The process of pumping a unit's entire refrigerant charge into the liquid receiver is called a(n) [this concept].", "is_epa_608": true, "epa_608_category": "Type II", "epa_608_topic": "Liquid Receiver Pump-Down, Service Valves & Filter-Drier Replacement"}, {"id": "m6", "term": "condenser", "definition": "To determine a system's subcooling value, the liquid line temperature should be subtracted from the [this concept] temperature.", "is_epa_608": false, "epa_608_category": "", "epa_608_topic": ""}, {"id": "m7", "term": "liquid level switch", "definition": "Many recovery cylinders use a [this concept] as a safety device to turn off the recovery machine when the cylinder is 80% full.", "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Recovery Cylinders, 80% Fill Limit, Tare Weight & DOT Shipping"}, {"id": "m8", "term": "sensible heat", "definition": "Subcooling refers to the amount of [this concept] removed from a refrigerant after it has condensed.", "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Saturation, Temperature-Pressure (T/P) Chart, Superheat & Subcooling"}, {"id": "m9", "term": "positive", "definition": "Pressure that is greater than atmospheric pressure is termed [this concept] pressure.", "is_epa_608": false, "epa_608_category": "", "epa_608_topic": ""}, {"id": "m10", "term": "hardener", "definition": "Two-part epoxy resin kits generally include one tube filled with epoxy and another tube filled with a(n) [this concept].", "is_epa_608": false, "epa_608_category": "", "epa_608_topic": ""}], "vocabulary": [{"id": "v1", "term": "Subcooling", "definition": "Subcooling is used for checking refrigerant charge in a system that uses a thermostatic expansion valve as its metering device.", "section_id": "12.1", "section_title": "Checking Refrigerant Charge", "page": 221, "source": "textbook", "is_epa_60 buting Refrigerant", "page": 223, "source": "textbook", "is_epa_608": true, "epa_608_category": "Type II", "epa_608_topic": "Liquid Receiver Pump-Down, Service Valves & Filter-Drier Replacement"}, {"id": "v7", "term": "Push-pull liquid recovery method", "definition": "The push-pull liquid recovery method is a process of removing liquid refrigerant from a refrigeration system by creating a pressure difference between the system and the recovery cylinder.", "section_id": "12.2", "section_title": "Redistributing Refrigerant", "page": 228, "source": "textbook", "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Recovery Cylinders, 80% Fill Limit, Tare Weight & DOT Shipping"}, {"id": "v8", "term": "Tare weight", "definition": "The tare weight of a refrigerant cylinder is how much the cylinder weighs when empty.", "section_id": "12.2", "section_title": "Redistributing Refrigerant", "page": 231, "source": "textbook", "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Recovery Cylinders, 80% Fill Limit, Tare Weight & DOT Shipping"}, {"id": "v9", "term": "Vapor recovery method", "definition": "The vapor recovery method is a form of active recovery because it recovers vapor refrigerant from a refrigeration system by drawing it out with a recovery machine.", "section_id": "12.2", "section_title": "Redistributing Refrigerant", "page": 226, "source": "textbook", "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "General Refrigerant Recovery, Charging & Leak-Check Procedures"}, {"id": "v10", "term": "Water capacity (WC)", "definition": "Water capacity (WC) is the weight of the volume of water needed to fill an entire recovery cylinder of a given size.", "section_id": "12.2", "section_title": "Redistributing Refrigerant", "page": 230, "source": "textbook", "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Recovery Cylinders, 80% Fill Limit, Tare Weight & DOT Shipping"}, {"id": "v11", "term": "Epoxy resin", "definition": ump-down", "triple evacuation", "evacuation", "recovery"], "correct_index": 0, "explanation": "Verified Answer: pump-down.", "is_exam_trap": false, "image_data_uri": "", "is_epa_608": true, "epa_608_category": "Type II", "epa_608_topic": "Liquid Receiver Pump-Down, Service Valves & Filter-Drier Replacement"}, {"id": "q8", "section_id": "12.1", "prompt": "Concept Completion (Checking Refrigerant Charge): To determine a unit's subcooling value, the liquid line temperature should be subtracted from the ____ temperature.", "choices": ["evaporator", "compressor", "condenser", "suction line"], "correct_index": 2, "explanation": "Verified Answer: condenser.", "is_exam_trap": false, "image_data_uri": "", "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Saturation, Temperature-Pressure (T/P) Chart, Superheat & Subcooling"}, {"id": "q9", "section_id": "12.2", "prompt": "Concept Completion (Redistributing Refrigerant): Many recovery cylinders use a ____ as a safety component to turn off the recovery machine when the cylinder is 80% full.", "choices": ["pressure relief valve", "filter-drier", "low-side float", "liquid level switch"], "correct_index": 3, "explanation": "Verified Answer: liquid level switch.", "is_exam_trap": false, "image_data_uri": "", "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Recovery Cylinders, 80% Fill Limit, Tare Weight & DOT Shipping"}, {"id": "q10", "section_id": "12.2", "prompt": "Compute the tare weight of a cylinder if its total weight is 590 lb and the weight of refrigerant in the cylinder is 450 lb.", "choices": ["1,040 lb", "450 lb", "140 lb", "590 lb"], "correct_index": 2, "explanation": "Verified Answer: 140 lb.", "is_exam_trap": false, "image_data_uri": "", "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Recovery Cylinders, 80% Fill Limit, Tare Weight & DOT Shipping"}, {"id": "q11", "section_id": "12.2", "prompt": "Concept Completion (Redistributing Refrigerant): Subcooling denotes the am _category": "Type I", "epa_608_topic": "Type I Small Appliance Capillary Tubes & Domestic Circuit Recovery"}, {"id": "q36", "section_id": "12.1", "prompt": "Concept Completion (Checking Refrigerant Charge): Performing a pump-down involves moving all the refrigerant in a system to the ____.", "choices": ["compressor", "liquid receiver", "recovery cylinder", "evaporator"], "correct_index": 1, "explanation": "Verified Answer: liquid receiver.", "is_exam_trap": false, "image_data_uri": "", "is_epa_608": true, "epa_608_category": "Type II", "epa_608_topic": "Liquid Receiver Pump-Down, Service Valves & Filter-Drier Replacement"}, {"id": "q37", "section_id": "12.2", "prompt": "Concept Completion (Redistributing Refrigerant): Active recovery methods use ____ to recover refrigerant from a system.", "choices": ["a recovery machine", "a recovery bag", "a vacuum pump", "static pressure"], "correct_index": 0, "explanation": "Verified Answer: a recovery machine.", "is_exam_trap": false, "image_data_uri": "", "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "General Refrigerant Recovery, Charging & Leak-Check Procedures"}, {"id": "q38", "section_id": "12.2", "prompt": "Concept Completion (Redistributing Refrigerant): Passive recovery may involve using the ____ to pump refrigerant out of the system.", "choices": ["vacuum pump", "compressor", "recovery machine", "superheat"], "correct_index": 1, "explanation": "Verified Answer: compressor.", "is_exam_trap": false, "image_data_uri": "", "is_epa_608": true, "epa_608_category": "Type I", "epa_608_topic": "Type I Passive (System-Dependent) Recovery & 15 lb Limit"}, {"id": "q39", "section_id": "12.2", "prompt": "Concept Completion (Redistributing Refrigerant): During vapor recovery, the low- and high-side service valves should be ____.", "choices": ["mid-positioned", "front seated", "cracked open", "back seated"], "correct_index": 0, "explanation": "Verified Answer: mid-positioned.", "is_exam_trap": false, "image_data_uri": "", "is_epa_608": false, "epa_608_category": "", "epa_608_topic": ""}, {"id": "q40", "section_id": "12.1", "prompt": "Concept Completion (Checking Refrigerant Charge): Liquid recovery must be used in combination with ____ to remove a system's entire refrigerant charge.", "choices": ["vapor recovery", "static pressure", "push-pull recovery", "passive recovery"], "correct_index": 0, "explanation": "Verified Answer: vapor recovery.", "is_exam_trap": false, "image_data_uri": "", "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "General Refrigerant Recovery, Charging & Leak-Check Procedures"}], "critical_thinking": [{"num": 1, "prompt": "How does the subcooling of a refrigeration system affect both the low side of the system and the system overall?", "analysis": "The amount of subcooling that occurs on the high side of a refrigeration system determines the amount of refrigerant that will flash vaporize when it enters the evaporator. This is important because less flash gas means more liquid refrigerant in the evaporator. The more liquid in the evaporator, the more heat-removing capacity it has. The subcooling of a system relates to the system's cooling capacity and is important for determining whether a system has the correct charge of refrigerant.", "image_data_uri": "", "id": "ct1", "concept_choices": ["If no decrease in pressure occurs after 24 hours of raising the system pressure to 170 psig using nitrogen.", "Closing the queen valve isolates the majority of the refrigerant charge in just the liquid receiver (the smallest volume possible).", "The amount of subcooling that occurs on the high side of a refrigeration system determines the amount of refrigerant that will flash vaporize when it enters the evaporator.", "Normally passive recovery makes use of the compressor to pump refrigerant into a recovery bag."], "correct_index": 2, "is_epa_608": true, "epa_608_category": "Core", "epa_608_topic": "Saturation, Temperature-Pressure (T/P) Chart, Superheat & Subcooling"}, {"num": 2, "prompt": "Your service manager sends you to relieve another technician whose shift is ending. The technician has already begun a system pump-down procedure on a large system with a liquid receiver, but you need to finish the process and perform service on the condenser. Which service valve - the discharge service valve, the king valve, or the queen valve - would you close to isolate the majority of the refrigerant charge in the smallest possible volume? Explain your answer.", "analysis": "Closing the queen valve isolates the majority of the refrigerant charge in just the liquid receiver (the smallest volume possible). Depending on the compressor, closing the suction service valve would make little or no difference on the high side. Since the king valve is already closed, it cannot be closed again. Closing the discharge service valve would isolate the tubing from the discharge of the compressor through the king valve (liquid receiver service valve or the inlet of the liquid line). This volume is larger than liquid receiver and would make any service to the condenser impossible without an isolation valve or check valve in the condensate line to prevent vapor from the liquid receiver going back into the condenser. The queen valve isolates the majority of the refrigerant in the liquid receiver. The remaining vapor in the condenser can be recovered through an access port or discharge service valve to allow service to the condenser.", "image_data_uri": "", "id": "ct2", "concept_choices": ["Closing the queen valve isolates the majority of the refrigerant charge in just the liquid receiver (the smallest volume possible).", "The amount of subcooling that occurs on the high side of a refrigeration system determines the amount of refrigerant that will flash vaporize when it enters the evaporator.", "Normally passive recovery makes use of the compressor to pump refrigerant into a recovery bag.", "If no decrease in pressure occurs after 24 hours of raising the system pressure to 170 psig using nitrogen."], "correct_index": 0, "is_epa_608": true, "epa_608_category": "Type II", "epa_608_topic": "Liquid Receiver Pump-Down, Service Valves & Filter-Drier Replacement"}, {"num": 3, "prompt": "Why is passive recovery not the best option for recovering refrigerant from a system that has a compressor that is not working?", "analysis": "Normally passive recovery makes use of the compressor to pump refrigerant into a recovery bag. Without an operating compressor, the passive recovery process will take much longer than using a recovery machine. Also, other means of moving the refrigerant will be necessary, such as employing an ice water bath to cool the recovery bag (to lower its pressure) and a heat gun or heat lamp to warm the system's compressor to raise its pressure to drive refrigerant from the system into the recovery bag. On this system with an inoperable compressor, active recovery using a recovery machine and recovery cylinder would be more preferable than passive recovery.", "image_data_uri": "", "id": "ct3", "concept_choices": ["If no decrease in pressure occurs after 24 hours of raising the system pressure to 170 psig using nitrogen.", "The amount of subcooling that occurs on the high side of a refrigeration system determines the amount of refrigerant that will flash vaporize when it enters the evaporator.", "Closing the queen valve isolates the majority of the refrigerant charge in just the liquid receiver (the smallest volume possible).", "Normally passive recovery makes use of the compressor to pump refrigerant into a recovery bag."], "correct_index": 3, "is_epa_608": true, "epa_608_category": "Type I", "epa_608_topic": "Type I Passive (System-Dependent) Recovery & 15 lb Limit"}, {"num": 4, "prompt": "When pressure testing a system with nitrogen, how does a technician know when the system is leak-free and ready to be vented, evacuated, and then charged?", "analysis": "If no decrease in pressure occurs after     Object.keys(rawMap).forEach(function (k) {
      const val = Number(rawMap[k]);

      if (pruneExpired && val <= now) return;
      out[k] = val;
    });
    return out;
  }

  function computeReadiness() {

      function drawBrazingCanvas(ctx, t) {
        const b = computeBrazeStatus();
        // Shop bench surface
        drawRoundedBox(ctx, 18, 18, 744, 394, 12, "#0c1526", "#23334f", 1.5);
        ctx.fillStyle = "#111e34";
        ctx.fillRect(19, 326, 742, 85);

        // Pipeline step progress bar at top
        const pipeSteps = [
          { id: "cut", lbl: "1. CUT" },
          { id: "deburr", lbl: "2. DEBURR" },
          { id: "flare", lbl: "3. FLARE" },
          { id: "swage", lbl: "4. SWAGE" },
          { id: "braze", lbl: "5. N2 BRAZE" }
        ];
        state.hitBoxes = [];
        pipeSteps.forEach((st, idx) => {
          const bx = 34 + idx * 144;
          const active = state.stage === st.id;
          drawRoundedBox(ctx, bx, 32, 132, 30, 7, active ? "#1e3a5f" : "#121d33", active ? "#fbbf24" : "#2c3f62", active ? 2 : 1);
          ctx.fillStyle = active ? "#fbbf24" : "#94a3b8";
          ctx.font = "700 11px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(st.lbl, bx + 66, 51);
          state.hitBoxes.push({ x: bx, y: 32, w: 132, h: 30, kind: "stage", value: st.id });
        });

        // Left: Dry Nitrogen Tank + Regulator Gauge
        drawRoundedBox(ctx, 36, 95, 58, 195, 22, "#1e3a8a", "#60a5fa", 2);
        ctx.fillStyle = "#dbeafe";
        ctx.font = "800 12px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("N2", 65, 165);
        ctx.font = "600 9px system-ui, sans-serif";
        ctx.fillText("DRY", 65, 180);
        // Brass regulator + flowmeter tube
        drawRoundedBox(ctx, 94, 112, 48, 36, 6, "#92400e", "#fbbf24", 1.5);
        ctx.fillStyle = "#fef3c7";
        ctx.font = "700 11px monospace";
        ctx.fillText(state.nitrogenScfh.toFixed(1), 118, 130);
        ctx.font = "600 8px system-ui, sans-serif";
        ctx.fillText("SCFH", 118, 142);

        // Nitrogen hose into copper pipe
        ctx.beginPath();
        ctx.moveTo(142, 130);
        ctx.bezierCurveTo(180, 130, 180, 214, 210, 214);
        ctx.strokeStyle = b.n2Ok ? "#22d3ee" : (state.nitrogenScfh === 0 ? "#475569" : "#f97316");
        ctx.lineWidth = 4;
        ctx.stroke();

        // Main Copper Pipe Cutaway Assembly (x=210..620, y=184..244)
        const hotGlow = clamp((state.torchHeat - 40) / 50, 0, 1);
        const copperMain = hotGlow > 0.1
          ? "rgb(" + Math.round(lerp(184, 239, hotGlow)) + "," + Math.round(lerp(115, 72, hotGlow)) + "," + Math.round(lerp(51, 56, hotGlow)) + ")"
          : "#b87333";

        // Outer copper walls
        ctx.fillStyle = "#92400e";
        ctx.fillRect(210, 184, 200, 60);
        ctx.fillStyle = copperMain;
        ctx.fillRect(390, 178, 86, 72); // swaged / coupling sleeve
        ctx.fillRect(470, 184, 155, 60);

        // Cutaway interior channel
        const interiorColor = state.brazeQuality === "oxidized"
          ? "#18181b"
          : (state.brazeQuality === "clean" ? "#451a03" : "#271408");
        ctx.fillStyle = interiorColor;
        ctx.fillRect(214, 198, 408, 32);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "700 9px system-ui, sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("CUTAWAY INTERIOR", 220, 174);

        // Visualize Nitrogen purge dots flowing through interior
        if (state.nitrogenScfh > 0) {
          const speed = 40 + state.nitrogenScfh * 38;
          const count = Math.min(16, Math.max(4, Math.round(state.nitrogenScfh * 3)));
          for (let i = 0; i < count; i++) {
            const px = 220 + ((i * (395 / count) + t * speed) % 395);
            const py = 214 + Math.sin(t * 6 + i) * 5;
            ctx.beginPath();
            ctx.arc(px, py, 3, 0, Math.PI * 2);
            ctx.fillStyle = b.n2High ? "#f97316" : "#22d3ee";
            ctx.fill();
          }
        }

        // Visualize Black Copper Oxide Soot if 0 SCFH & Torch Hot
        if (state.nitrogenScfh === 0 && b.heatHot) {
          for (let i = 0; i < 22; i++) {
            const sx = 365 + (i * 11);
            const sy = 203 + ((i * 17) % 22);
            ctx.beginPath();
            ctx.arc(sx, sy, 3.2, 0, Math.PI * 2);
            ctx.fillStyle = "#09090b";
            ctx.fill();
            ctx.strokeStyle = "#52525b";
            ctx.lineWidth = 1;
            ctx.stroke();
          }
          ctx.fillStyle = "#f87171";
          ctx.font = "800 12px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("BLACK COPPER OXIDE SCALE (TXV CLOG RISK!)", 430, 162);
        }

        // Visualize Silver Braze Fillet at joint seam
        if (state.silverApplied) {
          ctx.fillStyle = state.brazeQuality === "blowout" ? "#fca5a5" : "#e2e8f0";
          ctx.fillRect(466, 176, 8, 76);
          if (state.brazeQuality === "blowout") {
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.arc(470, 204, 4, 0, Math.PI * 2);
            ctx.arc(470, 224, 3.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Stage-specific visual cues on right end of copper tube
        if (state.stage === "cut") {
          drawRoundedBox(ctx, 560, 146, 56, 118, 8, "#334155", "#94a3b8", 2);
          ctx.beginPath();
          ctx.arc(588, 176, 11, 0, Math.PI * 2);
          ctx.fillStyle = "#fbbf24";
          ctx.fill();
          ctx.fillStyle = "#e2e8f0";
          ctx.font = "700 11px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("1/4 Turn Cutter Wheel", 588, 286);
        } else if (state.stage === "deburr") {
          ctx.beginPath();
          ctx.moveTo(625, 198);
          ctx.lineTo(665, 214);
          ctx.lineTo(625, 230);
          ctx.closePath();
          ctx.fillStyle = "#22d3ee";
          ctx.fill();
          ctx.fillStyle = "#bae6fd";
          ctx.font = "700 11px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Ream ID Facing Down", 620, 272);
        } else if (state.stage === "flare") {
          ctx.beginPath();
          ctx.moveTo(622, 184);
          ctx.lineTo(648, 168);
          ctx.lineTo(648, 260);
          ctx.lineTo(622, 244);
          ctx.closePath();
          ctx.fillStyle = "#d97706";
          ctx.fill();
          drawRoundedBox(ctx, 565, 174, 32, 80, 4, "#fbbf24", "#fef3c7", 1.5);

      const canvasCtrl = setupResponsiveCanvas(canvas, 780, 430, {
        onClick(pt) {
          for (let i = 0; i < state.hitBoxes.length; i++) {
            const hb = state.hitBoxes[i];
            if (pt.x >= hb.x && pt.x <= hb.x + hb.w && pt.y >= hb.y && pt.y <= hb.y + hb.h) {
              safePlay("click");
              if (hb.kind === "stage") state.stage = hb.value;
              else if (hb.kind === "bay") state.selectedBay = hb.value;
              else if (hb.kind === "tool") state.selectedTool = hb.value;
              else if (hb.kind === "tstep") state.triageStep = hb.value;
              else if (hb.kind === "saf") {
                if (hb.value === "loto") {
                  state.lotoLocked = !state.lotoLocked;
                  if (!state.lotoLocked) state.zeroVerified = false;
                } else if (hb.value === "n2reg") state.n2Regulator = !state.n2Regulator;
                else if (hb.value === "glasses") state.ppeGlasses = !state.ppeGlasses;
                else if (hb.value === "gloves") state.ppeGloves = !state.ppeGloves;
              }
              renderControls();
              updateMetricsAndAlert();
              return;
            }
          }
        }
      });

      function tick(ts) {
        if (state.destroyed) return;
        state.time = ts * 0.001;
        const ctx = canvasCtrl.beginFrame();
        if (ctx) {
          if (state.mode === "brazing") drawBrazingCanvas(ctx, state.time);
          else if (state.mode === "certs") drawCertsCanvas(ctx);
          else if (state.mode === "safety") drawSafetyCanvas(ctx, state.time);
          else if (state.mode === "service") drawServiceCanvas(ctx);
          else if (state.mode === "tools") drawToolsCanvas(ctx);
        }
        state.rafId = requestAnimationFrame(tick);
      }

      createMissionController({
        missions: missions,
        elements: {
          box: missionBox,
          xpEl: rootEl.querySelector('[data-tg1-stat="xp"]'),
          accEl: rootEl.querySelector('[data-tg1-stat="acc"]'),
          streakEl: rootEl.querySelector('[data-tg1-stat="streak"]')
        },
        playSound: safePlay,
        awardXP: safeAward,
        onLoadMission(m) {
          const p = m.params || {};
          if (p.bench_mode && modeNames[p.bench_mode]) state.mode = p.bench_mode;
          if (p.stage) state.stage = p.stage;
          if (p.nitrogen_scfh != null || p.scfh != null) {
            state.nitrogenScfh = clamp(Number(p.nitrogen_scfh != null ? p.nitrogen_scfh : p.scfh), 0, 5);
          }
          if (p.torch_heat != null) state.torchHeat = clamp(Number(p.torch_heat), 0, 100);
          if (p.silver_applied != null) state.silverApplied = Boolean(p.silver_applied);
          state.brazeQuality = "idle";
          if (p.selected_bay) state.selectedBay = p.selected_bay;
          if (p.selected_cert) state.selectedCert = p.selected_cert;
          if (p.loto_locked != null) state.lotoLocked = Boolean(p.loto_locked);
          if (p.zero_verified != null) state.zeroVerified = Boolean(p.zero_verified);
          if (p.n2_regulator != null) state.n2Regulator = Boolean(p.n2_regulator);
          if (p.ppe_glasses != null) state.ppeGlasses = Boolean(p.ppe_glasses);
          if (p.ppe_gloves != null) state.ppeGloves = Boolean(p.ppe_gloves);
          if (p.triage_step != null) state.triageStep = clamp(Number(p.triage_step), 1, 6);
          if (p.ticket_symptom) state.ticketSymptom = String(p.ticket_symptom);
          else if (p.ppe || p.tool) state.ticketSymptom = [p.ppe, p.tool].filter(Boolean).join(" • ");
          if (p.selected_tool) state.selectedTool = p.selected_tool;
          setMode(state.mode);
        },
        onVerifyBench(m) {
          const p = m.params || {};
          if (state.mode === "brazing") {
            if (p.target_stage && state.stage !== p.target_stage) {
              return { ok: false, message: "Select stage '" + p.target_stage + "' on the copper prep bench first!" };
            }
            const needMinN2 = p.target_nitrogen_min != null ? Number(p.target_nitrogen_min) : 2.0;
            const needMaxN2 = p.target_nitrogen_max != null ? Number(p.target_nitrogen_max) : 3.0;
            if (state.nitrogenScfh < needMinN2 || state.nitrogenScfh > needMaxN2) {
              return { ok: false, message: "Nitrogen flow is " + state.nitrogenScfh.toFixed(1) + " SCFH. Adjust regulator to " + needMinN2.toFixed(1) + "–" + needMaxN2.toFixed(1) + " SCFH!" };
            }
            const needHeat = Boolean(p.target_heat_min != null || p.target_heat_max != null || p.require_silver || (p.bench_goal_text && p.bench_goal_text.indexOf("Apply") >= 0));
            if (needHeat) {
              const hMin = p.target_heat_min != null ? Number(p.target_heat_min) : 65;
              const hMax = p.target_heat_max != null ? Number(p.target_heat_max) : 85;
              if (state.torchHeat < hMin || state.torchHeat > hMax) {
                return { ok: false, message: "Bring Torch Heat into the Cherry-Red zone (" + hMin + "–" + hMax + "%) first!" };
              }
              if (!state.silverApplied) {
                return { ok: false, message: "Click 'Apply 15% Silver Alloy' once the copper reaches Cherry Red!" };
              }
            }
            return { ok: true, message: m.coachTip };
          }
          if (state.mode === "certs") {
            if (p.target_bay && state.selectedBay !== p.target_bay) {
              return { ok: false, message: "Select the matching Equipment Bay on the Dispatch Board first!" };
            }
            if (p.target_cert && state.selectedCert !== p.target_cert && state.selectedCert !== "universal") {
              return { ok: false, message: "Select the matching EPA 608 Certification on the board first!" };
            }
            const bayOk = p.target_bay ? state.selectedBay === p.target_bay : (state.selectedBay === "low" || state.selectedBay === "fleet");
            const certOk = p.target_cert
              ? (state.selectedCert === p.target_cert || state.selectedCert === "universal")
              : ((state.selectedBay === "low" && (state.selectedCert === "type3" || state.selectedCert === "universal")) ||
                 (state.selectedBay === "fleet" && state.selectedCert === "universal"));
            if (!bayOk || !certOk) {
              return { ok: false, message: "Match the Equipment Bay with its required EPA 608 Certification first!" };
            }
            return { ok: true, message: m.coachTip };
          }
          if (state.mode === "safety") {
            if (!state.lotoLocked || !state.zeroVerified || !state.n2Regulator || !state.ppeGlasses || !state.ppeGloves) {
              return { ok: false, spark: !state.n2Regulator, message: "Complete all 5 checks: LOTO Lock, 0V Live-Dead-Live, N2 Regulator, Safety Glasses, and Gloves!" };
            }
            return { ok: true, message: m.coachTip };
          }
          if (state.mode === "service") {
            const targetStep = p.target_triage_step != null ? Number(p.target_triage_step) : (p.bench_goal_text && p.bench_goal_text.indexOf("Step 6") >= 0 ? 6 : 3);
            if (state.triageStep !== targetStep) {
              return { ok: false, message: "Select Step " + targetStep + " on the Service Call Board before verifying!" };
            }
            return { ok: true, message: m.coachTip };
          }
          if (state.mode === "tools") {
            const goal = p.bench_goal_text || "";
            let want = p.target_tool || "micron";
            if (!p.target_tool) {
              if (goal.indexOf("Swaging") >= 0) want = "swage";
              else if (goal.indexOf("Leak") >= 0) want = "leak";
            }
            if (state.selectedTool !== want) {
              return { ok: false, message: "Select the exact tool named in the mission brief on the Tool Crib Board!" };
            }
            return { ok: true, message: m.coachTip };
          }
          return { ok: true, message: m.coachTip };
        }
      });

      renderControls();
      updateMetricsAndAlert();
      state.rafId = requestAnimationFrame(tick);

      return {
        destroy() {
          state.destroyed = true;
          if (state.rafId) cancelAnimationFrame(state.rafId);
          canvasCtrl.destroy();
          containerEl.innerHTML = "";
        }
      };
    },
    init(containerEl, data, playSound, awardXP) {
      return this.mount(containerEl, data, playSound, awardXP);
    }
  };

  function lookupPsig(refrig, tempF) {
    const tbl = PT_TABLES[refrig] || PT_TABLES["R-410A"];
    const t = clamp(tempF, 0, 150);
    for (let i = 0; i < tbl.length - 1; i++) {
      const [t0, p0] = tbl[i];
      const [t1, p1] = tbl[i + 1];
      if (t >= t0 && t <= t1) {
        return lerp(p0, p1, (t - t0) / (t1 - t0));
      }
    }
    return tbl[tbl.length - 1][1];
  }

        // Wait: standard left=Indoor Evap, bottom=Compressor? Even clearer:

        // Left: EVAPORATOR (Indoor Cold Coil, x=75..195, y=120..265)
        // Right: CONDENSER (Outdoor Hot Coil, x=585..705, y=120..265)
        // Top-Center: METERING DEVICE (TXV, x=390, y=76)
        // Wait: flow Compressor -> Condenser (discharge), Condenser -> TXV (liquid), TXV -> Evap (cold 2-phase), Evap -> Compressor (suction)!
        // Top = Condenser or Bottom = Compressor, Top = TXV! Let's check exact direction:
        // Compressor (bottom-left x=135, y=325) --Discharge--> Top-Right Condenser (x=590..715, y=95..220)
        // --Liquid Line w/ Sight Glass--> Bottom-Right TXV (x=590, y=325)
        //Wait if Evap is Top-Left (x=70..195, y=95..220):
        // Compressor (Bottom-Center x=390, y=335) -> goes RIGHT & UP to Condenser (Right x=615, y=175) -> goes UP-LEFT to TXV (Top-Center x=390, y=74) -> goes LEFT & DOWN to Evaporator (Left x=155, y=175) -> goes DOWN-RIGHT to Compressor (390, 335)!
        // Let's verify that clockwise loop!
        // 1. Compressor (390, 335) pushes hot red vapor UP-RIGHT to Condenser (625, 175) ->
        // 2. Condenser rejects heat (orange -> amber liquid) to Top Liquid Line -> Filter-Drier & Sight Glass -> TXV (390, 72) ->
        // 3. TXV flashes to cold cyan mist LEFT to Evaporator (155, 175) ->
        // 4. Evaporator absorbs indoor heat (cyan -> cool blue vapor) DOWN to Compressor Suction (390, 335)!
        // That leaves center x=240..540, y=135..265 wide open for the DIGITAL MANIFOLD GAUGE SET + Recovery/Micron indicators! Genius!

        // Draw Piping Segments
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        // 1. Hot Discharge (Compressor -> Condenser bottom)
        ctx.beginPath();
        ctx.moveTo(435, 338);
        ctx.lineTo(645, 338);
        ctx.lineTo(645, 238);
        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 10;

        ctx.moveTo(645, 108);
        ctx.lineTo(645, 68);
        ctx.lineTo(418, 68);
        ctx.strokeStyle = "#f97316";
        ctx.lineWidth = 8;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(362, 68);
        ctx.lineTo(135, 68);
        ctx.lineTo(135, 108);
        ctx.strokeStyle = "#22d3ee";
        ctx.lineWidth = 8;
        ctx.stroke();

        // 4. Cool Suction Vapor (Evaporator bottom -> Compressor)
        ctx.beginPath();
        ctx.moveTo(135, 238);
        ctx.lineTo(135, 338);
        ctx.lineTo(345, 338);
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 10;
        ctx.stroke();

        const flowSpeed = 0.22 * clamp(state.chargePct / 100, 0.4, 1.4);
        const loopPts = [
          [435, 338], [645, 338], [645, 68], [135, 68], [135, 338], [345, 338]
        ];
        // Compute perimeter segments for smooth dots
        const segs = [
          { x1: 435, y1: 338, x2: 645, y2: 338, col: "#fca5a5" },
          { x1: 645, y1: 338, x2: 645, y2: 68,  col: "#fdba74" },
          { x1: 645, y1: 68,  x2: 390, y2: 68,  col: "#fbbf24" },
          { x1: 390, y1: 68,  x2: 135, y2: 68,  col: "#67e8f9" },
          { x1: 135, y1: 68,  x2: 135, y2: 338, col: "#7dd3fc" },
          { x1: 135, y1: 338, x2: 345, y2: 338, col: "#60a5fa" }
        ];
        for (let i = 0; i < 18; i++) {
          const u = ((i / 18) + t * flowSpeed) % 1;
          const sIdx = Math.min(segs.length - 1, Math.floor(u * segs.length));
          const localT = (u * segs.length) - sIdx;
          const seg = segs[sIdx];
          const px = lerp(seg.x1, seg.x2, localT);
          const py = lerp(seg.y1, seg.y2, localT);
          ctx.beginPath();
          ctx.arc(px, py, 3.6, 0, Math.PI * 2);
          ctx.fillStyle = seg.col;
          ctx.fill();
        }

        // Component: EVAPORATOR (Left)
        const icyGlow = state.evapSatF < 32;
        drawRoundedBox(ctx, 56, 108, 158, 132, 10, icyGlow ? "#0c2d48" : "#0f1e36", icyGlow ? "#67e8f9" : "#38bdf8", 2);
        for (let r = 0; r < 4; r++) {
          ctx.strokeStyle = "#22d3ee";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(74, 134 + r * 24);
          ctx.lineTo(196, 134 + r * 24);
          ctx.stroke();
