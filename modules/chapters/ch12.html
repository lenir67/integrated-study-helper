<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ch 12 — Working with Refrigerants</title>
  <style>

:root {
  --bg: #0b1120;
  --bg-deep: #060a14;
  --card: #111c33;
  --card-alt: #172542;
  --border: #253659;
  --border-bright: #364e7d;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --cyan: #38bdf8;
  --amber: #f59e0b;
  --emerald: #10b981;
  --coral: #f43f5e;
  --tile-red: #dc2626;
  --tile-blue: #2563eb;
  --tile-gold: #d97706;
  --tile-green: #059669;
  --radius: 12px;
  --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Roboto, system-ui, -apple-system, Helvetica, Arial, sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select {
  font-family: inherit;
}

.hidden {
  display: none !important;
}

/* === HEADER & HUD === */
.app-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: linear-gradient(180deg, #070c18 0%, #0d162b 100%);
  border-bottom: 1px solid var(--border);
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.ch-badge {
  background: linear-gradient(135deg, var(--cyan), #0284c7);
  color: #061224;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 6px 12px;
  border-radius: 8px;
  white-space: nowrap;
  box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
}

.title-block {
  min-width: 0;
}

.title-kicker {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--cyan);
  font-weight: 700;
}

.chapter-title {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 520px;
}

.hud-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.hud-pill {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 12.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.hud-pill.rank {
  border-color: rgba(56, 189, 248, 0.45);
  color: var(--cyan);
}

.hud-pill.bolts {
  border-color: rgba(245, 158, 11, 0.45);
  color: var(--amber);
}

.hud-pill.readiness {
  border-color: rgba(16, 185, 129, 0.45);
  color: var(--emerald);
}

.readiness-meter {
  width: 48px;
  height: 7px;
  background: #091020;
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.readiness-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--cyan), var(--emerald));
  transition: width 0.35s ease;
}

.btn {
  background: var(--card-alt);
  color: var(--text);
  border: 1px solid var(--border-bright);
  border-radius: 8px;
  padding: 7px 13px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
}

.btn:hover:not(:disabled) {
  background: #1f3258;
  border-color: var(--cyan);
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn.primary {
  background: var(--cyan);
  color: #061224;
  border-color: var(--cyan);
  font-weight: 700;
}

.btn.primary:hover:not(:disabled) {
  background: #7dd3fc;
}

.btn.amber {
  background: var(--amber);
  color: #110c02;
  border-color: var(--amber);
  font-weight: 700;
}

.btn.amber:hover:not(:disabled) {
  background: #fbbf24;
}

.btn.emerald {
  background: var(--emerald);
  color: #031f16;
  border-color: var(--emerald);
  font-weight: 700;
}

.btn.emerald:hover:not(:disabled) {
  background: #34d399;
}

.btn.coral {
  background: rgba(244, 63, 94, 0.16);
  color: #fda4af;
  border-color: rgba(244, 63, 94, 0.5);
}

.btn.coral:hover:not(:disabled) {
  background: rgba(244, 63, 94, 0.28);
}

.btn.sm {
  padding: 5px 10px;
  font-size: 12px;
}

.audio-toggle {
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 12.5px;
}

/* === MULTI-EDITION SWITCHER & SCOPE BANNER === */
.edition-switcher {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  background: var(--bg-deep);
  border: 1px solid var(--border-bright);
  border-radius: 999px;
  box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.45);
  max-width: 100%;
  overflow-x: auto;
}

.edition-btn {
  background: transparent;
  color: var(--muted);
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.16s ease;
}

.edition-btn:hover {
  color: var(--text);
  background: rgba(56, 189, 248, 0.1);
}

.edition-btn.active {
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.24), rgba(16, 185, 129, 0.2));
  color: #ffffff;
  border-color: var(--cyan);
  box-shadow: 0 0 14px rgba(56, 189, 248, 0.22);
}

.edition-scope-banner {
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(16, 185, 129, 0.1));
  border: 1px solid rgba(56, 189, 248, 0.4);
  border-left: 4px solid var(--cyan);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-bottom: 12px;
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--text);
  display: block;
  box-shadow: var(--shadow);
}

.edition-scope-banner code {
  background: rgba(15, 23, 42, 0.72);
  border: 1px solid rgba(148, 163, 184, 0.28);
  border-radius: 5px;
  padding: 1px 6px;
  font-size: 12.5px;
  color: #f8fafc;
}

.edition-scope-banner[data-edition="v9"] {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(56, 189, 248, 0.08));
  border-color: rgba(245, 158, 11, 0.42);
  border-left-color: var(--amber);
}

.edition-scope-banner[data-edition="v10"] {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.14), rgba(56, 189, 248, 0.1));
  border-color: rgba(16, 185, 129, 0.48);
  border-left-color: var(--emerald);
}

.edition-scope-banner strong {
  color: #ffffff;
}

/* === TOP NAVIGATION === */
.top-tabs {
  background: #080e1c;
  border-bottom: 1px solid var(--border);
  padding: 8px 18px;
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
}

.top-tab {
  background: var(--card);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 16px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}

.top-tab:hover {
  color: var(--text);
  border-color: var(--border-bright);
}

.top-tab.active {
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(16, 185, 129, 0.14));
  color: #ffffff;
  border-color: var(--cyan);
  box-shadow: 0 0 18px rgba(56, 189, 248, 0.18);
}

.main-shell {
  max-width: 1320px;
  margin: 0 auto;
  padding: 16px 18px 34px 18px;
}

.tab-panel {
  display: none;
}

.tab-panel.active {
  display: block;
}

/* === FILTER BAR & SUBTABS === */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  padding: 10px 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.filter-label {
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-right: 4px;
}

.pill {
  background: var(--bg);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.14s ease;
  max-width: 240px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pill:hover {
  color: var(--text);
  border-color: var(--cyan);
}

.pill.active {
  background: var(--cyan);
  color: #061224;
  border-color: var(--cyan);
  font-weight: 700;
}

.pill.trap.active {
  background: var(--coral);
  color: #ffffff;
  border-color: var(--coral);
}

.pill.practice.active {
  background: var(--amber);
  color: #110c02;
  border-color: var(--amber);
}

.pill.epa608 {
  border-color: rgba(16, 185, 129, 0.55);
  color: #6ee7b7;
  background: rgba(16, 185, 129, 0.12);
}

.pill.epa608:hover {
  border-color: #34d399;
  color: #ffffff;
  background: rgba(16, 185, 129, 0.22);
}

.pill.epa608.active {
  background: #059669;
  border-color: #34d399;
  color: #ffffff;
}

.subtabs-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.subtab-btn {
  background: var(--card);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.subtab-btn:hover {
  color: var(--text);
}

.subtab-btn.active {
  background: var(--card-alt);
  color: var(--cyan);
  border-color: var(--cyan);
}

.subtab-panel {
  display: none;
}

.subtab-panel.active {
  display: block;
}

/* === CARDS & BADGES === */
.surface-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.badge.cyan {
  background: rgba(56, 189, 248, 0.16);
  color: var(--cyan);
  border: 1px solid rgba(56, 189, 248, 0.35);
}

.badge.amber {
  background: rgba(245, 158, 11, 0.16);
  color: #fbbf24;
  border: 1px solid rgba(245, 158, 11, 0.35);
}

.badge.emerald {
  background: rgba(16, 185, 129, 0.16);
  color: #34d399;
  border: 1px solid rgba(16, 185, 129, 0.35);
}

.badge.coral {
  background: rgba(244, 63, 94, 0.18);
  color: #fda4af;
  border: 1px solid rgba(244, 63, 94, 0.45);
}

.badge.muted {
  background: #0d162a;
  color: var(--muted);
  border: 1px solid var(--border);
}

.badge.epa608-badge {
  background: rgba(16, 185, 129, 0.22);
  color: #6ee7b7;
  border: 1px solid rgba(16, 185, 129, 0.65);
  font-weight: 800;
}

/* === FLIP CARDS === */
.flip-stage-wrap {
  max-width: 820px;
  margin: 0 auto;
}

.flip-meta-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.flip-progress-track {
  width: 100%;
  height: 7px;
  background: #091020;
  border: 1px solid var(--border);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 14px;
}

.flip-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--emerald));
  transition: width 0.25s ease;
}

.flip-scene {
  perspective: 1200px;
  margin-bottom: 14px;
}

.flip-card {
  position: relative;
  display: grid;
  width: 100%;
  min-height: 310px;
  transform-style: preserve-3d;
  transition: transform 0.45s cubic-bezier(0.22, 0.85, 0.36, 1);
  cursor: pointer;
}

.flip-card.flipped {
  transform: rotateY(180deg);
}

.flip-face {
  grid-area: 1 / 1;
  width: 100%;
  min-height: 310px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: linear-gradient(160deg, var(--card) 0%, var(--card-alt) 100%);
  border: 1.5px solid var(--border-bright);
  border-radius: 16px;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--shadow);
}

.flip-face.back {
  transform: rotateY(180deg);
  border-color: rgba(16, 185, 129, 0.55);
  background: linear-gradient(160deg, #0f1b33 0%, #11243f 100%);
}

.flip-card.is-epa608 .flip-face {
  border-color: rgba(16, 185, 129, 0.72);
  background: linear-gradient(160deg, rgba(16, 185, 129, 0.14) 0%, var(--card-alt) 100%);
}

.flip-card.is-epa608 .flip-face.back {
  border-color: #10b981;
  background: linear-gradient(160deg, rgba(16, 185, 129, 0.18) 0%, #11243f 100%);
}

.flip-face-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.flip-face-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 14px 8px;
  gap: 12px;
}

.flip-prompt {
  font-size: 21px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.45;
}

.flip-answer {
  font-size: 21px;
  font-weight: 800;
  color: #6ee7b7;
  line-height: 1.45;
}

.flip-img {
  max-width: 100%;
  max-height: 300px;
  border-radius: 8px;
  border: 1px solid var(--border-bright);
  background: #080e1a;
  object-fit: contain;
  cursor: zoom-in;
}

.trap-callout {
  width: 100%;
  background: rgba(244, 63, 94, 0.13);
  border: 1px solid rgba(244, 63, 94, 0.45);
  border-left: 4px solid var(--coral);
  border-radius: 8px;
  padding: 9px 12px;
  text-align: left;
  font-size: 13.5px;
  color: #ffe4e6;
}

.trap-callout strong {
  color: #fda4af;
}

.flip-hint {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}

.flip-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.flip-nav-group, .flip-status-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* === GUIDED BLANK NOTES === */
.notes-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 14px;
}

.notes-toolbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.study-notes-workspace {
  display: grid;
  grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}

.study-notes-workspace.single-col {
  grid-template-columns: 1fr;
}

.word-bank-box {
  position: sticky;
  top: 12px;
  max-height: calc(100vh - 28px);
  overflow-y: auto;
  background: var(--card-alt);
  border: 1px solid rgba(245, 158, 11, 0.45);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 0;
}

.word-bank-box.awaiting-pick {
  border-color: var(--cyan);
  box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.28);
}

.word-bank-title {
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--amber);
  margin: 0 0 10px 0;
}

.word-bank-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.wb-chip {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border-bright);
  border-radius: 6px;
  padding: 5px 11px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  transition: all 0.14s ease;
}

.wb-chip[draggable="true"] {
  cursor: grab;
}

.wb-chip[draggable="true"]:active {
  cursor: grabbing;
}

.wb-chip:hover:not(:disabled):not(.used) {
  border-color: var(--cyan);
  background: var(--card);
}

.wb-chip.armed {
  border-color: var(--cyan);
  background: rgba(56, 189, 248, 0.22);
  color: #ffffff;
  box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.35);
}

.wb-chip.used,
.wb-chip:disabled {
  opacity: 0.45;
  text-decoration: line-through;
  cursor: default;
  border-color: rgba(16, 185, 129, 0.45);
  color: #a7f3d0;
}

.wb-helper-banner {
  margin-top: 10px;
  background: rgba(56, 189, 248, 0.14);
  border: 1px solid rgba(56, 189, 248, 0.45);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  color: #e0f2fe;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.print-only-banner {
  display: none;
}

.print-only-inline {
  display: none;
}

.print-blank-line {
  display: none;
}

.notes-section-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 14px;
}

.notes-section-head {
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
  margin-bottom: 12px;
}

.notes-section-id {
  background: rgba(56, 189, 248, 0.16);
  color: var(--cyan);
  border: 1px solid rgba(56, 189, 248, 0.4);
  font-weight: 800;
  font-size: 12px;
  padding: 3px 9px;
  border-radius: 6px;
}

.notes-section-title {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  color: #ffffff;
}

.notes-list {
  margin: 0;
  padding-left: 28px;
}

.note-item {
  margin-bottom: 14px;
  font-size: 15.5px;
  line-height: 1.75;
  color: #e2e8f0;
}

.note-item:last-child {
  margin-bottom: 0;
}

.note-item.is-epa608 {
  background: linear-gradient(90deg, rgba(16, 185, 129, 0.20) 0%, rgba(16, 185, 129, 0.08) 100%);
  border-left: 4px solid #10b981;
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 14px;
}

.note-item.is-epa608:last-child {
  margin-bottom: 0;
}

.note-blank {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 10px;
  margin: 0 3px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.94em;
  font-weight: 800;
  transition: all 0.15s ease;
  vertical-align: baseline;
}

button.note-blank.is-unsolved {
  cursor: pointer;
  background: rgba(245, 158, 11, 0.14);
  color: #fbbf24;
  border: 1.5px dashed rgba(245, 158, 11, 0.65);
}

button.note-blank.is-unsolved:hover:not(:disabled):not(.is-locked),
button.note-blank.is-unsolved.is-active {
  background: rgba(56, 189, 248, 0.2);
  color: #ffffff;
  border: 1.5px solid var(--cyan);
  box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
}

button.note-blank.is-unsolved.drag-over {
  border-color: var(--emerald);
  background: rgba(16, 185, 129, 0.24);
  transform: scale(1.03);
}

button.note-blank.is-unsolved.is-locked,
button.note-blank.is-locked:disabled {
  cursor: not-allowed;
  background: rgba(244, 63, 94, 0.14);
  color: #fda4af;
  border: 1.5px solid rgba(244, 63, 94, 0.65);
  box-shadow: none;
  opacity: 0.92;
  transform: none;
}

button.note-blank.flash-wrong {
  border-color: var(--coral) !important;
  background: rgba(244, 63, 94, 0.24) !important;
  color: #ffe4e6 !important;
  animation: shake 0.35s ease;
}

.note-blank.is-solved {
  background: rgba(16, 185, 129, 0.16);
  color: #6ee7b7;
  border: 1px solid rgba(16, 185, 129, 0.5);
  cursor: default;
}

.note-context-btn {
  display: inline-flex;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1.75px solid var(--cyan);
  background: rgba(56, 189, 248, 0.14);
  color: #7dd3fc;
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-weight: 800;
  font-size: 13.5px;
  line-height: 1;
  align-items: center;
  justify-content: center;
  padding: 0;
  margin: 0 2px 0 7px;
  cursor: pointer;
  vertical-align: middle;
  transition: all 0.15s ease;
}

.note-context-btn:hover,
.note-context-btn:focus-visible {
  background: rgba(56, 189, 248, 0.32);
  color: #ffffff;
  border-color: #7dd3fc;
  transform: scale(1.08);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22);
  outline: none;
}

.note-context-btn.is-epa608 {
  border-color: #10b981;
  background: rgba(16, 185, 129, 0.22);
  color: #6ee7b7;
}

.note-context-btn.is-epa608:hover,
.note-context-btn.is-epa608:focus-visible {
  border-color: #34d399;
  background: rgba(16, 185, 129, 0.38);
  color: #ffffff;
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.24);
}

.note-diagram-wrap {
  margin: 8px 0 4px 0;
}

.note-diagram-img {
  max-width: 100%;
  max-height: 300px;
  border-radius: 8px;
  border: 1px solid var(--border-bright);
  background: #080e1a;
  object-fit: contain;
  display: block;
  cursor: zoom-in;
}

.note-diagram-caption {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
  font-style: italic;
}

.context-quote-figure {
  margin-top: 12px;
  padding: 10px 12px;
  background: rgba(8, 14, 26, 0.72);
  border: 1px solid var(--border);
  border-radius: 10px;
}

.figures-modal-dialog {
  max-width: 900px;
  width: min(94vw, 900px);
  max-height: 90vh;
  overflow-y: auto;
  background: #0f172a;
  border: 1.5px solid rgba(56, 189, 248, 0.55);
  border-radius: 14px;
  padding: 20px 22px;
  box-shadow: 0 22px 50px rgba(0, 0, 0, 0.72);
  color: #f8fafc;
}

.figures-modal-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
  margin-top: 14px;
}

.figure-ref-card {
  background: var(--card);
  border: 1px solid var(--border-bright);
  border-radius: 10px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.figure-ref-card .note-diagram-img {
  max-height: 220px;
  width: 100%;
}

.figure-ref-title {
  font-size: 13.5px;
  font-weight: 700;
  color: #ffffff;
}

.figure-ref-source {
  font-size: 12px;
  color: var(--cyan);
}

.card-choice-options,
.scenario-choice-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.card-choice-btn,
.scenario-choice-btn {
  background: var(--card-alt);
  color: var(--text);
  border: 1.5px solid var(--border-bright);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 13.5px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: all 0.12s ease;
  line-height: 1.35;
}

.card-choice-btn:hover:not(:disabled),
.scenario-choice-btn:hover:not(:disabled) {
  border-color: var(--cyan);
  background: #1f3258;
}

.card-choice-btn.wrong,
.scenario-choice-btn.wrong {
  border-color: rgba(244, 63, 94, 0.6);
  background: rgba(244, 63, 94, 0.14);
  color: #fda4af;
  opacity: 0.72;
  cursor: not-allowed;
}

.card-choice-btn.is-locked,
.scenario-choice-btn.is-locked,
.card-choice-btn.is-locked:disabled,
.scenario-choice-btn.is-locked:disabled {
  border-color: rgba(244, 63, 94, 0.55);
  background: rgba(244, 63, 94, 0.1);
  color: #fda4af;
  opacity: 0.65;
  cursor: not-allowed;
}

.blank-feedback-bad,
.scenario-feedback-bad {
  margin-top: 8px;
  background: rgba(244, 63, 94, 0.14);
  border: 1px solid rgba(244, 63, 94, 0.45);
  border-radius: 7px;
  padding: 6px 10px;
  font-size: 12.5px;
  font-weight: 600;
  color: #fecdd3;
}

.blank-feedback-locked {
  margin-top: 8px;
  background: rgba(244, 63, 94, 0.16);
  border: 1.5px solid rgba(244, 63, 94, 0.6);
  border-left: 4px solid var(--coral);
  border-radius: 7px;
  padding: 7px 11px;
  font-size: 12.5px;
  font-weight: 700;
  color: #ffe4e6;
}

.card-choice-grid {
  margin-bottom: 14px;
  background: var(--card);
  border: 1.5px solid rgba(56, 189, 248, 0.45);
  border-radius: 12px;
  padding: 13px 15px;
}

.card-choice-title,
.scenario-choice-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--cyan);
  margin-bottom: 9px;
}

.scenario-choice-grid {
  margin-top: 8px;
  background: #0d172c;
  border: 1px solid var(--border-bright);
  border-radius: 10px;
  padding: 11px 13px;
}

.note-trap-strip {
  margin-top: 6px;
  background: rgba(244, 63, 94, 0.12);
  border: 1px solid rgba(244, 63, 94, 0.4);
  border-left: 4px solid var(--coral);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
  color: #fecdd3;
}

.note-trap-strip strong {
  color: #fda4af;
}

/* === KEY VOCABULARY SUBTAB === */
.vocab-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 14px;
}

.vocab-toolbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.vocab-toolbar-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--text);
}

.vocab-toolbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  flex: 1 1 auto;
  justify-content: flex-end;
}

.vocab-search-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  min-width: 220px;
  flex: 1 1 240px;
  max-width: 340px;
}

.vocab-search-input {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border-bright);
  border-radius: 8px;
  padding: 7px 11px;
  font-size: 13px;
  font-weight: 500;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.vocab-search-input::placeholder {
  color: var(--muted);
}

.vocab-search-input:focus {
  outline: none;
  border-color: var(--cyan);
  box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
}

.vocab-notice-banner {
  background: rgba(245, 158, 11, 0.12);
  border: 1px solid rgba(245, 158, 11, 0.45);
  border-left: 4px solid var(--amber);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 13.5px;
  color: var(--text);
}

.vocab-section-group {
  margin-bottom: 18px;
}

.vocab-section-heading {
  margin: 0 0 10px 0;
  padding: 0 2px 7px 2px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 15px;
  font-weight: 800;
  color: var(--text);
}

.vocab-section-heading-main {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}

.vocab-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.vocab-card:hover {
  border-color: var(--border-bright);
}

.vocab-card.is-epa608 {
  border-color: rgba(16, 185, 129, 0.55);
  border-left: 4px solid var(--emerald);
  background: linear-gradient(160deg, rgba(16, 185, 129, 0.1) 0%, var(--card) 100%);
}

.vocab-card.is-mastered {
  border-color: rgba(16, 185, 129, 0.65);
  background: linear-gradient(160deg, rgba(16, 185, 129, 0.14) 0%, var(--card) 100%);
}

.vocab-card-head {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.vocab-card-term {
  margin: 0;
  font-size: 16.5px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.3;
}

.vocab-meta-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.vocab-def {
  margin: 0;
  font-size: 14px;
  line-height: 1.55;
  color: var(--text);
  opacity: 0.92;
}

.vocab-reveal-btn {
  width: 100%;
  text-align: center;
  background: var(--card-alt);
  color: var(--cyan);
  border: 1.5px dashed rgba(56, 189, 248, 0.5);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.vocab-reveal-btn:hover {
  background: rgba(56, 189, 248, 0.16);
  border-color: var(--cyan);
}

.vocab-card-foot {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  padding-top: 6px;
  border-top: 1px solid rgba(148, 163, 184, 0.14);
}

/* === EMBEDDED KEY VOCABULARY IN STUDY GUIDE === */
.notes-embedded-vocab {
  margin-top: 18px;
  border-color: rgba(56, 189, 248, 0.35);
}

.notes-embedded-vocab-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  padding-bottom: 10px;
  margin-bottom: 12px;
}

.notes-embedded-vocab.is-collapsed .notes-embedded-vocab-head {
  border-bottom: none;
  padding-bottom: 0;
  margin-bottom: 0;
}

.notes-embedded-vocab-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.notes-embedded-vocab-title {
  margin: 0;
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
}

.notes-vocab-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.notes-vocab-body.is-collapsed {
  display: none;
}

.notes-vocab-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.notes-vocab-card {
  background: var(--card-alt);
  box-shadow: none;
  padding: 12px 14px;
}

.notes-vocab-card.is-epa608 {
  background: linear-gradient(160deg, rgba(16, 185, 129, 0.12) 0%, var(--card-alt) 100%);
}

.notes-vocab-card.is-mastered {
  background: linear-gradient(160deg, rgba(16, 185, 129, 0.16) 0%, var(--card-alt) 100%);
}

/* === TERM MATCH-UP === */
.match-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 14px;
}

.match-stats {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.match-grid {
  display: grid;
  grid-template-columns: 1fr 1.35fr;
  gap: 14px;
}

.match-col {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.match-col-head {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--cyan);
  margin-bottom: 2px;
}

.match-card {
  background: var(--card);
  border: 1.5px solid var(--border-bright);
  border-radius: 10px;
  padding: 12px 14px;
  text-align: left;
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
}

.match-card.is-epa608 {
  border-color: rgba(16, 185, 129, 0.65);
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.16), var(--card));
}

.match-card:hover:not(.matched) {
  border-color: var(--cyan);
  background: var(--card-alt);
}

.match-card.is-epa608:hover:not(.matched):not(.selected) {
  border-color: #34d399;
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.24), var(--card-alt));
}

.match-card.selected {
  border-color: var(--cyan);
  background: rgba(56, 189, 248, 0.18);
  box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3);
}

.match-card.matched {
  border-color: var(--emerald);
  background: rgba(16, 185, 129, 0.16);
  color: #a7f3d0;
  cursor: default;
}

.match-card.flash-wrong {
  border-color: var(--coral);
  background: rgba(244, 63, 94, 0.24);
  animation: shake 0.35s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.match-clear-banner {
  margin-top: 14px;
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(56, 189, 248, 0.15));
  border: 1.5px solid var(--emerald);
  border-radius: var(--radius);
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

/* === FIELD SCENARIOS & LABS === */
.scenarios-labs-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.stack-col {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.section-heading {
  margin: 0 0 4px 0;
  font-size: 16px;
  font-weight: 800;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 8px;
}

.scenario-card, .lab-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px 17px;
  box-shadow: var(--shadow);
}

.scenario-card.is-epa608 {
  border-color: rgba(16, 185, 129, 0.65);
  border-left: 4px solid #10b981;
  background: linear-gradient(160deg, rgba(16, 185, 129, 0.14) 0%, var(--card) 100%);
}

.scenario-prompt {
  font-size: 14.5px;
  color: #e2e8f0;
  margin: 8px 0 12px 0;
}

.scenario-analysis {
  margin-top: 10px;
  background: rgba(16, 185, 129, 0.11);
  border: 1px solid rgba(16, 185, 129, 0.4);
  border-left: 4px solid var(--emerald);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13.5px;
  color: #d1fae5;
}

.lab-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 6px 0 10px 0;
}

.lab-subhead {
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--cyan);
  font-weight: 800;
  margin: 8px 0 4px 0;
}

.lab-list {
  margin: 0;
  padding-left: 18px;
  font-size: 13.5px;
  color: #cbd5e1;
}

/* === ARENA (TAB 2) === */
.arena-modebar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-bottom: 14px;
}

.arena-mode-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.arena-game-picker-banner {
  background: linear-gradient(135deg, rgba(17, 28, 51, 0.96), rgba(23, 37, 66, 0.94));
  border: 1px solid var(--border-bright);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.arena-game-picker-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.arena-game-picker-head h3 {
  margin: 0;
  font-size: 16px;
  color: #ffffff;
}

.arena-game-picker {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.arena-game-card {
  background: var(--card-alt);
  border: 1.5px solid var(--border-bright);
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
  transition: border-color 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease;
}

.arena-game-card:hover {
  border-color: var(--cyan);
  transform: translateY(-1px);
}

.arena-game-card.active {
  border-color: var(--cyan);
  background: linear-gradient(160deg, rgba(56, 189, 248, 0.16), rgba(16, 185, 129, 0.08));
  box-shadow: 0 0 18px rgba(56, 189, 248, 0.16);
}

.arena-game-card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}

.arena-game-card-title {
  font-size: 14.5px;
  font-weight: 800;
  color: #ffffff;
}

.arena-game-card-desc {
  font-size: 12.5px;
  color: var(--muted);
  margin: 4px 0 0 0;
  line-height: 1.4;
}

.arena-game-card-stats {
  font-size: 12px;
  color: #cbd5e1;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.arena-lobby-grid {
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: 16px;
}

.round-cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin: 12px 0 14px 0;
}

.round-option {
  background: var(--card-alt);
  border: 1.5px solid var(--border-bright);
  border-radius: 10px;
  padding: 12px;
  text-align: left;
  color: var(--text);
  cursor: pointer;
}

.round-option.active {
  border-color: var(--cyan);
  background: rgba(56, 189, 248, 0.17);
  box-shadow: 0 0 16px rgba(56, 189, 248, 0.2);
}

.round-option strong {
  display: block;
  font-size: 14px;
  margin-bottom: 3px;
}

.round-option span {
  font-size: 12px;
  color: var(--muted);
}

.van-shop-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 360px;
  overflow-y: auto;
}

.shop-item {
  background: var(--card-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.shop-item.owned {
  border-color: rgba(16, 185, 129, 0.55);
  background: rgba(16, 185, 129, 0.1);
}

.shop-item-info strong {
  display: block;
  font-size: 13.5px;
  color: #ffffff;
}

.shop-item-info small {
  font-size: 12px;
  color: var(--muted);
}

/* Solo Active Play */
.solo-hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.timer-bar-wrap {
  width: 100%;
  height: 10px;
  background: #080e1c;
  border: 1px solid var(--border);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 12px;
}

.timer-bar-fill {
  height: 100%;
  width: 100%;
  background: var(--cyan);
  transition: width 0.08s linear, background-color 0.25s ease;
}

.quiz-question-card {
  background: var(--card);
  border: 1px solid var(--border-bright);
  border-radius: 14px;
  padding: 16px 20px;
  margin-bottom: 12px;
}

.quiz-question-card.is-epa608 {
  border-color: rgba(16, 185, 129, 0.72);
  border-left: 4px solid #10b981;
  background: linear-gradient(160deg, rgba(16, 185, 129, 0.16) 0%, var(--card) 100%);
}

.quiz-q-text {
  font-size: 20px;
  font-weight: 700;
  color: #ffffff;
  margin: 8px 0 0 0;
  line-height: 1.4;
}

.quiz-q-img {
  margin-top: 10px;
  max-height: 300px;
  max-width: 100%;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #080e1a;
  cursor: zoom-in;
}

.kahoot-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.kahoot-tile {
  border: 2px solid rgba(255, 255, 255, 0.16);
  border-radius: 12px;
  padding: 14px 16px;
  color: #ffffff;
  font-size: 15.5px;
  font-weight: 700;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 68px;
  transition: transform 0.1s ease, filter 0.15s ease, opacity 0.15s ease;
}

.kahoot-tile:hover:not(:disabled) {
  transform: translateY(-2px);
  filter: brightness(1.08);
}

.kahoot-tile:disabled {
  cursor: default;
}

.kahoot-tile.c0 { background: linear-gradient(135deg, #be123c, #e11d48); }
.kahoot-tile.c1 { background: linear-gradient(135deg, #1d4ed8, #2563eb); }
.kahoot-tile.c2 { background: linear-gradient(135deg, #b45309, #d97706); }
.kahoot-tile.c3 { background: linear-gradient(135deg, #047857, #059669); }

.kahoot-tile.dimmed {
  opacity: 0.35;
}

.kahoot-tile.reveal-correct {
  box-shadow: 0 0 0 3px #ffffff, 0 0 24px rgba(16, 185, 129, 0.75);
  opacity: 1 !important;
}

.kahoot-tile.reveal-wrong {
  box-shadow: 0 0 0 3px #fda4af;
}

.tile-shape {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.28);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.tile-key {
  margin-left: auto;
  background: rgba(0, 0, 0, 0.28);
  border-radius: 6px;
  padding: 2px 7px;
  font-size: 12px;
  opacity: 0.9;
}

.feedback-banner {
  margin-top: 12px;
  border-radius: 12px;
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

.feedback-banner.ok {
  background: rgba(16, 185, 129, 0.16);
  border-color: var(--emerald);
}

.feedback-banner.bad {
  background: rgba(244, 63, 94, 0.16);
  border-color: var(--coral);
}

/* === HOST MODE (SMARTBOARD) === */
.host-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 14px;
}

.host-question-box {
  background: linear-gradient(160deg, #101b33 0%, #162647 100%);
  border: 2px solid var(--cyan);
  border-radius: 16px;
  padding: 22px 26px;
  margin-bottom: 14px;
}

.host-question-box.is-epa608 {
  border-color: #10b981;
  background: linear-gradient(160deg, rgba(16, 185, 129, 0.20) 0%, #162647 100%);
}

.host-q-text {
  font-size: 26px;
  font-weight: 800;
  color: #ffffff;
  line-height: 1.35;
  margin: 10px 0 0 0;
}

.host-tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}

.host-tile {
  border-radius: 14px;
  padding: 18px 20px;
  font-size: 22px;
  font-weight: 800;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 82px;
  border: 2px solid rgba(255, 255, 255, 0.2);
}

.host-tile.c0 { background: #be123c; }
.host-tile.c1 { background: #1d4ed8; }
.host-tile.c2 { background: #b45309; }
.host-tile.c3 { background: #047857; }
.host-tile.dimmed { opacity: 0.3; }
.host-tile.reveal-correct {
  opacity: 1 !important;
  box-shadow: 0 0 0 4px #ffffff, 0 0 28px rgba(16, 185, 129, 0.85);
}

.host-teams-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.team-card {
  background: var(--card);
  border: 1px solid var(--border-bright);
  border-radius: 12px;
  padding: 12px;
  text-align: center;
}

.team-name-input {
  width: 100%;
  background: var(--bg);
  color: #ffffff;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 14px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 6px;
}

.team-score-val {
  font-size: 28px;
  font-weight: 900;
  color: var(--amber);
  margin: 4px 0 8px 0;
}

.team-btn-row {
  display: flex;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* === MYSTERY CRATE MODAL === */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(4, 8, 18, 0.82);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal-card {
  background: linear-gradient(160deg, #111c33 0%, #19294a 100%);
  border: 2px solid var(--amber);
  border-radius: 16px;
  padding: 22px 24px;
  max-width: 680px;
  width: 100%;
  text-align: center;
  box-shadow: 0 22px 60px rgba(0, 0, 0, 0.65);
}

.crates-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin: 18px 0;
}

.crate-btn {
  background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
  border: 2px solid var(--amber);
  border-radius: 14px;
  padding: 20px 12px;
  color: #ffffff;
  cursor: pointer;
  transition: transform 0.16s ease, box-shadow 0.16s ease;
}

.crate-btn:hover:not(:disabled) {
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 0 24px rgba(245, 158, 11, 0.4);
}

.crate-icon {
  font-size: 40px;
  display: block;
  margin-bottom: 6px;
}

.crate-result-box {
  background: rgba(15, 23, 42, 0.85);
  border: 1.5px solid var(--cyan);
  border-radius: 12px;
  padding: 16px;
  margin-top: 12px;
}

/* === DIAGRAM LIGHTBOX MODAL === */
.diagram-lightbox-backdrop {
  z-index: 88;
  background: rgba(2, 6, 16, 0.9);
  padding: 20px;
}

.diagram-lightbox-dialog {
  position: relative;
  max-width: min(1100px, 94vw);
  max-height: 92vh;
  background: #0d162b;
  border: 1.5px solid var(--border-bright);
  border-radius: 14px;
  padding: 14px 16px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.78);
}

.diagram-lightbox-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.diagram-lightbox-caption {
  font-size: 13px;
  font-weight: 700;
  color: var(--cyan);
}

.diagram-lightbox-img {
  display: block;
  max-width: 100%;
  max-height: calc(92vh - 76px);
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 8px;
  background: #080e1a;
  border: 1px solid var(--border);
  margin: 0 auto;
}

/* === TEXTBOOK CONTEXT QUOTE MODAL === */
.context-quote-backdrop {
  z-index: 86;
  background: rgba(2, 6, 16, 0.84);
  padding: 20px;
}

.context-quote-dialog {
  max-width: 660px;
  width: min(92vw, 660px);
  max-height: 90vh;
  overflow-y: auto;
  background: #0f172a;
  border: 1.5px solid rgba(56, 189, 248, 0.55);
  border-radius: 14px;
  padding: 20px 22px;
  box-shadow: 0 22px 50px rgba(0, 0, 0, 0.72);
  color: #f8fafc;
}

.context-quote-bar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
}

.context-quote-title {
  font-size: 17px;
  font-weight: 800;
  color: #ffffff;
}

.context-quote-source {
  font-size: 13px;
  font-weight: 600;
  color: #7dd3fc;
  margin-top: 3px;
}

.context-quote-epa-banner {
  background: rgba(16, 185, 129, 0.20);
  border: 1px solid rgba(16, 185, 129, 0.6);
  color: #6ee7b7;
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  font-weight: 700;
  margin-top: 12px;
  margin-bottom: 10px;
}

.context-quote-excerpt {
  margin: 14px 0 12px 0;
  padding: 14px 16px;
  background: rgba(15, 23, 42, 0.85);
  border-left: 4px solid var(--cyan);
  border-radius: 0 10px 10px 0;
  font-size: 16px;
  line-height: 1.72;
  color: #e2e8f0;
}

.context-quote-excerpt.epa608-quote-highlight {
  background: rgba(16, 185, 129, 0.16);
  border-left: 4px solid #10b981;
  color: #ecfdf5;
  box-shadow: inset 0 0 0 1px rgba(16, 185, 129, 0.35);
}

.context-quote-hint {
  font-size: 13px;
  color: #94a3b8;
}

/* === TOASTS & CONFETTI === */
.toast-stack {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 90;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.xp-toast {
  background: #0d1a33;
  border: 1.5px solid var(--amber);
  color: #fef3c7;
  padding: 9px 14px;
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 700;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  animation: toastSlide 0.22s ease-out;
}

@keyframes toastSlide {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.confetti-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 95;
  overflow: hidden;
}

.confetti-piece {
  position: absolute;
  top: -14px;
  width: 10px;
  height: 14px;
  border-radius: 2px;
  animation: confettiFall 1.8s linear forwards;
}

@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(105vh) rotate(520deg); opacity: 0; }
}

.select-input {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border-bright);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 13px;
  font-weight: 600;
}

.empty-card {
  background: var(--card);
  border: 1px dashed var(--border-bright);
  border-radius: var(--radius);
  padding: 26px;
  text-align: center;
  color: var(--muted);
}

/* === RESPONSIVE === */
@media (max-width: 960px) {
  .app-header {
    position: static;
  }
  .scenarios-labs-grid,
  .arena-game-picker,
  .arena-lobby-grid,
  .kahoot-grid,
  .host-tiles,
  .host-teams-grid,
  .card-choice-options,
  .scenario-choice-options {
    grid-template-columns: 1fr;
  }
  .match-grid {
    grid-template-columns: minmax(115px, 0.88fr) minmax(145px, 1.32fr);
    gap: 8px;
  }
  .study-notes-workspace {
    grid-template-columns: 1fr;
  }
  .word-bank-box {
    position: sticky;
    top: 6px;
    z-index: 25;
    max-height: 28vh;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    margin-bottom: 12px;
  }
  .round-cards,
  .crates-row {
    grid-template-columns: 1fr;
  }
  .vocab-toolbar-actions {
    justify-content: flex-start;
  }
  .vocab-search-wrap {
    max-width: 100%;
  }
  .vocab-grid,
  .notes-vocab-grid {
    grid-template-columns: 1fr;
  }
  .chapter-title {
    white-space: normal;
    max-width: none;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
}

@media (max-width: 640px) {
  .app-header {
    padding: 8px 12px;
    gap: 8px;
  }
  .main-shell {
    padding: 10px 10px 28px;
  }
  .notes-section-card {
    padding: 12px 12px;
  }
  .notes-list {
    padding-left: 18px;
  }
  .filter-bar {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    padding: 8px 10px;
  }
  .filter-pill,
  .filter-bar .pill {
    flex-shrink: 0;
  }
  .flip-card,
  .flip-face {
    min-height: 250px;
  }
  .flip-face {
    padding: 14px 16px;
  }
  .flip-prompt,
  .flip-answer {
    font-size: 17.5px;
  }
  .flip-img {
    max-height: 220px;
  }
  .match-card {
    padding: 9px 10px;
    font-size: 12.5px;
    line-height: 1.35;
  }
  .note-context-btn {
    width: 30px;
    height: 30px;
  }
}

  @page {
    size: letter portrait;
    margin: 0.5in 0.55in;

/* === INTERACTIVE TOPIC GAME CSS === */

/* === CTE HVACR Topic Game Engines Part 1 (.tg1- scoped) === */
.tg1-root {
  --tg1-bg: #0b1220;
  --tg1-panel: #111b2e;
  --tg1-panel-2: #162238;
  --tg1-border: #263652;
  --tg1-text: #e2e8f0;
  --tg1-muted: #94a3b8;
  --tg1-amber: #fbbf24;
  --tg1-cyan: #22d3ee;
  --tg1-green: #22c55e;
  --tg1-red: #ef4444;
  --tg1-orange: #f97316;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--tg1-text);
  background: var(--tg1-bg);
  border: 1px solid var(--tg1-border);
  border-radius: 14px;
  padding: 14px;
  box-sizing: border-box;
  width: 100%;
}
.tg1-root *, .tg1-root *::before, .tg1-root *::after {
  box-sizing: border-box;
}

.tg1-topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  background: linear-gradient(135deg, #131f36 0%, #0f172a 100%);
  border: 1px solid var(--tg1-border);
  border-radius: 10px;
  margin-bottom: 12px;
}
.tg1-title-group {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.tg1-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--tg1-amber);
}
.tg1-heading {
  font-size: 16px;
  font-weight: 800;
  color: #f8fafc;
  margin: 0;
}
.tg1-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.tg1-stat-pill {
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid var(--tg1-border);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--tg1-text);
}
.tg1-stat-pill strong {
  color: var(--tg1-amber);
}
.tg1-stat-pill.tg1-streak strong {
  color: var(--tg1-cyan);
}

.tg1-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.42fr) minmax(300px, 1fr);
  gap: 12px;
  align-items: start;
}
@media (max-width: 940px) {
  .tg1-grid {
    grid-template-columns: 1fr;
  }
}

.tg1-bench-col, .tg1-mission-col {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

.tg1-mode-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tg1-mode-tab {
  background: var(--tg1-panel);
  color: var(--tg1-muted);
  border: 1px solid var(--tg1-border);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
}
.tg1-mode-tab:hover {
  border-color: var(--tg1-cyan);
  color: #f8fafc;
}
.tg1-mode-tab.tg1-active {
  background: rgba(251, 191, 36, 0.14);
  border-color: var(--tg1-amber);
  color: var(--tg1-amber);
}

.tg1-canvas-wrap {
  position: relative;
  background: #070d18;
  border: 1px solid var(--tg1-border);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.55);
}
.tg1-canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 780 / 430;
  cursor: pointer;
  touch-action: manipulation;
}
.tg1-canvas-hint {
  position: absolute;
  bottom: 8px;
  right: 10px;
  background: rgba(11, 18, 32, 0.85);
  border: 1px solid var(--tg1-border);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 11px;
  color: var(--tg1-muted);
  pointer-events: none;
}

.tg1-alert-banner {
  display: none;
  padding: 9px 12px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 700;
  border: 1px solid transparent;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.tg1-alert-banner.tg1-visible {
  display: flex;
}
.tg1-alert-danger {
  background: rgba(239, 68, 68, 0.16);
  border-color: rgba(239, 68, 68, 0.65);
  color: #fecaca;
}
.tg1-alert-warn {
  background: rgba(249, 115, 22, 0.16);
  border-color: rgba(249, 115, 22, 0.6);
  color: #fed7aa;
}
.tg1-alert-ok {
  background: rgba(34, 197, 94, 0.15);
  border-color: rgba(34, 197, 94, 0.55);
  color: #bbf7d0;
}

@keyframes tg1-shake-anim {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
.tg1-shake {
  animation: tg1-shake-anim 0.35s ease;
}

.tg1-metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
  gap: 8px;
}
.tg1-metric {
  background: var(--tg1-panel);
  border: 1px solid var(--tg1-border);
  border-radius: 9px;
  padding: 7px 10px;
}
.tg1-metric-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--tg1-muted);
}
.tg1-metric-val {
  font-size: 16px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
  color: #f8fafc;
}
.tg1-metric.tg1-ok { border-color: rgba(34, 197, 94, 0.5); }
.tg1-metric.tg1-ok .tg1-metric-val { color: var(--tg1-green); }
.tg1-metric.tg1-warn { border-color: rgba(245, 158, 11, 0.55); }
.tg1-metric.tg1-warn .tg1-metric-val { color: var(--tg1-amber); }
.tg1-metric.tg1-bad { border-color: rgba(239, 68, 68, 0.65); }
.tg1-metric.tg1-bad .tg1-metric-val { color: #f87171; }
.tg1-metric.tg1-cyan .tg1-metric-val { color: var(--tg1-cyan); }

.tg1-controls {
  background: var(--tg1-panel);
  border: 1px solid var(--tg1-border);
  border-radius: 12px;
  padding: 11px 12px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.tg1-controls-title {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--tg1-cyan);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.tg1-ctrl-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
  gap: 9px 12px;
}
.tg1-ctrl-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.tg1-ctrl-head {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
  color: var(--tg1-text);
}
.tg1-ctrl-head span:last-child {
  font-variant-numeric: tabular-nums;
  color: var(--tg1-amber);
  font-weight: 700;
}
.tg1-slider {
  width: 100%;
  accent-color: var(--tg1-amber);
  cursor: pointer;
}

.tg1-btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  align-items: center;
}
.tg1-btn {
  background: var(--tg1-panel-2);
  color: var(--tg1-text);
  border: 1px solid var(--tg1-border);
  border-radius: 8px;
  padding: 6px 11px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.14s ease;
}
.tg1-btn:hover:not(:disabled) {
  border-color: var(--tg1-cyan);
  color: #fff;
  transform: translateY(-1px);
}
.tg1-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.tg1-btn.tg1-btn-active {
  background: rgba(34, 211, 238, 0.16);
  border-color: var(--tg1-cyan);
  color: var(--tg1-cyan);
}
.tg1-btn.tg1-btn-amber {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  border-color: #fbbf24;
  color: #0b1220;
}
.tg1-btn.tg1-btn-green {
  background: rgba(34, 197, 94, 0.2);
  border-color: var(--tg1-green);
  color: #86efac;
}
.tg1-btn.tg1-btn-red {
  background: rgba(239, 68, 68, 0.2);
  border-color: var(--tg1-red);
  color: #fca5a5;
}

.tg1-select {
  background: #0b1220;
  color: var(--tg1-text);
  border: 1px solid var(--tg1-border);
  border-radius: 7px;
  padding: 5px 8px;
  font-size: 12px;
  font-weight: 600;
}

/* Digital Multimeter LCD Box */
.tg1-dmm-lcd {
  background: #1a2e22;
  border: 2px solid #365743;
  border-radius: 9px;
  padding: 9px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
}
.tg1-dmm-lcd.tg1-lcd-fault {
  background: #36181c;
  border-color: #ef4444;
}
.tg1-dmm-readout {
  font-family: "Cascadia Mono", "Consolas", monospace;
  font-size: 22px;
  font-weight: 800;
  color: #a7f3d0;
  letter-spacing: 0.03em;
  font-variant-numeric: tabular-nums;
}
.tg1-dmm-lcd.tg1-lcd-fault .tg1-dmm-readout {
  color: #fecaca;
}
.tg1-dmm-sub {
  font-size: 11px;
  color: #9ae6b4;
  text-align: right;
  line-height: 1.35;
}
.tg1-dmm-lcd.tg1-lcd-fault .tg1-dmm-sub {
  color: #fca5a5;
}

/* Mission Runner Card */
.tg1-mission-box {
  background: var(--tg1-panel);
  border: 1px solid var(--tg1-border);
  border-radius: 12px;
  padding: 13px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.tg1-mission-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.tg1-mission-badge {
  background: rgba(34, 211, 238, 0.14);
  color: var(--tg1-cyan);
  border: 1px solid rgba(34, 211, 238, 0.35);
  border-radius: 999px;
  padding: 3px 9px;
  font-size: 11px;
  font-weight: 700;
}
.tg1-progress-track {
  height: 7px;
  background: #0b1220;
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid var(--tg1-border);
}
.tg1-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--tg1-cyan), var(--tg1-amber));
  transition: width 0.28s ease;
}
.tg1-mission-title {
  margin: 0;
  font-size: 15px;
  font-weight: 800;
  color: #f8fafc;
}
.tg1-mission-prompt {
  margin: 0;
  font-size: 13.5px;
  line-height: 1.5;
  color: #cbd5e1;
}
.tg1-target-note {
  background: rgba(251, 191, 36, 0.1);
  border: 1px dashed rgba(251, 191, 36, 0.45);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 12px;
  color: #fde68a;
  line-height: 1.4;
}

.tg1-choices {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.tg1-choice-btn {
  width: 100%;
  text-align: left;
  background: var(--tg1-panel-2);
  color: var(--tg1-text);
  border: 1px solid var(--tg1-border);
  border-radius: 9px;
  padding: 9px 11px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.38;
  cursor: pointer;
  display: flex;
  gap: 9px;
  align-items: flex-start;
  transition: all 0.14s ease;
}
.tg1-choice-btn:hover:not(:disabled) {
  border-color: var(--tg1-cyan);
  background: #1c2b47;
}
.tg1-choice-btn:disabled {
  cursor: default;
}
.tg1-choice-key {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: #0b1220;
  border: 1px solid var(--tg1-border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 800;
  color: var(--tg1-amber);
}
.tg1-choice-btn.tg1-choice-correct {
  background: rgba(34, 197, 94, 0.18);
  border-color: var(--tg1-green);
  color: #dcfce7;
}
.tg1-choice-btn.tg1-choice-wrong {
  background: rgba(239, 68, 68, 0.18);
  border-color: var(--tg1-red);
  color: #fee2e2;
}

.tg1-coach-tip {
  display: none;
  background: rgba(15, 23, 42, 0.9);
  border-left: 3px solid var(--tg1-amber);
  border-radius: 0 8px 8px 0;
  padding: 9px 11px;
  font-size: 12.5px;
  line-height: 1.45;
  color: #e2e8f0;
}
.tg1-coach-tip.tg1-visible {
  display: block;
}
.tg1-coach-tip strong {
  color: var(--tg1-amber);
}

.tg1-mission-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.tg1-summary-card {
  background: linear-gradient(155deg, #13223b 0%, #0f172a 100%);
  border: 1px solid rgba(251, 191, 36, 0.5);
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.tg1-summary-rank {
  font-size: 20px;
  font-weight: 900;
  color: var(--tg1-amber);
}

@media (max-width: 640px) {
  .tg1-root { padding: 10px; }
  .tg1-panel { padding: 10px; }
  .tg1-canvas-hint {
    position: static;
    display: block;
    margin-top: 6px;
    text-align: center;
  }
  .tg1-dmm-lcd { flex-wrap: wrap; gap: 6px; }
  .tg1-dmm-readout { font-size: 18px; }
}


/* === TG2 Topic Game Engines Part 2 & Sorter Arcade (.tg2-*) === */
.tg2-root {
  --tg2-bg: #0f172a;
  --tg2-panel: #1e293b;
  --tg2-panel-deep: #0b1220;
  --tg2-border: #334155;
  --tg2-text: #f8fafc;
  --tg2-muted: #94a3b8;
  --tg2-blue: #38bdf8;
  --tg2-gold: #fbbf24;
  --tg2-green: #34d399;
  --tg2-red: #f87171;
  --tg2-orange: #fb923c;
  --tg2-purple: #a78bfa;
  font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--tg2-text);
  box-sizing: border-box;
  width: 100%;
}
.tg2-root *,
.tg2-root *::before,
.tg2-root *::after {
  box-sizing: border-box;
}

.tg2-switcher {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  padding: 6px;
  background: var(--tg2-panel-deep);
  border: 1px solid var(--tg2-border);
  border-radius: 12px;
}
.tg2-switch-btn {
  flex: 1 1 240px;
  appearance: none;
  border: 1px solid transparent;
  background: transparent;
  color: var(--tg2-muted);
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease, transform 0.1s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.tg2-switch-btn:hover {
  color: var(--tg2-text);
  background: rgba(56, 189, 248, 0.08);
}
.tg2-switch-btn.is-active {
  background: linear-gradient(135deg, #0284c7, #2563eb);
  color: #ffffff;
  border-color: rgba(125, 211, 252, 0.45);
  box-shadow: 0 4px 14px rgba(2, 132, 199, 0.32);
}

.tg2-stage {
  width: 100%;
}

.tg2-shell {
  background: var(--tg2-panel);
  border: 1px solid var(--tg2-border);
  border-radius: 14px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.tg2-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 10px;
  border-bottom: 1px solid var(--tg2-border);
  padding-bottom: 10px;
}
.tg2-title-wrap {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.tg2-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--tg2-blue);
}
.tg2-title {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  color: #ffffff;
}
.tg2-subtitle {
  margin: 0;
  font-size: 13px;
  color: var(--tg2-muted);
}

.tg2-status-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.tg2-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid var(--tg2-border);
  background: var(--tg2-panel-deep);
  color: var(--tg2-text);
}
.tg2-badge.is-ok {
  background: rgba(52, 211, 153, 0.14);
  border-color: rgba(52, 211, 153, 0.45);
  color: var(--tg2-green);
}
.tg2-badge.is-warn {
  background: rgba(251, 191, 36, 0.14);
  border-color: rgba(251, 191, 36, 0.48);
  color: var(--tg2-gold);
}
.tg2-badge.is-danger {
  background: rgba(248, 113, 113, 0.16);
  border-color: rgba(248, 113, 113, 0.55);
  color: var(--tg2-red);
}
.tg2-badge.is-info {
  background: rgba(56, 189, 248, 0.14);
  border-color: rgba(56, 189, 248, 0.45);
  color: var(--tg2-blue);
}

.tg2-lab-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(270px, 1fr);
  gap: 14px;
  align-items: stretch;
}
@media (max-width: 900px) {
  .tg2-lab-grid {
    grid-template-columns: 1fr;
  }
}

.tg2-canvas-card {
  background: var(--tg2-panel-deep);
  border: 1px solid var(--tg2-border);
  border-radius: 12px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.tg2-canvas {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 8px;
  background: #060c18;
  border: 1px solid rgba(51, 65, 85, 0.75);
}

.tg2-telemetry-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
  gap: 8px;
}
.tg2-gauge {
  background: #0f172a;
  border: 1px solid var(--tg2-border);
  border-radius: 10px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.tg2-gauge-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--tg2-muted);
  font-weight: 700;
}
.tg2-gauge-val {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 17px;
  font-weight: 800;
  color: #ffffff;
}
.tg2-gauge-sub {
  font-size: 11px;
  color: var(--tg2-muted);
}
.tg2-gauge.is-ok .tg2-gauge-val { color: var(--tg2-green); }
.tg2-gauge.is-warn .tg2-gauge-val { color: var(--tg2-gold); }
.tg2-gauge.is-danger .tg2-gauge-val { color: var(--tg2-red); }
.tg2-gauge.is-info .tg2-gauge-val { color: var(--tg2-blue); }

.tg2-controls-card {
  background: var(--tg2-panel-deep);
  border: 1px solid var(--tg2-border);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.tg2-ctrl-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tg2-ctrl-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 700;
  color: #e2e8f0;
}
.tg2-ctrl-val {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  color: var(--tg2-blue);
  font-weight: 700;
}
.tg2-seg-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tg2-btn {
  appearance: none;
  border: 1px solid #475569;
  background: #1e293b;
  color: #e2e8f0;
  padding: 7px 11px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.14s ease, border-color 0.14s ease, transform 0.1s ease;
}
.tg2-btn:hover:not(:disabled) {
  background: #334155;
  border-color: #64748b;
}
.tg2-btn:active:not(:disabled) {
  transform: translateY(1px);
}
.tg2-btn:disabled {
  opacity: 0.48;
  cursor: not-allowed;
}
.tg2-btn.is-selected {
  background: #0284c7;
  border-color: #38bdf8;
  color: #ffffff;
}
.tg2-btn.is-gold {
  background: rgba(251, 191, 36, 0.18);
  border-color: rgba(251, 191, 36, 0.55);
  color: var(--tg2-gold);
}
.tg2-btn.is-gold.is-selected,
.tg2-btn.is-primary {
  background: #fbbf24;
  border-color: #fbbf24;
  color: #020617;
}
.tg2-btn.is-danger {
  background: rgba(248, 113, 113, 0.16);
  border-color: rgba(248, 113, 113, 0.5);
  color: #fecaca;
}
.tg2-btn.is-danger.is-selected {
  background: #ef4444;
  border-color: #f87171;
  color: #ffffff;
}
.tg2-btn.is-green {
  background: rgba(52, 211, 153, 0.16);
  border-color: rgba(52, 211, 153, 0.5);
  color: var(--tg2-green);
}

.tg2-slider {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}
.tg2-select {
  width: 100%;
  background: #1e293b;
  color: #f8fafc;
  border: 1px solid #475569;
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 13px;
  font-weight: 600;
}

.tg2-alert-bar {
  border-radius: 9px;
  padding: 8px 11px;
  font-size: 12.5px;
  font-weight: 600;
  border: 1px solid var(--tg2-border);
  background: #0f172a;
  color: #cbd5e1;
  line-height: 1.4;
}
.tg2-alert-bar.is-ok {
  border-color: rgba(52, 211, 153, 0.45);
  background: rgba(52, 211, 153, 0.1);
  color: #a7f3d0;
}
.tg2-alert-bar.is-warn {
  border-color: rgba(251, 191, 36, 0.45);
  background: rgba(251, 191, 36, 0.1);
  color: #fde68a;
}
.tg2-alert-bar.is-danger {
  border-color: rgba(248, 113, 113, 0.55);
  background: rgba(248, 113, 113, 0.12);
  color: #fecaca;
}

/* Mission Deck */
.tg2-mission-deck {
  background: var(--tg2-panel-deep);
  border: 1px solid var(--tg2-border);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.tg2-mission-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tg2-mission-tab {
  appearance: none;
  border: 1px solid #334155;
  background: #1e293b;
  color: #cbd5e1;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.tg2-mission-tab.is-active {
  border-color: var(--tg2-blue);
  background: rgba(56, 189, 248, 0.16);
  color: #ffffff;
}
.tg2-mission-tab.is-done {
  border-color: rgba(52, 211, 153, 0.6);
  color: var(--tg2-green);
}
.tg2-mission-body {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 10px;
}
.tg2-mission-copy {
  flex: 1 1 320px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.tg2-mission-title {
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
}
.tg2-mission-desc {
  font-size: 13px;
  color: #cbd5e1;
  line-height: 1.45;
}
.tg2-mission-hint {
  font-size: 12px;
  color: var(--tg2-gold);
}
.tg2-mission-checks {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}
.tg2-check-pill {
  font-size: 11.5px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid #334155;
  background: #0f172a;
  color: var(--tg2-muted);
}
.tg2-check-pill.is-met {
  border-color: rgba(52, 211, 153, 0.55);
  background: rgba(52, 211, 153, 0.14);
  color: var(--tg2-green);
}
.tg2-mission-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
}

/* === Sorter Arcade === */
.tg2-sorter-hud {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(115px, 1fr));
  gap: 8px;
}
.tg2-hud-stat {
  background: var(--tg2-panel-deep);
  border: 1px solid var(--tg2-border);
  border-radius: 10px;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.tg2-hud-k {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--tg2-muted);
  font-weight: 700;
}
.tg2-hud-v {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 18px;
  font-weight: 800;
  color: #ffffff;
}
.tg2-hud-v.is-gold { color: var(--tg2-gold); }
.tg2-hud-v.is-blue { color: var(--tg2-blue); }
.tg2-hud-v.is-green { color: var(--tg2-green); }
.tg2-hud-v.is-red { color: var(--tg2-red); }

.tg2-sorter-stage {
  position: relative;
  display: grid;
  align-items: center;
  background: var(--tg2-panel-deep);
  border: 1px solid var(--tg2-border);
  border-radius: 12px;
  padding: 10px;
  overflow: hidden;
}
.tg2-belt-canvas {
  grid-area: 1 / 1;
  width: 100%;
  height: auto;
  min-height: 110px;
  display: block;
  border-radius: 8px;
  background: #060b16;
}
.tg2-sorter-incoming {
  border-radius: 10px;
  padding: 10px 14px;
  border: 1px solid rgba(56, 189, 248, 0.35);
  background: linear-gradient(180deg, #0f172a 0%, #0b1220 100%);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.tg2-incoming-k {
  font-size: 10.5px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--tg2-blue);
}
.tg2-incoming-v {
  font-size: 14.5px;
  font-weight: 700;
  line-height: 1.4;
  color: #f8fafc;
}
.tg2-sorter-feedback {
  min-height: 36px;
  border-radius: 9px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border: 1px solid var(--tg2-border);
  background: #0f172a;
  color: #cbd5e1;
}
.tg2-sorter-feedback.is-good {
  border-color: rgba(52, 211, 153, 0.5);
  background: rgba(52, 211, 153, 0.12);
  color: #a7f3d0;
}
.tg2-sorter-feedback.is-bad {
  border-color: rgba(248, 113, 113, 0.55);
  background: rgba(248, 113, 113, 0.14);
  color: #fecaca;
}

.tg2-bins-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 10px;
}
.tg2-bin-btn {
  appearance: none;
  border: 2px solid #334155;
  background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
  color: #f8fafc;
  border-radius: 12px;
  padding: 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  text-align: left;
  transition: transform 0.1s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.tg2-bin-btn:hover:not(:disabled) {
  border-color: var(--tg2-blue);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(2, 132, 199, 0.22);
}
.tg2-bin-btn:active:not(:disabled) {
  transform: translateY(0);
}
.tg2-bin-btn.is-flash-ok {
  border-color: var(--tg2-green) !important;
  box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.25);
}
.tg2-bin-btn.is-flash-bad {
  border-color: var(--tg2-red) !important;
  box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.25);
}
.tg2-bin-top {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.tg2-keycap {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 24px;
  height: 24px;
  padding: 0 6px;
  border-radius: 6px;
  background: #020617;
  border: 1px solid #475569;
  color: var(--tg2-gold);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 12px;
  font-weight: 800;
}
.tg2-bin-label {
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.25;
}
.tg2-bin-sub {
  font-size: 11.5px;
  color: var(--tg2-muted);
}

.tg2-sorter-overlay {
  grid-area: 1 / 1;
  position: relative;
  inset: auto;
  min-height: 190px;
  border-radius: 8px;
  background: rgba(6, 11, 22, 0.9);
  backdrop-filter: blur(4px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px;
  text-align: center;
  z-index: 4;
}
.tg2-overlay-title {
  margin: 0;
  font-size: 22px;
  font-weight: 800;
  color: var(--tg2-gold);
}
.tg2-overlay-stats {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  font-size: 13px;
  color: #e2e8f0;
}
.tg2-target-action {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--tg2-blue);
  margin-top: 2px;
}
.tg2-choices {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 8px;
  margin-top: 8px;
}
.tg2-choice {
  appearance: none;
  width: 100%;
  text-align: left;
  border: 1px solid #334155;
  background: #1e293b;
  color: #f8fafc;
  border-radius: 9px;
  padding: 9px 11px;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.35;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  transition: border-color 0.14s ease, background 0.14s ease;
}
.tg2-choice:hover:not(:disabled) {
  border-color: var(--tg2-blue);
  background: #24344d;
}
.tg2-choice:disabled {
  cursor: default;
}
.tg2-choice.is-correct {
  border-color: var(--tg2-green);
  background: rgba(52, 211, 153, 0.16);
  color: #d1fae5;
}
.tg2-choice.is-wrong {
  border-color: var(--tg2-red);
  background: rgba(248, 113, 113, 0.16);
  color: #fee2e2;
}
.tg2-coach-box {
  margin-top: 8px;
  padding: 8px 11px;
  border-left: 3px solid var(--tg2-gold);
  background: rgba(15, 23, 42, 0.85);
  border-radius: 0 8px 8px 0;
  font-size: 12.5px;
  color: #fde68a;
  line-height: 1.4;
}

@media (max-width: 640px) {
  .tg2-mission-copy { flex: 1 1 100%; }
  .tg2-mission-actions { align-items: stretch; width: 100%; }
  .tg2-bins-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tg2-choices { grid-template-columns: 1fr; }
}

/* === ARENA CUSTOM GAMES CSS === */

/* === HVAC TOWER DEFENSE ARENA MODE (.atd- scoped) === */
.atd-root {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.atd-lobby-grid {
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  gap: 16px;
}

.atd-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
}

.atd-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.atd-title {
  margin: 0;
  font-size: 19px;
  font-weight: 800;
  color: #ffffff;
}

.atd-subtitle {
  margin: 4px 0 12px 0;
  font-size: 13.5px;
  color: var(--muted);
}

.atd-map-cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin: 12px 0 14px 0;
}

.atd-map-card {
  background: var(--card-alt);
  border: 1.5px solid var(--border-bright);
  border-radius: 12px;
  padding: 11px;
  text-align: left;
  color: var(--text);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: transform 0.14s ease, border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
}

.atd-map-card:hover {
  transform: translateY(-2px);
  border-color: var(--cyan);
}

.atd-map-card.active {
  border-color: var(--cyan);
  background: linear-gradient(160deg, rgba(56, 189, 248, 0.19), var(--card-alt));
  box-shadow: 0 0 18px rgba(56, 189, 248, 0.22);
}

.atd-map-svg {
  width: 100%;
  height: auto;
  border-radius: 8px;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  display: block;
}

.atd-map-name {
  font-size: 13.5px;
  font-weight: 800;
  color: #ffffff;
  line-height: 1.25;
}

.atd-map-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  font-size: 11.5px;
  color: var(--muted);
}

.atd-map-chip {
  background: rgba(6, 10, 20, 0.65);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px 7px;
  color: #cbd5e1;
  font-weight: 700;
}

.atd-filter-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.atd-filter-row label {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}

.atd-lobby-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.atd-records-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 12px;
}

.atd-record-box {
  background: var(--card-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}

.atd-record-val {
  font-size: 18px;
  font-weight: 800;
  color: var(--cyan);
}

.atd-record-lbl {
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 600;
}

.atd-howto-list {
  margin: 0 0 12px 0;
  padding-left: 18px;
  color: #cbd5e1;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.atd-turret-mini-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.atd-turret-mini {
  background: var(--card-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 12px;
}

.atd-turret-mini strong {
  display: block;
  color: #ffffff;
  font-size: 12.5px;
  margin-bottom: 2px;
}

.atd-turret-mini span {
  color: var(--muted);
}

/* === TACTICAL MAP & WAVE HUD === */
.atd-hud-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: var(--card);

  justify-content: center;

  flex-wrap: wrap;
