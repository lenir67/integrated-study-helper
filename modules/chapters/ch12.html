        if (pct < 25) bar.style.backgroundColor = "#f43f5e";
        else if (pct < 55) bar.style.backgroundColor = "#f59e0b";
        else bar.style.backgroundColor = "#38bdf8";
      }
      if (tdState.timeLeftMs <= 0) {
        handleQuizAnswer(-1, true);
      }
    }, 100);
  }

  function handleQuizAnswer(displayIdx, timedOut) {
    if (tdState.phase !== "quiz" || tdState.answered) return;
    stopQuizTimer();
    tdState.answered = true;
    tdState.selectedDisplayIdx = timedOut ? -1 : displayIdx;
    tdState.answeredCount++;

    const q = tdState.currentQ;
    const picked = (!timedOut && displayIdx >= 0) ? tdState.displayedChoices[displayIdx] : null;
    const isCorrect = Boolean(picked && picked.isCorrect);

    if (isCorrect) {
      tdState.correctCount++;
      tdState.streak++;
      if (tdState.streak > tdState.maxStreak) tdState.maxStreak = tdState.streak;

      const van = getVanBonuses();
      const map = getSelectedMap();
      const speedCredits = Math.round((Math.max(0, tdState.timeLeftMs) / tdState.totalTimeMs) * 20);
      const earnedCredits = 45 + 10 * Math.min(tdState.streak, 5) + speedCredits;
      const earnedBolts = Math.round(30 * van.mult * map.boltBonus);

      tdState.credits += earnedCredits;
      tdState.runBolts += earnedBolts;
      tdState.lastQuizCredits = earnedCredits;
      tdState.lastQuizBolts = earnedBolts;

      awardXP(earnedBolts, "TD Quiz");
      playSound("correct");
    } else {
      playSound("wrong");
      if (tdState.shields > 0) {
        tdState.shields--;
        showToast("🛡️ Streak Shield absorbed the miss! Streak saved.");
      } else {
        tdState.streak = 0;
      }
      if (q && !tdState.missedQuestions.some(function (mq) { return mq.id === q.id; })) {
        tdState.missedQuestions.push(q);
      }
    }

    renderQuiz();
  }

  function advanceQuiz() {
    if (tdState.phase !== "quiz" || !tdState.answered) return;
    playSound("click");
    if (tdState.batchMode === "bonus") {
      enterTacticalPhase();
      return;
    }
    tdState.batchIdx++;
    if (tdState.batchIdx >= tdState.batchTotal) {
      enterTacticalPhase();
    } else {
      prepareQuizQuestion();
    }
  }

  function enterTacticalPhase() {
    stopQuizTimer();
    tdState.phase = "tactical";
    renderTactical();
  }

  // === WAVE BUILDING & COMBAT ENGINE ===
  function buildWaveComposition(wave, totalWaves) {
    const seq = [];
    const leaks = 4 + Math.min(8, Math.floor(wave * 0.9));
    const airs = 3 + Math.min(8, Math.floor(wave * 0.8));
    const acids = wave >= 2 ? (1 + Math.floor(wave * 0.65)) : 0;
    const floods = wave >= 4 ? (1 + Math.floor((wave - 2) * 0.6)) : 0;

    const maxCount = Math.max(leaks, airs, acids, floods);
    for (let i = 0; i < maxCount; i++) {
      if (i < leaks) seq.push("leak");
      if (i < airs) seq.push("air");
      if (i < acids) seq.push("acid");
      if (i < floods) seq.push("floodback");
    }

    const isBossWave = (wave % 3 === 0) || (wave >= totalWaves);
    if (isBossWave) {
      const bossCount = (wave >= totalWaves && wave >= 9) ? 2 : 1;
      for (let b = 0; b < bossCount; b++) {
        seq.push("boss");
      }
    }

    const hpScale = 1 + (wave - 1) * 0.28 + Math.max(0, wave - 5) * 0.08;
    const speedScale = 1 + Math.min(0.45, (wave - 1) * 0.03);

    return seq.map(function (typeId) {
      const def = ENEMY_DEFS[typeId];
      const maxHp = Math.round(def.baseHp * hpScale);
      const creditBonus = Math.min(25, Math.max(4, Math.round(def.credits + Math.floor((wave - 1) / 3))));
      const scoreBonus = Math.min(300, Math.max(25, Math.round(def.score * (1 + (wave - 1) * 0.06))));
      return {
        type: typeId,
        icon: def.icon,
        name: def.name,
        maxHp: maxHp,
        hp: maxHp,
        baseSpeed: def.baseSpeed * speedScale,
        radius: def.radius,
        color: def.color,
        stroke: def.stroke,
        coreDmg: def.coreDmg,
        credits: creditBonus,
        score: scoreBonus,
        isCritTarget: def.isCritTarget
      };
    });
  }

  function getWaveIntelSummary(wave, totalWaves) {
    const parts = ["💨 Leaks", "🫧 Air"];
    if (wave >= 2) parts.push("🧪 Acid Slugs");
    if (wave >= 4) parts.push("🧊 Floodback Surges");
    const isBoss = (wave % 3 === 0) || (wave >= totalWaves);
    if (isBoss) parts.push("💥 BURNOUT BOSS");
    return {
      isBoss: isBoss,
      text: parts.join(" • ")
    };
  }

  function launchCurrentWave() {
    if (tdState.phase !== "tactical" || tdState.waveRunning || tdState.waveClearPending) return;
    const map = getSelectedMap();
    tdState.waveRunning = true;
    tdState.waveReached = Math.max(tdState.waveReached, tdState.wave);
    tdState.spawnQueue = buildWaveComposition(tdState.wave, map.totalWaves);
    tdState.spawnTimer = 0.15;
    tdState.enemies = [];
    tdState.projectiles = [];
    tdState.effects = [];
    tdState.floaters = [];

    playSound("click");
    renderTactical();
    startWaveLoop();
  }

  function startWaveLoop() {
    stopWaveLoop();
    if (tdState.phase !== "tactical" || !tdState.waveRunning) return;
    lastTs = 0;
    rafId = window.requestAnimationFrame(stepWave);
  }

  function spawnEnemyFromSpec(spec) {
    const pts = tdState.pathData.points;
    const startPt = pts[0];
    tdState.enemies.push({
      id: tdState.nextEnemyUid++,
      type: spec.type,
      icon: spec.icon,
      name: spec.name,
      hp: spec.hp,
      maxHp: spec.maxHp,
      baseSpeed: spec.baseSpeed,
      radius: spec.radius,
      color: spec.color,
      stroke: spec.stroke,
      coreDmg: spec.coreDmg,
      credits: spec.credits,
      score: spec.score,
      isCritTarget: spec.isCritTarget,
      wpIdx: 0,
      segProgress: 0,
      pathDist: 0,
      x: startPt.x,
      y: startPt.y,
      slowTimer: 0,
      slowFactor: 0,
      hitFlash: 0
    });
  }

  function addFloater(x, y, text, color) {
    tdState.floaters.push({
      x: x,
      y: y,
      text: text,
      color: color || "#ffffff",
      life: 0.72,
      maxLife: 0.72
    });
  }

  function damageEnemy(enemy, rawDmg, sourceTurret, isCrit) {
    if (!enemy || enemy.hp <= 0) return;
    const dmg = Math.max(1, Math.round(rawDmg));
    enemy.hp -= dmg;
    enemy.hitFlash = 0.12;
    if (sourceTurret) sourceTurret.totalDmg += dmg;

    addFloater(
      enemy.x + (Math.random() - 0.5) * 14,
      enemy.y - enemy.radius - 4,
      (isCrit ? "CRIT -" : "-") + dmg,
      isCrit ? "#34d399" : "#f8fafc"
    );

    if (enemy.hp <= 0) {
      enemy.hp = 0;
      if (sourceTurret) sourceTurret.kills += 1;
      tdState.credits += enemy.credits;
      tdState.score += enemy.score;
      addFloater(enemy.x, enemy.y - enemy.radius - 18, "+" + enemy.credits + " 🔧", "#fbbf24");
      tdState.effects.push({
        kind: "pop",
        x: enemy.x,
        y: enemy.y,
        radius: enemy.radius * 1.9,
        color: enemy.color,
        life: 0.25,
        maxLife: 0.25
      });
    }
  }

  function fireTurret(turret, target) {
    const def = TURRET_MAP[turret.type];
    const stats = getTurretStats(turret);
    turret.angle = Math.atan2(target.y - turret.y, target.x - turret.x);
    turret.cooldown = 1 / stats.rate;

    if (turret.type === "cryo") {
      tdState.projectiles.push({
        kind: "cryo",
        turretId: turret.id,
        targetId: target.id,
        x: turret.x + Math.cos(turret.angle) * 16,
        y: turret.y + Math.sin(turret.angle) * 16,
        lastX: target.x,
        lastY: target.y,
        speed: 440,
        damage: stats.damage,
        slow: stats.slow,
        color: def.color
      });
    } else if (turret.type === "torch") {
      tdState.projectiles.push({
        kind: "torch",
        turretId: turret.id,
        targetId: target.id,
        x: turret.x + Math.cos(turret.angle) * 18,
        y: turret.y + Math.sin(turret.angle) * 18,
        lastX: target.x,
        lastY: target.y,
        speed: 370,
        damage: stats.damage,
        splash: stats.splash,
        color: def.color
      });
    } else if (turret.type === "zapper") {
      const hitChain = [target];
      const visited = Object.create(null);
      visited[target.id] = true;
      let curr = target;
      while (hitChain.length < stats.chains) {
        let bestNext = null;
        let bestDist = 110;
        for (let i = 0; i < tdState.enemies.length; i++) {
          const cand = tdState.enemies[i];
          if (cand.hp <= 0 || visited[cand.id]) continue;
          const d = Math.hypot(cand.x - curr.x, cand.y - curr.y);
          if (d <= bestDist) {
            bestDist = d;
            bestNext = cand;
          }
        }
        if (!bestNext) break;
        visited[bestNext.id] = true;
        hitChain.push(bestNext);
        curr = bestNext;
      }

      const arcPoints = [{ x: turret.x, y: turret.y }];
      hitChain.forEach(function (enemy, idx) {
        arcPoints.push({ x: enemy.x, y: enemy.y });
        const mult = idx === 0 ? 1 : 0.78;
        damageEnemy(enemy, stats.damage * mult, turret, false);
      });

      tdState.effects.push({
        kind: "arc",
        points: arcPoints,
        color: "#fde047",
        life: 0.18,
        maxLife: 0.18
      });
    } else if (turret.type === "recovery") {
      const isCrit = Boolean(target.isCritTarget);
      const dmg = stats.damage * (isCrit ? stats.critMult : 1);
      damageEnemy(target, dmg, turret, isCrit);
      tdState.effects.push({
        kind: "beam",
        x1: turret.x + Math.cos(turret.angle) * 20,
        y1: turret.y + Math.sin(turret.angle) * 20,
        x2: target.x,
        y2: target.y,
        color: isCrit ? "#34d399" : "#6ee7b7",
        width: isCrit ? 4 : 2.5,
        life: 0.18,
        maxLife: 0.18
      });
    }
  }

  function findTargetForTurret(turret) {
    const stats = getTurretStats(turret);
    let best = null;
    let bestProgress = -1;
    for (let i = 0; i < tdState.enemies.length; i++) {
      const e = tdState.enemies[i];
      if (e.hp <= 0) continue;
      const dist = Math.hypot(e.x - turret.x, e.y - turret.y);
      if (dist <= stats.range + e.radius * 0.4) {
        if (e.pathDist > bestProgress) {
          bestProgress = e.pathDist;
          best = e;
        }
      }
    }
    return best;
  }

  function stepWave(now) {
    if (!tdState.waveRunning || tdState.phase !== "tactical") {
      rafId = null;
      return;
    }
    if (!lastTs) lastTs = now;
    const rawDt = Math.min(0.05, Math.max(0, (now - lastTs) / 1000));
    lastTs = now;
    const dt = rawDt * tdState.speedMult;

    tdState.flowPhase = (tdState.flowPhase + dt * 44) % 40;

    // 1. Spawn enemies
    if (tdState.spawnQueue.length > 0) {
      tdState.spawnTimer -= dt;
      if (tdState.spawnTimer <= 0) {
        const spec = tdState.spawnQueue.shift();
        spawnEnemyFromSpec(spec);
        tdState.spawnTimer = spec.type === "boss" ? 1.1 : Math.max(0.45, 0.9 - tdState.wave * 0.03);
      }
    }

    // 2. Move enemies along path
    const pts = tdState.pathData.points;
    const segLens = tdState.pathData.segLengths;
    for (let i = tdState.enemies.length - 1; i >= 0; i--) {
      const e = tdState.enemies[i];
      if (e.hp <= 0) {
        tdState.enemies.splice(i, 1);
        continue;
      }
      if (e.slowTimer > 0) {
        e.slowTimer = Math.max(0, e.slowTimer - dt);
        if (e.slowTimer === 0) e.slowFactor = 0;
      }
      if (e.hitFlash > 0) {
        e.hitFlash = Math.max(0, e.hitFlash - dt);
      }

      const effSpeed = e.baseSpeed * (1 - (e.slowTimer > 0 ? e.slowFactor : 0));
      let moveLeft = effSpeed * dt;

      while (moveLeft > 0 && e.wpIdx < segLens.length) {
        const segLen = segLens[e.wpIdx];
        const rem = segLen - e.segProgress;
        if (moveLeft >= rem) {
          moveLeft -= rem;
          e.pathDist += rem;
          e.wpIdx += 1;
          e.segProgress = 0;
        } else {
          e.segProgress += moveLeft;
          e.pathDist += moveLeft;
          moveLeft = 0;
        }
      }

      if (e.wpIdx >= segLens.length) {
        tdState.coreHp = Math.max(0, tdState.coreHp - e.coreDmg);
        playSound("spark");
        const corePt = pts[pts.length - 1];
        addFloater(corePt.x - 10, corePt.y - 24, "-" + e.coreDmg + " ❤️", "#f43f5e");
        tdState.effects.push({
          kind: "ring",
          x: corePt.x,
          y: corePt.y,
          radius: 38,
          color: "#f43f5e",
          life: 0.35,
          maxLife: 0.35
        });
        tdState.enemies.splice(i, 1);

        if (tdState.coreHp <= 0) {
          tdState.waveRunning = false;
          rafId = null;
          drawTacticalCanvas();
          finishOperation("overload");
          return;
        }
      } else {
        const a = pts[e.wpIdx];
        const b = pts[e.wpIdx + 1];
        const t = segLens[e.wpIdx] > 0 ? (e.segProgress / segLens[e.wpIdx]) : 0;
        e.x = a.x + (b.x - a.x) * t;
        e.y = a.y + (b.y - a.y) * t;
      }
    }

    // 3. Turrets acquire targets & fire
    for (let i = 0; i < tdState.turrets.length; i++) {
      const turret = tdState.turrets[i];
      if (turret.cooldown > 0) turret.cooldown = Math.max(0, turret.cooldown - dt);
      if (turret.cooldown <= 0) {
        const target = findTargetForTurret(turret);
        if (target) {
          fireTurret(turret, target);
        }
      }
    }

    // 4. Advance projectiles
    for (let i = tdState.projectiles.length - 1; i >= 0; i--) {
      const p = tdState.projectiles[i];
      let target = null;
      for (let j = 0; j < tdState.enemies.length; j++) {
        if (tdState.enemies[j].id === p.targetId && tdState.enemies[j].hp > 0) {
          target = tdState.enemies[j];
          break;
        }
      }
      if (target) {
        p.lastX = target.x;
        p.lastY = target.y;
      }

      const dx = p.lastX - p.x;
      const dy = p.lastY - p.y;
      const dist = Math.hypot(dx, dy);
      const stepDist = p.speed * dt;

      if (dist <= stepDist + 6) {
        const sourceTurret = findTurretById(p.turretId);
        if (p.kind === "cryo") {
          if (target) {
            target.slowFactor = Math.max(target.slowFactor, p.slow);
            target.slowTimer = Math.max(target.slowTimer, 2.2);
            damageEnemy(target, p.damage, sourceTurret, false);
          }
          tdState.effects.push({
            kind: "ring",
            x: p.lastX,
            y: p.lastY,
            radius: 26,
            color: "#38bdf8",
            life: 0.24,
            maxLife: 0.24
          });
        } else if (p.kind === "torch") {
          for (let k = 0; k < tdState.enemies.length; k++) {
            const e = tdState.enemies[k];
            if (e.hp <= 0) continue;
            const dSplash = Math.hypot(e.x - p.lastX, e.y - p.lastY);
            if (dSplash <= p.splash + e.radius) {
              const falloff = target && e.id === target.id ? 1.0 : Math.max(0.6, 1 - (dSplash / (p.splash + e.radius)) * 0.4);
              damageEnemy(e, p.damage * falloff, sourceTurret, false);
            }
          }
          tdState.effects.push({
            kind: "ring",
            x: p.lastX,
            y: p.lastY,
            radius: p.splash,
            color: "#f97316",
            life: 0.28,
            maxLife: 0.28
          });
        }
        tdState.projectiles.splice(i, 1);
      } else {
        p.x += (dx / dist) * stepDist;
        p.y += (dy / dist) * stepDist;
      }
    }

    // Remove enemies defeated by projectiles/turrets this frame
    for (let i = tdState.enemies.length - 1; i >= 0; i--) {
      if (tdState.enemies[i].hp <= 0) {
        tdState.enemies.splice(i, 1);
      }
    }

    // 5. Update effects & floaters
    for (let i = tdState.effects.length - 1; i >= 0; i--) {
      tdState.effects[i].life -= dt;
      if (tdState.effects[i].life <= 0) tdState.effects.splice(i, 1);
    }
    for (let i = tdState.floaters.length - 1; i >= 0; i--) {
      tdState.floaters[i].life -= dt;
      tdState.floaters[i].y -= 24 * dt;
      if (tdState.floaters[i].life <= 0) tdState.floaters.splice(i, 1);
    }

    // 6. Sync lightweight HUD & draw frame
    syncTacticalHud();
    drawTacticalCanvas();

    // 7. Check wave clear
    if (tdState.spawnQueue.length === 0 && tdState.enemies.length === 0) {
      tdState.waveRunning = false;
      rafId = null;
      handleWaveCleared();
      return;
    }

    rafId = window.requestAnimationFrame(stepWave);
  }

  function handleWaveCleared() {
    const map = getSelectedMap();
    const van = getVanBonuses();
    const clearBolts = Math.round((40 + tdState.wave * 10) * van.mult * map.boltBonus);
    tdState.runBolts += clearBolts;
    tdState.score += tdState.wave * 150;
    tdState.wavesCleared = tdState.wave;
    tdState.waveReached = Math.max(tdState.waveReached, tdState.wave);

    awardXP(clearBolts, "Wave " + tdState.wave + " Cleared");
    playSound("correct");

    if (tdState.wave >= map.totalWaves) {
      finishOperation("victory");
      return;
    }

    tdState.waveClearPending = true;
    showToast("✅ Wave " + tdState.wave + " Cleared! +" + clearBolts + " ⚡ Bolts");
    renderTactical();
    scheduleWaveAdvance();
  }

  function scheduleWaveAdvance() {
    stopWaveTransitionTimer();
    if (!tdState.waveClearPending || tdState.phase !== "tactical") return;
    waveTransitionTimerId = window.setTimeout(function () {
      waveTransitionTimerId = null;
      if (!tdState.waveClearPending || tdState.phase !== "tactical") return;
      advanceToNextWavePrep();
    }, 900);
  }

  function advanceToNextWavePrep() {
    stopWaveTransitionTimer();
    tdState.waveClearPending = false;
    tdState.wave += 1;
    startQuizBatch("wave_prep", 3);
  }

  function finishOperation(outcomeType) {
    stop();
    tdState.phase = "summary";
    tdState.outcomeType = outcomeType;
    tdState.victory = outcomeType === "victory";

    const hs = ensureHighScoreFields();
    const prevBestWave = hs.towerDefenseWave || 0;
    const prevBestScore = hs.towerDefenseScore || 0;
    const waveReached = tdState.victory ? getSelectedMap().totalWaves : tdState.waveReached;
    const pct = tdState.answeredCount > 0 ? Math.round((tdState.correctCount / tdState.answeredCount) * 100) : 0;

    const isNewWave = waveReached > prevBestWave;
    const isNewScore = tdState.score > prevBestScore;
    if (isNewWave) hs.towerDefenseWave = waveReached;
    if (isNewScore) hs.towerDefenseScore = tdState.score;
    if (pct > (hs.bestPct || 0)) hs.bestPct = pct;

    if (activeCtx && activeCtx.SHELL) {
      if (typeof activeCtx.SHELL.save === "function") activeCtx.SHELL.save();
      if (typeof activeCtx.SHELL.refreshHUD === "function") activeCtx.SHELL.refreshHUD();
    }

    if (tdState.victory || pct >= 70) {
      playSound("fanfare");
      launchConfetti();
    } else if (outcomeType === "overload") {
      playSound("wrong");
    }

    renderSummary(isNewWave, isNewScore);
  }

  // === CELL INTERACTIONS (BUILD, SELECT, UPGRADE, SELL) ===
  function handleCellClick(col, row) {
    if (tdState.phase !== "tactical") return;
    if (col < 0 || col >= GRID_COLS || row < 0 || row >= GRID_ROWS) return;
    tdState.cursorCell = { col: col, row: row };

    const existing = findTurretAt(col, row);
    if (existing) {
      tdState.selectedTurretId = existing.id;
      playSound("click");
      renderInspector();
      drawTacticalCanvas();
      return;
    }

    if (isPathCell(col, row)) {
      tdState.selectedTurretId = null;
      playSound("wrong");
      showToast("Refrigerant/duct line is active — place units on open floor pads.");
      renderInspector();
      drawTacticalCanvas();
      return;
    }

    if (tdState.selectedBlueprint) {
      const def = TURRET_MAP[tdState.selectedBlueprint];
      if (!def) return;
      if (tdState.credits < def.cost) {
        playSound("wrong");
        showToast("Need " + def.cost + " 🔧 Credits for " + def.name + "!");
        return;
      }
      tdState.credits -= def.cost;
      const newTurret = {
        id: tdState.nextTurretUid++,
        type: def.id,
        col: col,
        row: row,
        x: col * CELL_SIZE + CELL_SIZE / 2,
        y: row * CELL_SIZE + CELL_SIZE / 2,
        level: 1,
        totalInvested: def.cost,
        cooldown: 0,
        angle: 0,
        kills: 0,
        totalDmg: 0
      };
      tdState.turrets.push(newTurret);
      tdState.selectedTurretId = newTurret.id;
      tdState.effects.push({
        kind: "ring",
        x: newTurret.x,
        y: newTurret.y,
        radius: 34,
        color: def.color,
        life: 0.28,
        maxLife: 0.28
      });
      playSound("crate");
      syncTacticalHud();
      renderInspector();
      drawTacticalCanvas();
      return;
    }

    tdState.selectedTurretId = null;
    renderInspector();
    drawTacticalCanvas();
  }

  function upgradeSelectedTurret() {
    const turret = findTurretById(tdState.selectedTurretId);
    if (!turret) return;
    const cost = getTurretUpgradeCost(turret);
    if (cost === null) return;
    if (tdState.credits < cost) {
      playSound("wrong");
      showToast("Need " + cost + " 🔧 Credits to upgrade!");
      return;
    }
    tdState.credits -= cost;
    turret.level += 1;
    turret.totalInvested += cost;
    tdState.effects.push({
      kind: "ring",
      x: turret.x,
      y: turret.y,
      radius: 40,
      color: "#fbbf24",
      life: 0.34,
      maxLife: 0.34
    });
    addFloater(turret.x, turret.y - 22, "★ LV " + turret.level, "#fbbf24");
    playSound("crate");
    syncTacticalHud();
    renderInspector();
    drawTacticalCanvas();
  }

  function sellSelectedTurret() {
    const turret = findTurretById(tdState.selectedTurretId);
    if (!turret) return;
    const refund = getTurretSellRefund(turret);
    tdState.credits += refund;
    tdState.turrets = tdState.turrets.filter(function (t) { return t.id !== turret.id; });
    tdState.selectedTurretId = null;
    addFloater(turret.x, turret.y - 16, "+" + refund + " 🔧", "#fbbf24");
    playSound("click");
    syncTacticalHud();
    renderInspector();
    drawTacticalCanvas();
  }

  // === CANVAS RENDERER ===
  function drawTacticalCanvas() {
    if (!activeStage) return;
    const canvas = activeStage.querySelector("#atd-canvas");
    if (!canvas || typeof canvas.getContext !== "function") return;
    const ctx2d = canvas.getContext("2d");
    if (!ctx2d || !tdState.pathData) return;

    const map = getSelectedMap();
    const path = tdState.pathData;
    const pts = path.points;

    // 1. Shop floor background & grid
    ctx2d.clearRect(0, 0, CANVAS_W, CANVAS_H);
    ctx2d.fillStyle = "#060b16";
    ctx2d.fillRect(0, 0, CANVAS_W, CANVAS_H);

    for (let r = 0; r < GRID_ROWS; r++) {
      for (let c = 0; c < GRID_COLS; c++) {
        const x = c * CELL_SIZE;
        const y = r * CELL_SIZE;
        const onPath = isPathCell(c, r);
        ctx2d.fillStyle = onPath ? "#0b1426" : ((c + r) % 2 === 0 ? "#0d172b" : "#101c34");
        ctx2d.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);

        if (!onPath) {
          ctx2d.strokeStyle = "rgba(54, 78, 125, 0.35)";
          ctx2d.lineWidth = 1;
          ctx2d.strokeRect(x + 1.5, y + 1.5, CELL_SIZE - 3, CELL_SIZE - 3);

          const occupied = Boolean(findTurretAt(c, r));
          if (!occupied && tdState.selectedBlueprint) {
            ctx2d.strokeStyle = "rgba(56, 189, 248, 0.22)";
            ctx2d.lineWidth = 1.5;
            ctx2d.beginPath();
            ctx2d.moveTo(x + 25, y + 30);
            ctx2d.lineTo(x + 35, y + 30);
            ctx2d.moveTo(x + 30, y + 25);
            ctx2d.lineTo(x + 30, y + 35);
            ctx2d.stroke();
          }
        }
      }
    }

    // 2. Insulated Copper / Duct Path
    ctx2d.save();
    ctx2d.lineJoin = "round";
    ctx2d.lineCap = "round";

    ctx2d.strokeStyle = "#1e293b";
    ctx2d.lineWidth = 42;
    ctx2d.beginPath();
    pts.forEach(function (pt, idx) {
      if (idx === 0) ctx2d.moveTo(pt.x, pt.y);
      else ctx2d.lineTo(pt.x, pt.y);
    });
    ctx2d.stroke();

    ctx2d.strokeStyle = map.pipeColor;
    ctx2d.lineWidth = 28;
    ctx2d.stroke();

    ctx2d.strokeStyle = map.pipeInner;
    ctx2d.lineWidth = 4;
    ctx2d.setLineDash([10, 14]);
    ctx2d.lineDashOffset = -tdState.flowPhase;
    ctx2d.globalAlpha = 0.72;
    ctx2d.stroke();
    ctx2d.setLineDash([]);
    ctx2d.globalAlpha = 1;

    // Directional chevron arrows along path segments
    ctx2d.strokeStyle = "rgba(241, 245, 249, 0.45)";
    ctx2d.lineWidth = 2;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i];
      const b = pts[i + 1];
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2;
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      ctx2d.save();
      ctx2d.translate(mx, my);
      ctx2d.rotate(ang);
      ctx2d.beginPath();
      ctx2d.moveTo(-5, -5);
      ctx2d.lineTo(4, 0);
      ctx2d.lineTo(-5, 5);
      ctx2d.stroke();
      ctx2d.restore();
    }
    ctx2d.restore();

    // 3. Inlet & Core Markers
    const inlet = pts[0];
    const core = pts[pts.length - 1];

    ctx2d.save();
    ctx2d.fillStyle = "rgba(56, 189, 248, 0.22)";
    ctx2d.strokeStyle = "#38bdf8";
    ctx2d.lineWidth = 2;
    ctx2d.beginPath();
    ctx2d.arc(inlet.x, inlet.y, 19, 0, Math.PI * 2);
    ctx2d.fill();
    ctx2d.stroke();
    ctx2d.fillStyle = "#e0f2fe";
    ctx2d.font = "bold 9px Segoe UI, sans-serif";
    ctx2d.textAlign = "center";
    ctx2d.textBaseline = "middle";
    ctx2d.fillText("INLET", inlet.x, inlet.y);

    const hpPct = tdState.maxCoreHp > 0 ? tdState.coreHp / tdState.maxCoreHp : 0;
    const coreColor = hpPct > 0.6 ? "#10b981" : (hpPct > 0.3 ? "#f59e0b" : "#f43f5e");
    ctx2d.fillStyle = hpPct > 0.6 ? "rgba(16, 185, 129, 0.26)" : (hpPct > 0.3 ? "rgba(245, 158, 11, 0.26)" : "rgba(244, 63, 94, 0.28)");
    ctx2d.strokeStyle = coreColor;
    ctx2d.lineWidth = 2.5;
    ctx2d.beginPath();
    ctx2d.arc(core.x, core.y, 22, 0, Math.PI * 2);
    ctx2d.fill();
    ctx2d.stroke();
    ctx2d.fillStyle = "#ffffff";
    ctx2d.font = "bold 9px Segoe UI, sans-serif";
    ctx2d.fillText("CORE", core.x, core.y - 5);
    ctx2d.fillStyle = coreColor;
    ctx2d.font = "bold 10px Segoe UI, sans-serif";
    ctx2d.fillText(tdState.coreHp + "HP", core.x, core.y + 7);
    ctx2d.restore();

    // 4. Hover / Keyboard Blueprint Preview
    const previewCell = tdState.hoverCell || (document.activeElement === canvas ? tdState.cursorCell : null);
    if (previewCell && tdState.selectedBlueprint) {
      const pc = previewCell.col;
      const pr = previewCell.row;
      if (pc >= 0 && pc < GRID_COLS && pr >= 0 && pr < GRID_ROWS) {
        const px = pc * CELL_SIZE + CELL_SIZE / 2;
        const py = pr * CELL_SIZE + CELL_SIZE / 2;
        const def = TURRET_MAP[tdState.selectedBlueprint];
        const canPlace = !isPathCell(pc, pr) && !findTurretAt(pc, pr) && def && tdState.credits >= def.cost;
        if (!findTurretAt(pc, pr)) {
          ctx2d.save();
          ctx2d.strokeStyle = canPlace ? "rgba(56, 189, 248, 0.85)" : "rgba(244, 63, 94, 0.75)";
          ctx2d.fillStyle = canPlace ? "rgba(56, 189, 248, 0.14)" : "rgba(244, 63, 94, 0.14)";
          ctx2d.lineWidth = 2;
          ctx2d.fillRect(pc * CELL_SIZE + 4, pr * CELL_SIZE + 4, CELL_SIZE - 8, CELL_SIZE - 8);
          ctx2d.strokeRect(pc * CELL_SIZE + 4, pr * CELL_SIZE + 4, CELL_SIZE - 8, CELL_SIZE - 8);

          if (def && !isPathCell(pc, pr)) {
            ctx2d.beginPath();
            ctx2d.arc(px, py, def.levels[0].range, 0, Math.PI * 2);
            ctx2d.fillStyle = canPlace ? "rgba(56, 189, 248, 0.08)" : "rgba(244, 63, 94, 0.07)";
            ctx2d.fill();
            ctx2d.setLineDash([5, 5]);
            ctx2d.stroke();
          }
          ctx2d.restore();
        }
      }
    }

    // 5. Selected Turret Range Circle
    const selTurret = findTurretById(tdState.selectedTurretId);
    if (selTurret) {
      const stats = getTurretStats(selTurret);
      const def = TURRET_MAP[selTurret.type];
      ctx2d.save();
      ctx2d.beginPath();
      ctx2d.arc(selTurret.x, selTurret.y, stats.range, 0, Math.PI * 2);
      ctx2d.fillStyle = "rgba(56, 189, 248, 0.09)";
      ctx2d.fill();
      ctx2d.strokeStyle = def ? def.color : "#38bdf8";
      ctx2d.lineWidth = 1.8;
      ctx2d.setLineDash([6, 4]);
      ctx2d.stroke();
      ctx2d.restore();
    }

    // 6. Placed Turrets
    tdState.turrets.forEach(function (t) {
      const def = TURRET_MAP[t.type];
      const isSel = selTurret && selTurret.id === t.id;
      ctx2d.save();
      ctx2d.translate(t.x, t.y);

      // Base mounting plate
      ctx2d.fillStyle = "#172542";
      ctx2d.strokeStyle = isSel ? "#ffffff" : (def ? def.color : "#38bdf8");
      ctx2d.lineWidth = isSel ? 2.6 : 1.8;
      ctx2d.beginPath();
      ctx2d.roundRect ? ctx2d.roundRect(-21, -21, 42, 42, 9) : ctx2d.rect(-21, -21, 42, 42);
      ctx2d.fill();
      ctx2d.stroke();

      // Rotated turret barrel / emitter
      ctx2d.save();
      ctx2d.rotate(t.angle || 0);
      if (t.type === "cryo") {
        ctx2d.fillStyle = "#38bdf8";
        ctx2d.fillRect(0, -5, 21, 10);
        ctx2d.fillStyle = "#e0f2fe";
        ctx2d.beginPath();
        ctx2d.arc(0, 0, 10, 0, Math.PI * 2);
        ctx2d.fill();
        ctx2d.fillStyle = "#0284c7";
        ctx2d.beginPath();
        ctx2d.arc(0, 0, 5, 0, Math.PI * 2);
        ctx2d.fill();
      } else if (t.type === "zapper") {
        ctx2d.fillStyle = "#f59e0b";
        ctx2d.fillRect(2, -9, 17, 4);
        ctx2d.fillRect(2, 5, 17, 4);
        ctx2d.fillStyle = "#fef08a";
        ctx2d.beginPath();
        ctx2d.arc(0, 0, 10, 0, Math.PI * 2);
        ctx2d.fill();
        ctx2d.fillStyle = "#78350f";
        ctx2d.beginPath();
        ctx2d.arc(0, 0, 4.5, 0, Math.PI * 2);
        ctx2d.fill();
      } else if (t.type === "torch") {
        ctx2d.fillStyle = "#ea580c";
        ctx2d.fillRect(0, -7, 22, 14);
        ctx2d.fillStyle = "#fb923c";
        ctx2d.fillRect(16, -9, 6, 18);
        ctx2d.fillStyle = "#fde047";
        ctx2d.beginPath();
        ctx2d.arc(0, 0, 11, 0, Math.PI * 2);
        ctx2d.fill();
      } else if (t.type === "recovery") {
        ctx2d.fillStyle = "#10b981";
        ctx2d.fillRect(0, -3.5, 25, 7);
        ctx2d.fillStyle = "#34d399";
        ctx2d.fillRect(6, -6, 9, 12);
        ctx2d.fillStyle = "#064e3b";
        ctx2d.beginPath();
        ctx2d.arc(0, 0, 10, 0, Math.PI * 2);
        ctx2d.fill();
        ctx2d.strokeStyle = "#6ee7b7";
        ctx2d.lineWidth = 2;
        ctx2d.stroke();
      }
      ctx2d.restore();

      // Level stars
      const stars = t.level === 3 ? "★★★" : (t.level === 2 ? "★★" : "★");
      ctx2d.fillStyle = "#fbbf24";
      ctx2d.font = "bold 9px Segoe UI, sans-serif";
      ctx2d.textAlign = "center";
      ctx2d.textBaseline = "bottom";
      ctx2d.fillText(stars, 0, 20);

      ctx2d.restore();
    });

    // 7. Enemies & HP Bars
    tdState.enemies.forEach(function (e) {
      ctx2d.save();
      ctx2d.translate(e.x, e.y);

      if (e.slowTimer > 0) {
        ctx2d.strokeStyle = "rgba(56, 189, 248, 0.85)";
        ctx2d.lineWidth = 2.5;
        ctx2d.beginPath();
        ctx2d.arc(0, 0, e.radius + 4, 0, Math.PI * 2);
        ctx2d.stroke();
      }

      ctx2d.fillStyle = e.hitFlash > 0 ? "#ffffff" : e.color;
      ctx2d.strokeStyle = e.stroke;
      ctx2d.lineWidth = e.type === "boss" ? 3 : 2;
      ctx2d.beginPath();
      ctx2d.arc(0, 0, e.radius, 0, Math.PI * 2);
      ctx2d.fill();
      ctx2d.stroke();

      ctx2d.font = (e.type === "boss" ? "16px" : "12px") + " Segoe UI Emoji, Segoe UI, sans-serif";
      ctx2d.textAlign = "center";
      ctx2d.textBaseline = "middle";
      ctx2d.fillText(e.icon, 0, 1);

      // HP Bar
      const bw = e.type === "boss" ? 42 : 28;
      const bh = e.type === "boss" ? 6 : 4.5;
      const pct = Math.max(0, Math.min(1, e.hp / e.maxHp));
      ctx2d.fillStyle = "rgba(2, 6, 16, 0.9)";
      ctx2d.fillRect(-bw / 2 - 1, -e.radius - 10, bw + 2, bh + 2);
      ctx2d.fillStyle = pct > 0.55 ? "#10b981" : (pct > 0.25 ? "#f59e0b" : "#f43f5e");
      ctx2d.fillRect(-bw / 2, -e.radius - 9, bw * pct, bh);

      ctx2d.restore();
    });

    // 8. Projectiles
    tdState.projectiles.forEach(function (p) {
      ctx2d.save();
      ctx2d.fillStyle = p.color;
      ctx2d.beginPath();
      ctx2d.arc(p.x, p.y, p.kind === "torch" ? 5.5 : 4.5, 0, Math.PI * 2);
      ctx2d.fill();
      ctx2d.strokeStyle = "#ffffff";
      ctx2d.lineWidth = 1.2;
      ctx2d.stroke();
      ctx2d.restore();
    });

    // 9. Visual Effects (Rings, Beams, Arcs)
    tdState.effects.forEach(function (fx) {
      const alpha = Math.max(0, fx.life / fx.maxLife);
      ctx2d.save();
      ctx2d.globalAlpha = alpha;
      if (fx.kind === "ring" || fx.kind === "pop") {
        const curR = fx.radius * (1 - alpha * 0.55);
        ctx2d.strokeStyle = fx.color;
        ctx2d.lineWidth = fx.kind === "ring" ? 3 : 2;
        ctx2d.beginPath();
        ctx2d.arc(fx.x, fx.y, Math.max(4, curR), 0, Math.PI * 2);
        ctx2d.stroke();
      } else if (fx.kind === "beam") {
        ctx2d.strokeStyle = fx.color;
        ctx2d.lineWidth = fx.width || 3;
        ctx2d.beginPath();
        ctx2d.moveTo(fx.x1, fx.y1);
        ctx2d.lineTo(fx.x2, fx.y2);
        ctx2d.stroke();
      } else if (fx.kind === "arc" && fx.points && fx.points.length >= 2) {
        ctx2d.strokeStyle = fx.color;
        ctx2d.lineWidth = 2.6;
        ctx2d.beginPath();
        ctx2d.moveTo(fx.points[0].x, fx.points[0].y);
        for (let i = 1; i < fx.points.length; i++) {
          const prev = fx.points[i - 1];
          const curr = fx.points[i];
          const midX = (prev.x + curr.x) / 2 + (Math.random() - 0.5) * 14;
          const midY = (prev.y + curr.y) / 2 + (Math.random() - 0.5) * 14;
          ctx2d.lineTo(midX, midY);
          ctx2d.lineTo(curr.x, curr.y);
        }
        ctx2d.stroke();
      }
      ctx2d.restore();
    });

    // 10. Floating Damage & Credit Numbers
    tdState.floaters.forEach(function (fl) {
      const alpha = Math.max(0, fl.life / fl.maxLife);
      ctx2d.save();
      ctx2d.globalAlpha = alpha;
      ctx2d.font = "bold 12px Segoe UI, sans-serif";
      ctx2d.textAlign = "center";
      ctx2d.fillStyle = "#020617";
      ctx2d.fillText(fl.text, fl.x + 1, fl.y + 1);
      ctx2d.fillStyle = fl.color;
      ctx2d.fillText(fl.text, fl.x, fl.y);
      ctx2d.restore();
    });
  }

  // === SVG MINI-MAP PREVIEW ===
  function buildMapSvg(map) {
    const pts = map.waypoints.map(function (wp) {
      return (wp[0] * 10 + 5) + "," + (wp[1] * 10 + 5);
    }).join(" ");
    const start = map.waypoints[0];
    const end = map.waypoints[map.waypoints.length - 1];
    return '<svg class="atd-map-svg" viewBox="0 0 120 70" aria-hidden="true">' +
      '<rect x="0" y="0" width="120" height="70" fill="#060a14" />' +
      '<polyline points="' + pts + '" fill="none" stroke="' + esc(map.pipeColor) + '" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />' +
      '<polyline points="' + pts + '" fill="none" stroke="' + esc(map.pipeInner) + '" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round" stroke-linejoin="round" />' +
      '<circle cx="' + (start[0] * 10 + 5) + '" cy="' + (start[1] * 10 + 5) + '" r="3.6" fill="#38bdf8" />' +
      '<circle cx="' + (end[0] * 10 + 5) + '" cy="' + (end[1] * 10 + 5) + '" r="4" fill="#10b981" />' +
    '</svg>';
  }

  // === PHASE RENDERERS ===
  function renderLobby() {
    if (!activeStage) return;
    const allBlitz = getBlitzAll();
    if (allBlitz.length === 0) {
      activeStage.innerHTML =
        '<div class="empty-card">' +
          'No quiz questions available in this chapter payload.' +
          '<div style="margin-top:12px;"><button type="button" class="btn" id="atd-empty-back">⬅️ Back to Crate Quest</button></div>' +
        '</div>';
      const backBtn = activeStage.querySelector("#atd-empty-back");
      if (backBtn) {
        backBtn.addEventListener("click", function () {
          if (activeCtx && typeof activeCtx.setArenaMode === "function") activeCtx.setArenaMode("solo");
        });
      }
      return;
    }

    const van = getVanBonuses();
    const hs = ensureHighScoreFields();
    const sections = (activeCtx && Array.isArray(activeCtx.sections)) ? activeCtx.sections : [];
    const epaCount = getFilterCount("EPA608");
    const trapCount = getFilterCount("TRAP");

    const secOptions = '<option value="ALL"' + (tdState.sectionFilter === "ALL" ? " selected" : "") + '>All Chapter Sections (' + allBlitz.length + ' Qs)</option>' +
      sections.map(function (s) {
        const cnt = getFilterCount(s.id);
        return '<option value="' + esc(s.id) + '"' + (tdState.sectionFilter === s.id ? " selected" : "") + '>' + esc(s.id + " " + s.title) + ' (' + cnt + ' Qs)</option>';
      }).join("") +
      (epaCount > 0 ? '<option value="EPA608"' + (tdState.sectionFilter === "EPA608" ? " selected" : "") + '>🌿 EPA 608 Only (' + epaCount + ' Qs)</option>' : '') +
      '<option value="TRAP"' + (tdState.sectionFilter === "TRAP" ? " selected" : "") + '>⚠️ Exam Traps Only (' + trapCount + ' Qs)</option>';

    const mapCardsHtml = MAPS.map(function (m) {
      const isActive = m.id === tdState.selectedMapId;
      return '<button type="button" class="atd-map-card' + (isActive ? " active" : "") + '" data-atd-map="' + esc(m.id) + '">' +
        buildMapSvg(m) +
        '<div class="atd-map-name">' + esc(m.name) + '</div>' +
        '<div class="atd-map-meta">' +
          '<span class="atd-map-chip">🔧 ' + m.startCredits + '</span>' +
          '<span class="atd-map-chip">❤️ ' + m.coreHp + '</span>' +
          '<span class="atd-map-chip">🌊 ' + m.totalWaves + 'w</span>' +
          '<span class="atd-map-chip">⚡ ' + m.boltBonus.toFixed(1) + 'x</span>' +
        '</div>' +
      '</button>';
    }).join("");

    const turretsHtml = TURRET_DEFS.map(function (t) {
      return '<div class="atd-turret-mini">' +
        '<strong>' + esc(t.icon + " " + t.name) + ' <span style="color:#fbbf24;">(' + t.cost + ' cr)</span></strong>' +
        '<span>' + esc(t.role) + '</span>' +
      '</div>';
    }).join("");

    activeStage.innerHTML =
      '<div class="atd-root">' +
        '<div class="atd-lobby-grid">' +
          '<div class="atd-card">' +
            '<div class="atd-card-header">' +
              '<h2 class="atd-title">🛡️ HVAC Tower Defense</h2>' +
              '<span class="badge cyan">Van: x' + van.mult.toFixed(2) + ' • ' + van.shields + ' 🛡️ • +' + van.sec + 's</span>' +
            '</div>' +
            '<p class="atd-subtitle">Select an HVAC system map, answer 3-question prep batches to earn Build Credits &amp; Shop Bolts, and deploy defense units before faults trip the Compressor Core!</p>' +
            '<div class="atd-map-cards">' + mapCardsHtml + '</div>' +
            '<div class="atd-filter-row">' +
              '<label for="atd-sec-filter">Topic Filter:</label>' +
              '<select id="atd-sec-filter" class="select-input">' + secOptions + '</select>' +
            '</div>' +
            '<div class="atd-lobby-actions">' +
              '<button type="button" class="btn primary" id="atd-start-btn" style="flex:1;min-width:210px;padding:11px 16px;font-size:15px;">🛡️ Start Defense Operation</button>' +
              '<button type="button" class="btn" id="atd-back-solo-btn">⬅️ Back to Crate Quest</button>' +
            '</div>' +
          '</div>' +
          '<div class="atd-card">' +
            '<div class="atd-card-header">' +
              '<h3 class="atd-title" style="font-size:16px;">📊 Records &amp; Tactical Briefing</h3>' +
              '<span class="badge amber">Blooket TD Mode</span>' +
            '</div>' +
            '<div class="atd-records-grid">' +
              '<div class="atd-record-box"><div class="atd-record-val">🌊 ' + (hs.towerDefenseWave || 0) + '</div><div class="atd-record-lbl">Best Wave</div></div>' +
              '<div class="atd-record-box"><div class="atd-record-val">🏆 ' + (hs.towerDefenseScore || 0).toLocaleString() + '</div><div class="atd-record-lbl">Best Score</div></div>' +
              '<div class="atd-record-box"><div class="atd-record-val">🎯 ' + (hs.bestPct || 0) + '%</div><div class="atd-record-lbl">Best Quiz %</div></div>' +
            '</div>' +
            '<ol class="atd-howto-list">' +
              '<li><strong>Quiz Prep Batch:</strong> Answer 3 fast HVAC questions before each wave for Build Credits &amp; Shop Bolts.</li>' +
              '<li><strong>Deploy &amp; Upgrade:</strong> Click open floor pads on the 12×7 grid to build Cryo, Zapper, Torch, or Sniper units (Lv 1–3).</li>' +
              '<li><strong>Stop the Gremlins:</strong> Prevent Schrader Leaks, Acid Slugs, Floodback Surges &amp; Burnout Bosses from overloading the Core!</li>' +
            '</ol>' +
            '<div class="atd-turret-mini-grid">' + turretsHtml + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    activeStage.querySelectorAll("[data-atd-map]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        playSound("click");
        tdState.selectedMapId = btn.getAttribute("data-atd-map");
        renderLobby();
      });
    });

    const filterEl = activeStage.querySelector("#atd-sec-filter");
    if (filterEl) {
      filterEl.addEventListener("change", function (e) {
        tdState.sectionFilter = e.target.value;
      });
    }

    const startBtn = activeStage.querySelector("#atd-start-btn");
    if (startBtn) {
      startBtn.addEventListener("click", function () {
        startOperation(false);
      });
    }

    const backBtn = activeStage.querySelector("#atd-back-solo-btn");
    if (backBtn) {
      backBtn.addEventListener("click", function () {

  function renderQuiz() {
    if (!activeStage) return;
    const q = tdState.currentQ;
    if (!q) {
      enterTacticalPhase();
      return;
    }

    const shapes = ["▲", "◆", "●", "■"];
    const prepLabel = tdState.batchMode === "bonus"
      ? ("⚡ Bonus Q 1/1 (Wave " + tdState.wave + ")")
      : ("Wave " + tdState.wave + " Prep — Q " + (tdState.batchIdx + 1) + "/" + tdState.batchTotal);

    const tilesHtml = tdState.displayedChoices.map(function (opt, idx) {
      let extraCls = "";
      if (tdState.answered) {
        if (opt.isCorrect) extraCls = " reveal-correct";
        else if (idx === tdState.selectedDisplayIdx) extraCls = " reveal-wrong";
        else extraCls = " dimmed";
      }
      return '<button type="button" class="kahoot-tile c' + (idx % 4) + extraCls + '" data-atd-choice="' + idx + '"' + (tdState.answered ? " disabled" : "") + '>' +
        '<span class="tile-shape">' + shapes[idx % 4] + '</span>' +
        '<span style="flex:1;">' + esc(opt.text) + '</span>' +
        '<span class="tile-key">[' + (idx + 1) + ']</span>' +
      '</button>';
    }).join("");

    let feedbackHtml = "";
    if (tdState.answered) {
      const picked = tdState.selectedDisplayIdx >= 0 ? tdState.displayedChoices[tdState.selectedDisplayIdx] : null;
      const isOk = Boolean(picked && picked.isCorrect);
      const correctChoice = tdState.displayedChoices.find(function (c) { return c.isCorrect; });
      const nextText = tdState.batchMode === "bonus"
        ? "🛠️ Return to Tactical Map ➡️"
        : (tdState.batchIdx + 1 < tdState.batchTotal ? "Next [Enter] ➡️" : "🛠️ Open Tactical Map ➡️");
      const creditNote = isOk
        ? (' <span class="badge emerald">+' + tdState.lastQuizCredits + ' 🔧 Credits</span> <span class="badge amber">+' + tdState.lastQuizBolts + ' ⚡ Bolts</span>')
        : "";

      feedbackHtml =
        '<div class="feedback-banner ' + (isOk ? "ok" : "bad") + '">' +
          '<div style="flex:1;min-width:240px;">' +
            '<div><strong>' + (isOk ? "✅ RIGHT ON TARGET!" : (tdState.selectedDisplayIdx === -1 ? "⏰ TIME'S UP!" : "❌ MISSED!")) + '</strong>' + creditNote + '</div>' +
            (!isOk && correctChoice ? '<div style="margin-top:3px;">Correct answer: <strong>' + esc(correctChoice.text) + '</strong></div>' : '') +
            (q.explanation ? '<div style="font-size:13.5px;color:#e2e8f0;margin-top:4px;">' + esc(q.explanation) + '</div>' : '') +
            (q.trap_note ? '<div style="font-size:13px;color:#fecdd3;margin-top:4px;"><strong>⚠️ Exam Trap:</strong> ' + esc(q.trap_note) + '</div>' : '') +
          '</div>' +
          '<button type="button" class="btn primary" id="atd-quiz-next">' + nextText + '</button>' +
        '</div>';
    }

    const secHtml = (q.section_id && activeCtx && typeof activeCtx.sectionLabel === "function")
      ? '<span class="badge muted">' + esc(activeCtx.sectionLabel(q.section_id)) + '</span>'
      : '';
    const epaHtml = (activeCtx && typeof activeCtx.renderEpa608Badge === "function")
      ? activeCtx.renderEpa608Badge(q)
      : '';
    const imgUri = safeImgUri(q.image_data_uri);
    const imgHtml = imgUri ? '<img class="quiz-q-img" src="' + esc(imgUri) + '" alt="Question visual">' : "";
    const timerPct = Math.max(0, (tdState.timeLeftMs / tdState.totalTimeMs) * 100);

    activeStage.innerHTML =
      '<div class="atd-root">' +
        '<div class="solo-hud">' +
          '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
            '<span class="badge cyan">' + esc(prepLabel) + '</span>' +
            '<span class="badge amber">🔧 Credits: ' + tdState.credits + '</span>' +
            '<span class="badge emerald">❤️ Core HP: ' + tdState.coreHp + '/' + tdState.maxCoreHp + '</span>' +
            '<span class="badge muted">🔥 Streak: ' + tdState.streak + '</span>' +
            (tdState.shields > 0 ? '<span class="badge cyan">🛡️ ' + tdState.shields + '</span>' : '') +
          '</div>' +
          '<button type="button" class="btn sm coral" id="atd-quiz-end">🏁 End Operation</button>' +
        '</div>' +
        '<div class="timer-bar-wrap"><div class="timer-bar-fill" id="atd-quiz-timer-bar" style="width:' + timerPct + '%"></div></div>' +
        '<div class="quiz-question-card' + (q.is_epa_608 ? " is-epa608" : "") + '">' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
            secHtml +
            epaHtml +
            (q.is_trap ? '<span class="badge coral">⚠️ EXAM TRAP</span>' : '') +
          '</div>' +
          '<h2 class="quiz-q-text">' + esc(q.question) + '</h2>' +
          imgHtml +
        '</div>' +
        '<div class="kahoot-grid">' + tilesHtml + '</div>' +
        feedbackHtml +
      '</div>';

    activeStage.querySelectorAll("[data-atd-choice]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        handleQuizAnswer(Number(btn.getAttribute("data-atd-choice")), false);
      });
    });

    const nextBtn = activeStage.querySelector("#atd-quiz-next");
    if (nextBtn) {
      nextBtn.addEventListener("click", advanceQuiz);
    }

    const endBtn = activeStage.querySelector("#atd-quiz-end");
    if (endBtn) {
      endBtn.addEventListener("click", function () {
        finishOperation("cashed_out");
      });
    }
  }

  function renderInspector() {
    if (!activeStage) return;
    const slot = activeStage.querySelector("#atd-inspector");
    if (!slot) return;

    const turret = findTurretById(tdState.selectedTurretId);
    if (turret) {
      const def = TURRET_MAP[turret.type];
      const stats = getTurretStats(turret);
      const upgCost = getTurretUpgradeCost(turret);
      const refund = getTurretSellRefund(turret);
      const canUpg = upgCost !== null && tdState.credits >= upgCost;

      let specStr = "Dmg " + stats.damage + " • Range " + stats.range + "px • " + stats.rate.toFixed(2) + "/s";
      if (stats.slow) specStr += " • Slow " + Math.round(stats.slow * 100) + "%";
      if (stats.chains) specStr += " • Chains " + stats.chains;
      if (stats.splash) specStr += " • Blast " + stats.splash + "px";
      if (stats.critMult) specStr += " • 2x vs Boss/Leak";

      slot.innerHTML =
        '<div class="atd-inspector-info">' +
          '<div class="atd-inspector-title">' +
            '<span>' + esc(def.icon + " " + def.name) + '</span>' +
            '<span class="badge cyan">Lv ' + turret.level + ' / 3</span>' +
            '<span class="badge muted">(' + turret.col + ', ' + turret.row + ')</span>' +
          '</div>' +
          '<div class="atd-inspector-sub">' + esc(specStr) + ' • Eliminated: ' + turret.kills + '</div>' +
        '</div>' +
        '<div class="atd-inspector-btns">' +
          (upgCost !== null
            ? '<button type="button" class="btn sm ' + (canUpg ? "emerald" : "") + '" id="atd-upg-btn"' + (canUpg ? "" : " disabled") + '>⬆️ Upgrade Lv ' + turret.level + ' → ' + (turret.level + 1) + ' (' + upgCost + ' cr)</button>'
            : '<span class="badge emerald">★ MAX LEVEL</span>') +
          '<button type="button" class="btn sm amber" id="atd-sell-btn">♻️ Sell +' + refund + ' cr</button>' +
        '</div>';

      const upgBtn = slot.querySelector("#atd-upg-btn");
      if (upgBtn) upgBtn.addEventListener("click", upgradeSelectedTurret);
      const sellBtn = slot.querySelector("#atd-sell-btn");
      if (sellBtn) sellBtn.addEventListener("click", sellSelectedTurret);
      return;
    }

    const bp = tdState.selectedBlueprint ? TURRET_MAP[tdState.selectedBlueprint] : null;
    if (bp) {
      slot.innerHTML =
        '<div class="atd-inspector-info">' +
          '<div class="atd-inspector-title">' +
            '<span>Blueprint: ' + esc(bp.icon + " " + bp.name) + '</span>' +
            '<span class="badge amber">' + bp.cost + ' 🔧 Credits</span>' +
          '</div>' +
          '<div class="atd-inspector-sub">' + esc(bp.role) + ' Click any open pad on the 12×7 grid to deploy (or click an existing unit to Upgrade/Sell).</div>' +
        '</div>';
    } else {
      slot.innerHTML =
        '<div class="atd-inspector-info">' +
          '<div class="atd-inspector-title">🛠️ Tactical Inspector</div>' +
          '<div class="atd-inspector-sub">Choose a turret blueprint on the right to build, or click any placed unit on the map to Upgrade/Sell.</div>' +
        '</div>';
    }
  }

  function syncTacticalHud() {
    if (!activeStage) return;
    const creditsEl = activeStage.querySelector("#atd-hud-credits");
    const hpEl = activeStage.querySelector("#atd-hud-hp");
    const scoreEl = activeStage.querySelector("#atd-hud-score");
    const enemiesEl = activeStage.querySelector("#atd-hud-enemies");
    const deployedEl = activeStage.querySelector("#atd-hud-deployed");
    if (creditsEl) creditsEl.textContent = "🔧 Credits: " + tdState.credits;
    if (hpEl) hpEl.textContent = "❤️ Core HP: " + tdState.coreHp + "/" + tdState.maxCoreHp;
    if (scoreEl) scoreEl.textContent = "🏆 Score: " + tdState.score.toLocaleString();
    if (deployedEl) deployedEl.textContent = tdState.turrets.length + " Deployed";
    if (enemiesEl) {
      const totalRem = tdState.enemies.length + tdState.spawnQueue.length;
      enemiesEl.textContent = "🔥 Faults: " + totalRem;
    }

    activeStage.querySelectorAll("[data-atd-bp]").forEach(function (btn) {
      const id = btn.getAttribute("data-atd-bp");
      const def = TURRET_MAP[id];
      if (!def) return;
      btn.classList.toggle("unaffordable", tdState.credits < def.cost);
    });

    const upgBtn = activeStage.querySelector("#atd-upg-btn");
    const selTurret = findTurretById(tdState.selectedTurretId);
    if (upgBtn && selTurret) {
      const upgCost = getTurretUpgradeCost(selTurret);
      if (upgCost !== null) {
        const canUpg = tdState.credits >= upgCost;
        upgBtn.disabled = !canUpg;
        upgBtn.classList.toggle("emerald", canUpg);

    const map = getSelectedMap();
    const intel = getWaveIntelSummary(tdState.wave, map.totalWaves);
    const totalRem = tdState.enemies.length + tdState.spawnQueue.length;

    const paletteHtml = TURRET_DEFS.map(function (t) {
      const isAct = tdState.selectedBlueprint === t.id;
      const unafford = tdState.credits < t.cost;
      return '<button type="button" class="atd-turret-btn' + (isAct ? " active" : "") + (unafford ? " unaffordable" : "") + '" data-atd-bp="' + esc(t.id) + '">' +
        '<div class="atd-turret-top">' +
          '<span>' + esc(t.icon + " " + t.name) + '</span>' +

        '</div>' +
        '<div class="atd-turret-desc">' + esc(t.role) + '</div>' +
      '</button>';

    const clearBannerHtml = tdState.waveClearPending
      ? '<div class="atd-wave-clear-bar">' +
          '<div><strong>✅ Wave ' + tdState.wave + ' Cleared!</strong> Preparing Wave ' + (tdState.wave + 1) + ' Quiz Batch...</div>' +
          '<button type="button" class="btn emerald sm" id="atd-next-prep-now">📝 Start Wave ' + (tdState.wave + 1) + ' Prep ➡️</button>' +
        '</div>'
      : '';

    activeStage.innerHTML =
      '<div class="atd-root">' +
        '<div class="atd-hud-bar">' +
          '<div class="atd-hud-stats">' +
            '<span class="badge cyan">Wave ' + tdState.wave + ' / ' + map.totalWaves + '</span>' +
            '<span class="badge amber" id="atd-hud-credits">🔧 Credits: ' + tdState.credits + '</span>' +
            '<span class="badge emerald" id="atd-hud-hp">❤️ Core HP: ' + tdState.coreHp + '/' + tdState.maxCoreHp + '</span>' +
            '<span class="badge muted" id="atd-hud-score">🏆 Score: ' + tdState.score.toLocaleString() + '</span>' +
            (tdState.waveRunning ? '<span class="badge coral" id="atd-hud-enemies">🔥 Faults: ' + totalRem + '</span>' : '') +
          '</div>' +
          '<div class="atd-hud-actions">' +
            '<button type="button" class="btn sm" id="atd-speed-btn">⏩ Speed: ' + tdState.speedMult + 'x</button>' +
            (!tdState.waveRunning && !tdState.waveClearPending
              ? '<button type="button" class="btn sm amber" id="atd-bonus-q-btn">⚡ Bonus Question (+Credits)</button>' +
                '<button type="button" class="btn sm emerald" id="atd-launch-wave-btn">▶️ Launch Wave ' + tdState.wave + '</button>'
              : '') +
            '<button type="button" class="btn sm coral" id="atd-cashout-btn">🏁 Cash Out &amp; Finish</button>' +
          '</div>' +
        '</div>' +
        clearBannerHtml +
        '<div class="atd-tactical-grid">' +
          '<div class="atd-canvas-col">' +
            '<div class="atd-canvas-frame">' +
              '<canvas id="atd-canvas" class="atd-canvas" width="' + CANVAS_W + '" height="' + CANVAS_H + '" tabindex="0" aria-label="HVAC Tower Defense Tactical Grid"></canvas>' +
            '</div>' +
            '<div class="atd-inspector" id="atd-inspector"></div>' +
          '</div>' +
          '<div class="atd-sidebar">' +
            '<div class="atd-sidebar-head">' +
              '<h3>🛠️ Turret Shop</h3>' +
              '<span class="badge muted" id="atd-hud-deployed">' + tdState.turrets.length + ' Deployed</span>' +
            '</div>' +
            '<div class="atd-turret-list">' + paletteHtml + '</div>' +
            '<div class="atd-intel-box">' +
              '<strong>' + (intel.isBoss ? "⚠️ Wave " + tdState.wave + " Boss Alert" : "📡 Wave " + tdState.wave + " Forecast") + '</strong>' +
              '<div>' + esc(intel.text) + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    renderInspector();
    drawTacticalCanvas();

    const canvas = activeStage.querySelector("#atd-canvas");
    if (canvas) {
      canvas._atdCellClick = handleCellClick;
      canvas.addEventListener("click", function (e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / (rect.width || canvas.width);
        const scaleY = canvas.height / (rect.height || canvas.height);
        const px = (e.clientX - rect.left) * scaleX;
        const py = (e.clientY - rect.top) * scaleY;
        const col = Math.floor(px / CELL_SIZE);
        const row = Math.floor(py / CELL_SIZE);
        handleCellClick(col, row);
      });
      canvas.addEventListener("mousemove", function (e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / (rect.width || canvas.width);
        const scaleY = canvas.height / (rect.height || canvas.height);
        const col = Math.floor(((e.clientX - rect.left) * scaleX) / CELL_SIZE);
        const row = Math.floor(((e.clientY - rect.top) * scaleY) / CELL_SIZE);
        if (!tdState.hoverCell || tdState.hoverCell.col !== col || tdState.hoverCell.row !== row) {
          tdState.hoverCell = { col: col, row: row };
          if (!tdState.waveRunning) drawTacticalCanvas();
        }
      });
      canvas.addEventListener("mouseleave", function () {
        tdState.hoverCell = null;
        if (!tdState.waveRunning) drawTacticalCanvas();
      });
      canvas.addEventListener("keydown", function (e) {
        let moved = false;
        if (e.key === "ArrowLeft") { tdState.cursorCell.col = Math.max(0, tdState.cursorCell.col - 1); moved = true; }
        else if (e.key === "ArrowRight") { tdState.cursorCell.col = Math.min(GRID_COLS - 1, tdState.cursorCell.col + 1); moved = true; }
        else if (e.key === "ArrowUp") { tdState.cursorCell.row = Math.max(0, tdState.cursorCell.row - 1); moved = true; }
        else if (e.key === "ArrowDown") { tdState.cursorCell.row = Math.min(GRID_ROWS - 1, tdState.cursorCell.row + 1); moved = true; }
        else if (e.key === "Enter" || e.code === "Space") {
          e.preventDefault();
          handleCellClick(tdState.cursorCell.col, tdState.cursorCell.row);
          return;
        }
        if (moved) {
          e.preventDefault();
          tdState.hoverCell = { col: tdState.cursorCell.col, row: tdState.cursorCell.row };
          if (!tdState.waveRunning) drawTacticalCanvas();
        }
      });
    }

    activeStage.querySelectorAll("[data-atd-bp]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        playSound("click");
        tdState.selectedBlueprint = btn.getAttribute("data-atd-bp");
        tdState.selectedTurretId = null;
        activeStage.querySelectorAll("[data-atd-bp]").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-atd-bp") === tdState.selectedBlueprint);
        });
        renderInspector();
        drawTacticalCanvas();
      });
    });

    const speedBtn = activeStage.querySelector("#atd-speed-btn");
    if (speedBtn) {
      speedBtn.addEventListener("click", function () {
        playSound("click");
        tdState.speedMult = tdState.speedMult === 1 ? 2 : 1;
        speedBtn.textContent = "⏩ Speed: " + tdState.speedMult + "x";
      });
    }

    const bonusBtn = activeStage.querySelector("#atd-bonus-q-btn");
    if (bonusBtn) {
      bonusBtn.addEventListener("click", function () {
        playSound("click");
        startQuizBatch("bonus", 1);
      });
    }

    const launchBtn = activeStage.querySelector("#atd-launch-wave-btn");
    if (launchBtn) {
      launchBtn.addEventListener("click", launchCurrentWave);
    }

    const cashBtn = activeStage.querySelector("#atd-cashout-btn");
    if (cashBtn) {
      cashBtn.addEventListener("click", function () {
        finishOperation("cashed_out");
      });
    }

    const nextPrepNow = activeStage.querySelector("#atd-next-prep-now");
    if (nextPrepNow) {
      nextPrepNow.addEventListener("click", advanceToNextWavePrep);
    }
  }

            '<div class="atd-stat-box"><div class="atd-stat-val">🏆 ' + tdState.score.toLocaleString() + '</div><div class="atd-stat-lbl">Defense Score</div></div>' +

  function mount(stageEl, ctx) {

  }

  function returnToLobby() {
    clearTimers();
    match = null;
    if (activeCtx && typeof activeCtx.playSound === "function") activeCtx.playSound("click");
    render();
  }

  function renderLobby(stageEl, ctx) {
    const allQ = Array.isArray(ctx && ctx.blitzQuestions) ? ctx.blitzQuestions : [];
    if (allQ.length === 0) {
      stageEl.innerHTML = '<div class="akp-root"><div class="empty-card">No quiz questions available in this chapter payload.</div></div>';
      return;
    }

    const van = getVan(ctx);
    const hs = (ctx.state && ctx.state.highScores) ? ctx.state.highScores : {};
    const bestPts = Number(hs.kahootPodiumPts) || 0;
    const totalWins = Number(hs.kahootPodiumWins) || 0;
    const bestPct = Number(hs.bestPct) || 0;

    const epaCount = getPoolCount(ctx, "EPA608");
    const trapCount = getPoolCount(ctx, "TRAP");
    const secs = Array.isArray(ctx.sections) ? ctx.sections : [];
    const hasFilterSec = secs.some(function (s) { return s.id === prefs.sectionFilter; });
    if (
      prefs.sectionFilter !== "ALL" &&
      prefs.sectionFilter !== "TRAP" &&
      !(prefs.sectionFilter === "EPA608" && epaCount > 0) &&
      !hasFilterSec
    ) {
      prefs.sectionFilter = "ALL";
    }

    const secOptionsHtml =
      '<option value="ALL" ' + (prefs.sectionFilter === "ALL" ? "selected" : "") + '>All Chapter Sections (' + allQ.length + ' Qs)</option>' +
