      function stepForward() {
        const tel = computeTelemetry();
        if (tel.stalled) {
          safePlay(playSound, "wrong");
          stopAuto();
          renderUI();
          return;
        }
        if (state.stepIndex < tel.steps.length - 1) {
          state.stepIndex += 1;
          state.lastCheckNote = "";
          const nextTel = computeTelemetry();
          safePlay(playSound, nextTel.stalled ? "wrong" : "click");
          if (nextTel.stalled) stopAuto();
        } else {
          stopAuto();
        }
        renderUI();
      }

      disp.on(containerEl, "click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        if (missionCtrl.handleClick(btn)) return;
        const act = btn.getAttribute("data-act");

        if (act === "step") {
          stopAuto();
          stepForward();
        } else if (act === "autorun") {
          safePlay(playSound, "click");
          stopAuto();
          state.autoRunning = true;
          state.autoTimer = window.setInterval(() => {
            if (disp.destroyed || !state.autoRunning) return;
            const tel = computeTelemetry();
            if (tel.complete || tel.stalled) {
              stopAuto();
              renderUI();
              return;
            }
            stepForward();
          }, 700);
        } else if (act === "reset") {
          stopAuto();
          state.stepIndex = 0;
          state.lastCheckNote = "";
          safePlay(playSound, "click");
          renderUI();
        } else if (btn.hasAttribute("data-mode")) {
          stopAuto();
          state.mode = btn.getAttribute("data-mode");
          state.stepIndex = 0;
          state.lastCheckNote = "Switched Thermostat Mode to " + state.mode.toUpperCase() + ".";
          safePlay(playSound, "click");
          renderUI();
        } else if (btn.hasAttribute("data-check")) {
          const chk = btn.getAttribute("data-check");
          if (chk === "flame") {
            if (state.fault === "flame_rod") {
              state.fault = "none";
              state.lastCheckNote = "✅ Cleaned oxidized Flame Rod & verified DC rectification (>3.8 μA)!";
              safePlay(playSound, "correct");
            } else {
              state.lastCheckNote = "🔍 Flame Rod measured clean (>3.5 μA DC when burners fire).";
              safePlay(playSound, "click");
            }
          } else if (chk === "pressure") {
            if (state.fault === "pressure_sw" || state.fault === "hsi_fail" || state.fault === "safety_fault") {
              state.fault = "none";
              state.lastCheckNote = "✅ Cleared draft/safety obstruction & confirmed switch closes cleanly!";
              safePlay(playSound, "correct");
            } else {
              state.lastCheckNote = "🔍 Pressure/Limit switches tested continuous and within spec.";
              safePlay(playSound, "click");
            }
          } else if (chk === "solenoid") {
            if (state.fault === "reversing_stuck" || state.fault === "hsi_fail" || state.fault === "safety_fault") {
              state.fault = "none";
              state.lastCheckNote = "✅ Repaired 24V coil/igniter connection — continuity & voltage restored!";
              safePlay(playSound, "correct");
            } else {
              state.lastCheckNote = "🔍 Verified 24V AC control coil & reversing valve solenoid operation.";
              safePlay(playSound, "click");
            }
          }
          renderUI();
        }
      });

      disp.on(faultSelect, "change", () => {
        stopAuto();
        state.fault = faultSelect.value;
        state.lastCheckNote = "";
        safePlay(playSound, "click");
        renderUI();
      });

      renderUI();

      // Canvas animation loop
      let lastTs = 0;
      disp.raf((ts) => {
        if (!ctx) return;
        const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
        lastTs = ts;
        const tel = computeTelemetry();
        state.flowPhase = (state.flowPhase + dt * (tel.stalled ? 0.2 : 1.4)) % 1;

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "#060c18";
        ctx.fillRect(0, 0, W, H);

        if (profile === "heat_pump") {
          // Draw Heat Pump Dual Coils + 4-Way Reversing Valve Centerpiece
          const isHeat = state.mode === "heating";
          const isDefrost = state.mode === "defrost";
          const indoorWarm = isHeat || isDefrost;

          // Indoor Coil Box (Left)
          drawRoundedRect(ctx, 28, 42, 180, 210, 10);
          ctx.fillStyle = indoorWarm ? "rgba(251, 146, 60, 0.14)" : "rgba(56, 189, 248, 0.14)";
          ctx.fill();
          ctx.strokeStyle = indoorWarm ? "#fb923c" : "#38bdf8";
          ctx.lineWidth = 2.5;
          ctx.stroke();

          ctx.fillStyle = "#f8fafc";
          ctx.font = "700 13px 'Segoe UI', sans-serif";
          ctx.fillText("INDOOR AIR HANDLER", 48, 66);
          ctx.fillStyle = indoorWarm ? "#fbbf24" : "#38bdf8";
          ctx.font = "700 12px sans-serif";
          ctx.fillText(isHeat ? "Condenser (Heat Output)" : (isDefrost ? "W2 Aux Heat ON (" + tel.supplyTemp + "°F)" : "Evaporator (Cooling)"), 42, 86);

          // Indoor coil fins
          for (let y = 104; y < 224; y += 16) {
            ctx.strokeStyle = indoorWarm ? "#fb923c" : "#38bdf8";
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(52, y); ctx.lineTo(182, y); ctx.stroke();
          }
          if (isDefrost && tel.effStep >= 2) {
            drawCanvasTag(ctx, 48, 226, "🔥 W2 AUX STRIPS ON", "#7c2d12", "#fbbf24", "#fb923c");
          }

          // Outdoor / Geothermal Coil Box (Right)
          drawRoundedRect(ctx, 512, 42, 180, 210, 10);
          ctx.fillStyle = indoorWarm && !isDefrost ? "rgba(56, 189, 248, 0.12)" : "rgba(251, 146, 60, 0.14)";
          ctx.fill();
          ctx.strokeStyle = isDefrost ? "#fbbf24" : (isHeat ? "#38bdf8" : "#fb923c");
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.fillStyle = "#f8fafc";
          ctx.font = "700 13px 'Segoe UI', sans-serif";
          ctx.fillText(chNum === 37 ? "GEOTHERMAL LOOP" : "OUTDOOR COIL", 538, 66);
          ctx.fillStyle = isDefrost ? "#fbbf24" : (isHeat ? "#38bdf8" : "#fb923c");
          ctx.font = "700 12px sans-serif";
          ctx.fillText(isDefrost ? "DEFROST: Melting Ice" : (isHeat ? "Evaporator (Absorbing)" : "Condenser (Rejecting)"), 528, 86);

          for (let y = 104; y < 224; y += 16) {
            ctx.strokeStyle = isDefrost ? "#fb923c" : (isHeat ? "#38bdf8" : "#fb923c");
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(534, y); ctx.lineTo(668, y); ctx.stroke();
          }
          if (isDefrost) {
            drawCanvasTag(ctx, 534, 226, tel.effStep >= 2 ? "ODF OFF • MELTING 💧" : "FROST DETECTED ❄", "#1e293b", "#fbbf24");
          }

          // Center 4-Way Reversing Valve & Compressor
          drawRoundedRect(ctx, 270, 52, 180, 118, 12);
          ctx.fillStyle = "#111b2e";
          ctx.fill();
          ctx.strokeStyle = tel.stalled ? "#f87171" : "#fbbf24";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = "#f8fafc";
          ctx.font = "700 12px sans-serif";
          ctx.fillText("4-WAY REVERSING VALVE", 286, 74);

          // Valve Ports: Top = Discharge, Bottom Left = Indoor, Center = Suction, Bottom Right = Outdoor
          const solEnergized = (state.mode === "cooling" || state.mode === "defrost") && state.fault !== "reversing_stuck";
          const slideX = solEnergized ? 378 : 342;
          ctx.fillStyle = solEnergized ? "#fbbf24" : "#38bdf8";
          drawRoundedRect(ctx, slideX - 36, 98, 72, 24, 12);
          ctx.fill();
          ctx.fillStyle = "#020617";
          ctx.font = "700 10px sans-serif";
          ctx.fillText(solEnergized ? "COOL/DEFROST" : "HEATING", slideX - 30, 114);

          // Solenoid Coil Box on right of 4-way
          drawRoundedRect(ctx, 418, 86, 24, 48, 4);
          ctx.fillStyle = solEnergized ? "#fbbf24" : "#334155";
          ctx.fill();
          ctx.fillStyle = "#f8fafc";
          ctx.font = "700 10px monospace";
          ctx.fillText(solEnergized ? "24V" : "0V", 420, 148);

          // Compressor below 4-way
          ctx.beginPath();
          ctx.arc(360, 218, 30, 0, Math.PI * 2);
          ctx.fillStyle = "#1e293b";
          ctx.fill();
          ctx.strokeStyle = tel.effStep >= 2 && !tel.stalled ? "#34d399" : "#64748b";
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.fillStyle = "#f8fafc";
          ctx.font = "700 10px sans-serif";
          ctx.fillText("COMP", 345, 222);

          // Refrigerant flow pipes & directional arrows
          const activeFlow = tel.effStep >= 1 && !tel.stalled;
          ctx.strokeStyle = indoorWarm ? "#fb923c" : "#38bdf8";
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(270, 112); ctx.lineTo(208, 112); ctx.stroke();
          ctx.strokeStyle = indoorWarm ? "#38bdf8" : "#fb923c";
          ctx.beginPath(); ctx.moveTo(450, 112); ctx.lineTo(512, 112); ctx.stroke();

          if (activeFlow) {
            const pOff = state.flowPhase * 42;
            if (isHeat) {
              drawArrow(ctx, 265 - pOff, 112, 225 - pOff, 112, "#fb923c", 7);
              drawArrow(ctx, 495 - pOff, 112, 460 - pOff, 112, "#38bdf8", 7);
            } else {
              drawArrow(ctx, 220 + pOff, 112, 255 + pOff, 112, "#38bdf8", 7);
              drawArrow(ctx, 455 + pOff, 112, 495 + pOff, 112, "#fb923c", 7);
            }
          }
        } else {
          // Furnace / Boiler / AC Equipment Sequence Cutaway
          drawRoundedRect(ctx, 36, 36, 648, 224, 12);
          ctx.fillStyle = "#111b2e";
          ctx.fill();
          ctx.strokeStyle = "#475569";
          ctx.lineWidth = 2;
          ctx.stroke();

          // Left Compartment: Inducer + Pressure Switch
          drawRoundedRect(ctx, 56, 56, 175, 184, 8);
          ctx.fillStyle = "#0b1220";
          ctx.fill();
          ctx.strokeStyle = "#334155";
          ctx.stroke();
          ctx.fillStyle = "#94a3b8";
          ctx.font = "700 11px sans-serif";
          ctx.fillText(profile === "gas_heat" ? "INDUCER & PRESSURE SW" : "24V CONTROL & SAFETY", 66, 76);

          // Spinning Inducer Wheel
          const inducerRunning = tel.effStep >= 1 && !tel.stalled;
          ctx.save();
          ctx.translate(142, 142);
          ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2);
          ctx.strokeStyle = inducerRunning ? "#38bdf8" : "#475569";
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.rotate(inducerRunning ? ts * 0.008 : 0);
          for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 28, Math.sin(a) * 28); ctx.stroke();
          }
          ctx.restore();
          drawCanvasTag(ctx, 68, 204, tel.pressureWC, "#0f172a", tel.pressureStatus === "is-danger" ? "#f87171" : "#34d399");

          // Center Compartment: Burner / HSI / Flame Rod OR Heating/Cooling Coil
          drawRoundedRect(ctx, 250, 56, 225, 184, 8);
          ctx.fillStyle = "#0b1220";
          ctx.fill();
          ctx.strokeStyle = "#334155";
          ctx.stroke();
          ctx.fillStyle = "#94a3b8";
          ctx.font = "700 11px sans-serif";
          ctx.fillText(profile === "gas_heat" ? "BURNER / HSI / FLAME ROD" : "HEAT EXCHANGE / COIL", 268, 76);

          const hsiGlowing = profile === "gas_heat" && tel.effStep >= 3 && state.fault !== "hsi_fail" && state.fault !== "pressure_sw";
          const burnerLit = (profile === "gas_heat" || profile === "oil_heat") && tel.effStep >= 4 && !tel.stalled;

          if (hsiGlowing && tel.effStep <= 5) {
            ctx.save();
            ctx.fillStyle = "rgba(251, 146, 60, 0.35)";
            ctx.beginPath(); ctx.arc(312, 142, 22, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#fb923c";
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(304, 154); ctx.lineTo(312, 128); ctx.lineTo(320, 154); ctx.stroke();
            ctx.restore();
          }

          if (burnerLit) {
            for (let f = 0; f < 4; f++) {
              const fx = 294 + f * 36;
              const flicker = Math.sin(ts * 0.02 + f * 1.4) * 5;
              ctx.beginPath();
              ctx.moveTo(fx - 11, 184);
              ctx.quadraticCurveTo(fx, 118 + flicker, fx + 11, 184);
              ctx.closePath();
              ctx.fillStyle = profile === "oil_heat" ? "#fbbf24" : "#38bdf8";
              ctx.fill();
              ctx.beginPath();
              ctx.moveTo(fx - 5, 184);
              ctx.quadraticCurveTo(fx, 142 + flicker, fx + 5, 184);
              ctx.closePath();
              ctx.fillStyle = "#e0f2fe";
              ctx.fill();
            }
          } else if (profile === "electric_heat" && tel.effStep >= 2) {
            ctx.strokeStyle = "#fb923c";
            ctx.lineWidth = 4;
            for (let y = 110; y < 185; y += 22) {
              ctx.beginPath(); ctx.moveTo(275, y); ctx.lineTo(445, y); ctx.stroke();
            }
          } else if (profile === "ac_cooling" || profile === "absorption_evap") {
            ctx.strokeStyle = tel.effStep >= 2 ? "#38bdf8" : "#475569";
            ctx.lineWidth = 4;
            for (let y = 110; y < 185; y += 20) {
              ctx.beginPath(); ctx.moveTo(275, y); ctx.lineTo(445, y); ctx.stroke();
            }
          } else if (profile === "hydronic_solar") {
            ctx.strokeStyle = tel.effStep >= 2 ? "#fb923c" : "#475569";
            ctx.lineWidth = 5;
            ctx.strokeRect(278, 108, 168, 72);
          }

          // Flame Rod Probe graphic
          if (profile === "gas_heat") {
            ctx.strokeStyle = "#e2e8f0";
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(432, 98); ctx.lineTo(410, 148); ctx.stroke();
            drawCanvasTag(ctx, 270, 204, "Flame: " + tel.flameUa, "#0f172a", tel.flameStatus === "is-danger" ? "#f87171" : "#38bdf8");
          }

          // Right Compartment: Supply Blower & Outlet Temp
          drawRoundedRect(ctx, 492, 56, 174, 184, 8);
          ctx.fillStyle = "#0b1220";
          ctx.fill();
          ctx.strokeStyle = "#334155";
          ctx.stroke();
          ctx.fillStyle = "#94a3b8";
          ctx.font = "700 11px sans-serif";
          ctx.fillText("SUPPLY AIR DELIVERY", 514, 76);

          const blowerOn = tel.complete;
          ctx.save();
          ctx.translate(578, 142);
          ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2);
          ctx.strokeStyle = blowerOn ? "#34d399" : "#475569";
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.rotate(blowerOn ? ts * 0.01 : 0);
          for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 28, Math.sin(a) * 28); ctx.stroke();
          }
          ctx.restore();
          drawCanvasTag(ctx, 514, 204, "Supply: " + tel.supplyTemp + "°F", "#0f172a", tel.supplyTemp >= 95 ? "#fb923c" : "#38bdf8");
        }

        // Bottom Interactive Sequence Ladder
        const ladderY = 278;
        const padX = 28;
        const totalW = W - padX * 2;
        const n = tel.steps.length;
        const boxW = Math.floor((totalW - (n - 1) * 8) / n);
        for (let i = 0; i < n; i++) {
          const sx = padX + i * (boxW + 8);
          const isFaulted = tel.stalled && i === tel.effStep;
          const isDone = !isFaulted && i < tel.effStep || (tel.complete && i === tel.effStep);
          const isCurrent = !isFaulted && i === tel.effStep && !tel.complete;

          drawRoundedRect(ctx, sx, ladderY, boxW, 74, 8);
          ctx.fillStyle = isFaulted ? "rgba(248, 113, 113, 0.2)" : (isDone ? "rgba(52, 211, 153, 0.16)" : (isCurrent ? "rgba(251, 191, 36, 0.18)" : "#0f172a"));
          ctx.fill();
          ctx.strokeStyle = isFaulted ? "#f87171" : (isDone ? "#34d399" : (isCurrent ? "#fbbf24" : "#334155"));
          ctx.lineWidth = isCurrent || isFaulted ? 2.2 : 1.3;
          ctx.stroke();

          ctx.fillStyle = isFaulted ? "#fecaca" : (isDone ? "#34d399" : (isCurrent ? "#fbbf24" : "#64748b"));
          ctx.font = "800 11px monospace";
          ctx.fillText((isFaulted ? "✕ " : (isDone ? "✓ " : "")) + "STEP " + (i + 1), sx + 8, ladderY + 20);

          ctx.fillStyle = "#f8fafc";
          ctx.font = "700 10.5px 'Segoe UI', sans-serif";
          const words = tel.steps[i].label.split(" ");
          let line1 = "";
          let line2 = "";
          for (let w = 0; w < words.length; w++) {
            if ((line1 + " " + words[w]).trim().length <= 13) line1 = (line1 + " " + words[w]).trim();
            else line2 = (line2 + " " + words[w]).trim();
          }
          ctx.fillText(line1, sx + 8, ladderY + 41);
          if (line2) ctx.fillText(line2, sx + 8, ladderY + 56);
        }
      });

      return {
        destroy() {
          disp.destroy(containerEl);
        }
      };
    }
  };

  // =========================================================================
  // ENGINE 3: "commercial_walkin" (Ch 41-50, 52)
  // =========================================================================
  window.TOPIC_ENGINES.commercial_walkin = {
    mount(containerEl, data, playSound, awardXP) {
      const disp = createDisposer();
      const safeData = safeObj(data);
      const chNum = Number(safeData.chapter_num) || 46;

      const defaultMissions = [
        {
          id: "cw_m1",
          title: "Mission 1: Set Walk-In Freezer (-10°F) & Clear Sight Glass",
          description: "A low charge caused flashing bubbles in the sight glass and a warm freezer. Switch to -10°F Freezer, restore charge/clear sight glass, and tune TXV Superheat to 6–12°F.",
          hint: "Set Box Setpoint to -10°F Freezer, clear the Low Charge fault, and center TXV Superheat around 8–10°F.",
          xp: 25,
          initial: { setpoint: 35, llsvOpen: true, txvTurns: 1.0, mode: "cooling", fault: "low_charge", frostPct: 18 },
          target: { setpoint: -10, sight_glass_clear: true, superheat_min: 6, superheat_max: 12, fault_cleared: true }
        },
        {
          id: "cw_m2",
          title: "Mission 2: Execute Electric Defrost on Iced Evaporator",
          description: "The walk-in evaporator coil is packed with ice, starving suction pressure! Trigger Electric Defrost to melt frost below 10% then return to Cooling.",
          hint: "Click 'Trigger Defrost' until coil frost drops < 10%, then switch back to Cooling.",
          xp: 30,
          initial: { setpoint: -10, llsvOpen: true, txvTurns: 0, mode: "cooling", fault: "iced_coil", frostPct: 86 },
          target: { frost_max: 10, mode: "cooling", fault_cleared: true }
        },
        {
          id: "cw_m3",
          title: "Mission 3: Perform Liquid-Line Solenoid Pumpdown",
          description: "Close the Liquid Line Solenoid Valve (LLSV) to execute a safe pumpdown cycle and draw Evaporator Suction down ≤ 10 psig without liquid floodback.",
          hint: "Click 'Close LLSV / Pumpdown' and let suction pressure pull down below 10 psig.",
          xp: 30,
          initial: { setpoint: 35, llsvOpen: true, txvTurns: 0, mode: "cooling", fault: "none", frostPct: 8 },
          target: { pumpdown: true, suction_max: 10 }
        }
      ];

      const missions = normalizeMissions(safeData.sim_missions, defaultMissions);

      const state = {
        setpoint: 35,
        llsvOpen: true,
        txvTurns: 0,
        mode: "cooling", // cooling | pumpdown | defrost
        fault: "none",   // none | low_charge | iced_coil | restricted_drier
        frostPct: 10,
        liveBoxTemp: 35.0,
        liveSuctionPsig: 62.0,
        flowPhase: 0,
        interacted: false
      };

      function computeTargets() {
        const isFreezer = state.setpoint === -10;
        const baseSST = isFreezer ? -20 : 25;
        const baseSuction = isFreezer ? 16 : 62;
        const baseHead = isFreezer ? 222 : 238;

        let targetSuction = baseSuction;
        let targetHead = baseHead;
        let superheat = 10 + state.txvTurns * 6;
        let sightGlass = "Clear Liquid";
        let targetBox = state.setpoint;
        let compOn = true;

        if (state.mode === "defrost") {
          compOn = false;
          targetSuction = isFreezer ? 38 : 68;
          targetHead = 165;
          sightGlass = "Idle (Defrost)";
          targetBox = state.setpoint + 4;
        } else if (!state.llsvOpen || state.mode === "pumpdown") {
          targetSuction = 4;
          compOn = state.liveSuctionPsig > 7;
          sightGlass = "Pumpdown (LLSV Shut)";
          superheat = 18;
          targetHead = 188;
        } else {
          if (state.fault === "low_charge") {
            targetSuction -= 13;
            targetHead -= 38;
            superheat += 12;
            sightGlass = "Flashing Bubbles ⚠️";
            targetBox += 11;
          } else if (state.fault === "restricted_drier") {
            targetSuction -= 11;
            superheat += 13;
            sightGlass = "Flashing Bubbles ⚠️";
            targetBox += 9;
          } else if (state.fault === "iced_coil" || state.frostPct >= 65) {
            targetSuction -= 10;
            superheat -= 5;
            targetBox += 12;
          }
        }

        superheat = roundTo(clamp(superheat, 1, 32), 1);
        return {
          isFreezer,
          baseSST,
          targetSuction: roundTo(clamp(targetSuction, 2, 95), 1),
          targetHead: Math.round(targetHead),
          superheat,
          sightGlass,
          targetBox,
          compOn
        };
      }

      function applyMissionSetup(m) {
        const s = Object.assign({}, safeObj(m.params), safeObj(m.initial));
        if (s.setpoint != null) {
          state.setpoint = Number(s.setpoint) === -10 ? -10 : 35;
        } else if (s.temp_f != null) {
          state.setpoint = Number(s.temp_f) <= 5 ? -10 : 35;
        } else {
          state.setpoint = 35;
        }

        if (s.mode && ["cooling", "pumpdown", "defrost"].includes(String(s.mode))) {
          state.mode = String(s.mode);
        } else if (s.target_state === "PUMP_DOWN_SOLENOID") {
          state.mode = "pumpdown";
        } else if (s.target_state === "DEFROST_INIT" || s.target_state === "DRIP_DELAY") {
          state.mode = "defrost";
        } else {
          state.mode = "cooling";
        }

        state.llsvOpen = s.llsvOpen != null
          ? Boolean(s.llsvOpen)
          : (state.mode !== "pumpdown" && s.target_state !== "DRIP_DELAY");
        state.txvTurns = s.txvTurns != null ? clamp(Number(s.txvTurns) || 0, -2, 2) : 0;
        state.fault = s.fault ? String(s.fault) : "none";
        if (s.frostPct != null) {
          state.frostPct = clamp(Number(s.frostPct) || 0, 0, 100);
        } else if (state.fault === "iced_coil" || s.target_state === "DEFROST_INIT") {
          state.frostPct = 82;
        } else {
          state.frostPct = 10;
        }
        state.interacted = false;
        const t = computeTargets();
        state.liveBoxTemp = t.targetBox;
        state.liveSuctionPsig = state.llsvOpen ? t.targetSuction : (state.setpoint === -10 ? 16 : 62);
      }

      function evaluateMission(m, t) {
        const tgt = safeObj(m.target);
        const checks = [];
        if (m.check) {
          let ok = false;
          try { ok = Boolean(m.check(t, state)); } catch (_) { ok = false; }
          checks.push({ label: "Objective Criteria Met", met: ok });
          return { allMet: ok, checks };
        }
        const hasExplicit =
          tgt.setpoint != null || tgt.sight_glass_clear != null ||
          tgt.superheat_min != null || tgt.superheat_max != null ||
          tgt.frost_max != null || tgt.mode != null ||
          tgt.pumpdown != null || tgt.fault_cleared != null;
        const combined = (m.title + " " + m.description + " " + m.hint).toLowerCase();
        if (tgt.setpoint != null || /-10|freezer/.test(combined)) {
          const sp = tgt.setpoint != null ? Number(tgt.setpoint) : -10;
          checks.push({ label: "Setpoint " + sp + "°F", met: state.setpoint === sp });
        }
        if (tgt.sight_glass_clear || /sight glass|flash|charge/.test(combined)) {
          checks.push({ label: "Sight Glass Clear", met: t.sightGlass === "Clear Liquid" });
        }
        if (tgt.superheat_min != null || tgt.superheat_max != null || /superheat|txv/.test(combined)) {
          const mn = tgt.superheat_min != null ? Number(tgt.superheat_min) : 6;
          const mx = tgt.superheat_max != null ? Number(tgt.superheat_max) : 12;
          checks.push({ label: "Superheat " + mn + "–" + mx + "°F (" + t.superheat + "°F)", met: t.superheat >= mn && t.superheat <= mx });
        }
        if (tgt.frost_max != null || /defrost|ice|frost/.test(combined)) {
          const fm = tgt.frost_max != null ? Number(tgt.frost_max) : 12;
          checks.push({ label: "Coil Frost ≤ " + fm + "% (" + Math.round(state.frostPct) + "%)", met: state.frostPct <= fm });
        }
        if (tgt.mode) {
          checks.push({ label: "Mode: " + tgt.mode.toUpperCase(), met: state.mode === tgt.mode });
        }
        if (tgt.pumpdown || /pumpdown|solenoid|llsv/.test(combined)) {
          checks.push({ label: "LLSV Closed (Pumpdown)", met: !state.llsvOpen || state.mode === "pumpdown" });
          checks.push({ label: "Suction ≤ 10 psig (" + state.liveSuctionPsig.toFixed(1) + ")", met: state.liveSuctionPsig <= 10 });
        }
        if (tgt.fault_cleared) {
          checks.push({ label: "Faults Cleared", met: state.fault === "none" });
        }
        if (!checks.length) {
          checks.push({ label: "Sight Glass Clear", met: t.sightGlass === "Clear Liquid" });
          checks.push({ label: "Superheat 6–12°F", met: t.superheat >= 6 && t.superheat <= 12 });
        }
        const canPass = hasExplicit || state.interacted;
        return { allMet: canPass && checks.every((c) => c.met), checks };
      }

      containerEl.innerHTML = [
        '<div class="tg2-shell">',
        '  <div class="tg2-head">',
        '    <div class="tg2-title-wrap">',
        '      <span class="tg2-kicker">Ch. ' + chNum + ' Commercial Refrigeration Simulator</span>',
        '      <h3 class="tg2-title">Walk-In Cooler/Freezer &amp; Pumpdown Lab</h3>',
        '      <p class="tg2-subtitle">Manage Box Setpoint, Liquid-Line Solenoid Valve (LLSV), Sight Glass, TXV Superheat, and Electric Defrost.</p>',

        '    <div class="tg2-status-strip" data-el="statusStrip"></div>',
        '  </div>',
        '  <div class="tg2-lab-grid">',
        '    <div class="tg2-canvas-card">',
        '      <canvas class="tg2-canvas" data-el="canvas"></canvas>',
        '      <div class="tg2-telemetry-grid" data-el="telemetry"></div>',
        '      <div class="tg2-alert-bar" data-el="alertBar"></div>',
        '    </div>',
        '    <div class="tg2-controls-card">',
        '      <div class="tg2-ctrl-group">',
        '        <div class="tg2-ctrl-label"><span>Box Setpoint</span><span class="tg2-ctrl-val" data-el="setpointLbl">35°F Cooler</span></div>',

        '          <button type="button" class="tg2-btn is-selected" data-setpoint="35">🥛 35°F Cooler</button>',

        '        <div class="tg2-seg-row">',
        '          <button type="button" class="tg2-btn is-selected" data-llsv="open">🟢 LLSV Open (Run)</button>',
        '          <button type="button" class="tg2-btn is-gold" data-llsv="closed">🔒 Close LLSV (Pumpdown)</button>',
        '        </div>',
        '      </div>',
        '      <div class="tg2-ctrl-group">',
        '        <div class="tg2-ctrl-label"><span>TXV Superheat Adjustment</span><span class="tg2-ctrl-val" data-el="txvLbl">0.0 Turns (10°F SH)</span></div>',
        '        <input type="range" class="tg2-slider" min="-2" max="2" step="0.25" value="0" data-el="txvSlider" aria-label="TXV Superheat Stem Turns" />',
        '      </div>',
        '      <div class="tg2-ctrl-group">',
        '        <div class="tg2-ctrl-label"><span>Defrost Clock Mode</span><span class="tg2-ctrl-val" data-el="clockLbl">Cooling</span></div>',
        '        <div class="tg2-seg-row">',
        '          <button type="button" class="tg2-btn is-selected" data-clk="cooling">❄️ Cooling</button>',
        '          <button type="button" class="tg2-btn" data-clk="pumpdown">⏬ Pumpdown</button>',
        '          <button type="button" class="tg2-btn is-danger" data-clk="defrost">🔥 Electric Defrost</button>',
        '        </div>',
        '      </div>',
        '      <div class="tg2-ctrl-group">',
        '        <div class="tg2-ctrl-label"><span>Service Fault Simulation / Repair</span></div>',
        '        <select class="tg2-select" data-el="faultSelect" aria-label="Commercial Fault Simulation">',
        '          <option value="none">Normal System Charge &amp; Flow</option>',
        '          <option value="low_charge">Fault: Low Refrigerant Charge (Flashing Sight Glass)</option>',
        '          <option value="iced_coil">Fault: Iced Evaporator Coil (Missed Defrost)</option>',
        '          <option value="restricted_drier">Fault: Restricted Liquid Line Drier</option>',
        '        </select>',
        '        <button type="button" class="tg2-btn is-green" data-el="repairBtn">🔧 Repair / Weigh-In Correct Charge</button>',
        '      </div>',
        '    </div>',
        '  </div>',
        '  <div class="tg2-mission-deck">',
        '    <div class="tg2-mission-tabs" data-el="missionTabs"></div>',
        '    <div class="tg2-mission-body" data-el="missionBody"></div>',
        '  </div>',
        '</div>'
      ].join("\n");

      const q = (sel) => containerEl.querySelector('[data-el="' + sel + '"]');
      const canvas = q("canvas");
      const W = 720;
      const H = 370;
      const ctx = setupHiDPICanvas(canvas, W, H);
      const statusStrip = q("statusStrip");
      const telemetryEl = q("telemetry");
      const alertBar = q("alertBar");
      const setpointLbl = q("setpointLbl");
      const llsvLbl = q("llsvLbl");
      const txvLbl = q("txvLbl");
      const clockLbl = q("clockLbl");
      const txvSlider = q("txvSlider");
      const faultSelect = q("faultSelect");
      const missionTabsEl = q("missionTabs");
      const missionBodyEl = q("missionBody");

      function renderUI() {
        const t = computeTargets();
        setpointLbl.textContent = state.setpoint === -10 ? "-10°F Freezer" : "35°F Cooler";
        llsvLbl.textContent = state.llsvOpen ? "LLSV Open (24V)" : "LLSV Closed (0V)";
        txvLbl.textContent = (state.txvTurns >= 0 ? "+" : "") + state.txvTurns.toFixed(2) + " Turns (" + t.superheat + "°F SH)";
        clockLbl.textContent = state.mode.toUpperCase() + " | Frost " + Math.round(state.frostPct) + "%";
        txvSlider.value = String(state.txvTurns);
        faultSelect.value = state.fault;

        containerEl.querySelectorAll("[data-setpoint]").forEach((b) => {
          b.classList.toggle("is-selected", Number(b.getAttribute("data-setpoint")) === state.setpoint);
        });
        containerEl.querySelectorAll("[data-llsv]").forEach((b) => {
          b.classList.toggle("is-selected", (b.getAttribute("data-llsv") === "open") === state.llsvOpen);
        });
        containerEl.querySelectorAll("[data-clk]").forEach((b) => {
          b.classList.toggle("is-selected", b.getAttribute("data-clk") === state.mode);
        });

        const badges = [];
        if (state.mode === "defrost") badges.push('<span class="tg2-badge is-danger">🔥 ELECTRIC DEFROST ACTIVE</span>');
        else if (!state.llsvOpen || state.mode === "pumpdown") badges.push('<span class="tg2-badge is-warn">🔒 PUMPDOWN ACTIVE</span>');
        if (t.sightGlass.indexOf("Flashing") >= 0) badges.push('<span class="tg2-badge is-danger">🫧 FLASHING SIGHT GLASS</span>');
        if (t.superheat < 5 && state.llsvOpen && state.mode === "cooling") badges.push('<span class="tg2-badge is-danger">⚠️ LIQUID FLOODBACK RISK</span>');
        if (!badges.length) badges.push('<span class="tg2-badge is-ok">✅ COMMERCIAL SYSTEM NOMINAL</span>');
        statusStrip.innerHTML = badges.join("");

        const shClass = t.superheat < 5 ? "is-danger" : (t.superheat > 16 ? "is-warn" : "is-ok");
        const sgClass = t.sightGlass === "Clear Liquid" ? "is-ok" : (t.sightGlass.indexOf("Flashing") >= 0 ? "is-danger" : "is-warn");
        const boxWarn = Math.abs(state.liveBoxTemp - state.setpoint) > 5;

        telemetryEl.innerHTML = [
          '<div class="tg2-gauge ' + (boxWarn ? 'is-warn' : 'is-ok') + '"><span class="tg2-gauge-label">Box Temp °F</span><span class="tg2-gauge-val">' + state.liveBoxTemp.toFixed(1) + '°F</span><span class="tg2-gauge-sub">Setpoint: ' + state.setpoint + '°F</span></div>',
          '<div class="tg2-gauge is-info"><span class="tg2-gauge-label">Suction psig</span><span class="tg2-gauge-val">' + state.liveSuctionPsig.toFixed(1) + ' psig</span><span class="tg2-gauge-sub">' + (t.compOn ? "Compressor ON" : "Cutout OFF") + '</span></div>',
          '<div class="tg2-gauge is-info"><span class="tg2-gauge-label">Head psig</span><span class="tg2-gauge-val">' + t.targetHead + ' psig</span><span class="tg2-gauge-sub">R-404A/448A Condenser</span></div>',
          '<div class="tg2-gauge ' + shClass + '"><span class="tg2-gauge-label">TXV Superheat</span><span class="tg2-gauge-val">' + t.superheat.toFixed(1) + '°F</span><span class="tg2-gauge-sub">Target 6–12°F</span></div>',
          '<div class="tg2-gauge ' + sgClass + '"><span class="tg2-gauge-label">Sight Glass</span><span class="tg2-gauge-val" style="font-size:14px">' + escapeHtml(t.sightGlass) + '</span><span class="tg2-gauge-sub">Frost: ' + Math.round(state.frostPct) + '%</span></div>'
        ].join("");

        if (state.mode === "defrost") {
          alertBar.className = "tg2-alert-bar is-warn";
          alertBar.textContent = "🔥 Electric Defrost: Compressor & evaporator fan are locked OFF while heater rods melt ice (" + Math.round(state.frostPct) + "% remaining) down the drain line.";
        } else if (!state.llsvOpen || state.mode === "pumpdown") {
          alertBar.className = "tg2-alert-bar is-info";
          alertBar.textContent = "🔒 Pumpdown Cycle: LLSV closed! Compressor evacuates evaporator down to ≤ 10 psig before Low-Pressure Control opens to prevent floodback.";
        } else if (t.sightGlass.indexOf("Flashing") >= 0) {
          alertBar.className = "tg2-alert-bar is-danger";
          alertBar.textContent = "🫧 Flashing Sight Glass: Vapor bubbles in the liquid line starve the TXV (High Superheat " + t.superheat + "°F). Fix leak/charge or clear restricted drier!";
        } else if (t.superheat < 5) {
          alertBar.className = "tg2-alert-bar is-danger";
          alertBar.textContent = "⚠️ Floodback Danger (" + t.superheat + "°F Superheat): TXV is overfeeding liquid into compressor suction! Turn TXV stem clockwise (+).";
        } else {
          alertBar.className = "tg2-alert-bar is-ok";
          alertBar.textContent = "✅ Solid Liquid Column at Sight Glass, " + t.superheat + "°F Superheat, and steady " + state.setpoint + "°F box control.";
        }

        missionCtrl.render(t);
      }

      const missionCtrl = createMissionController({
        missions,
        tabsEl: missionTabsEl,
        bodyEl: missionBodyEl,
        playSound,
        awardXP,
        onLoad: applyMissionSetup,
        evaluate: evaluateMission,
        onRenderAfter: renderUI
      });

      if (missions[0] && (Object.keys(missions[0].initial).length || Object.keys(missions[0].params).length)) {
        applyMissionSetup(missions[0]);
      }

      disp.on(containerEl, "click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        if (missionCtrl.handleClick(btn)) return;
        if (btn.hasAttribute("data-setpoint")) {
          state.setpoint = Number(btn.getAttribute("data-setpoint"));
          state.interacted = true;
          safePlay(playSound, "click");
          renderUI();
        } else if (btn.hasAttribute("data-llsv")) {
          const open = btn.getAttribute("data-llsv") === "open";
          state.llsvOpen = open;
          state.mode = open ? "cooling" : "pumpdown";
          state.interacted = true;
          safePlay(playSound, "click");
          renderUI();
        } else if (btn.hasAttribute("data-clk")) {
          state.mode = btn.getAttribute("data-clk");
          if (state.mode === "pumpdown") state.llsvOpen = false;
          if (state.mode === "cooling") state.llsvOpen = true;
          state.interacted = true;
          safePlay(playSound, "click");
          renderUI();
        } else if (btn.getAttribute("data-el") === "repairBtn") {
          state.fault = "none";
          state.frostPct = Math.min(state.frostPct, 12);
          state.txvTurns = 0;
          state.interacted = true;
          safePlay(playSound, "correct");
          renderUI();
        }
      });

      disp.on(txvSlider, "input", () => {
        state.txvTurns = Number(txvSlider.value);
        state.interacted = true;
        renderUI();
      });

      disp.on(faultSelect, "change", () => {
        state.fault = faultSelect.value;
        if (state.fault === "iced_coil") state.frostPct = 85;
        state.interacted = true;
        safePlay(playSound, "click");
        renderUI();
      });

      renderUI();

      // Smooth physics + animation tick
      let lastTs = 0;
      let uiTickAcc = 0;
      disp.raf((ts) => {
        if (!ctx) return;
        const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
        lastTs = ts;
        const t = computeTargets();

        // Smooth dynamic convergence for box temp, suction psig, and frost
        state.liveBoxTemp += (t.targetBox - state.liveBoxTemp) * Math.min(1, dt * 1.8);
        const suctRate = (!state.llsvOpen || state.mode === "pumpdown") ? 1.4 : 2.2;
        state.liveSuctionPsig += (t.targetSuction - state.liveSuctionPsig) * Math.min(1, dt * suctRate);

        if (state.mode === "defrost") {
          state.frostPct = Math.max(0, state.frostPct - dt * 19);
          if (state.frostPct <= 0.5 && state.fault === "iced_coil") state.fault = "none";
        } else if (state.fault === "iced_coil") {
          state.frostPct = Math.min(95, state.frostPct + dt * 4);
        }

        state.flowPhase = (state.flowPhase + dt * (t.compOn ? 1.15 : 0.0)) % 1;
        uiTickAcc += dt;
        if (uiTickAcc >= 0.25) {
          uiTickAcc = 0;
          renderUI();
        }

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "#060c18";
        ctx.fillRect(0, 0, W, H);

        // LEFT: Insulated Walk-In Box (x: 22..386, y: 24..346)
        drawRoundedRect(ctx, 22, 24, 364, 322, 12);
        ctx.fillStyle = state.setpoint === -10 ? "#0a1628" : "#0e1a2e";
        ctx.fill();
        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 7;
        ctx.stroke();

        ctx.fillStyle = "#f8fafc";
        ctx.font = "800 13px 'Segoe UI', sans-serif";
        ctx.fillText(state.setpoint === -10 ? "WALK-IN FREEZER BOX (-10°F)" : "WALK-IN COOLER BOX (35°F)", 40, 50);

        // Digital Box Thermostat
        drawRoundedRect(ctx, 290, 36, 80, 34, 6);
        ctx.fillStyle = "#020617";
        ctx.fill();
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = "#34d399";
        ctx.font = "800 15px monospace";
        ctx.fillText(state.liveBoxTemp.toFixed(1) + "°F", 298, 58);

        // Unit Cooler / Evaporator inside Walk-In (x: 56..288, y: 84..210)
        drawRoundedRect(ctx, 56, 84, 232, 124, 10);
        ctx.fillStyle = "#162235";
        ctx.fill();
        ctx.strokeStyle = state.mode === "defrost" ? "#fb923c" : "#38bdf8";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Evaporator Fan
        const evapFanOn = state.mode === "cooling";
        ctx.save();
        ctx.translate(106, 144);
        ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI * 2);
        ctx.fillStyle = "#09101d"; ctx.fill();
        ctx.strokeStyle = evapFanOn ? "#38bdf8" : "#475569"; ctx.lineWidth = 2; ctx.stroke();
        ctx.rotate(evapFanOn ? ts * 0.011 : 0);
        for (let b = 0; b < 5; b++) {
          const a = (b / 5) * Math.PI * 2;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 26, Math.sin(a) * 26); ctx.stroke();
        }
        ctx.restore();

        // Evaporator Coil Fins & Ice/Defrost Animation
        for (let fy = 98; fy < 194; fy += 14) {
          ctx.strokeStyle = state.mode === "defrost" ? "#fb923c" : "#38bdf8";
          ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.moveTo(156, fy); ctx.lineTo(272, fy); ctx.stroke();
        }
        if (state.frostPct > 12) {
          const frostAlpha = clamp(state.frostPct / 100, 0.12, 0.78);
          ctx.fillStyle = "rgba(224, 242, 254, " + frostAlpha + ")";
          drawRoundedRect(ctx, 154, 94, 120, 102, 6);
          ctx.fill();
          ctx.fillStyle = "#0284c7";
          ctx.font = "800 12px sans-serif";
          ctx.fillText("❄ FROST " + Math.round(state.frostPct) + "%", 174, 150);
        }
        if (state.mode === "defrost") {
          ctx.fillStyle = "#38bdf8";
          for (let d = 0; d < 5; d++) {
            const dy = 208 + ((ts * 0.08 + d * 18) % 62);
            ctx.beginPath(); ctx.arc(170 + d * 24, dy, 3, 0, Math.PI * 2); ctx.fill();
          }
          drawCanvasTag(ctx, 76, 224, "HEATED DRAIN LINE ACTIVE", "#431407", "#fbbf24", "#fb923c");
        }

        // TXV & Sensing Bulb (x: 318, y: 120 & 172)
        drawRoundedRect(ctx, 306, 108, 36, 28, 6);
        ctx.fillStyle = "#fbbf24";
        ctx.fill();
        ctx.fillStyle = "#020617";
        ctx.font = "800 10px sans-serif";
        ctx.fillText("TXV", 314, 126);

        // Sensing bulb on suction line
        drawRoundedRect(ctx, 306, 168, 28, 12, 5);
        ctx.fillStyle = t.superheat < 5 ? "#f87171" : "#34d399";
        ctx.fill();
        drawCanvasTag(ctx, 276, 190, "SH: " + t.superheat.toFixed(1) + "°F", "#0f172a", t.superheat < 5 ? "#f87171" : "#34d399");

        // RIGHT: Outdoor Condensing Unit + LLSV + Sight Glass (x: 422..698, y: 24..346)
        drawRoundedRect(ctx, 422, 24, 276, 322, 12);
        ctx.fillStyle = "#111b2e";
        ctx.fill();
        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = "#f8fafc";
        ctx.font = "800 13px 'Segoe UI', sans-serif";
        ctx.fillText("CONDENSING UNIT & LIQUID LINE", 442, 50);

        // Condenser Coil & Fan
        drawRoundedRect(ctx, 444, 70, 232, 92, 8);
        ctx.fillStyle = "#0b1220";
        ctx.fill();
        ctx.strokeStyle = t.compOn ? "#fb923c" : "#334155";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.save();
        ctx.translate(502, 116);
        ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2);
        ctx.strokeStyle = t.compOn ? "#fb923c" : "#475569"; ctx.stroke();
        ctx.rotate(t.compOn ? ts * 0.009 : 0);
        for (let b = 0; b < 4; b++) {
          const a = (b / 4) * Math.PI * 2;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 24, Math.sin(a) * 24); ctx.stroke();
        }
        ctx.restore();
        drawCanvasTag(ctx, 548, 106, "Head: " + t.targetHead + " psig", "#0f172a", "#fb923c");

        // Compressor
        ctx.beginPath(); ctx.arc(624, 240, 34, 0, Math.PI * 2);
        ctx.fillStyle = "#0b1220"; ctx.fill();
        ctx.strokeStyle = t.compOn ? "#34d399" : "#64748b"; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = "#f8fafc"; ctx.font = "700 10px sans-serif";
        ctx.fillText("COMP", 610, 238);
        ctx.fillStyle = t.compOn ? "#34d399" : "#94a3b8";
        ctx.fillText(t.compOn ? "RUN" : "OFF", 614, 252);

        // Liquid Line Solenoid Valve (LLSV) on Liquid Line (y: 122, x: 422 -> 342)
        ctx.strokeStyle = state.llsvOpen ? "#fb923c" : "#475569";
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(444, 122); ctx.lineTo(342, 122); ctx.stroke();

        // Suction Line (y: 174, x: 274 -> 624 -> comp)
        ctx.strokeStyle = t.compOn ? "#38bdf8" : "#475569";
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(274, 174); ctx.lineTo(590, 174); ctx.lineTo(590, 240); ctx.stroke();

        // LLSV Solenoid Valve Box (x: 410, y: 106)
        drawRoundedRect(ctx, 398, 102, 46, 38, 6);
        ctx.fillStyle = state.llsvOpen ? "#065f46" : "#7f1d1d";
        ctx.fill();
        ctx.strokeStyle = state.llsvOpen ? "#34d399" : "#f87171";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.font = "800 10px sans-serif";
        ctx.fillText("LLSV", 408, 118);
        ctx.fillText(state.llsvOpen ? "OPEN" : "SHUT", 406, 132);

        // Magnified Sight Glass Widget (center: 500, 260)
        drawRoundedRect(ctx, 444, 206, 126, 118, 10);
        ctx.fillStyle = "#07101f";
        ctx.fill();
        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = "#cbd5e1";
        ctx.font = "700 10.5px sans-serif";
        ctx.fillText("SIGHT GLASS", 472, 224);

        ctx.save();
        ctx.beginPath();
        ctx.arc(507, 266, 30, 0, Math.PI * 2);
        ctx.fillStyle = t.sightGlass === "Clear Liquid" ? "#0369a1" : (t.sightGlass.indexOf("Flashing") >= 0 ? "#0f4c75" : "#1e293b");
        ctx.fill();
        ctx.strokeStyle = t.sightGlass === "Clear Liquid" ? "#34d399" : (t.sightGlass.indexOf("Flashing") >= 0 ? "#f87171" : "#fbbf24");
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.clip();
        if (t.sightGlass.indexOf("Flashing") >= 0) {
          ctx.fillStyle = "rgba(224, 242, 254, 0.85)";
          for (let b = 0; b < 9; b++) {
            const bx = 485 + ((b * 13 + ts * 0.04) % 44);
            const by = 292 - ((ts * 0.07 + b * 17) % 52);
            ctx.beginPath(); ctx.arc(bx, by, 3 + (b % 3), 0, Math.PI * 2); ctx.fill();
          }
        }
        ctx.restore();
        ctx.fillStyle = t.sightGlass === "Clear Liquid" ? "#34d399" : (t.sightGlass.indexOf("Flashing") >= 0 ? "#f87171" : "#fbbf24");
        ctx.font = "700 10px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(t.sightGlass, 507, 314);
        ctx.textAlign = "left";

        // Flow arrows along liquid & suction lines
        if (state.llsvOpen && t.compOn) {
          const p = state.flowPhase * 45;
          drawArrow(ctx, 435 - p * 0.8, 122, 390 - p * 0.8, 122, "#fb923c", 6);
        }
        if (t.compOn) {
          const p = state.flowPhase * 90;
          drawArrow(ctx, 350 + p, 174, 385 + p, 174, "#38bdf8", 7);
        }
        drawCanvasTag(ctx, 444, 152, "Suction: " + state.liveSuctionPsig.toFixed(1) + " psig", "#0f172a", "#38bdf8");
      });

      return {
        destroy() {
          disp.destroy(containerEl);
        }
      };
    }
  };

  // =========================================================================
  // ENGINE 4: "sorter_arcade" (60s Tech Triage Conveyor Arcade — ALL Chapters)
  // =========================================================================
  window.TOPIC_ENGINES.sorter_arcade = {
    mount(containerEl, data, playSound, awardXP) {
      const disp = createDisposer();
      const safeData = safeObj(data);
      const chNum = safeData.chapter_num != null ? String(safeData.chapter_num) : "gen";
      const edKey = safeData.edition_key != null && String(safeData.edition_key).trim()
        ? "_" + String(safeData.edition_key).trim()
        : "";
      const storageKey = "tg2_sorter_highscore_ch_" + chNum + edKey;

      const fallbackBins = [
        { id: "high_side", label: "High-Pressure Side", color: "#fb923c", hint: "Discharge, condenser, liquid line" },
        { id: "low_side", label: "Low-Pressure Side", color: "#38bdf8", hint: "Evaporator, suction vapor" },
        { id: "electrical", label: "Controls & Electrical", color: "#fbbf24", hint: "24V relays, sensors, switches" },
        { id: "safety", label: "Safety & Diagnostics", color: "#34d399", hint: "PPE, EPA rules, lockouts" }
      ];
      const fallbackItems = [
        { text: "Compressor Discharge Line", bin_id: "high_side", hint: "High-pressure superheated vapor leaves the compressor toward the condenser." },
        { text: "Evaporator Suction Line", bin_id: "low_side", hint: "Low-pressure cool vapor returns from the evaporator coil to the compressor." },
        { text: "24V Reversing Valve Solenoid", bin_id: "electrical", hint: "O/B thermostat terminals control the 24V solenoid on a heat pump 4-way valve." },
        { text: "Flame Rod (>1.5 μA DC)", bin_id: "electrical", hint: "Flame rectification proves safe gas burner ignition to the furnace control board." },
        { text: "Target 400 CFM/Ton Airflow", bin_id: "safety", hint: "Proper airflow prevents evaporator coil freeze-ups and high static blower damage." },
        { text: "Liquid Line Sight Glass", bin_id: "high_side", hint: "Located on the high-pressure liquid line ahead of the TXV to inspect solid liquid." }
      ];

      const rawBins = Array.isArray(safeData.sorter_bins) && safeData.sorter_bins.length ? safeData.sorter_bins.slice(0, 4) : fallbackBins;
      const palette = ["#38bdf8", "#fbbf24", "#34d399", "#fb923c"];
      const bins = rawBins.map((b, idx) => {
        if (typeof b === "string") {
          return { id: String(idx + 1), label: b, color: palette[idx % palette.length], hint: "" };
        }
        const obj = safeObj(b);
        return {
          id: String(obj.id != null ? obj.id : (obj.bin_id != null ? obj.bin_id : (obj.key != null ? obj.key : idx + 1))),
          label: String(obj.label || obj.name || obj.title || "Category " + (idx + 1)),
          color: String(obj.color || palette[idx % palette.length]),
          hint: String(obj.hint || obj.description || "")
        };
      });

      const validBinIds = new Set(bins.map((b) => b.id));
      const rawItems = Array.isArray(safeData.sorter_items) && safeData.sorter_items.length ? safeData.sorter_items : fallbackItems;
      const masterItems = rawItems
        .map((it) => {
          const obj = safeObj(it);
          const text = String(obj.text || obj.label || obj.prompt || obj.term || "HVAC Component");
          let binId = String(obj.bin_id != null ? obj.bin_id : (obj.bin != null ? obj.bin : (obj.category != null ? obj.category : bins[0].id)));
          if (!validBinIds.has(binId) && bins.length) binId = bins[0].id;
          return {
            text,
            bin_id: binId,
            hint: String(obj.hint || obj.explanation || obj.reason || "")
          };
        });

      function shuffle(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = copy[i];
          copy[i] = copy[j];
          copy[j] = tmp;
        }
        return copy;
      }

      function loadHighScore() {
        try {
          return Math.max(0, Number(window.localStorage.getItem(storageKey)) || 0);
        } catch (_) {
          return 0;
        }
      }
      function saveHighScore(val) {
        try {
          window.localStorage.setItem(storageKey, String(val));
        } catch (_) {}
      }

      const game = {
        timeLeft: 60.0,
        score: 0,
        highScore: loadHighScore(),
        lives: 5,
        streak: 0,
        maxStreak: 0,
        sortedCount: 0,
        attempts: 0,
        beltProgress: 0,
        beltOffsetPx: 0,
        paused: false,
        finished: false,
        roundXpGiven: false,
        deck: shuffle(masterItems),
        deckPos: 0,
        lastCardDuration: 9.5
      };

      function getCurrentCard() {
        if (!game.deck.length) game.deck = shuffle(masterItems);
        if (game.deckPos >= game.deck.length) {
          game.deck = shuffle(masterItems);
          game.deckPos = 0;
        }
        return game.deck[game.deckPos];
      }

      function getMultiplier(streak) {
        if (streak >= 10) return 4;
        if (streak >= 6) return 3;
        if (streak >= 3) return 2;
        return 1;
      }

      containerEl.innerHTML = [
        '<div class="tg2-shell">',
        '  <div class="tg2-head">',
        '    <div class="tg2-title-wrap">',
        '      <span class="tg2-kicker">60-Second Speed Triage Arcade</span>',
        '      <h3 class="tg2-title">⚡ Tech Triage Conveyor Sorter</h3>',
        '      <p class="tg2-subtitle">Click a bin or press keys <strong>1–' + bins.length + '</strong> before the part falls off the conveyor belt!</p>',
        '    </div>',
        '    <div class="tg2-status-strip">',
        '      <button type="button" class="tg2-btn" data-sact="pause">⏸ Pause</button>',
        '      <button type="button" class="tg2-btn is-gold" data-sact="restart">↻ Restart 60s</button>',
        '    </div>',
        '  </div>',
        '  <div class="tg2-sorter-hud" data-el="hud"></div>',
        '  <div class="tg2-sorter-stage">',
        '    <canvas class="tg2-belt-canvas" data-el="beltCanvas"></canvas>',
        '    <div class="tg2-sorter-overlay" data-el="overlay" style="display:none"></div>',
        '  </div>',
        '  <div class="tg2-sorter-incoming" data-el="incomingItem" aria-live="polite"></div>',
        '  <div class="tg2-sorter-feedback" data-el="feedback">Sort the active conveyor card into the matching category bin!</div>',
        '  <div class="tg2-bins-grid" data-el="binsGrid">' +
          bins.map((b, idx) => [
            '<button type="button" class="tg2-bin-btn" data-bin-idx="' + idx + '" data-bin-id="' + escapeHtml(b.id) + '" style="border-top: 4px solid ' + escapeHtml(b.color) + '">',
            '  <div class="tg2-bin-top"><span class="tg2-keycap">' + (idx + 1) + '</span><span style="font-size:11px;color:#94a3b8;font-weight:700">Key ' + (idx + 1) + '</span></div>',
            '  <div class="tg2-bin-label">' + escapeHtml(b.label) + '</div>',
            (b.hint ? '  <div class="tg2-bin-sub">' + escapeHtml(b.hint) + '</div>' : ''),
            '</button>'
          ].join("")).join("") +
        '  </div>',
        '</div>'
      ].join("\n");

      const q = (sel) => containerEl.querySelector('[data-el="' + sel + '"]');
      const hudEl = q("hud");
      const beltCanvas = q("beltCanvas");
      const W = 720;
      const H = 190;
      const ctx = setupHiDPICanvas(beltCanvas, W, H);
      const overlayEl = q("overlay");
      const incomingEl = q("incomingItem");
      const feedbackEl = q("feedback");
      const pauseBtn = containerEl.querySelector('[data-sact="pause"]');

      function renderIncomingCard() {
        if (!incomingEl) return;
        const card = getCurrentCard();
        const txt = card ? String(card.text || "") : "";
        incomingEl.innerHTML =
          '<span class="tg2-incoming-k">Active Conveyor Clue</span>' +
          '<span class="tg2-incoming-v">' + escapeHtml(txt) + '</span>';
      }

      function renderHUD() {
        const mult = getMultiplier(game.streak);
        const hearts = "❤️".repeat(Math.max(0, game.lives)) + "🖤".repeat(Math.max(0, 5 - game.lives));
        const timeCls = game.timeLeft <= 10 ? "is-red" : "is-blue";
        hudEl.innerHTML = [
          '<div class="tg2-hud-stat"><span class="tg2-hud-k">Shift Timer</span><span class="tg2-hud-v ' + timeCls + '">' + Math.max(0, game.timeLeft).toFixed(1) + 's</span></div>',
          '<div class="tg2-hud-stat"><span class="tg2-hud-k">Score</span><span class="tg2-hud-v is-gold">' + game.score + '</span></div>',
          '<div class="tg2-hud-stat"><span class="tg2-hud-k">Combo</span><span class="tg2-hud-v is-green">x' + mult + ' (' + game.streak + ')</span></div>',
          '<div class="tg2-hud-stat"><span class="tg2-hud-k">Lives (5)</span><span class="tg2-hud-v" style="font-size:15px">' + hearts + '</span></div>',
          '<div class="tg2-hud-stat"><span class="tg2-hud-k">Best Score</span><span class="tg2-hud-v">' + game.highScore + '</span></div>'
        ].join("");
        if (pauseBtn) pauseBtn.textContent = game.paused ? "▶ Resume" : "⏸ Pause";
        renderIncomingCard();
      }

      function flashBin(binIdx, ok) {
        const btn = containerEl.querySelector('[data-bin-idx="' + binIdx + '"]');
        if (!btn) return;
        const cls = ok ? "is-flash-ok" : "is-flash-bad";
        btn.classList.remove("is-flash-ok", "is-flash-bad");
        btn.classList.add(cls);
        disp.timeout(() => btn.classList.remove(cls), 280);
      }

      function finishRound(reasonText) {
        if (game.finished) return;
        game.finished = true;
        const isRecord = game.score > game.highScore;
        if (isRecord) {
          game.highScore = game.score;
          saveHighScore(game.highScore);
        }
        if (!game.roundXpGiven && game.score > 0) {
          game.roundXpGiven = true;
          const xpReward = clamp(Math.round(game.score / 75) + 10, 10, 60);
          safeXP(awardXP, xpReward, "Tech Triage Conveyor Shift");
        }
        safePlay(playSound, "fanfare");
        renderHUD();

        const acc = game.attempts ? Math.round((game.sortedCount / game.attempts) * 100) : 0;
        overlayEl.style.display = "flex";
        overlayEl.innerHTML = [
          '<h4 class="tg2-overlay-title">' + escapeHtml(reasonText) + (isRecord ? " — 🏆 NEW HIGH SCORE!" : "") + '</h4>',
          '<div class="tg2-overlay-stats">',
          '  <span>Score: <strong>' + game.score + '</strong></span>',
          '  <span>Best: <strong>' + game.highScore + '</strong></span>',
          '  <span>Sorted: <strong>' + game.sortedCount + '</strong></span>',
          '  <span>Accuracy: <strong>' + acc + '%</strong></span>',
          '  <span>Max Streak: <strong>' + game.maxStreak + '</strong></span>',
          '</div>',
          '<button type="button" class="tg2-btn is-primary" data-sact="restart">⚡ Play Another 60s Shift</button>'
        ].join("");
      }

      function advanceCard() {
        game.deckPos += 1;
        game.beltProgress = 0;
        renderIncomingCard();
      }

      function handleSort(binIdx, isBeltDrop) {
        if (game.finished || game.paused) return;
        const card = getCurrentCard();
        game.attempts += 1;

        if (!isBeltDrop && binIdx >= 0 && binIdx < bins.length) {
          const chosen = bins[binIdx];
          if (chosen.id === card.bin_id) {
            game.streak += 1;
            if (game.streak > game.maxStreak) game.maxStreak = game.streak;
            const mult = getMultiplier(game.streak);
            const speedBonus = game.beltProgress < 0.5 ? 25 : 0;
            const pts = 100 * mult + speedBonus;
            game.score += pts;
            game.sortedCount += 1;
            if (game.score > game.highScore) {
              game.highScore = game.score;
              saveHighScore(game.highScore);
            }

            // Award streak milestone Shop Bolts
            if (game.streak === 5 || game.streak === 10 || game.streak === 15) {
              safeXP(awardXP, game.streak * 2, game.streak + "-Card Conveyor Streak!");
            }

            safePlay(playSound, "correct");
            flashBin(binIdx, true);
            feedbackEl.className = "tg2-sorter-feedback is-good";
            feedbackEl.innerHTML = '<span>✅ Sorted into <strong>' + escapeHtml(chosen.label) + '</strong>! +' + pts + ' pts (Combo x' + mult + ')</span>' + (card.hint ? '<span>' + escapeHtml(card.hint) + '</span>' : '');
            advanceCard();
            renderHUD();
            return;
          }
        }

        // Wrong bin or dropped off belt
        game.lives -= 1;
        game.streak = 0;
        safePlay(playSound, "wrong");
        if (!isBeltDrop) flashBin(binIdx, false);
        const correctBin = bins.find((b) => b.id === card.bin_id);
        const correctName = correctBin ? correctBin.label : card.bin_id;

        feedbackEl.className = "tg2-sorter-feedback is-bad";
        feedbackEl.innerHTML = '<span>❌ ' + (isBeltDrop ? 'Card fell off belt!' : 'Wrong bin!') + ' Correct: <strong>' + escapeHtml(correctName) + '</strong></span>' + (card.hint ? '<span>💡 ' + escapeHtml(card.hint) + '</span>' : '');
        advanceCard();
        renderHUD();

        if (game.lives <= 0) {
          finishRound("Shift Ended — Out of Lives!");
        }
      }

      function restartGame() {
        game.timeLeft = 60.0;
        game.score = 0;
        game.lives = 5;
        game.streak = 0;
        game.maxStreak = 0;
        game.sortedCount = 0;
        game.attempts = 0;
        game.beltProgress = 0;
        game.paused = false;
        game.finished = false;
        game.roundXpGiven = false;
        game.deck = shuffle(masterItems);
        game.deckPos = 0;
        overlayEl.style.display = "none";
        feedbackEl.className = "tg2-sorter-feedback";
        feedbackEl.textContent = "New 60s shift started — sort fast with clicks or keys 1–" + bins.length + "!";
        safePlay(playSound, "click");
        renderHUD();
        renderIncomingCard();
      }

      disp.on(containerEl, "click", (e) => {
        const binBtn = e.target.closest("[data-bin-idx]");
        if (binBtn) {
          handleSort(Number(binBtn.getAttribute("data-bin-idx")), false);
          return;
        }
        const actBtn = e.target.closest("[data-sact]");
        if (!actBtn) return;
        const sact = actBtn.getAttribute("data-sact");
        if (sact === "restart") {
          restartGame();
        } else if (sact === "pause" && !game.finished) {
          game.paused = !game.paused;
          safePlay(playSound, "click");
          renderHUD();
        }
      });

      // Keyboard shortcuts 1-4 ONLY while Sorter is mounted and visible on screen
      disp.on(window, "keydown", (e) => {
        if (disp.destroyed || game.finished || game.paused) return;
        if (!isElementVisible(containerEl)) return;
        const tgt = e.target || document.activeElement;
        const tgtTag = tgt && tgt.tagName ? String(tgt.tagName).toUpperCase() : "";
        const activeTag = document.activeElement && document.activeElement.tagName
          ? String(document.activeElement.tagName).toUpperCase()
          : "";
        if (
          tgtTag === "INPUT" || tgtTag === "TEXTAREA" || tgtTag === "SELECT" ||
          activeTag === "INPUT" || activeTag === "TEXTAREA" || activeTag === "SELECT" ||
          (tgt && tgt.isContentEditable) ||
          (document.activeElement && document.activeElement.isContentEditable)
        ) {
          return;
        }
        if (e.ctrlKey || e.metaKey || e.altKey) return;

        if (/^[1-4]$/.test(String(e.key || ""))) {
          const num = Number(e.key);
          if (num >= 1 && num <= bins.length) {
            e.preventDefault();
            handleSort(num - 1, false);
          }
        }
      });

      renderHUD();

      // Canvas Conveyor Belt + 60s Timer Loop
      let lastTs = 0;
      let hudTick = 0;
      disp.raf((ts) => {
        if (!ctx) return;
        const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
        lastTs = ts;

        if (!game.paused && !game.finished) {
          game.timeLeft = Math.max(0, game.timeLeft - dt);
          const speedBoost = 1 + Math.min(0.45, game.sortedCount * 0.025);
          game.beltProgress += (dt * speedBoost) / game.lastCardDuration;
          game.beltOffsetPx = (game.beltOffsetPx + dt * 95 * speedBoost) % 36;

          hudTick += dt;
          if (hudTick >= 0.1) {
            hudTick = 0;
            renderHUD();
          }

          if (game.timeLeft <= 0) {
            finishRound("⏰ 60s Shift Complete!");
          } else if (game.beltProgress >= 1) {
            handleSort(-1, true);
          }
        }

        // Draw Conveyor Belt Track
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "#060b16";
        ctx.fillRect(0, 0, W, H);

        // Conveyor deck
        drawRoundedRect(ctx, 20, 144, W - 40, 34, 17);
        ctx.fillStyle = "#1e293b";
        ctx.fill();
        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Moving belt chevrons
        ctx.save();
        ctx.beginPath();
        drawRoundedRect(ctx, 24, 146, W - 48, 30, 15);
        ctx.clip();
        ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
        ctx.lineWidth = 2.5;
        for (let cx = -36 + game.beltOffsetPx; cx < W + 36; cx += 36) {
          ctx.beginPath();
          ctx.moveTo(cx, 148);
          ctx.lineTo(cx + 10, 158);
          ctx.lineTo(cx, 168);
          ctx.stroke();
        }
        ctx.restore();

        // End-of-belt Drop Zone indicator
        ctx.fillStyle = game.beltProgress > 0.78 ? "rgba(248, 113, 113, 0.25)" : "rgba(251, 191, 36, 0.12)";
        drawRoundedRect(ctx, W - 78, 12, 58, 124, 8);
        ctx.fill();
        ctx.fillStyle = game.beltProgress > 0.78 ? "#f87171" : "#94a3b8";
        ctx.font = "700 10px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("DROP", W - 49, 68);
        ctx.fillText("ZONE", W - 49, 82);
        ctx.textAlign = "left";

        // Belt rollers
        for (let rx = 44; rx <= W - 44; rx += 72) {
          ctx.beginPath();
          ctx.arc(rx, 161, 9, 0, Math.PI * 2);
          ctx.fillStyle = "#0f172a";
          ctx.fill();
          ctx.strokeStyle = "#64748b";
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        // Active Moving Card on Belt
        const card = getCurrentCard();
        const cardW = 360;
        const cardH = 120;
        const cardX = 24 + game.beltProgress * (W - cardW - 106);
        const cardY = 14;

        drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 12);
        ctx.fillStyle = game.beltProgress > 0.78 ? "#3f1d28" : "#1e293b";
        ctx.fill();
        ctx.strokeStyle = game.beltProgress > 0.78 ? "#f87171" : "#38bdf8";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Card urgency bar
        const remainRatio = clamp(1 - game.beltProgress, 0, 1);
        drawRoundedRect(ctx, cardX + 12, cardY + cardH - 11, (cardW - 24) * remainRatio, 5, 3);
        ctx.fillStyle = remainRatio < 0.25 ? "#f87171" : "#34d399";
        ctx.fill();

        // Card Label Text (wrapped dynamically with 14px / 12.5px / 11.5px font sizing up to 4 lines)
        ctx.fillStyle = "#94a3b8";
        ctx.font = "700 10px monospace";
        ctx.fillText("INCOMING TRIAGE ITEM", cardX + 14, cardY + 18);

        function wrapSorterLines(text, maxW, fontSpec) {
          ctx.font = fontSpec;
          const words = String(text || "").split(/\s+/).filter(Boolean);
          const out = [];
          let cur = "";
          for (let i = 0; i < words.length; i++) {
            const test = cur ? cur + " " + words[i] : words[i];
            if (ctx.measureText(test).width > maxW && cur) {
              out.push(cur);
              cur = words[i];
            } else {
              cur = test;
            }
          }
          if (cur) out.push(cur);
          return out;
        }

        const maxTextW = cardW - 28;
        const tierConfigs = [
          { maxLines: 2, font: "700 14px 'Segoe UI', sans-serif", lineH: 19, startY: cardY + 41 },
          { maxLines: 3, font: "700 12.5px 'Segoe UI', sans-serif", lineH: 17, startY: cardY + 38 },
          { maxLines: 4, font: "700 11.5px 'Segoe UI', sans-serif", lineH: 15, startY: cardY + 36 }
        ];
        let chosenTier = tierConfigs[tierConfigs.length - 1];
        let lines = [];
        for (let t = 0; t < tierConfigs.length; t++) {
          chosenTier = tierConfigs[t];
          lines = wrapSorterLines(card.text, maxTextW, chosenTier.font);
          if (lines.length <= chosenTier.maxLines) break;
        }
        ctx.fillStyle = "#ffffff";
        ctx.font = chosenTier.font;
        for (let l = 0; l < Math.min(4, lines.length); l++) {
          ctx.fillText(lines[l], cardX + 14, chosenTier.startY + l * chosenTier.lineH);
        }

        if (game.paused && !game.finished) {
          ctx.fillStyle = "rgba(6, 11, 22, 0.78)";
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = "#fbbf24";
          ctx.font = "800 22px 'Segoe UI', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("⏸ SHIFT PAUSED", W / 2, H / 2);
          ctx.textAlign = "left";
        }
      });

      return {
        destroy() {
          disp.destroy(containerEl);
        }
      };
    }
  };

  // =========================================================================
  // TOP-LEVEL COORDINATOR: window.initTopicGame
  // =========================================================================
  function inferFallbackEngineId(chapterData) {
    const ch = Number(chapterData && chapterData.chapter_num);
    if ([24, 28, 29, 30, 31, 32, 40].indexOf(ch) >= 0) return "airflow_duct";
    if ([20, 21, 22, 23, 25, 27, 33, 34, 35, 36, 37, 38, 39].indexOf(ch) >= 0) return "heating_sequence";
    if ((ch >= 41 && ch <= 50) || ch === 52) return "commercial_walkin";
    return "";
  }

  window.initTopicGame = function (mountEl, chapterData, playSound, awardXP) {
    if (!mountEl) return { destroy() {} };

    // Clean up any prior mount on the same container to prevent leaked listeners/timers
    if (typeof mountEl._tg2Destroy === "function") {
      try { mountEl._tg2Destroy(); } catch (_) {}
    }

    const safeData = safeObj(chapterData);
    let activeCtrl = null;
    let currentMode = null;
    let tornDown = false;

    mountEl.innerHTML = [
      '<div class="tg2-root">',
      '  <div class="tg2-switcher" role="tablist" aria-label="Interactive Chapter Game Mode">',
      '    <button type="button" class="tg2-switch-btn is-active" data-tg2-mode="sim">🛠️ Interactive Chapter Lab Simulator</button>',
      '    <button type="button" class="tg2-switch-btn" data-tg2-mode="sorter">⚡ 60s Tech Triage Conveyor Arcade</button>',
      '  </div>',
      '  <div class="tg2-stage" data-tg2-stage></div>',
      '</div>'
    ].join("\n");

    const stageEl = mountEl.querySelector("[data-tg2-stage]");
    const switchBtns = mountEl.querySelectorAll("[data-tg2-mode]");

    function destroyActive() {
      if (activeCtrl && typeof activeCtrl.destroy === "function") {
        try { activeCtrl.destroy(); } catch (_) {}
      }
      activeCtrl = null;
      if (stageEl) stageEl.innerHTML = "";
    }

    function mountMode(mode) {
      if (tornDown) return;
      destroyActive();
      currentMode = mode;

      switchBtns.forEach((btn) => {
        btn.classList.toggle("is-active", btn.getAttribute("data-tg2-mode") === mode);
      });

      if (mode === "sorter") {
        const sorterEngine = window.TOPIC_ENGINES && window.TOPIC_ENGINES.sorter_arcade;
        if (sorterEngine && typeof sorterEngine.mount === "function") {
          activeCtrl = sorterEngine.mount(stageEl, safeData, playSound, awardXP);
        }
        return;
      }

      const rawRequestedId = safeData.engine_id || safeData.topic_engine || safeData.game_engine || "";
      const requestedId = rawRequestedId ? String(rawRequestedId) : "";
      let simEngine = requestedId && window.TOPIC_ENGINES ? window.TOPIC_ENGINES[requestedId] : null;
      if (!simEngine) {
        const fallbackId = inferFallbackEngineId(safeData);
        if (fallbackId && window.TOPIC_ENGINES) simEngine = window.TOPIC_ENGINES[fallbackId];
      }

      if (simEngine && (typeof simEngine.mount === "function" || typeof simEngine.init === "function" || typeof simEngine === "function")) {
        const rawCtrl = typeof simEngine.mount === "function"
          ? simEngine.mount(stageEl, safeData, playSound, awardXP)
          : (typeof simEngine.init === "function"
            ? simEngine.init(stageEl, safeData, playSound, awardXP)
            : simEngine(stageEl, safeData, playSound, awardXP));
        activeCtrl = rawCtrl && typeof rawCtrl.destroy === "function"
          ? rawCtrl
          : { destroy: function () {} };
      } else {
        stageEl.innerHTML = [
          '<div class="tg2-shell">',
          '  <div class="tg2-alert-bar is-warn">',
          '    ⚠️ Lab Simulator engine "' + escapeHtml(requestedId || "unassigned") + '" is not registered yet. Switch to <strong>⚡ 60s Tech Triage Conveyor Arcade</strong> above!',
          '  </div>',
          '</div>'
        ].join("\n");
      }
    }

    function onSwitchClick(e) {
      const btn = e.target.closest("[data-tg2-mode]");
      if (!btn) return;
      const mode = btn.getAttribute("data-tg2-mode");
      if (!mode || mode === currentMode) return;
      safePlay(playSound, "click");
      mountMode(mode);
    }

    const switcherEl = mountEl.querySelector(".tg2-switcher");
    if (switcherEl) switcherEl.addEventListener("click", onSwitchClick);

    // Default to Interactive Chapter Lab Simulator on open
    mountMode("sim");

    function destroy() {
      if (tornDown) return;
      tornDown = true;
      if (switcherEl) switcherEl.removeEventListener("click", onSwitchClick);
      destroyActive();
      if (mountEl._tg2Destroy === destroy) delete mountEl._tg2Destroy;
      mountEl.innerHTML = "";
    }

    mountEl._tg2Destroy = destroy;
    return { destroy };
  };
})();

  // === PATH & GRID GEOMETRY ===
  function computePathData(waypoints) {
    const cellSet = Object.create(null);
    const points = [];
    const segLengths = [];
    let totalLength = 0;

    for (let i = 0; i < waypoints.length; i++) {
      const col = waypoints[i][0];
      const row = waypoints[i][1];
      cellSet[col + "," + row] = true;
      const pt = { x: col * CELL_SIZE + CELL_SIZE / 2, y: row * CELL_SIZE + CELL_SIZE / 2 };
      points.push(pt);
      if (i > 0) {
        const prevCol = waypoints[i - 1][0];
        const prevRow = waypoints[i - 1][1];
        const dc = col === prevCol ? 0 : (col > prevCol ? 1 : -1);
        const dr = row === prevRow ? 0 : (row > prevRow ? 1 : -1);
        let c = prevCol;
        let r = prevRow;
        while (c !== col || r !== row) {
          c += dc;
          r += dr;
          cellSet[c + "," + r] = true;
        }
        const prevPt = points[i - 1];
        const len = Math.hypot(pt.x - prevPt.x, pt.y - prevPt.y);
        segLengths.push(len);
        totalLength += len;
      }
    }

    return {
      waypoints: waypoints,
      cellSet: cellSet,
      points: points,
      segLengths: segLengths,
      totalLength: totalLength

  function replenishQueue(seedQuestions) {
    let pool = getFilteredPool(tdState.sectionFilter);

      tdState.queue = shuffleArray(seedQuestions).concat(shuffleArray(rest));
      tdState.qCursor = 0;
      return;
    }

    let nextBatch = shuffleArray(pool);
    if (nextBatch.length > 1 && tdState.lastQuestionId && nextBatch[0].id === tdState.lastQuestionId) {
      const swap = nextBatch[0];
      nextBatch[0] = nextBatch[nextBatch.length - 1];
      nextBatch[nextBatch.length - 1] = swap;

    tdState.queue = nextBatch;
    tdState.qCursor = 0;
  }

  function drawNextQuestion() {
    if (!tdState.queue || tdState.qCursor >= tdState.queue.length) {

  function startOperation(retryMissedOnly) {

  function startQuizBatch(batchMode, totalCount) {
    stop();
    tdState.phase = "quiz";
    tdState.batchMode = batchMode;

    tdState.batchTotal = totalCount;

  }

  function prepareQuizQuestion() {
    stopQuizTimer();
    const q = drawNextQuestion();
    if (!q) {
      enterTacticalPhase();
      return;
    }

    const choices = Array.isArray(q.choices) ? q.choices : [];
    const safeCorrectIdx = (typeof q.correctIndex === "number" && q.correctIndex >= 0 && q.correctIndex < choices.length)
      ? q.correctIndex
      : 0;
    const indexed = choices.map(function (c, i) {
      return { text: c, isCorrect: i === safeCorrectIdx };

    tdState.currentQ = q;
    tdState.displayedChoices = shuffleArray(indexed);
    tdState.answered = false;
    tdState.selectedDisplayIdx = -1;
    tdState.lastQuizCredits = 0;

  function startQuizInterval() {
    stopQuizTimer();
    if (tdState.phase !== "quiz" || tdState.answered) return;
    quizTimerId = window.setInterval(function () {
