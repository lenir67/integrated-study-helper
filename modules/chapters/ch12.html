        ctx.fillStyle = "#bae6fd";
        ctx.font = "800 12px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("EVAPORATOR", 135, 126);
        ctx.font = "700 11px system-ui, sans-serif";
        ctx.fillStyle = icyGlow ? "#67e8f9" : "#94a3b8";
        ctx.fillText(icyGlow ? "FROST RISK (<32°F)" : "Absorbs Indoor Heat", 135, 232);

        // Component: CONDENSER (Right)
        drawRoundedBox(ctx, 566, 108, 158, 132, 10, "#241215", "#f97316", 2);
        for (let r = 0; r < 4; r++) {
          ctx.strokeStyle = r < 2 ? "#ef4444" : "#f59e0b";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(584, 134 + r * 24);
          ctx.lineTo(706, 134 + r * 24);
          ctx.stroke();
        }
        // Heat rejection waves
        for (let w = 0; w < 3; w++) {
          const wx = 728 + ((t * 24 + w * 10) % 24);
          ctx.strokeStyle = "rgba(249,115,22,0.75)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(wx, 140 + w * 26);
          ctx.lineTo(wx + 8, 132 + w * 26);
          ctx.stroke();
        }
        ctx.fillStyle = "#fed7aa";
        ctx.font = "800 12px system-ui, sans-serif";
        ctx.fillText("CONDENSER", 645, 126);
        ctx.font = "700 11px system-ui, sans-serif";
        ctx.fillStyle = "#fdba74";
        ctx.fillText("Amb: " + state.ambientF + "°F -> Rejects Heat", 645, 232);

        // Component: TXV Metering Device + Sight Glass (Top)
        drawRoundedBox(ctx, 355, 48, 70, 40, 8, "#1e293b", "#fbbf24", 2);
        ctx.fillStyle = "#fef3c7";
        ctx.font = "800 11px system-ui, sans-serif";
        ctx.fillText("TXV", 390, 66);
        ctx.font = "700 9px monospace";
        ctx.fillText(state.chargePct + "%", 390, 80);

        // Sight glass on liquid line
        ctx.beginPath();
        ctx.arc(510, 68, 13, 0, Math.PI * 2);
        ctx.fillStyle = c.subcooling < 4 ? "#451a03" : "#14532d";
        ctx.fill();
        ctx.strokeStyle = c.subcooling < 4 ? "#f97316" : "#22c55e";
        ctx.lineWidth = 2;
        ctx.stroke();
        if (c.subcooling < 4) {
          // Flashing vapor bubbles
          for (let b = 0; b < 3; b++) {
            ctx.beginPath();
            ctx.arc(505 + b * 5, 68 + Math.sin(t * 14 + b) * 4, 2.2, 0, Math.PI * 2);
            ctx.fillStyle = "#fde68a";
            ctx.fill();
          }
        }
        ctx.fillStyle = "#94a3b8";
        ctx.font = "700 10px system-ui, sans-serif";
        ctx.fillText(c.subcooling < 4 ? "FLASHING!" : "CLEAR SIGHT", 510, 48);

        // Component: COMPRESSOR (Bottom Center)
        const pulse = Math.sin(t * 18) * 1.5;
        drawRoundedBox(ctx, 344, 304 + pulse * 0.4, 92, 68, 16, "#1e293b", c.superheat < 5 ? "#ef4444" : "#94a3b8", 2.5);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "800 12px system-ui, sans-serif";
        ctx.fillText("COMPRESSOR", 390, 334);
        ctx.font = "700 10px monospace";
        ctx.fillStyle = c.superheat < 5 ? "#f87171" : "#38bdf8";
        ctx.fillText("CR " + c.cr.toFixed(1) + ":1", 390, 353);

        // CENTER DIGITAL MANIFOLD GAUGE SET
        drawRoundedBox(ctx, 250, 114, 280, 152, 12, "#111b2e", "#334155", 2);
        ctx.fillStyle = "#fbbf24";
        ctx.font = "800 11px system-ui, sans-serif";
        ctx.fillText("DIGITAL MANIFOLD (" + state.refrigerant + ")", 390, 134);

        // Low Gauge Circle
        ctx.beginPath();
        ctx.arc(315, 188, 42, 0, Math.PI * 2);
        ctx.fillStyle = "#082f49";
        ctx.fill();
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 3;
        ctx.stroke();
        const lowGaugeText = c.lowPsig < -0.5
          ? (Math.abs(c.lowPsig * 2.036).toFixed(1) + '"')
          : (Math.round(c.lowPsig) + "");
        ctx.fillStyle = "#e0f2fe";
        ctx.font = "800 16px monospace";
        ctx.fillText(lowGaugeText, 315, 186);
        ctx.font = "700 10px system-ui, sans-serif";
        ctx.fillStyle = "#7dd3fc";
        ctx.fillText(c.lowPsig < -0.5 ? 'LOW Hg VAC' : "LOW PSIG", 315, 202);
        ctx.fillText("SH: " + c.superheat.toFixed(1) + "°F", 315, 217);

        // High Gauge Circle
        ctx.beginPath();
        ctx.arc(465, 188, 42, 0, Math.PI * 2);
        ctx.fillStyle = "#450a0a";
        ctx.fill();
        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = "#fee2e2";
        ctx.font = "800 16px monospace";
        ctx.fillText(Math.round(c.highPsig) + "", 465, 186);
        ctx.font = "700 10px system-ui, sans-serif";
        ctx.fillStyle = "#fca5a5";
        ctx.fillText("HIGH PSIG", 465, 202);
        ctx.fillText("SC: " + c.subcooling.toFixed(1) + "°F", 465, 217);

        // Micron + Recovery mini status bars inside center panel
        ctx.fillStyle = state.microns <= 500 ? "#4ade80" : "#fbbf24";
        ctx.font = "700 11px monospace";
        ctx.fillText("VAC: " + Math.round(state.microns) + " μm  |  REC: " + state.recoveryPct + "%", 390, 253);

        // Side Recovery Tank Bar (bottom-right corner)
        drawRoundedBox(ctx, 646, 294, 102, 104, 8, "#111b2e", state.recoveryPct > 80 ? "#ef4444" : "#475569", 1.8);
        ctx.fillStyle = "#cbd5e1";
        ctx.font = "700 10px system-ui, sans-serif";
        ctx.fillText("DOT TANK", 697, 310);
        const fillH = Math.round((state.recoveryPct / 100) * 62);
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(666, 318, 62, 62);
        ctx.fillStyle = state.recoveryPct > 80 ? "#ef4444" : (state.recoveryPct >= 70 ? "#f59e0b" : "#22c55e");
        ctx.fillRect(666, 380 - fillH, 62, fillH);
        // 80% max line
        ctx.strokeStyle = "#fbbf24";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(662, 330);
        ctx.lineTo(732, 330);
        ctx.stroke();
        ctx.fillStyle = "#f8fafc";
        ctx.font = "800 11px monospace";
        ctx.fillText(state.recoveryPct + "% (80% Max)", 697, 392);
      }

      createMissionController({
        missions: missions,
        elements: {
          box: missionBox,
          xpEl: rootEl.querySelector('[data-tg1-stat="xp"]'),
          accEl: rootEl.querySelector('[data-tg1-stat="acc"]'),
          streakEl: rootEl.querySelector('[data-tg1-stat="streak"]')
        },
        playSound: safePlay,
        awardXP: safeAward,
        onLoadMission(m) {
          const p = m.params || {};
          state.refrigerant = p.refrigerant || "R-410A";
          if (refrigSel) refrigSel.value = state.refrigerant;
          state.chargePct = p.charge_pct != null ? Number(p.charge_pct) : (p.txv_pct != null ? Number(p.txv_pct) : 100);
          state.ambientF = p.ambient_f != null ? Number(p.ambient_f) : (p.ambient != null ? Number(p.ambient) : 95);
          state.evapSatF = p.evap_sat_f != null ? Number(p.evap_sat_f) : (p.evap_sat != null ? Number(p.evap_sat) : (p.sat_evap_f != null ? Number(p.sat_evap_f) : 40));
          state.suctionF = p.suction_f != null ? Number(p.suction_f) : (p.suction_temp != null ? Number(p.suction_temp) : 52);
          state.condSatF = p.cond_sat_f != null ? Number(p.cond_sat_f) : (p.cond_sat != null ? Number(p.cond_sat) : (p.sat_cond_f != null ? Number(p.sat_cond_f) : 115));
          state.liquidF = p.liquid_f != null ? Number(p.liquid_f) : (p.liquid_temp != null ? Number(p.liquid_temp) : 103);
          state.recoveryPct = p.recovery_pct != null ? Number(p.recovery_pct) : (p.recovery_fill != null ? Number(p.recovery_fill) : 45);
          state.microns = p.microns != null ? Number(p.microns) : (p.vacuum_microns != null ? Number(p.vacuum_microns) : (p.low_psig != null && Number(p.low_psig) < 0 ? 1200 : 420));
          state.pullingVac = false;
          if (vacBtn) vacBtn.textContent = "Pull Deep Vacuum";
          renderSliders();
          updateTelemetry();
        },
        onVerifyBench(m) {
          const p = m.params || {};
          const c = computeCycle();
          const goal = (p.bench_goal_text || "").toLowerCase();
          if (p.target_max_microns != null || goal.indexOf("micron") >= 0) {
            const maxMic = p.target_max_microns != null ? Number(p.target_max_microns) : 500;
            if (state.microns > maxMic) {
              return { ok: false, message: "Micron gauge is still at " + Math.round(state.microns) + " μm. Evacuate below " + maxMic + " μm!" };
            }
            return { ok: true, message: m.coachTip };
          }
          if (p.target_subcool_min != null || goal.indexOf("subcooling") >= 0) {
            const lo = p.target_subcool_min != null ? Number(p.target_subcool_min) : 10;
            const hi = p.target_subcool_max != null ? Number(p.target_subcool_max) : 14;
            if (c.subcooling < lo || c.subcooling > hi) {
              return { ok: false, message: "Current Subcooling is " + c.subcooling.toFixed(1) + "°F. Tune Liquid Line Temp so SC = " + lo + "–" + hi + "°F!" };
            }
            return { ok: true, message: m.coachTip };
          }
          if (p.target_superheat_min != null || goal.indexOf("superheat") >= 0) {
            const lo = p.target_superheat_min != null ? Number(p.target_superheat_min) : 8;
            const hi = p.target_superheat_max != null ? Number(p.target_superheat_max) : 14;
            if (c.superheat < lo || c.superheat > hi) {
              return { ok: false, message: "Current Superheat is " + c.superheat.toFixed(1) + "°F. Tune Suction Line Temp so SH = " + lo + "–" + hi + "°F!" };
            }
            return { ok: true, message: m.coachTip };
          }
          if (state.recoveryPct > 80) {
            return { ok: false, spark: true, message: "Recovery Tank exceeds 80% maximum safe fill!" };
          }
          return { ok: true, message: m.coachTip };
        }
      });

      renderSliders();
      updateTelemetry();

      let lastTs = 0;
      function tick(ts) {
        if (state.destroyed) return;
        const dt = lastTs ? Math.min((ts - lastTs) * 0.001, 0.1) : 0.016;
        lastTs = ts;
        state.time = ts * 0.001;

        if (state.pullingVac && state.microns > 290) {
          state.microns = Math.max(290, state.microns - dt * 780);
          const vacInp = slidersEl && slidersEl.querySelector('[data-tg1-skey="microns"]');
          const vacLbl = slidersEl && slidersEl.querySelector('[data-tg1-sval="microns"]');
          if (vacInp) vacInp.value = Math.round(state.microns);
          if (vacLbl) vacLbl.textContent = Math.round(state.microns) + " μm";
          if (state.microns <= 290) {
            state.pullingVac = false;
            if (vacBtn) vacBtn.textContent = "Deep Vacuum (<300 μm) ✓";
            safePlay("correct");
          }
          updateTelemetry();
        }

        const ctx = canvasCtrl.beginFrame();
        if (ctx) drawLoopCanvas(ctx, state.time);
        state.rafId = requestAnimationFrame(tick);
      }

      state.rafId = requestAnimationFrame(tick);

      return {
        destroy() {
          state.destroyed = true;
          if (state.rafId) cancelAnimationFrame(state.rafId);
          canvasCtrl.destroy();
          containerEl.innerHTML = "";
        }
      };
    },
    init(containerEl, data, playSound, awardXP) {
      return this.mount(containerEl, data, playSound, awardXP);
    }
  };

      const probeRow = rootEl.querySelector('[data-tg1-role="probe-row"]');
      const missionBox = rootEl.querySelector('[data-tg1-role="mission-box"]');

      const testPoints = [
        { id: "L1-L2", label: "L1-L2", x: 112, y: 82 },
        { id: "R-C", label: "R-C (24V)", x: 262, y: 120 },
        { id: "R-W", label: "R-W (Limit)", x: 356, y: 120 },
        { id: "Y-C", label: "Y-C (T-Stat)", x: 468, y: 120 },
        { id: "COIL", label: "Contactor Coil", x: 586, y: 158 },
        { id: "CAP", label: "Cap μF", x: 572, y: 312 },
        { id: "CSR", label: "C-R / C-S / S-R", x: 678, y: 312 }
      ];

      function computeCircuitState() {
        const lineLive = state.powerOn && state.fault !== "tripped_l1";
        const xfmrLive = lineLive;
        const limitClosed = state.fault !== "open_limit";
        const yClosed = state.tstatY;
        const coilPowered = xfmrLive && limitClosed && yClosed;
        const coilIntact = state.fault !== "open_coil";
        const contactorPulled = coilPowered && coilIntact;
        const motorEnergized = lineLive && contactorPulled;
        const motorSpinning = motorEnergized && state.fault !== "bad_capacitor" && state.fault !== "open_start_winding" && state.fault !== "grounded_compressor";
        return { lineLive, xfmrLive, limitClosed, yClosed, coilPowered, coilIntact, contactorPulled, motorEnergized, motorSpinning };
      }

      function computeReading() {
        const cs = computeCircuitState();
        const mode = state.meterMode;
        const pr = state.probe;

        // LOTO Safety Guard: Measuring Ohms or uF on energized power!
        if ((mode === "OHMS" || mode === "UF") && state.powerOn) {
          return {
            faulted: true,
            value: "ERR / ARC!",
            sub: "LOTO VIOLATION: Disconnect is ON!"
          };
        }

        if (mode === "VAC") {
          if (pr === "L1-L2") return { faulted: false, value: cs.lineLive ? "240.0 V AC" : "0.0 V AC", sub: cs.lineLive ? "240V Line Hot" : (state.powerOn ? "Blown L1 Fuse / Breaker" : "LOTO Disconnect OFF") };
          if (pr === "R-C") return { faulted: false, value: cs.xfmrLive ? "24.2 V AC" : "0.0 V AC", sub: cs.xfmrLive ? "Transformer Secondary OK" : "No Primary Voltage" };
          if (pr === "R-W") {
            if (!cs.xfmrLive) return { faulted: false, value: "0.0 V AC", sub: "24V Transformer Off" };
            return cs.limitClosed
              ? { faulted: false, value: "0.0 V AC", sub: "Switch Closed (0V drop)" }
              : { faulted: true, value: "24.2 V AC", sub: "OPEN Pressure/Limit Switch!" };
          }
          if (pr === "Y-C") {
            if (!cs.xfmrLive) return { faulted: false, value: "0.0 V AC", sub: "24V Transformer Off" };
            if (!cs.limitClosed) return { faulted: false, value: "0.0 V AC", sub: "Upstream Limit Open" };
            return cs.yClosed
              ? { faulted: false, value: "24.2 V AC", sub: "Thermostat Y Calling" }
              : { faulted: false, value: "0.0 V AC", sub: "Thermostat Y Open (Idle)" };
          }
          if (pr === "COIL") {
            return cs.coilPowered
              ? { faulted: !cs.coilIntact, value: "24.2 V AC", sub: cs.coilIntact ? "Coil Energized" : "24V Present — Coil Open!" }
              : { faulted: false, value: "0.0 V AC", sub: "Coil De-energized" };
          }
          if (pr === "CAP" || pr === "CSR") {
            return { faulted: false, value: cs.motorEnergized ? "240.0 V AC" : "0.0 V AC", sub: cs.motorEnergized ? "Contactor Closed to Motor" : "Load Terminals Open" };
          }
        }

        if (mode === "OHMS") {
          if (pr === "L1-L2") return { faulted: false, value: state.fault === "tripped_l1" ? "OL" : "14.2 Ω", sub: "Transformer Primary Side" };
          if (pr === "R-C") return { faulted: false, value: "2.4 Ω", sub: "24V Secondary Winding" };
          if (pr === "R-W") return { faulted: state.fault === "open_limit", value: state.fault === "open_limit" ? "OL" : "0.1 Ω", sub: state.fault === "open_limit" ? "OPEN Limit Contacts" : "Closed Continuity" };
          if (pr === "Y-C") return { faulted: false, value: state.tstatY ? "0.2 Ω" : "OL", sub: state.tstatY ? "T-Stat Y Closed" : "T-Stat Y Open" };
          if (pr === "COIL") return { faulted: state.fault === "open_coil", value: state.fault === "open_coil" ? "OL" : "18.5 Ω", sub: state.fault === "open_coil" ? "OPEN Contactor Coil!" : "Healthy 24V Coil" };
          if (pr === "CAP") return { faulted: state.fault === "bad_capacitor", value: "Charge -> OL", sub: "Use μF Mode for Cap Test" };
          if (pr === "CSR") {
            if (state.fault === "open_start_winding") {
              return { faulted: true, value: "C-S: OL | S-R: OL", sub: "C-R: 1.8 Ω — OPEN START WINDING!" };
            }
            if (state.fault === "grounded_compressor") {
              return { faulted: true, value: "C-GND: 0.3 Ω", sub: "SHORT TO GROUND FAULT!" };
            }
            return { faulted: false, value: "1.8 / 4.2 / 6.0 Ω", sub: "C-R: 1.8 | C-S: 4.2 | S-R: 6.0 Ω (C-GND: OL)" };
          }
        }

        if (mode === "AMPS") {
          if (!cs.motorEnergized) return { faulted: false, value: "0.0 A", sub: "Compressor Not Energized" };
          if (state.fault === "bad_capacitor" || state.fault === "open_start_winding") {
            return { faulted: true, value: "24.5 A (LRA)", sub: "Locked Rotor Amps — Stalled!" };
          }
          if (state.fault === "grounded_compressor") {
            return { faulted: true, value: "TRIP >40 A", sub: "Breaker Trips on Ground Fault!" };
          }
          return { faulted: false, value: "11.4 A (RLA)", sub: "Running Load Amps Normal" };
        }

        if (mode === "UF") {
          if (pr === "CAP") {
            if (state.fault === "bad_capacitor") {
              return { faulted: true, value: "8.2 μF", sub: "FAILED (Rated " + state.ratedUf + " μF ±5%)" };
            }
            return { faulted: false, value: state.ratedUf.toFixed(1) + " μF", sub: "Good (Within ±5% of " + state.ratedUf + " μF)" };
          }
          return { faulted: false, value: "0.0 μF", sub: "Probe Cap μF Terminals" };
        }

        return { faulted: false, value: "0.0", sub: "Ready" };
      }

      function triggerLotoAlert(probeId) {
        state.lotoViolation = true;
        state.lotoMsg = "⚠️ LOTO VIOLATION: Turn Disconnect OFF before measuring Ohms!";
        if (state.meterMode === "UF") {
          state.lotoMsg = "⚠️ LOTO VIOLATION: Turn Disconnect OFF before measuring Ohms / μF!";
        }
        state.sparkTimer = 0.75;
        const tp = testPoints.find((t) => t.id === probeId);
        if (tp) state.sparkPos = { x: tp.x, y: tp.y };
        safePlay("spark");
        if (lcdEl) {
          lcdEl.classList.remove("tg1-shake");
          void lcdEl.offsetWidth;
          lcdEl.classList.add("tg1-shake");
        }
        updateUI();
      }

      function selectProbe(probeId) {
        state.probe = probeId;
        if ((state.meterMode === "OHMS" || state.meterMode === "UF") && state.powerOn) {
          triggerLotoAlert(probeId);
          return;
        }
        state.lotoViolation = false;
        state.lotoMsg = "";
        safePlay("click");
        updateUI();
      }

      function selectMeterMode(nextMode) {
        state.meterMode = nextMode;
        if ((nextMode === "OHMS" || nextMode === "UF") && state.powerOn) {
          triggerLotoAlert(state.probe);
          return;
        }
        state.lotoViolation = false;
        state.lotoMsg = "";
        safePlay("click");
        updateUI();
      }

      function updateUI() {
        if (powerRow) {
          powerRow.innerHTML =
            '<button type="button" class="tg1-btn ' + (state.powerOn ? "tg1-btn-red" : "tg1-btn-green") + '" data-tg1-e="power">' +
              (state.powerOn ? "LOTO Disconnect: ON (LIVE 240V)" : "LOTO Disconnect: OFF (SAFE)") +
            '</button>' +
            '<button type="button" class="tg1-btn ' + (state.tstatY ? "tg1-btn-active" : "") + '" data-tg1-e="tstat">' +
              (state.tstatY ? "Thermostat Y: COOL CALL ✓" : "Thermostat Y: IDLE (OPEN)") +
            '</button>';
          const pBtn = powerRow.querySelector('[data-tg1-e="power"]');
          const yBtn = powerRow.querySelector('[data-tg1-e="tstat"]');
          if (pBtn) {
            pBtn.addEventListener("click", () => {
              state.powerOn = !state.powerOn;
              if (!state.powerOn) {
                state.lotoViolation = false;
                state.lotoMsg = "";
              }
              safePlay("click");
              updateUI();
            });
          }
          if (yBtn) {
            yBtn.addEventListener("click", () => {
              state.tstatY = !state.tstatY;
              safePlay("click");
              updateUI();
            });
          }
        }

        if (modeRow) {
          const modes = [
            { id: "VAC", lbl: "V AC" },
            { id: "OHMS", lbl: "Ω Resistance" },
            { id: "AMPS", lbl: "Amps" },
            { id: "UF", lbl: "μF Capacitance" }
          ];
          modeRow.innerHTML = modes.map((m) =>
            '<button type="button" class="tg1-btn' + (state.meterMode === m.id ? " tg1-btn-amber" : "") + '" data-tg1-mm="' + m.id + '">' + escHtml(m.lbl) + '</button>'
          ).join("");
          modeRow.querySelectorAll("[data-tg1-mm]").forEach((b) => {
            b.addEventListener("click", () => selectMeterMode(b.getAttribute("data-tg1-mm")));
          });
        }

        if (probeRow) {
          probeRow.innerHTML = testPoints.map((tp) =>
            '<button type="button" class="tg1-btn' + (state.probe === tp.id ? " tg1-btn-active" : "") + '" data-tg1-tp="' + tp.id + '">' + escHtml(tp.label) + '</button>'
          ).join("");
          probeRow.querySelectorAll("[data-tg1-tp]").forEach((b) => {
            b.addEventListener("click", () => selectProbe(b.getAttribute("data-tg1-tp")));
          });
        }

        if (faultSel) faultSel.value = state.fault;

        const r = computeReading();
        if (lcdLabel) lcdLabel.textContent = "DMM • " + state.meterMode + " • PROBE: " + state.probe;
        if (lcdVal) lcdVal.textContent = r.value;
        if (lcdSub) lcdSub.textContent = r.sub;
        if (lcdEl) lcdEl.classList.toggle("tg1-lcd-fault", r.faulted || state.lotoViolation);

        if (alertEl) {
          if (state.lotoViolation) {
            alertEl.className = "tg1-alert-banner tg1-visible tg1-alert-danger";
            alertEl.textContent = state.lotoMsg;
          } else if (!state.powerOn) {
            alertEl.className = "tg1-alert-banner tg1-visible tg1-alert-ok";
            alertEl.textContent = "✓ LOTO LOCKED OFF (0V): Safe to measure Resistance (Ω) and Capacitance (μF).";
          } else {
            alertEl.className = "tg1-alert-banner";
            alertEl.textContent = "";
          }
        }
      }

      if (faultSel) {
        faultSel.addEventListener("change", () => {
          safePlay("click");
          state.fault = faultSel.value;
          updateUI();
        });
      }

      function drawSchematicCanvas(ctx, t, dt) {
        const cs = computeCircuitState();
        drawRoundedBox(ctx, 14, 14, 752, 402, 12, "#0a1120", "#22324d", 1.5);

        // Header status strip
        ctx.fillStyle = state.powerOn ? "#fca5a5" : "#86efac";
        ctx.font = "800 12px system-ui, sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(state.powerOn ? "240V L1/L2 ENERGIZED" : "LOTO OFF — ZERO ENERGY", 32, 38);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "700 11px system-ui, sans-serif";
        ctx.textAlign = "right";
        ctx.fillText("24V CONTROL LADDER + C-S-R MOTOR", 748, 38);

        state.hitBoxes = [];

        // --- L1 / L2 Disconnect Box (Left) ---
        drawRoundedBox(ctx, 28, 56, 114, 126, 9, "#111b2e", state.powerOn ? "#ef4444" : "#22c55e", 2);
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "800 11px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("DISCONNECT", 85, 76);
        ctx.fillStyle = state.powerOn ? "#ef4444" : "#22c55e";
        ctx.font = "800 13px monospace";
        ctx.fillText(state.powerOn ? "ON (240V)" : "OFF (LOTO)", 85, 118);
        ctx.font = "600 10px system-ui, sans-serif";
        ctx.fillStyle = "#94a3b8";
        ctx.fillText("Click to Toggle", 85, 168);
        state.hitBoxes.push({ x: 28, y: 56, w: 114, h: 126, kind: "power" });

        // --- High Voltage Rails to Transformer & Contactor ---
        const hvCol = cs.lineLive ? "#f97316" : "#334155";
        ctx.strokeStyle = hvCol;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(142, 82);
        ctx.lineTo(220, 82);
        ctx.lineTo(220, 224);
        ctx.lineTo(445, 224);
        ctx.stroke();

        // --- 240V -> 24V Transformer ---
        drawRoundedBox(ctx, 186, 98, 92, 66, 8, "#162238", cs.xfmrLive ? "#22d3ee" : "#475569", 1.8);
        ctx.fillStyle = "#e0f2fe";
        ctx.font = "800 11px system-ui, sans-serif";
        ctx.fillText("24V XFMR", 232, 124);
        ctx.font = "700 10px monospace";
        ctx.fillStyle = cs.xfmrLive ? "#22d3ee" : "#64748b";
        ctx.fillText(cs.xfmrLive ? "24.2 V AC" : "0.0 V", 232, 146);

        // --- 24V Control Ladder Rail (R -> Limit -> Y -> Contactor Coil -> C) ---
        const c24Live = cs.xfmrLive ? "#22d3ee" : "#334155";
        // R to Limit Switch
        ctx.strokeStyle = c24Live;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(278, 120);
        ctx.lineTo(334, 120);
        ctx.stroke();

        // Pressure / Limit Switch (x=334..382)
        ctx.strokeStyle = cs.limitClosed ? c24Live : "#ef4444";
        ctx.beginPath();
        ctx.moveTo(334, 120);
        if (cs.limitClosed) ctx.lineTo(382, 120);
        else ctx.lineTo(376, 98); // visibly open switch blade!
        ctx.stroke();
        ctx.fillStyle = cs.limitClosed ? "#cbd5e1" : "#f87171";
        ctx.font = "700 10px system-ui, sans-serif";
        ctx.fillText(cs.limitClosed ? "Limit (Closed)" : "LIMIT OPEN!", 358, 88);

        // Limit to Thermostat Y
        const afterLimit = (cs.xfmrLive && cs.limitClosed) ? "#22d3ee" : "#334155";
        ctx.strokeStyle = afterLimit;
        ctx.beginPath();
        ctx.moveTo(382, 120);
        ctx.lineTo(444, 120);
        ctx.stroke();

        // Thermostat Y Switch (x=444..492)
        ctx.strokeStyle = cs.yClosed ? afterLimit : "#fbbf24";
        ctx.beginPath();
        ctx.moveTo(444, 120);
        if (cs.yClosed) ctx.lineTo(492, 120);
        else ctx.lineTo(486, 98);
        ctx.stroke();
        ctx.fillStyle = cs.yClosed ? "#86efac" : "#fbbf24";
        ctx.fillText(cs.yClosed ? "T-Stat Y (Call)" : "T-Stat Y (Open)", 468, 88);

        // Y to Contactor Coil
        const afterY = cs.coilPowered ? "#22d3ee" : "#334155";
        ctx.strokeStyle = afterY;
        ctx.beginPath();
        ctx.moveTo(492, 120);
        ctx.lineTo(586, 120);
        ctx.lineTo(586, 140);
        ctx.stroke();

        // Contactor Coil Circle (x=586, y=160)
        drawRoundedBox(ctx, 540, 140, 92, 46, 20, cs.contactorPulled ? "#0e7490" : "#162238", cs.coilPowered ? (cs.coilIntact ? "#22d3ee" : "#ef4444") : "#475569", 2);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "800 10px system-ui, sans-serif";
        ctx.fillText("24V COIL", 586, 160);
        ctx.font = "700 9px monospace";
        ctx.fillText(cs.coilIntact ? (cs.coilPowered ? "PULLED IN" : "18.5 Ω") : "OPEN (OL!)", 586, 175);

        // Common C return wire
        ctx.strokeStyle = cs.contactorPulled ? "#22d3ee" : "#334155";
        ctx.beginPath();
        ctx.moveTo(586, 186);
        ctx.lineTo(586, 200);
        ctx.lineTo(250, 200);
        ctx.lineTo(250, 164);
        ctx.stroke();

        // Animated 24V current pulses along ladder when coil energized
        if (cs.contactorPulled) {
          for (let p = 0; p < 8; p++) {
            const px = 280 + ((p * 42 + t * 90) % 305);
            ctx.beginPath();
            ctx.arc(px, 120, 3, 0, Math.PI * 2);
            ctx.fillStyle = "#fde047";
            ctx.fill();
          }
        }

        // --- Contactor Main Power Contacts + Motor & Run Capacitor (Bottom Half) ---
        drawRoundedBox(ctx, 445, 212, 74, 48, 8, "#162238", cs.contactorPulled ? "#f97316" : "#475569", 2);
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "800 10px system-ui, sans-serif";
        ctx.fillText("CONTACTOR", 482, 232);
        ctx.fillStyle = cs.contactorPulled ? "#4ade80" : "#94a3b8";
        ctx.fillText(cs.contactorPulled ? "CLOSED" : "OPEN", 482, 248);

        // Power lines to Cap & Motor
        ctx.strokeStyle = cs.motorEnergized ? "#f97316" : "#334155";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(482, 260);
        ctx.lineTo(482, 312);
        ctx.lineTo(630, 312);
        ctx.stroke();

        // Run Capacitor Box (x=532, y=282)
        drawRoundedBox(ctx, 532, 282, 80, 62, 8, "#162238", state.fault === "bad_capacitor" ? "#ef4444" : "#38bdf8", 1.8);
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "800 10px system-ui, sans-serif";
        ctx.fillText("RUN CAP", 572, 304);
        ctx.fillStyle = state.fault === "bad_capacitor" ? "#f87171" : "#38bdf8";
        ctx.font = "800 11px monospace";
        ctx.fillText(state.fault === "bad_capacitor" ? "8.2 μF!" : "35.0 μF", 572, 326);

        // Compressor Motor Dome + Spinning Rotor (x=678, y=312)
        if (cs.motorSpinning) state.rotorAngle += dt * 7.5;
        ctx.beginPath();
        ctx.arc(678, 312, 54, 0, Math.PI * 2);
        ctx.fillStyle = "#111b2e";
        ctx.fill();
        ctx.strokeStyle = cs.motorEnergized ? (cs.motorSpinning ? "#22c55e" : "#ef4444") : "#475569";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Spinning rotor blades
        ctx.save();
        ctx.translate(678, 312);
        ctx.rotate(state.rotorAngle);
        ctx.strokeStyle = cs.motorSpinning ? "#4ade80" : "#64748b";
        ctx.lineWidth = 3;
        for (let b = 0; b < 3; b++) {
          ctx.rotate((Math.PI * 2) / 3);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(0, -28);
          ctx.stroke();
        }
        ctx.restore();

        ctx.fillStyle = "#f8fafc";
        ctx.font = "800 11px system-ui, sans-serif";
        ctx.fillText("C - S - R", 678, 382);
        if (cs.motorEnergized && !cs.motorSpinning) {
          ctx.fillStyle = "#f87171";
          ctx.font = "800 11px system-ui, sans-serif";
          ctx.fillText("STALLED / LRA!", 678, 248);
        }

        // --- Clickable Glowing Probe Hotspots ---
        testPoints.forEach((tp) => {
          const active = state.probe === tp.id;
          ctx.beginPath();
          ctx.arc(tp.x, tp.y, active ? 11 : 8, 0, Math.PI * 2);
          ctx.fillStyle = active ? "#fbbf24" : "rgba(34, 211, 238, 0.25)";
          ctx.fill();
          ctx.strokeStyle = active ? "#fef3c7" : "#22d3ee";
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = active ? "#fbbf24" : "#cbd5e1";
          ctx.font = "700 10px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(tp.id, tp.x, tp.y + 22);
          state.hitBoxes.push({ x: tp.x - 22, y: tp.y - 22, w: 44, h: 44, kind: "probe", value: tp.id });
        });

        // --- LOTO Violation Spark Arc Animation ---
        if (state.sparkTimer > 0) {
          state.sparkTimer = Math.max(0, state.sparkTimer - dt);
          ctx.save();
          ctx.translate(state.sparkPos.x, state.sparkPos.y);
          ctx.strokeStyle = "#fde047";
          ctx.lineWidth = 3;
          for (let s = 0; s < 6; s++) {
            const ang = (s / 6) * Math.PI * 2 + t * 25;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(ang) * 26, Math.sin(ang) * 26);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      const canvasCtrl = setupResponsiveCanvas(canvas, 780, 430, {
        onClick(pt) {
          for (let i = state.hitBoxes.length - 1; i >= 0; i--) {
            const hb = state.hitBoxes[i];
            if (pt.x >= hb.x && pt.x <= hb.x + hb.w && pt.y >= hb.y && pt.y <= hb.y + hb.h) {
              if (hb.kind === "power") {
                state.powerOn = !state.powerOn;
                if (!state.powerOn) {
                  state.lotoViolation = false;
                  state.lotoMsg = "";
                }
                safePlay("click");
                updateUI();
              } else if (hb.kind === "probe") {
                selectProbe(hb.value);
              }
              return;
            }
          }
        }
      });

      createMissionController({
        missions: missions,
        elements: {
          box: missionBox,
          xpEl: rootEl.querySelector('[data-tg1-stat="xp"]'),
          accEl: rootEl.querySelector('[data-tg1-stat="acc"]'),
          streakEl: rootEl.querySelector('[data-tg1-stat="streak"]')
        },
        playSound: safePlay,
        awardXP: safeAward,
        onLoadMission(m) {
          const p = m.params || {};
          state.fault = p.fault || "nominal";
          if (p.power_on != null) state.powerOn = Boolean(p.power_on);
          else if (p.disconnect_on != null) state.powerOn = Boolean(p.disconnect_on);
          else if (p.loto_required != null) state.powerOn = !Boolean(p.loto_required);
          else state.powerOn = true;
          state.tstatY = p.tstat_y != null ? Boolean(p.tstat_y) : (p.cooling_call != null ? Boolean(p.cooling_call) : true);
          let defaultMode = "VAC";
          let defaultProbe = "L1-L2";
          if (p.fault_node === "RUN_CAP_C_HERM") { defaultProbe = "CAP"; defaultMode = "UF"; }
          else if (p.fault_node === "COMP_WINDING_C_S") { defaultProbe = "CSR"; defaultMode = "OHMS"; }
          else if (p.fault_node === "TSTAT_24V_CALL") { defaultProbe = "Y-C"; defaultMode = "VAC"; }
          else if (p.loto_required) { defaultMode = "OHMS"; }
          state.meterMode = p.meter_mode || defaultMode;
          state.probe = p.probe || defaultProbe;
          state.ratedUf = p.rated_uf != null ? Number(p.rated_uf) : (p.uf && Number(p.uf) > 0 ? Number(p.uf) : 35);
          state.lotoViolation = false;
          state.lotoMsg = "";
          updateUI();
        },

          }
          if (tgt.rh_max != null) {
            checks.push({
              label: "RH ≤ " + tgt.rh_max + "% (" + tel.rh + "%)",
              met: tel.rh <= Number(tgt.rh_max)
            });
          }
          if (tgt.rh_min != null) {
            checks.push({
              label: "RH ≥ " + tgt.rh_min + "% (" + tel.rh + "%)",
              met: tel.rh >= Number(tgt.rh_min)
            });
          }
          if (tgt.humidity_mode) {
            checks.push({
              label: "Mode: " + tgt.humidity_mode,
              met: state.humidityMode === tgt.humidity_mode
            });
          }
          if (tgt.no_freeze) {
            checks.push({ label: "Coil Frost-Free", met: !tel.freezeRisk });
          }
          if (tgt.filter_max != null) {
            checks.push({ label: "Filter ≤ " + tgt.filter_max + "%", met: state.filterPct <= Number(tgt.filter_max) });
          }
          if (tgt.damper_min != null) {
            checks.push({ label: "Damper ≥ " + tgt.damper_min + "%", met: state.damperPct >= Number(tgt.damper_min) });
          }
          return { allMet: checks.length > 0 && checks.every((c) => c.met), checks };
        }

        // Keyword fallback for externally supplied descriptive missions
        if (/dehumid|muggy|latent|moisture/.test(combined)) {
          checks.push({ label: "Dehumidifier Active", met: state.humidityMode === "dehumidifier" });
          checks.push({ label: "RH ≤ 50% (" + tel.rh + "%)", met: tel.rh <= 50 });
        } else if (/humidif|dry air/.test(combined)) {
          checks.push({ label: "Humidifier Active", met: state.humidityMode === "humidifier" });
          checks.push({ label: "RH 38–55% (" + tel.rh + "%)", met: tel.rh >= 38 && tel.rh <= 55 });
        }
        checks.push({
          label: "Airflow 1,080–1,320 CFM (" + tel.cfm + ")",
          met: tel.cfm >= 1080 && tel.cfm <= 1320
        });
        checks.push({
          label: "ESP ≤ 0.50 in. WC (" + tel.esp.toFixed(2) + ")",
          met: tel.esp <= 0.50
        });
        checks.push({ label: "No Freeze Risk", met: !tel.freezeRisk });
        return {
          allMet: state.interacted && checks.every((c) => c.met),
          checks
        };
      }

      containerEl.innerHTML = [

        '        <input type="range" class="tg2-slider" min="0" max="100" step="1" value="12" data-el="filterSlider" aria-label="Filter Restriction" />',

      ].join("\n");

      const q = (sel) => containerEl.querySelector('[data-el="' + sel + '"]');
      const canvas = q("canvas");
      const W = 720;
      const H = 370;
      const ctx = setupHiDPICanvas(canvas, W, H);
      const statusStrip = q("statusStrip");
      const telemetryEl = q("telemetry");

      function syncControlUI(tel) {
        speedLbl.textContent = tel.tapLabel;
        filterLbl.textContent = state.filterPct + "% — " + tel.filterTier;
        damperLbl.textContent = state.damperPct + "% Open";
        humLbl.textContent = state.humidityMode === "off" ? "Off" : (state.humidityMode === "humidifier" ? "Humidifier ON" : "Dehumidifier ON");
        filterSlider.value = String(state.filterPct);
        damperSlider.value = String(state.damperPct);

        containerEl.querySelectorAll("[data-speed]").forEach((btn) => {
          btn.classList.toggle("is-selected", btn.getAttribute("data-speed") === state.speed);
        });
        containerEl.querySelectorAll("[data-hum]").forEach((btn) => {
          btn.classList.toggle("is-selected", btn.getAttribute("data-hum") === state.humidityMode);
        });
      }

      function renderUI() {
        const tel = computeTelemetry();
        syncControlUI(tel);

        // Status badges
        const badges = [];
        if (tel.freezeRisk) badges.push('<span class="tg2-badge is-danger">🧊 COIL FREEZE-UP RISK</span>');
        if (tel.highStatic) badges.push('<span class="tg2-badge is-warn">⚠️ HIGH STATIC (&gt; 0.50 in. WC)</span>');
        if (!tel.freezeRisk && !tel.highStatic && tel.cfm >= 1100 && tel.cfm <= 1300) {
          badges.push('<span class="tg2-badge is-ok">✅ 400 CFM/Ton Target Nominal</span>');
        }
        badges.push('<span class="tg2-badge is-info">3-Ton Nominal: 1,200 CFM</span>');
        statusStrip.innerHTML = badges.join("");

        const cfmClass = tel.freezeRisk ? "is-danger" : (tel.cfm >= 1100 && tel.cfm <= 1300 ? "is-ok" : "is-warn");
        const espClass = tel.highStatic ? "is-danger" : "is-ok";
        const dtClass = tel.deltaT > 25 ? "is-danger" : (tel.deltaT >= 18 && tel.deltaT <= 22 ? "is-ok" : "is-warn");
        const rhClass = tel.rh > 55 || tel.rh < 35 ? "is-warn" : "is-ok";

        telemetryEl.innerHTML = [
          '<div class="tg2-gauge ' + cfmClass + '"><span class="tg2-gauge-label">Total Airflow</span><span class="tg2-gauge-val">' + tel.cfm + ' CFM</span><span class="tg2-gauge-sub">' + tel.cfmPerTon + ' CFM/ton (Target ~400)</span></div>',
          '<div class="tg2-gauge ' + espClass + '"><span class="tg2-gauge-label">External Static (ESP)</span><span class="tg2-gauge-val">' + tel.esp.toFixed(2) + ' in. WC</span><span class="tg2-gauge-sub">Ret ' + tel.returnSP.toFixed(2) + ' | Sup +' + tel.supplySP.toFixed(2) + '</span></div>',
          '<div class="tg2-gauge ' + dtClass + '"><span class="tg2-gauge-label">Temp Split (ΔT)</span><span class="tg2-gauge-val">' + tel.deltaT.toFixed(1) + '°F</span><span class="tg2-gauge-sub">75°F Ret → ' + tel.supplyTemp.toFixed(1) + '°F Sup</span></div>',
          '<div class="tg2-gauge ' + rhClass + '"><span class="tg2-gauge-label">Relative Humidity</span><span class="tg2-gauge-val">' + tel.rh + '% RH</span><span class="tg2-gauge-sub">Comfort Band: 35–55%</span></div>'
        ].join("");

        if (tel.freezeRisk) {
          alertBar.className = "tg2-alert-bar is-danger";
          alertBar.textContent = "🧊 Freeze-Up Alert: Airflow dropped below 900 CFM (" + tel.cfmPerTon + " CFM/ton). Evaporator coil frost is forming — clean the filter, open dampers, or step up blower tap.";
        } else if (tel.highStatic) {
          alertBar.className = "tg2-alert-bar is-warn";
          alertBar.textContent = "⚠️ High Static Pressure (" + tel.esp.toFixed(2) + " in. WC > 0.50 limit): Blower motor works harder and moves less air. Inspect filter restriction & supply damper.";
        } else if (tel.rh > 55) {
          alertBar.className = "tg2-alert-bar is-warn";
          alertBar.textContent = "💧 High Humidity (" + tel.rh + "% RH): Excess indoor moisture reduces occupant comfort. Engage Dehumidifier or slow excessive CFM over the cooling coil.";
        } else {
          alertBar.className = "tg2-alert-bar is-ok";
          alertBar.textContent = "✅ System Balanced: " + tel.cfm + " CFM (~400 CFM/ton) at " + tel.esp.toFixed(2) + " in. WC static pressure with a crisp " + tel.deltaT.toFixed(1) + "°F coil split.";
        }

        missionCtrl.render(tel);
      }

      const missionCtrl = createMissionController({
        missions,
        tabsEl: missionTabsEl,
        bodyEl: missionBodyEl,
        playSound,
        awardXP,
        onLoad: applyMissionSetup,
        evaluate: evaluateMission,
        onRenderAfter: renderUI
      });

      // Apply initial mission setup if defined
      if (missions[0] && (Object.keys(missions[0].initial).length || Object.keys(missions[0].params).length)) {
        applyMissionSetup(missions[0]);
      }

      // Event bindings
      disp.on(containerEl, "click", (e) => {
        const target = e.target.closest("button");
        if (!target) return;
        if (missionCtrl.handleClick(target)) return;

        if (target.hasAttribute("data-speed")) {
          state.speed = target.getAttribute("data-speed");
          state.interacted = true;
          safePlay(playSound, "click");
          renderUI();
        } else if (target.hasAttribute("data-filter-preset")) {
          state.filterPct = Number(target.getAttribute("data-filter-preset"));
          state.interacted = true;
          safePlay(playSound, "click");
          renderUI();
        } else if (target.hasAttribute("data-hum")) {
          state.humidityMode = target.getAttribute("data-hum");
          state.interacted = true;
          safePlay(playSound, "click");
          renderUI();
        } else if (target.getAttribute("data-el") === "resetBtn") {
          state.speed = "med";
          state.filterPct = 10;
          state.damperPct = 100;
          state.humidityMode = "off";
          state.interacted = true;
          safePlay(playSound, "click");
          renderUI();
        }
      });

      disp.on(filterSlider, "input", () => {
        state.filterPct = Number(filterSlider.value);
        state.interacted = true;
        renderUI();
      });
      disp.on(damperSlider, "input", () => {
        state.damperPct = Number(damperSlider.value);
        state.interacted = true;
        renderUI();
      });

      // Initial render
      renderUI();

      // Canvas animation loop
      let lastTs = 0;
      disp.raf((ts) => {
        if (!ctx) return;
        const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
        lastTs = ts;

        const tel = computeTelemetry();
        const speedNorm = clamp(tel.cfm / 1200, 0.25, 1.45);
        state.blowerAngle += dt * (3.5 + speedNorm * 8.5);

        ctx.clearRect(0, 0, W, H);

        // Background subtle grid
        ctx.fillStyle = "#060c18";
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = "rgba(51, 65, 85, 0.22)";
        ctx.lineWidth = 1;
        for (let gx = 0; gx <= W; gx += 40) {
          ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
        }
        for (let gy = 0; gy <= H; gy += 40) {
          ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
        }

        // Return Duct (x: 24..185, y: 120..250)
        drawRoundedRect(ctx, 20, 125, 165, 120, 8);
        ctx.fillStyle = "#0f172a";
        ctx.fill();
        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Air Handler Cabinet (x: 185..475, y: 95..275)
        drawRoundedRect(ctx, 185, 95, 290, 180, 10);
        ctx.fillStyle = "#162235";
        ctx.fill();
        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Supply Trunk Duct (x: 475..700, y: 125..245)
        drawRoundedRect(ctx, 475, 125, 225, 120, 8);
        ctx.fillStyle = "#0f172a";
        ctx.fill();
        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Filter Slot (x: 194, y: 108..262)
        const dustAlpha = 0.2 + (state.filterPct / 100) * 0.78;
        ctx.save();
        ctx.fillStyle = state.filterPct >= 70 ? "rgba(180, 83, 9, " + dustAlpha + ")" : "rgba(148, 163, 184, " + dustAlpha + ")";
        ctx.fillRect(194, 108, 22, 154);
        ctx.strokeStyle = state.filterPct >= 70 ? "#f87171" : "#38bdf8";
        ctx.lineWidth = 2;
        ctx.strokeRect(194, 108, 22, 154);
        // Filter pleats
        ctx.strokeStyle = "rgba(15, 23, 42, 0.75)";
        ctx.lineWidth = 1.5;
        for (let py = 114; py < 258; py += 12) {
          ctx.beginPath();
          ctx.moveTo(195, py);
          ctx.lineTo(215, py + 6);
          ctx.stroke();
        }
        ctx.restore();

        // Blower Housing & Spinning Squirrel-Cage Wheel (center: 285, 185)
        ctx.save();
        ctx.translate(285, 185);
        ctx.beginPath();
        ctx.arc(0, 0, 48, 0, Math.PI * 2);
        ctx.fillStyle = "#0b1220";
        ctx.fill();
        ctx.strokeStyle = tel.highStatic ? "#fbbf24" : "#38bdf8";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Wheel blades
        ctx.rotate(state.blowerAngle);
        ctx.strokeStyle = "#94a3b8";
        ctx.lineWidth = 2;
        for (let b = 0; b < 10; b++) {
          const a = (b / 10) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * 14, Math.sin(a) * 14);
          ctx.lineTo(Math.cos(a + 0.25) * 41, Math.sin(a + 0.25) * 41);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fillStyle = "#38bdf8";
        ctx.fill();
        ctx.restore();

        // Evaporator A-Coil (x: 365..450, y: 112..258)
        ctx.save();
        ctx.fillStyle = tel.freezeRisk ? "rgba(186, 230, 253, 0.28)" : "rgba(56, 189, 248, 0.14)";
        ctx.strokeStyle = tel.freezeRisk ? "#e0f2fe" : "#38bdf8";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(372, 256);
        ctx.lineTo(410, 114);
        ctx.lineTo(448, 256);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // Coil fins
        ctx.strokeStyle = tel.freezeRisk ? "#bae6fd" : "rgba(56, 189, 248, 0.45)";
        ctx.lineWidth = 1.2;
        for (let fy = 135; fy < 252; fy += 14) {
          const frac = (fy - 114) / 142;
          const halfW = frac * 35;
          ctx.beginPath();
          ctx.moveTo(410 - halfW, fy);
          ctx.lineTo(410 + halfW, fy);
          ctx.stroke();
        }
        if (tel.freezeRisk) {
          // Draw frost sparkle crosses
          ctx.fillStyle = "#ffffff";
          ctx.font = "700 13px sans-serif";
          ctx.fillText("❄", 393, 178);
          ctx.fillText("❄", 412, 212);
          ctx.fillText("❄", 384, 234);
          ctx.fillText("❄", 422, 240);
        }
        ctx.restore();

        // Humidifier / Dehumidifier Accessory Box on Supply Trunk (x: 505..575, y: 74..125)
        drawRoundedRect(ctx, 502, 76, 86, 44, 6);
        const humActive = state.humidityMode !== "off";
        ctx.fillStyle = humActive ? "#1e293b" : "#0b1220";
        ctx.fill();
        ctx.strokeStyle = state.humidityMode === "humidifier" ? "#38bdf8" : (state.humidityMode === "dehumidifier" ? "#34d399" : "#475569");
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = humActive ? "#f8fafc" : "#64748b";
        ctx.font = "700 10.5px 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(state.humidityMode === "humidifier" ? "HUMIDIFIER ON" : (state.humidityMode === "dehumidifier" ? "DEHUMIDIFIER ON" : "HUMIDITY OFF"), 545, 96);
        ctx.fillText(tel.rh + "% RH", 545, 111);
        ctx.textAlign = "left";

        // Balancing Damper Blade (pivot at x: 615, y: 185)
        ctx.save();
        ctx.translate(615, 185);
        // 100% open = horizontal (angle 0); 20% open = nearly vertical (angle ~1.25 rad)
        const damperAngle = ((100 - state.damperPct) / 80) * 1.25;
        ctx.rotate(damperAngle);
        ctx.fillStyle = "#fbbf24";
        drawRoundedRect(ctx, -46, -4, 92, 8, 3);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#f8fafc";
        ctx.fill();
        ctx.restore();

        // Animated Streamline Airflow Particles
        const retColor = "rgba(251, 191, 36, 0.72)";
        const supColor = tel.freezeRisk
          ? "#e0f2fe"
          : (tel.deltaT >= 18 ? "#38bdf8" : (state.humidityMode === "humidifier" ? "#67e8f9" : "#34d399"));

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.t = (p.t + dt * (0.18 + speedNorm * 0.34)) % 1;
          const x = 28 + p.t * 655;
          const choke = x > 600 ? clamp(state.damperPct / 100, 0.3, 1) : 1;
          const y = 185 + p.lane * 50 * choke + Math.sin(p.t * 16 + i) * 3.5;

          const col = x < 395 ? retColor : supColor;
          ctx.save();
          ctx.strokeStyle = col;
          ctx.fillStyle = col;
          ctx.lineWidth = p.size * 0.7;
          ctx.beginPath();
          ctx.moveTo(x - 12 * speedNorm, y);
          ctx.lineTo(x, y);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(x, y, p.size * 0.65, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Static Pressure Probe Indicators
        // Return Probe at x: 145
        ctx.strokeStyle = "#fbbf24";
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(145, 125); ctx.lineTo(145, 76); ctx.stroke();
        drawCanvasTag(ctx, 84, 52, "Ret SP: " + tel.returnSP.toFixed(2) + " in. WC", "#0f172a", "#fbbf24", "#475569");

        // Supply Probe at x: 500 -> bottom
        ctx.beginPath(); ctx.moveTo(492, 245); ctx.lineTo(492, 286); ctx.stroke();
        drawCanvasTag(ctx, 430, 288, "Sup SP: +" + tel.supplySP.toFixed(2) + " in. WC", "#0f172a", tel.highStatic ? "#f87171" : "#34d399", "#475569");

        // Labels along schematic
        drawCanvasTag(ctx, 26, 260, "Return 75°F", "#0f172a", "#fbbf24");
        drawCanvasTag(ctx, 168, 286, "Filter " + state.filterPct + "%", "#0f172a", state.filterPct >= 70 ? "#f87171" : "#38bdf8");
        drawCanvasTag(ctx, 250, 52, "Blower: " + tel.tapLabel + " (" + tel.cfm + " CFM)", "#0f172a", tel.freezeRisk ? "#f87171" : "#38bdf8");
        drawCanvasTag(ctx, 366, 288, tel.freezeRisk ? "COIL FREEZING!" : "Evap ΔT " + tel.deltaT.toFixed(1) + "°F", "#0f172a", tel.freezeRisk ? "#f87171" : "#e2e8f0");
        drawCanvasTag(ctx, 578, 260, "Damper " + state.damperPct + "%", "#0f172a", "#fbbf24");
        drawCanvasTag(ctx, 594, 52, "Supply " + tel.supplyTemp.toFixed(1) + "°F", "#0f172a", "#38bdf8");
      });

      return {
        destroy() {
          disp.destroy(containerEl);
        }
      };
    }
  };

  // =========================================================================
  // ENGINE 2: "heating_sequence" (Ch 20-23, 25, 27, 33-39)
  // =========================================================================
  window.TOPIC_ENGINES.heating_sequence = {
    mount(containerEl, data, playSound, awardXP) {
      const disp = createDisposer();
      const safeData = safeObj(data);
      const chNum = Number(safeData.chapter_num) || 33;

      function resolveEquipmentProfile(num) {
        if (num === 33) return "gas_heat";
        if (num === 34) return "oil_heat";
        if (num === 35) return "electric_heat";
        if (num === 36 || num === 37) return "heat_pump";
        if (num === 38 || num === 39) return "hydronic_solar";
        if (num === 27) return "absorption_evap";
        return "ac_cooling";
      }

      const profile = resolveEquipmentProfile(chNum);
      const profileTitles = {
        gas_heat: "Ch. " + chNum + " Gas-Fired Furnace Ignition Sequence Lab",
        oil_heat: "Ch. " + chNum + " Oil-Fired Primary Burner Control Lab",
        electric_heat: "Ch. " + chNum + " Electric Sequencer & Limit Lab",
        heat_pump: "Ch. " + chNum + (chNum === 37 ? " Geothermal" : " Air-Source") + " Heat Pump & 4-Way Reversing Valve Lab",
        hydronic_solar: "Ch. " + chNum + (chNum === 39 ? " Solar Thermal Loop" : " Hydronic Boiler") + " Sequence Lab",
        absorption_evap: "Ch. " + chNum + " Absorption & Evaporative Cooling Sequence Lab",
        ac_cooling: "Ch. " + chNum + " Refrigeration & AC Control Sequence Lab"
      };

      function getSequenceSteps(prof, mode) {
        if (prof === "gas_heat") {

      const state = {

      function getFaultStepBlock(prof, fault) {
        if (fault === "none") return 99;
        if (fault === "pressure_sw" && prof === "gas_heat") return 2;
        if (fault === "hsi_fail" && prof === "gas_heat") return 3;
        if (fault === "flame_rod" && (prof === "gas_heat" || prof === "oil_heat")) return prof === "gas_heat" ? 5 : 4;
        if (fault === "reversing_stuck" && prof === "heat_pump") return 1;
        return 2;
      }

      function computeTelemetry() {
        const steps = getSequenceSteps(profile, state.mode);
        const blockIdx = getFaultStepBlock(profile, state.fault);
        const effStep = Math.min(state.stepIndex, steps.length - 1);
        const stalled = state.fault !== "none" && effStep >= blockIdx;
        const complete = !stalled && effStep >= steps.length - 1;

        let flameUa = "N/A";
        let flameStatus = "is-info";
        if (profile === "gas_heat") {
          if (effStep < 4 || stalled && blockIdx < 4) {
            flameUa = "0.0 μA (No Flame)";
            flameStatus = "is-info";
          } else if (state.fault === "flame_rod") {
            flameUa = "0.4 μA DC (LOCKOUT!)";
            flameStatus = "is-danger";
          } else if (effStep >= 5) {
            flameUa = "3.8 μA DC (>1.5 OK)";
            flameStatus = "is-ok";
          } else {
            flameUa = "2.1 μA (Proving...)";
            flameStatus = "is-warn";
          }
        } else if (profile === "oil_heat") {
          flameUa = state.fault === "flame_rod" ? "98k Ω Cad Cell (Dark!)" : (effStep >= 4 ? "620 Ω Cad Cell (Flame OK)" : "Standby");
          flameStatus = state.fault === "flame_rod" ? "is-danger" : (effStep >= 4 ? "is-ok" : "is-info");
        }

        let pressureWC = "N/A";
        let pressureStatus = "is-info";
        if (profile === "gas_heat") {
          if (effStep < 1) {
            pressureWC = "0.00 in. WC (Open)";
          } else if (state.fault === "pressure_sw") {
            pressureWC = "-0.08 in. WC (STUCK OPEN!)";
            pressureStatus = "is-danger";
          } else {
            pressureWC = "-0.72 in. WC (Closed ✓)";
            pressureStatus = "is-ok";
          }
        }

        let supplyTemp = 70;
        if (!stalled) {
          const prog = effStep / Math.max(1, steps.length - 1);
          if (profile === "gas_heat" || profile === "oil_heat") supplyTemp = Math.round(70 + prog * 58);
          else if (profile === "electric_heat") supplyTemp = Math.round(70 + prog * 42);
          else if (profile === "hydronic_solar") supplyTemp = Math.round(72 + prog * 78);
          else if (profile === "heat_pump") {
            if (state.mode === "cooling") supplyTemp = Math.round(74 - prog * 19);
            else if (state.mode === "defrost") supplyTemp = Math.round(72 + prog * 18); // aux heat tempering
            else supplyTemp = Math.round(70 + prog * 28);
          } else {
            supplyTemp = Math.round(75 - prog * 20);
          }
        }

        let solenoid = "0V (N/A)";
        let solStatus = "is-info";
        if (profile === "heat_pump") {
          if (state.fault === "reversing_stuck") {
            solenoid = "0V / STUCK VALVE!";
            solStatus = "is-danger";
          } else if (state.mode === "cooling" || state.mode === "defrost") {
            solenoid = "24V AC (O Energized)";
            solStatus = "is-warn";
          } else {
            solenoid = "0V AC (O Relaxed - Heat)";
            solStatus = "is-ok";
          }
        }

        return {
          steps,
          effStep,
          blockIdx,
          stalled,
          complete,
          flameUa,
          flameStatus,
          pressureWC,
          pressureStatus,
          supplyTemp,
          solenoid,
          solStatus
        };
      }

      function stopAuto() {
        state.autoRunning = false;
        if (state.autoTimer) {
          window.clearInterval(state.autoTimer);
          state.autoTimer = null;
        }
      }
      disp.add(stopAuto);

      function applyMissionSetup(m) {
        stopAuto();
        const s = Object.assign({}, safeObj(m.params), safeObj(m.initial));
        const txt = (m.title + " " + m.description).toLowerCase();
        if (s.mode && ["heating", "cooling", "defrost"].includes(String(s.mode).toLowerCase())) {
          state.mode = String(s.mode).toLowerCase();
        } else if (profile === "heat_pump") {
          if (/defrost/.test(txt)) state.mode = "defrost";
          else if (/cooling/.test(txt)) state.mode = "cooling";
          else state.mode = "heating";
        }
        state.fault = s.fault ? String(s.fault) : "none";
        if (Number.isFinite(Number(s.stepIndex))) {
          state.stepIndex = Number(s.stepIndex);
        } else if (s.target_state) {
          const map = { THERMOSTAT_CALL: 0, INDUCER_DRAFT: 1, PRESSURE_SWITCH: 2, IGNITION_TRIAL: 3, FLAME_PROOF: 5, BLOWER_ON: 6 };
          state.stepIndex = map[s.target_state] != null ? map[s.target_state] : (Number(s.step) ? Math.max(0, Number(s.step) - 1) : 0);
        } else if (Number.isFinite(Number(s.step))) {
          state.stepIndex = Math.max(0, Number(s.step) - 1);
        } else {
          state.stepIndex = 0;
        }
        state.lastCheckNote = "";
      }

      function evaluateMission(m, tel) {
        const tgt = safeObj(m.target);
        const checks = [];
        if (m.check) {
          let ok = false;
          try { ok = Boolean(m.check(tel, state)); } catch (_) { ok = false; }
          checks.push({ label: "Objective Criteria Met", met: ok });
          return { allMet: ok, checks };
        }
        const combined = (m.title + " " + m.description + " " + m.hint).toLowerCase();
        const wantMode = tgt.mode || (/defrost/.test(combined) ? "defrost" : (/cooling/.test(combined) && profile === "heat_pump" ? "cooling" : (/heating/.test(combined) && profile === "heat_pump" ? "heating" : null)));
        if (wantMode && profile === "heat_pump") {
          checks.push({ label: "Mode: " + wantMode.toUpperCase(), met: state.mode === wantMode });
        }
        checks.push({ label: "Zero Active Faults", met: state.fault === "none" });
        checks.push({ label: "Full Sequence Completed", met: tel.complete });
        return { allMet: checks.every((c) => c.met), checks };
      }
