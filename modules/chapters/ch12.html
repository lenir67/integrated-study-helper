        const cnt = getPoolCount(ctx, s.id);
        return '<option value="' + esc(ctx, s.id) + '" ' + (prefs.sectionFilter === s.id ? "selected" : "") + '>' +
          esc(ctx, s.id + " " + s.title) + ' (' + cnt + ' Qs)</option>';
      }).join("") +
      (epaCount > 0
        ? '<option value="EPA608" ' + (prefs.sectionFilter === "EPA608" ? "selected" : "") + '>🌿 EPA 608 Only (' + epaCount + ' Qs)</option>'
        : '') +
      '<option value="TRAP" ' + (prefs.sectionFilter === "TRAP" ? "selected" : "") + '>⚠️ Exam Traps Only (' + trapCount + ' Qs)</option>';

    const roundCardsHtml = ROUND_OPTIONS.map(function (opt) {
      const act = prefs.roundId === opt.id ? " is-active" : "";
      return '<button type="button" class="akp-opt-card' + act + '" data-akp-round="' + esc(ctx, opt.id) + '">' +
        '<strong>' + esc(ctx, opt.title) + '</strong>' +
        '<span>' + esc(ctx, opt.desc) + '</span>' +
      '</button>';
    }).join("");

    const diffCardsHtml = DIFFICULTIES.map(function (d) {
      const act = prefs.diffId === d.id ? " is-active-amber" : "";
      return '<button type="button" class="akp-opt-card' + act + '" data-akp-diff="' + esc(ctx, d.id) + '">' +
        '<strong>' + esc(ctx, d.title) + '</strong>' +
        '<span>' + esc(ctx, d.desc) + '</span>' +
      '</button>';
    }).join("");

    const avatarHtml = AVATARS.map(function (av) {
      const act = prefs.avatarId === av.id ? " is-active" : "";
      return '<button type="button" class="akp-avatar-btn' + act + '" data-akp-avatar="' + esc(ctx, av.id) + '">' +
        esc(ctx, av.label) +
      '</button>';
    }).join("");

    const rivalsHtml = AI_RIVALS.map(function (r) {
      return '<span class="akp-rival-chip">' + esc(ctx, r.icon + " " + r.name) + '</span>';
    }).join("");

    stageEl.innerHTML =
      '<div class="akp-root">' +
        '<div class="akp-lobby-grid">' +
          '<div class="akp-card">' +
            '<div class="akp-card-head">' +
              '<div>' +
                '<h2 class="akp-title">🏆 Kahoot Podium Blitz</h2>' +
                '<p class="akp-sub">Race 5 HVAC AI rivals on a decaying 1,000-pt speed clock, stack streak flames, and climb to 1st place on the live podium!</p>' +
              '</div>' +
              '<span class="badge cyan">Live 6-Tech Lobby</span>' +
            '</div>' +

            '<div class="akp-section-label"><span>1. Match Length</span><span>1,000 → 500 pts/Q</span></div>' +
            '<div class="akp-option-grid">' + roundCardsHtml + '</div>' +

            '<div class="akp-section-label"><span>2. AI Rival Crew Difficulty</span><span>Bolt Multiplier</span></div>' +
            '<div class="akp-option-grid">' + diffCardsHtml + '</div>' +

            '<div class="akp-section-label"><span>3. Choose Your Callsign</span><span>Podium Badge</span></div>' +
            '<div class="akp-avatar-grid">' + avatarHtml + '</div>' +

            '<div class="akp-filter-row">' +
              '<label for="akp-topic-select">Topic Filter:</label>' +
              '<select id="akp-topic-select" class="select-input">' + secOptionsHtml + '</select>' +
            '</div>' +

            '<div class="akp-lobby-actions">' +
              '<button type="button" class="btn primary akp-start-btn" id="akp-start-btn">🚀 Enter Kahoot Arena!</button>' +
              '<button type="button" class="btn" id="akp-back-solo-btn">⬅️ Back to Crate Quest</button>' +
            '</div>' +
          '</div>' +

          '<div class="akp-card">' +
            '<div class="akp-card-head">' +
              '<h3 class="akp-title" style="font-size:16.5px;">📊 Your Podium Records &amp; Rig</h3>' +
              '<span class="badge amber">1st: +250 ⚡ Base</span>' +
            '</div>' +

            '<div class="akp-stats-grid">' +
              '<div class="akp-stat-box">' +
                '<div class="akp-stat-val is-cyan">' + bestPts.toLocaleString() + '</div>' +
                '<div class="akp-stat-lbl">Best Podium Score</div>' +
              '</div>' +
              '<div class="akp-stat-box">' +
                '<div class="akp-stat-val is-amber">' + totalWins + '</div>' +
                '<div class="akp-stat-lbl">🥇 1st Place Trophies</div>' +
              '</div>' +
              '<div class="akp-stat-box">' +
                '<div class="akp-stat-val is-emerald">' + bestPct + '%</div>' +
                '<div class="akp-stat-lbl">Best Accuracy</div>' +
              '</div>' +
            '</div>' +

            '<div class="akp-van-strip">' +
              '<span>🚐 Active Service Van:</span>' +
              '<span>x' + Number(van.mult || 1).toFixed(2) + ' Bolts</span>' +
              '<span>• ' + (Number(van.shields) || 0) + ' 🛡️ Shields</span>' +
              '<span>• +' + (Number(van.sec) || 0) + 's Clock</span>' +
            '</div>' +

            '<div class="akp-section-label" style="margin-top:8px;"><span>⚡ 3 Single-Use Tactical Power-Ups</span><span>1 Each / Match</span></div>' +
            '<div class="akp-power-preview-list">' +
              '<div class="akp-power-preview">' +
                '<span class="akp-power-icon">✂️</span>' +
                '<div><strong>50/50 Cut [Q]</strong><small>Eliminates 2 incorrect choices on your current question.</small></div>' +
              '</div>' +
              '<div class="akp-power-preview">' +
                '<span class="akp-power-icon">🧊</span>' +
                '<div><strong>Cryo Freeze [W]</strong><small>Freezes the speed timer for 8 seconds so you keep max speed points.</small></div>' +
              '</div>' +
              '<div class="akp-power-preview">' +
                '<span class="akp-power-icon">⚡</span>' +
                '<div><strong>2x Points Surge [E]</strong><small>Doubles total Kahoot points and Shop Bolts earned on a correct answer.</small></div>' +
              '</div>' +
            '</div>' +

            '<div class="akp-section-label"><span>🤖 5 AI HVAC Rivals</span><span>Live Standings</span></div>' +
            '<div class="akp-rival-chips">' + rivalsHtml + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    stageEl.querySelectorAll("[data-akp-round]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (typeof ctx.playSound === "function") ctx.playSound("click");
        prefs.roundId = btn.getAttribute("data-akp-round");
        render();
      });
    });

    stageEl.querySelectorAll("[data-akp-diff]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (typeof ctx.playSound === "function") ctx.playSound("click");
        prefs.diffId = btn.getAttribute("data-akp-diff");
        render();
      });
    });

    stageEl.querySelectorAll("[data-akp-avatar]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (typeof ctx.playSound === "function") ctx.playSound("click");
        prefs.avatarId = btn.getAttribute("data-akp-avatar");
        render();
      });
    });

    const sel = document.getElementById("akp-topic-select");
    if (sel) {
      sel.addEventListener("change", function (e) {
        prefs.sectionFilter = e.target.value;
      });
    }

    const startBtn = document.getElementById("akp-start-btn");
    if (startBtn) {
      startBtn.addEventListener("click", function () {
        startMatch(null);
      });
    }

    const backBtn = document.getElementById("akp-back-solo-btn");
    if (backBtn) {
      backBtn.addEventListener("click", function () {
        stop();
        if (typeof ctx.playSound === "function") ctx.playSound("click");
        if (typeof ctx.setArenaMode === "function") ctx.setArenaMode("solo");
      });
    }
  }

  function getPoolCount(ctx, filterKey) {
    if (ctx && typeof ctx.getFilteredBlitz === "function") {
      const res = ctx.getFilteredBlitz(filterKey);
      return Array.isArray(res) ? res.length : 0;
    }
    return Array.isArray(ctx && ctx.blitzQuestions) ? ctx.blitzQuestions.length : 0;
  }

  function renderPlaying(stageEl, ctx) {
    const q = match.queue[match.qIndex];
    const totalQ = match.queue.length;
    const potBase = calcPotentialBasePts(match.timeLeftMs, match.totalTimeMs);
    const nextStreakBonus = getStreakBonus(match.playerStreak + 1);
    const timerPct = Math.max(0, (match.timeLeftMs / match.totalTimeMs) * 100);
    const frozen = match.freezeLeftMs > 0;
    const secText = (typeof ctx.sectionLabel === "function") ? ctx.sectionLabel(q.section_id) : (q.section_id || "");
    const epaBadge = (typeof ctx.renderEpa608Badge === "function") ? ctx.renderEpa608Badge(q) : "";
    const imgUri = safeImgSrc(q.image_data_uri);

    let timerStyleColor = "#38bdf8";
    if (!frozen) {
      if (timerPct < 25) timerStyleColor = "#f43f5e";
      else if (timerPct < 55) timerStyleColor = "#f59e0b";
    }

    const tilesHtml = match.displayedChoices.map(function (opt, idx) {
      let extraCls = "";
      let isDisabled = match.answered || opt.eliminated;
      if (opt.eliminated && !match.answered) {
        extraCls = " dimmed";
      } else if (match.answered) {
        if (opt.isCorrect) extraCls = " reveal-correct";
        else if (idx === match.selectedDisplayIdx) extraCls = " reveal-wrong";
        else extraCls = " dimmed";
      }
      return '<button type="button" class="kahoot-tile c' + (idx % 4) + extraCls + '" data-akp-choice="' + idx + '" ' + (isDisabled ? "disabled" : "") + '>' +
        '<span class="tile-shape">' + SHAPES[idx % 4] + '</span>' +
        '<span style="flex:1;">' + esc(ctx, opt.text) + '</span>' +
        '<span class="tile-key">[' + (idx + 1) + ']</span>' +
      '</button>';
    }).join("");

    let feedbackHtml = "";
    if (match.answered) {
      const bd = match.lastBreakdown || {};
      const isOk = Boolean(bd.isCorrect);
      const correctChoice = match.displayedChoices.find(function (c) { return c.isCorrect; });
      const headline = isOk
        ? "✅ RIGHT ON TARGET!"
        : (match.timedOut ? "⏰ TIME'S UP!" : "❌ MISSED!");
      const breakdownHtml = isOk
        ? '<div class="akp-breakdown">' +
            '<span class="akp-pts-chip">+' + bd.totalKahootPts.toLocaleString() + ' pts (' +
              'Speed +' + bd.basePts +
              (bd.streakBonus > 0 ? (' · Streak +' + bd.streakBonus) : '') +
              (bd.doubleWasActive ? ' · ⚡ ×2 Surge' : '') +
            ')</span>' +
            '<span class="akp-bolts-chip">+' + bd.earnedBolts + ' ⚡ Shop Bolts</span>' +
          '</div>'
        : (bd.shieldSaved
            ? '<div class="akp-breakdown"><span class="badge cyan">🛡️ Streak Shield Saved Your Streak!</span></div>'
            : '');

      feedbackHtml =
        '<div class="feedback-banner ' + (isOk ? "ok" : "bad") + '">' +
          '<div style="flex:1;min-width:240px;">' +
            '<strong>' + headline + '</strong> ' +
            (!isOk && correctChoice ? '<span>Correct answer: <strong>' + esc(ctx, correctChoice.text) + '</strong></span>' : '') +
            breakdownHtml +
            (q.explanation ? '<div style="font-size:13.5px;color:#e2e8f0;margin-top:6px;">' + esc(ctx, q.explanation) + '</div>' : '') +
            (q.trap_note ? '<div style="font-size:13px;color:#fecdd3;margin-top:4px;"><strong>⚠️ Exam Trap:</strong> ' + esc(ctx, q.trap_note) + '</div>' : '') +
          '</div>' +
          '<button type="button" class="btn primary" id="akp-to-scoreboard-btn">📊 View Standings [Enter] ➡️</button>' +
        '</div>';
    }

    const cutUsed = match.powerUpsUsed.cut;
    const freezeUsed = match.powerUpsUsed.freeze;
    const doubleUsed = match.powerUpsUsed.double;

    stageEl.innerHTML =
      '<div class="akp-root">' +
        '<div class="solo-hud">' +
          '<div class="akp-hud-left">' +
            '<span class="badge cyan">Q ' + (match.qIndex + 1) + ' / ' + totalQ + '</span>' +
            '<span class="badge emerald">🏆 Score: ' + match.playerScore.toLocaleString() + '</span>' +
            '<span class="badge amber">🔥 Streak: ' + match.playerStreak + (nextStreakBonus > 0 ? ' (+' + nextStreakBonus + ' next)' : '') + '</span>' +
            '<span class="akp-potential-pill' + (match.doublePointsActive ? ' is-double' : '') + '" id="akp-potential-pts">🎯 Potential: ' + potBase + (match.doublePointsActive ? ' ×2' : '') + ' pts</span>' +
            '<span class="akp-freeze-pill' + (frozen ? '' : ' hidden') + '" id="akp-freeze-badge">🧊 FROZEN ' + Math.ceil(match.freezeLeftMs / 1000) + 's</span>' +
            (match.shields > 0 ? '<span class="badge cyan">🛡️ ' + match.shields + '</span>' : '') +
          '</div>' +
          '<div class="akp-hud-right">' +
            '<button type="button" class="btn sm coral" id="akp-quit-match-btn">🏁 End Match</button>' +
          '</div>' +
        '</div>' +

        '<div class="timer-bar-wrap">' +
          '<div class="timer-bar-fill' + (frozen ? ' akp-timer-frozen' : '') + '" id="akp-timer-bar" style="width:' + timerPct + '%;' + (frozen ? '' : ('background-color:' + timerStyleColor + ';')) + '"></div>' +
        '</div>' +

        '<div class="akp-power-bar">' +
          '<button type="button" class="akp-power-btn" id="akp-btn-cut" ' + ((cutUsed || match.answered) ? 'disabled' : '') + '>' +
            '<span>✂️ 50/50 Cut' + (cutUsed ? ' (Used)' : '') + '</span>' +
            '<span class="akp-power-key">[Q]</span>' +
          '</button>' +
          '<button type="button" class="akp-power-btn' + (frozen ? ' is-freeze-active' : '') + '" id="akp-btn-freeze" ' + ((freezeUsed || match.answered) ? 'disabled' : '') + '>' +
            '<span>🧊 Cryo Freeze' + (frozen ? ' (Active)' : (freezeUsed ? ' (Used)' : '')) + '</span>' +
            '<span class="akp-power-key">[W]</span>' +
          '</button>' +
          '<button type="button" class="akp-power-btn' + (match.doublePointsActive ? ' is-active' : '') + '" id="akp-btn-double" ' + ((doubleUsed || match.answered) ? 'disabled' : '') + '>' +
            '<span>⚡ 2x Points Surge' + (match.doublePointsActive ? ' (Armed)' : (doubleUsed ? ' (Used)' : '')) + '</span>' +
            '<span class="akp-power-key">[E]</span>' +
          '</button>' +
        '</div>' +

        '<div class="quiz-question-card' + (q.is_epa_608 ? ' is-epa608' : '') + '">' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">' +
            (secText ? '<span class="badge muted">' + esc(ctx, secText) + '</span>' : '') +
            epaBadge +
            (q.is_trap ? '<span class="badge coral">⚠️ EXAM TRAP</span>' : '') +
            (match.doublePointsActive ? '<span class="badge amber">⚡ 2X SURGE ACTIVE</span>' : '') +
          '</div>' +
          '<h2 class="quiz-q-text">' + esc(ctx, q.question) + '</h2>' +
          (imgUri ? '<img class="quiz-q-img" src="' + esc(ctx, imgUri) + '" alt="Question visual">' : '') +
        '</div>' +

        '<div class="kahoot-grid">' + tilesHtml + '</div>' +
        feedbackHtml +
      '</div>';

    stageEl.querySelectorAll("[data-akp-choice]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        handleAnswer(Number(btn.getAttribute("data-akp-choice")), false);
      });
    });

    const cutBtn = document.getElementById("akp-btn-cut");
    if (cutBtn) cutBtn.addEventListener("click", activateCut);
    const freezeBtn = document.getElementById("akp-btn-freeze");
    if (freezeBtn) freezeBtn.addEventListener("click", activateFreeze);
    const doubleBtn = document.getElementById("akp-btn-double");
    if (doubleBtn) doubleBtn.addEventListener("click", activateDouble);

    const sbBtn = document.getElementById("akp-to-scoreboard-btn");
    if (sbBtn) sbBtn.addEventListener("click", advanceToScoreboard);

    const quitBtn = document.getElementById("akp-quit-match-btn");
    if (quitBtn) {
      quitBtn.addEventListener("click", function () {
        if (match.answeredCount > 0) {
          if (match.answered) {
            advanceAiRivals(match);
            match.latestStandings = buildStandings(match);
          } else if (!match.latestStandings || match.latestStandings.length === 0) {
            match.latestStandings = buildStandings(match);
          }
          enterPodium();
        } else {
          returnToLobby();
        }
      });
    }
  }

  function formatClimberBadge(delta) {
    if (delta > 0) return '<span class="akp-climb up">▲ +' + delta + '</span>';
    if (delta < 0) return '<span class="akp-climb down">▼ ' + delta + '</span>';
    return '<span class="akp-climb flat">—</span>';
  }

  function renderScoreboard(stageEl, ctx) {
    const standings = match.latestStandings && match.latestStandings.length > 0
      ? match.latestStandings
      : buildStandings(match);
    const playerRow = standings.find(function (s) { return s.isPlayer; }) || standings[0];
    const firstRow = standings[0];
    const secondRow = standings[1];

    let gapHtml = "";
    if (playerRow.rank === 1) {
      const lead = secondRow ? (playerRow.score - secondRow.score) : playerRow.score;
      gapHtml = lead > 0
        ? ('🥇 Leading by ' + lead.toLocaleString() + ' pts!')
        : '🥇 Tied for 1st place!';
    } else {
      const gap = firstRow.score - playerRow.score;
      gapHtml = '🎯 ' + gap.toLocaleString() + ' pts behind 1st place (' + esc(ctx, firstRow.name) + ')!';
    }

    const rowsHtml = standings.map(function (row, idx) {
      const rowCls = "akp-lb-row" + (row.isPlayer ? " is-player" : "") + (row.rank === 1 ? " is-rank1" : "");
      const deltaCls = row.lastRoundPts > 0 ? "pos" : "zero";
      const deltaText = row.lastRoundPts > 0 ? ("+" + row.lastRoundPts.toLocaleString()) : "+0";
      const streakText = row.streak > 0 ? ("🔥 " + row.streak) : "—";
      return '<div class="' + rowCls + '" style="animation-delay:' + (idx * 55) + 'ms;">' +
        '<div class="akp-lb-rank">#' + row.rank + '</div>' +
        '<div>' + formatClimberBadge(row.rankDelta) + '</div>' +
        '<div class="akp-lb-player">' +
          '<span style="font-size:19px;">' + esc(ctx, row.icon) + '</span>' +
          '<span class="akp-lb-name">' + esc(ctx, row.name) + '</span>' +
          (row.isPlayer ? '<span class="akp-you-tag">YOU</span>' : '') +
        '</div>' +
        '<div class="akp-lb-streak">' + streakText + '</div>' +
        '<div class="akp-lb-delta ' + deltaCls + '">' + deltaText + '</div>' +
        '<div class="akp-lb-score">' + row.score.toLocaleString() + '</div>' +
      '</div>';
    }).join("");

    const isFinalQ = (match.qIndex + 1) >= match.queue.length;
    const nextLabel = isFinalQ ? "🏆 Reveal Final Podium [Enter] ➡️" : "Next Question [Enter] ➡️";

    stageEl.innerHTML =
      '<div class="akp-root">' +
        '<div class="akp-card akp-sb-shell">' +
          '<div class="akp-card-head">' +
            '<div>' +
              '<h2 class="akp-title">📊 Live Arena Standings</h2>' +
              '<p class="akp-sub">After Question ' + (match.qIndex + 1) + ' of ' + match.queue.length + ' • ' + esc(ctx, match.diffSpec.title) + '</p>' +
            '</div>' +
            '<span class="badge cyan">Your Rank: #' + playerRow.rank + ' / 6</span>' +
          '</div>' +

          '<div class="akp-gap-callout">' +
            '<span>' + gapHtml + '</span>' +
            '<span class="badge amber">' + esc(ctx, match.avatar.label) + ': ' + playerRow.score.toLocaleString() + ' pts</span>' +
          '</div>' +

          '<div class="akp-lb-list">' + rowsHtml + '</div>' +

          '<div class="akp-sb-actions">' +
            '<button type="button" class="btn coral" id="akp-finish-early-btn">🏁 Finish Early</button>' +
            '<button type="button" class="btn primary" id="akp-next-from-sb-btn">' + nextLabel + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    const nextBtn = document.getElementById("akp-next-from-sb-btn");
    if (nextBtn) nextBtn.addEventListener("click", advanceFromScoreboard);

    const earlyBtn = document.getElementById("akp-finish-early-btn");
    if (earlyBtn) earlyBtn.addEventListener("click", enterPodium);
  }

  function renderPodium(stageEl, ctx) {
    const standings = match.latestStandings && match.latestStandings.length > 0
      ? match.latestStandings
      : buildStandings(match);
    const playerRow = standings.find(function (s) { return s.isPlayer; }) || standings[0];
    const pct = match.answeredCount > 0 ? Math.round((match.correctCount / match.answeredCount) * 100) : 0;

    const first = standings[0];
    const second = standings[1];
    const third = standings[2];
    const podiumOrder = [
      { entry: second, cls: "is-second", medal: "🥈", label: "2nd" },
      { entry: first, cls: "is-first", medal: "🥇", label: "1st" },
      { entry: third, cls: "is-third", medal: "🥉", label: "3rd" }
    ];

    const podiumColsHtml = podiumOrder.map(function (slot) {
      if (!slot.entry) return "";
      const e = slot.entry;
      const pCls = e.isPlayer ? " is-player-col" : "";
      return '<div class="akp-podium-col ' + slot.cls + pCls + '">' +
        '<div class="akp-podium-cap">' +
          '<div class="akp-podium-avatar">' + esc(ctx, e.icon) + '</div>' +
          '<div class="akp-podium-name">' + esc(ctx, e.name) + (e.isPlayer ? ' (YOU)' : '') + '</div>' +

            return true;

          return false;

            e.preventDefault();

  function shuffleArray(arr) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = copy[i];
      copy[i] = copy[j];
      copy[j] = tmp;

    return copy;

  function normTerm(s) {
    const clean = String(s == null ? "" : s)
      .trim()
      .replace(/\s+/g, " ")
      .replace(/\u2126/g, "\u03A9");
    const re = /(^|[\s(\[+\-*/=<>÷×≠±·\d])([Mm])(\s*)(Ω|ohms?|Hz|Pa|[WVAJFH])(?![A-Za-z])/gi;
    let out = "";
    let last = 0;
    let m;
    while ((m = re.exec(clean)) !== null) {
      out += clean.slice(last, m.index).toLowerCase();
      out += m[1].toLowerCase() + m[2] + m[3] + m[4].toLowerCase();
      last = re.lastIndex;
    }
    out += clean.slice(last).toLowerCase();
    return out;
  }

  function hashSeed(str) {
    let h = 2166136261;
    const s = String(str || "");
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function deterministicShuffle(arr, seedStr) {
    const copy = arr.slice();
    let seed = hashSeed(seedStr) || 1;
    for (let i = copy.length - 1; i > 0; i--) {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      const j = seed % (i + 1);
      const tmp = copy[i];
      copy[i] = copy[j];
      copy[j] = tmp;

  function extractNotesList() {

  function parseNoteSegments(note) {
    if (note.segments) {
      return note.segments.map(function (seg) {
        if (typeof seg === "string") return { text: seg, blank: false };
        return { text: String(seg.text || seg.value || ""), blank: Boolean(seg.blank || seg.is_blank) };

    const text = note.text || "";

    // Format with explicit blanks array and placeholders
    if (note.blanks && note.blanks.length > 0) {
      const re = /(\{\{(?:\d+|blank)\}\}|_{3,}|\[blank\])/gi;
      let lastIdx = 0;
      let bIdx = 0;
      let m;
      while ((m = re.exec(text)) !== null) {
        if (m.index > lastIdx) {
          segs.push({ text: text.slice(lastIdx, m.index), blank: false });
        }
        const ans = note.blanks[bIdx] != null ? String(note.blanks[bIdx]) : "____";
        segs.push({ text: ans, blank: true });
        bIdx++;

      }
      if (lastIdx < text.length) {
        segs.push({ text: text.slice(lastIdx), blank: false });
      }
      if (segs.some(function (s) { return s.blank; })) {

    if (segs.length > 0) {
      if (last < text.length) {
        segs.push({ text: text.slice(last), blank: false });

      }
    }
    if (Array.isArray(DATA.word_bank) && DATA.word_bank.length > 0) {
      DATA.word_bank.forEach(addWord);
    } else {
      parsedNotes.forEach(function (n) {
        n.parsedSegs.forEach(function (s) {
          if (s.blank) addWord(s.text);
        });
      });
    }
    words.sort(function (a, b) {
      return a.toLowerCase().localeCompare(b.toLowerCase());
    });
    return words;
  }

  const FALLBACK_HVAC_TERMS = [
    "Thermostatic Expansion Valve (TXV)",
    "Evaporator Coil",
    "Condenser Coil",
    "Compressor",
    "Subcooling",
    "Superheat",
    "Filter-Drier",
    "Suction Line",
    "Liquid Line",
    "Reversing Valve"
  ];

  function getWordChoicesForItem(item, targetAnswer) {
    const fallbackTarget = String(targetAnswer || (item && (item.guided_blank || item.answer || item.back)) || "").trim();
    const itemChoices = item && Array.isArray(item.word_choices) ? item.word_choices : [];
    const itemCorrectIdx = item && typeof item.correct_choice_index === "number" ? item.correct_choice_index : -1;

    if (itemChoices.length >= 2) {
      const cleaned = [];
      const seenC = Object.create(null);
      itemChoices.forEach(function (c) {
        const txt = String(c == null ? "" : c).trim();
        const k = normTerm(txt);
        if (txt && !seenC[k]) {
          seenC[k] = true;
          cleaned.push(txt);
        }
      });
      if (cleaned.length >= 2) {
        let resolvedIdx = -1;
        if (targetAnswer) {
          const tNorm = normTerm(targetAnswer);
          resolvedIdx = cleaned.findIndex(function (c) { return normTerm(c) === tNorm; });
        } else if (itemCorrectIdx >= 0 && itemCorrectIdx < itemChoices.length) {
          const origAns = normTerm(itemChoices[itemCorrectIdx]);
          resolvedIdx = cleaned.findIndex(function (c) { return normTerm(c) === origAns; });
        } else if (fallbackTarget) {
          const fNorm = normTerm(fallbackTarget);
          resolvedIdx = cleaned.findIndex(function (c) { return normTerm(c) === fNorm; });
        }
        if (resolvedIdx !== -1) {
          return { choices: cleaned, correctIndex: resolvedIdx };
        }
      }
    }

    const correctText = fallbackTarget || "Verified Concept";
    const cNorm = normTerm(correctText);
    const pool = [];
    const seen = Object.create(null);
    seen[cNorm] = true;

    function pushCandidate(raw) {
      const s = String(raw == null ? "" : raw).trim();
      if (!s) return;
      const k = normTerm(s);
      if (seen[k]) return;
      seen[k] = true;
      pool.push(s);
    }

    if (/^option\s+[a-z]$/i.test(correctText)) {
      ["Option A", "Option B", "Option C", "Option D", "Option E", "Option F"].forEach(pushCandidate);
    } else if (/^false\b/i.test(cNorm)) {
      ["TRUE (accurate)", "ALWAYS required", "ONLY in summer"].forEach(pushCandidate);
    }

    wordBankList.forEach(pushCandidate);
    cards.forEach(function (c) { pushCandidate(c.guided_blank || c.back); });
    matchPairs.forEach(function (p) { pushCandidate(p.term); });
    FALLBACK_HVAC_TERMS.forEach(pushCandidate);

    const seed = (item && item.id ? item.id : "item") + "::" + cNorm;
    const shuffledDistractors = deterministicShuffle(pool, seed).slice(0, 3);
    const combined = [correctText].concat(shuffledDistractors);
    const finalChoices = deterministicShuffle(combined, seed + "::order");
    return {
      choices: finalChoices,
      correctIndex: finalChoices.findIndex(function (c) { return normTerm(c) === cNorm; })
    };
  }

  function shortenTakeaway(txt) {
    const firstLine = String(txt || "").trim().split(/\r?\n/)[0].trim();
    if (!firstLine) return "";
    if (firstLine.length <= 125) return firstLine;
    return firstLine.slice(0, 122).replace(/\s+\S*$/, "") + "...";
  }

  function getScenarioChoices(sc) {
    if (sc && Array.isArray(sc.concept_choices) && sc.concept_choices.length >= 2 &&

      };
    }
    const correctText = shortenTakeaway(sc && sc.analysis) ||
      "Verify system specifications, follow safety procedures, and document measured readings.";
    const cNorm = normTerm(correctText);
    const pool = [];
    const seen = Object.create(null);
    seen[cNorm] = true;
    function pushCand(raw) {
      const s = shortenTakeaway(raw);
      if (!s) return;
      const k = normTerm(s);
      if (seen[k]) return;
      seen[k] = true;
      pool.push(s);
    }
    criticalThinking.forEach(function (other) {

    });
    [
      "Bypass safety controls and continue operating the equipment without baseline checks",
      "Skip documenting measurements and replace major components by guesswork alone",
      "Ignore manufacturer procedures and rely solely on visual estimation"
    ].forEach(pushCand);

    const seed = "scen::" + (sc && sc.id ? sc.id : "0");
    const distractors = deterministicShuffle(pool, seed).slice(0, 3);
    const combined = [correctText].concat(distractors);
    const finalChoices = deterministicShuffle(combined, seed + "::order");
    return {
      choices: finalChoices,
      correctIndex: finalChoices.findIndex(function (c) { return normTerm(c) === cNorm; })
    };
  }

  // === 2-STRIKE / 30s LOCKOUT HELPERS ===
  function stopLockoutTicker() {
    if (lockoutTickerId != null) {
      window.clearInterval(lockoutTickerId);
      lockoutTickerId = null;
    }
  }

  function getLockoutRemainingMs(lockKey) {
    if (!state.entryLockouts || typeof state.entryLockouts !== "object") return 0;
    const unlockAt = Number(state.entryLockouts[lockKey]);
    if (!Number.isFinite(unlockAt) || unlockAt <= 0) return 0;
    const now = Date.now();
    if (unlockAt <= now) {
      delete state.entryLockouts[lockKey];
      if (lastWrongAttempt && ("blank:" + lastWrongAttempt.bKey) === lockKey) {
        lastWrongAttempt = null;
      }
      SHELL.save();
      return 0;
    }
    return unlockAt - now;
  }

  function getLockoutRemainingSec(lockKey) {
    const remMs = getLockoutRemainingMs(lockKey);
    return remMs > 0 ? Math.ceil(remMs / 1000) : 0;
  }

  function isEntryLocked(lockKey) {
    return getLockoutRemainingMs(lockKey) > 0;
  }

  function recordCorrectAndClearStrikes(lockKey) {
    if (state.entryWrongStreaks) delete state.entryWrongStreaks[lockKey];
    if (state.entryLockouts) delete state.entryLockouts[lockKey];
  }

  function ensureLockoutTicker() {
    if (!state.entryLockouts || Object.keys(state.entryLockouts).length === 0) {
      stopLockoutTicker();
      return;
    }
    if (lockoutTickerId != null) return;
    lockoutTickerId = window.setInterval(function () {
      const locks = state.entryLockouts || {};
      const keys = Object.keys(locks);
      if (keys.length === 0) {
        stopLockoutTicker();
        return;
      }
      const now = Date.now();
      let anyExpired = false;
      keys.forEach(function (k) {
        const unlockAt = Number(locks[k]);
        if (!Number.isFinite(unlockAt) || unlockAt <= now) {
          delete locks[k];
          if (lastWrongAttempt && ("blank:" + lastWrongAttempt.bKey) === k) {
            lastWrongAttempt = null;
          }
          anyExpired = true;
        } else {
          const remSec = Math.ceil((unlockAt - now) / 1000);
          document.querySelectorAll("[data-lock-rem]").forEach(function (el) {
            if (el.getAttribute("data-lock-rem") === k) {
              el.textContent = remSec + "s";
            }
          });
          document.querySelectorAll("[data-lock-msg]").forEach(function (el) {
            if (el.getAttribute("data-lock-msg") === k) {
              const tpl = el.getAttribute("data-lock-template");
              if (tpl) {
                el.textContent = tpl.replace(/\{sec\}/g, remSec + "s");
              } else {
                const pref = el.getAttribute("data-lock-prefix") || "";
                const suff = el.getAttribute("data-lock-suffix") || "";
                el.textContent = pref + remSec + "s" + suff;
              }
            }
          });
        }
      });
      if (Object.keys(locks).length === 0) {
        stopLockoutTicker();
      }
      if (anyExpired) {
        SHELL.save();
        if (activeTopTab === "tab-study" && !printRestoreState) {
          renderActiveStudySubTab();
        }
      }
    }, 250);
  }

    if (!state.entryLockouts || typeof state.entryLockouts !== "object") {

    }
    const strikes = (Number(state.entryWrongStreaks[lockKey]) || 0) + 1;
    if (strikes >= MAX_WRONG_TRIES) {
      delete state.entryWrongStreaks[lockKey];
      state.entryLockouts[lockKey] = Date.now() + LOCKOUT_DURATION_MS;
      ensureLockoutTicker();
      return { locked: true, strikes: MAX_WRONG_TRIES, remSec: Math.ceil(LOCKOUT_DURATION_MS / 1000) };

    state.entryWrongStreaks[lockKey] = strikes;
    return { locked: false, strikes: strikes, remSec: 0 };

  // === SUBTAB 1.2: GUIDED BLANK NOTES (SCRAMBLED WORD LIST + CLICK/DRAG) ===
  function computeScrambleRank(chNum, nonce, norm) {
    let h = hashSeed(String(chNum) + "::" + String(nonce) + "::" + String(norm));
    h = (Math.imul(h, 1664525) + 1013904223) >>> 0;
    h ^= h >>> 16;
    h = Math.imul(h, 0x85ebca6b) >>> 0;
    h ^= h >>> 13;
    h = Math.imul(h, 0xc2b2ae35) >>> 0;
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  function arrayOrderEquals(a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) {
      if (a[i] !== b[i]) return false;
    }
    return true;
  }

  function orderScrambledBankEntries(scopedBankMap, chNum) {
    const entries = Object.keys(scopedBankMap).map(function (k) {
      const e = scopedBankMap[k];
      e.exhausted = e.solved >= e.total;
      if (wordScrambleRanks[e.norm] == null) {
        wordScrambleRanks[e.norm] = computeScrambleRank(chNum, scrambleNonce, e.norm);
      }
      return e;
    });
    if (entries.length < 2) return entries;

    entries.sort(function (a, b) {
      const da = wordScrambleRanks[a.norm];
      const db = wordScrambleRanks[b.norm];
      if (da !== db) return da - db;
      return a.norm.localeCompare(b.norm);
    });

    const alphaByNorm = entries.slice().sort(function (a, b) {
      return a.norm.localeCompare(b.norm);
    }).map(function (e) { return e.norm; });
    const alphaByText = entries.slice().sort(function (a, b) {
      return a.text.toLowerCase().localeCompare(b.text.toLowerCase());
    }).map(function (e) { return e.norm; });
    const seqOrder = entries.slice().sort(function (a, b) {
      return a.seqIdx - b.seqIdx;
    }).map(function (e) { return e.norm; });

    function isNaturalOrder(arr) {
      const norms = arr.map(function (e) { return e.norm; });
      return arrayOrderEquals(norms, alphaByNorm) ||
        arrayOrderEquals(norms, alphaByText) ||
        arrayOrderEquals(norms, seqOrder);
    }

    if (isNaturalOrder(entries)) {
      const n = entries.length;
      let fixed = null;
      for (let shift = 1; shift < n; shift++) {
        const rot = entries.slice(shift).concat(entries.slice(0, shift));
        if (!isNaturalOrder(rot)) {
          fixed = rot;
          break;
        }
      }
      if (!fixed) {
        const swapped = entries.slice();
        const tmp = swapped[0];
        swapped[0] = swapped[1];
        swapped[1] = tmp;
        fixed = swapped;
      }
      return fixed;
    }
    return entries;
  }

  function getBlankSiblingSignature(meta) {
    if (!meta || !meta.note) return "";
    const n = meta.note;
    const gp = normTerm(n.guided_prefix);
    const gs = normTerm(n.guided_suffix);
    if (gp || gs) {
      return "g::" + gp + "||" + gs + "||" + String(n.image_data_uri || "");
    }
    const segs = n.parsedSegs || [];
    const hasStatic = segs.some(function (s) { return !s.blank && normTerm(s.text) !== ""; });
    if (!hasStatic) return "";
    const templateSig = segs.map(function (s, idx) {
      return s.blank ? ("{{B" + (idx === meta.segIndex ? "*" : "") + "}}") : normTerm(s.text);
    }).join("|");
    return "t::" + templateSig + "||" + String(n.image_data_uri || "");
  }

  function attemptBlankChoice(bKey, chosenWord) {
    const meta = blankLookup[bKey];
    if (!meta || state.solvedBlankKeys.indexOf(bKey) !== -1) return;
    const lockKey = "blank:" + bKey;
    if (isEntryLocked(lockKey)) {
      window.playSound("wrong");
      SHELL.showToast("🔒 Locked for " + getLockoutRemainingSec(lockKey) + "s — try another blank or review the section!");
      return;
    }
    const cleanWord = String(chosenWord || "").trim();
    const chosenNorm = normTerm(cleanWord);
    let isCorrect = chosenNorm === normTerm(meta.expectedAnswer);

    if (!isCorrect && chosenNorm) {
      const mySig = getBlankSiblingSignature(meta);
      if (mySig) {
        const siblingKey = Object.keys(blankLookup).find(function (sibKey) {
          if (sibKey === bKey || state.solvedBlankKeys.indexOf(sibKey) !== -1) return false;
          const sib = blankLookup[sibKey];
          return getBlankSiblingSignature(sib) === mySig && normTerm(sib.expectedAnswer) === chosenNorm;
        });
        if (siblingKey) {
          const sibling = blankLookup[siblingKey];
          const prevMyAns = meta.expectedAnswer;
          const prevSibAns = sibling.expectedAnswer;
          meta.expectedAnswer = prevSibAns;
          sibling.expectedAnswer = prevMyAns;
          if (meta.note && Array.isArray(meta.note.parsedSegs) && meta.note.parsedSegs[meta.segIndex]) {
            meta.note.parsedSegs[meta.segIndex].text = prevSibAns;
          }
          if (sibling.note && Array.isArray(sibling.note.parsedSegs) && sibling.note.parsedSegs[sibling.segIndex]) {
            sibling.note.parsedSegs[sibling.segIndex].text = prevMyAns;
          }
          isCorrect = true;
        }
      }
    }

    if (isCorrect) {
      window.playSound("correct");
      const hadWrongBeforeSolve =
        (wrongAttemptsByBlank[bKey] && Object.keys(wrongAttemptsByBlank[bKey]).length > 0) ||
        Boolean(state.entryWrongStreaks && Number(state.entryWrongStreaks[lockKey]) > 0);
      recordCorrectAndClearStrikes(lockKey);
      if (state.solvedBlankKeys.indexOf(bKey) === -1) {
        state.solvedBlankKeys.push(bKey);
      }
      activeBlankKey = null;
      selectedBankWord = null;
      lastWrongAttempt = null;

      const noteKeys = getBlankKeysForNote(meta.note);
      const allNoteSolved = noteKeys.every(function (k) {
        return state.solvedBlankKeys.indexOf(k) !== -1;
      });
      const anyWrongOnNote = hadWrongBeforeSolve || noteKeys.some(function (k) {
        return wrongAttemptsByBlank[k] && Object.keys(wrongAttemptsByBlank[k]).length > 0;
      });
      if (allNoteSolved && !anyWrongOnNote) {
        const idxP = state.needsPracticeIds.indexOf(meta.note.id);
        if (idxP !== -1) state.needsPracticeIds.splice(idxP, 1);
        if (state.masteredIds.indexOf(meta.note.id) === -1) {
          state.masteredIds.push(meta.note.id);
        }
      }
      SHELL.save();
      SHELL.refreshHUD();
      if (SHELL.markAwarded("blank_" + bKey)) {
        window.awardXP(10, "Blank solved");
      }
      renderFilterBar();
      renderGuidedNotes();
    } else {
      window.playSound("wrong");
      if (!wrongAttemptsByBlank[bKey]) wrongAttemptsByBlank[bKey] = Object.create(null);
      wrongAttemptsByBlank[bKey][normTerm(cleanWord)] = true;
      const res = recordWrongTryAndMaybeLock(lockKey);
      selectedBankWord = null;
      if (state.masteredIds.indexOf(meta.note.id) === -1 && state.needsPracticeIds.indexOf(meta.note.id) === -1) {
        state.needsPracticeIds.push(meta.note.id);
      }
      if (res.locked) {
        activeBlankKey = null;
        lastWrongAttempt = null;
        SHELL.showToast("🔒 2 incorrect tries — Blank #" + meta.note.num + " locked for " + res.remSec + "s!");
      } else {
        activeBlankKey = bKey;
        lastWrongAttempt = { bKey: bKey, word: cleanWord, strikes: res.strikes };
      }
      SHELL.save();
      renderFilterBar();
      renderGuidedNotes();
      if (!res.locked) {
        const blankEl = Array.prototype.find.call(document.querySelectorAll("#subtab-notes .note-blank[data-blank-key]"), function (el) {
          return el.getAttribute("data-blank-key") === bKey;
        });
        if (blankEl) {
          blankEl.classList.add("flash-wrong");
          window.setTimeout(function () {
            blankEl.classList.remove("flash-wrong");
          }, 420);
        }
      }
    }
  }

  function renderGuidedNotes() {
    const host = document.getElementById("subtab-notes");
    if (!host) return;
    syncNotesPrintVocabClass();
    const prevScrollY = window.scrollY;
    const existingBank = document.getElementById("word-bank-box");
    const prevBankScrollTop = existingBank ? existingBank.scrollTop : 0;

    let filteredNotes = parsedNotes;
    if (activeFilter === "EPA608") {
      filteredNotes = parsedNotes.filter(function (n) { return n.is_epa_608; });
    } else if (activeFilter === "TRAP") {
      filteredNotes = parsedNotes.filter(function (n) { return n.is_trap; });
    } else if (activeFilter === "PRACTICE") {
      filteredNotes = parsedNotes.filter(function (n) { return state.needsPracticeIds.indexOf(n.id) !== -1; });
    } else if (activeFilter !== "ALL") {
      filteredNotes = parsedNotes.filter(function (n) { return n.section_id === activeFilter; });
    }

    const scopedBankMap = Object.create(null);
    const filteredBlankKeys = Object.create(null);
    const seqOrderNorms = [];
    let totalFilteredBlanks = 0;
    let solvedFilteredBlanks = 0;

    filteredNotes.forEach(function (item) {
      let bc = 0;
      item.parsedSegs.forEach(function (seg) {
        if (!seg.blank) return;
        const bKey = item.id + "_b_" + (bc++);
        filteredBlankKeys[bKey] = true;
        totalFilteredBlanks++;
        const isSolved = state.solvedBlankKeys.indexOf(bKey) !== -1;
        if (isSolved) solvedFilteredBlanks++;

        const ansClean = String(seg.text || "").trim();
        const nAns = normTerm(ansClean);
        if (nAns) {
          if (!scopedBankMap[nAns]) {
            scopedBankMap[nAns] = { norm: nAns, text: ansClean, total: 0, solved: 0, seqIdx: seqOrderNorms.length };
            seqOrderNorms.push(nAns);
          }
          scopedBankMap[nAns].total++;
          if (isSolved) scopedBankMap[nAns].solved++;
        }
      });
    });

    const remainingFilteredBlanks = Math.max(0, totalFilteredBlanks - solvedFilteredBlanks);

    if (activeBlankKey && (!filteredBlankKeys[activeBlankKey] || state.solvedBlankKeys.indexOf(activeBlankKey) !== -1 || isEntryLocked("blank:" + activeBlankKey))) {
      activeBlankKey = null;
    }
    if (lastWrongAttempt && (!filteredBlankKeys[lastWrongAttempt.bKey] || state.solvedBlankKeys.indexOf(lastWrongAttempt.bKey) !== -1 || isEntryLocked("blank:" + lastWrongAttempt.bKey))) {
      lastWrongAttempt = null;
    }

    const chNum = DATA.chapter_num || DATA.chapter || "XX";
    const chTitle = DATA.title || DATA.chapter_title || "Chapter Study Guide";
    const bankEntries = orderScrambledBankEntries(scopedBankMap, chNum);

    if (selectedBankWord) {
      const selNorm = normTerm(selectedBankWord);
      const matchEntry = scopedBankMap[selNorm];
      if (!matchEntry || matchEntry.exhausted) {
        selectedBankWord = null;
      }
    }

    const remainingBankTerms = bankEntries.filter(function (e) { return !e.exhausted; }).length;

    const progressText = totalFilteredBlanks > 0 && remainingFilteredBlanks === 0
      ? ("🎉 Solved " + solvedFilteredBlanks + " / " + totalFilteredBlanks + " Blanks (Complete!)")
      : ("✅ Solved " + solvedFilteredBlanks + " / " + totalFilteredBlanks + " Blanks (" + remainingFilteredBlanks + " remaining)");

    const validFigs = getValidFiguresList();
    const figBtnHtml = validFigs.length > 0
      ? '<button type="button" class="btn sm" id="btn-open-figures">🖼️ Reference Figures (' + validFigs.length + ')</button>'
      : "";
    const printVocabBtnHtml = vocabList.length > 0
      ? ('<button type="button" class="btn sm' + (notesPrintVocab ? " primary" : "") + '" id="btn-notes-toggle-print-vocab" aria-pressed="' + (notesPrintVocab ? "true" : "false") + '">' +
          (notesPrintVocab ? "📖 Print w/ Vocab: ON" : "📖 Print w/ Vocab: OFF") +
        '</button>')
      : "";
    const toolbarHtml =
      '<div class="notes-toolbar">' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
          '<strong>📝 Chapter Study Guide — Choose the Correct Term for Each Blank</strong>' +
          '<span class="badge ' + (remainingFilteredBlanks === 0 && totalFilteredBlanks > 0 ? "emerald" : "cyan") + '">' + escHtml(progressText) + '</span>' +
        '</div>' +
        '<div class="notes-toolbar-actions">' +
          figBtnHtml +
          '<button type="button" class="btn sm amber" id="btn-notes-rescramble">🔀 Re-Scramble List</button>' +
          '<button type="button" class="btn sm coral" id="btn-notes-reset">🔄 Reset My Answers</button>' +
          printVocabBtnHtml +
          '<button type="button" class="btn sm emerald" id="btn-notes-print">🖨️ Print Blank Worksheet</button>' +
        '</div>' +
      '</div>';

    let wordBankHtml = "";
    if (bankEntries.length > 0) {
      const hasActiveBlank = Boolean(activeBlankKey && filteredBlankKeys[activeBlankKey]);
      const activeMeta = hasActiveBlank ? (blankLookup[activeBlankKey] || null) : null;
      const activeNoteNum = activeMeta && activeMeta.note ? activeMeta.note.num : "";
      let helperHtml = "";
      if (selectedBankWord) {
        helperHtml =
          '<div class="wb-helper-banner">' +
            '<span>Picked: <strong>«' + escHtml(selectedBankWord) + '»</strong> — now click any blank where it belongs!</span>' +
            '<button type="button" class="btn sm" id="btn-wb-clear-sel">Clear Selection</button>' +
          '</div>';
      } else if (hasActiveBlank) {
        helperHtml =
          '<div class="wb-helper-banner">' +
            '<span>Blank #' + escHtml(activeNoteNum) + ' selected — click the matching word in this Scrambled List!</span>' +
            '<button type="button" class="btn sm" id="btn-wb-clear-sel">Cancel</button>' +
          '</div>';
      }
      wordBankHtml =
        '<div class="word-bank-box' + (hasActiveBlank ? " awaiting-pick" : "") + '" id="word-bank-box">' +
          '<h3 class="word-bank-title">' +
            '<span class="screen-only">🔀 Scrambled Word List (' + remainingBankTerms + ' remaining of ' + bankEntries.length + ' terms — click or drag onto blanks)</span>' +
            '<span class="print-only-inline">Word Bank (' + bankEntries.length + ' Terms — Check off each term as used)</span>' +
          '</h3>' +
          '<div class="word-bank-grid">' +
            bankEntries.map(function (entry, i) {
              const isArmed = Boolean(selectedBankWord && normTerm(selectedBankWord) === entry.norm && !entry.exhausted);
              const cls = "wb-chip" + (entry.exhausted ? " used" : "") + (isArmed ? " armed" : "");
              const titleAttr = entry.total > 1
                ? ' title="' + escHtml((entry.total - entry.solved) + " of " + entry.total + " uses remaining") + '"'
                : "";
              const dragAttr = entry.exhausted ? ' draggable="false"' : ' draggable="true"';
              const multiPrintTag = entry.total > 1 ? '<span class="print-only-inline"> (&times;' + entry.total + ')</span>' : "";
              return '<button type="button" class="' + cls + '" data-wb-idx="' + i + '"' + dragAttr + titleAttr + (entry.exhausted ? " disabled" : "") + '>' +
                '<span class="wb-chip-label">' +
                  (entry.exhausted ? '<span class="screen-only">✅ </span>' : '') +
                  escHtml(entry.text) +
                  multiPrintTag +
                '</span>' +
              '</button>';
            }).join("") +
          '</div>' +
          helperHtml +
        '</div>';
    }

    const customPrintHeading = (DATA.print_heading && String(DATA.print_heading).trim())
      ? String(DATA.print_heading).trim()
      : ("Ch. " + chNum + " Exam Study Guide — " + chTitle);
    const printEditionPrefix = (DATA.edition_label && String(DATA.edition_label).trim())
      ? (escHtml(String(DATA.edition_label).trim()) + " &bull; ")
      : "";
    const printHeaderHtml =
      '<div class="print-only-banner">' +
        '<div class="print-title-row">' +
          '<h2>' + escHtml(customPrintHeading) + '</h2>' +
          '<span class="print-course-tag">' + printEditionPrefix + 'CTE HVAC/R &bull; CIP 47.0201</span>' +
        '</div>' +
        '<div class="print-student-grid">' +
          '<div class="print-field"><span class="print-field-lbl">Name:</span><span class="print-field-line"></span></div>' +
          '<div class="print-field"><span class="print-field-lbl">Date:</span><span class="print-field-line"></span></div>' +
          '<div class="print-field"><span class="print-field-lbl">Block / Hr:</span><span class="print-field-line"></span></div>' +
          '<div class="print-field"><span class="print-field-lbl">Score:</span><span class="print-field-line"></span><span>/ ' + escHtml(totalFilteredBlanks) + '</span></div>' +
        '</div>' +
        '<div class="print-directions"><strong>Directions:</strong> Write the correct term from the Word Bank on each blank line to complete every statement. Check off each term as you use it.</div>' +
      '</div>';

    function renderNoteItemHtml(item, displayNum) {
      let blankCounter = 0;
      let itemAllSolved = true;
      let itemWrongKey = null;
      const lockedBlanksForItem = [];

      const lineHtml = item.parsedSegs.map(function (seg) {
        if (!seg.blank) return escHtml(seg.text);
        const bKey = item.id + "_b_" + (blankCounter++);
        const isSolved = state.solvedBlankKeys.indexOf(bKey) !== -1;
        if (isSolved) {
          return '<span class="note-blank is-solved"><span class="screen-only">✅ ' + escHtml(seg.text) + '</span><span class="print-blank-line"></span></span>';
        }
        itemAllSolved = false;
        const bLockKey = "blank:" + bKey;
        if (isEntryLocked(bLockKey)) {
          const remSec = getLockoutRemainingSec(bLockKey);
          lockedBlanksForItem.push({ lockKey: bLockKey, remSec: remSec });
          return '<button type="button" class="note-blank is-unsolved is-locked" data-blank-key="' + escHtml(bKey) + '" disabled><span class="screen-only">🔒 Locked (<span data-lock-rem="' + escHtml(bLockKey) + '">' + remSec + 's</span>)</span><span class="print-blank-line"></span></button>';
        }
        if (lastWrongAttempt && lastWrongAttempt.bKey === bKey) {
          itemWrongKey = bKey;
        }
        const isActive = (activeBlankKey === bKey);
        return '<button type="button" class="note-blank is-unsolved' + (isActive ? " is-active" : "") + '" data-blank-key="' + escHtml(bKey) + '"><span class="screen-only">' + (isActive ? "⬅️ Click word in Scrambled List" : "Pick from Scrambled List") + '</span><span class="print-blank-line"></span></button>';
      }).join("");

      const itemImgUri = resolveItemImageUri(item);
      const itemImgCap = resolveItemImageCaption(item);
      const imgHtml = itemImgUri
        ? ('<div class="note-diagram-wrap"><img class="note-diagram-img" src="' + escHtml(itemImgUri) + '" alt="' + escHtml(itemImgCap || "Study diagram") + '">' +
          (itemImgCap ? '<div class="note-diagram-caption">' + escHtml(itemImgCap) + '</div>' : "") +
          '</div>')
        : "";

      const wrongFeedHtml = (lastWrongAttempt && itemWrongKey && lastWrongAttempt.bKey === itemWrongKey)
        ? '<div class="blank-feedback-bad screen-only">«' + escHtml(lastWrongAttempt.word) + '» does not fit Blank #' + escHtml(displayNum) + ' (1 of 2 tries used — 1 more wrong try locks this blank for 30s!)</div>'
        : "";

      const lockedFeedHtml = lockedBlanksForItem.map(function (lk) {
        const tpl = "🔒 Blank #" + displayNum + " locked for {sec} after 2 incorrect tries — review the section or work on another blank!";
        const msg = tpl.replace("{sec}", lk.remSec + "s");
        return '<div class="blank-feedback-locked screen-only"><span data-lock-msg="' + escHtml(lk.lockKey) + '" data-lock-template="' + escHtml(tpl) + '">' + escHtml(msg) + '</span></div>';
      }).join("");

      const contextBtnClass = "note-context-btn screen-only" + (item.is_epa_608 ? " is-epa608" : "");
      const contextBtnTitle = item.is_epa_608
        ? ("View relevant EPA 608 textbook excerpt (" + (item.epa_608_category || "Core") + (item.epa_608_topic ? " — " + item.epa_608_topic : "") + ")")
        : "View relevant textbook excerpt";
      const contextBtnHtml = (canShowContextQuote() && item.context_quote && item.context_quote.trim())
        ? ' <button type="button" class="' + contextBtnClass + '" data-context-note-id="' + escHtml(item.id) + '" data-context-num="' + escHtml(displayNum) + '" title="' + escHtml(contextBtnTitle) + '" aria-label="View textbook context quote for question ' + escHtml(displayNum) + '"><span aria-hidden="true">i</span></button>'
        : "";

      const epaBadgeHtml = item.is_epa_608 ? (" " + renderEpa608Badge(item)) : "";

      let trapInlineBadge = "";
      let trapStripHtml = "";
      if (item.is_trap || item.trap_note) {
        if (!itemAllSolved) {
          trapInlineBadge = ' <span class="badge coral screen-only" style="margin-left:6px;">⚠️ Exam Trap</span>';
        } else {
          trapStripHtml = '<div class="note-trap-strip"><strong>⚠️ EXAM TRAP ALERT:</strong> ' + escHtml(item.trap_note || "Watch out for reversed True/False wording on this concept!") + '</div>';
        }
      }

      const noteItemClass = "note-item" + (item.is_epa_608 ? " is-epa608" : "");
      return '<li class="' + noteItemClass + '" value="' + escHtml(displayNum) + '">' + lineHtml + contextBtnHtml + epaBadgeHtml + trapInlineBadge + imgHtml + wrongFeedHtml + lockedFeedHtml + trapStripHtml + '</li>';
    }

    const isFlatSequentialSheet = (activeFilter === "ALL" || Boolean(printRestoreState));

    let sectionsHtml = '<div id="notes-container">';
    if (filteredNotes.length === 0) {
      const emptyMsg = activeFilter === "PRACTICE"
        ? "No study guide items are currently flagged for Needs Practice."
        : (activeFilter === "EPA608"
          ? "No EPA 608 (ESCO v10) study guide items in this chapter."
          : "No study guide items match this section filter.");
      sectionsHtml += '<div class="empty-card"><p>' + escHtml(emptyMsg) + '</p><button type="button" class="btn primary" id="btn-reset-notes-filter">Show All Study Guide Items</button></div>';
    } else if (isFlatSequentialSheet) {
      sectionsHtml += '<div class="notes-section-card flat-sequential-sheet"><ol class="notes-list" start="1">';
      filteredNotes.forEach(function (item, idx) {
        sectionsHtml += renderNoteItemHtml(item, idx + 1);
      });
      sectionsHtml += '</ol></div>';
    } else {
      // Group filtered notes by textbook section preserving section order
      const orderedSectionIds = [];
      sections.forEach(function (s) { orderedSectionIds.push(s.id); });
      filteredNotes.forEach(function (n) {
        if (orderedSectionIds.indexOf(n.section_id) === -1) orderedSectionIds.push(n.section_id);
      });

      orderedSectionIds.forEach(function (secId) {
        const items = filteredNotes.filter(function (n) { return n.section_id === secId; });
        if (items.length === 0) return;
        const secMeta = sections.find(function (s) { return s.id === secId; });
        const secTitle = secMeta ? secMeta.title : ("Section " + secId);
        sectionsHtml +=
          '<div class="notes-section-card">' +
            '<div class="notes-section-head">' +
              '<span class="notes-section-id">' + escHtml(secId || "Review") + '</span>' +
              '<h3 class="notes-section-title">' + escHtml(secTitle) + '</h3>' +
            '</div>' +
            '<ol class="notes-list" start="' + escHtml(items[0].num) + '">';

        items.forEach(function (item) {
          sectionsHtml += renderNoteItemHtml(item, item.num);
        });

        sectionsHtml += '</ol></div>';
      });
    }
    sectionsHtml += buildEmbeddedNotesVocabHtml();
    sectionsHtml += '</div>';

    const workspaceHtml = '<div class="study-notes-workspace' + (wordBankHtml ? "" : " single-col") + '">' + wordBankHtml + sectionsHtml + '</div>';
    host.innerHTML = toolbarHtml + printHeaderHtml + workspaceHtml;
    if (activeTopTab === "tab-study" && activeSubTab === "subtab-notes" && !printRestoreState && window.scrollY !== prevScrollY) {
      window.scrollTo(0, prevScrollY);
    }
    const newBank = document.getElementById("word-bank-box");
    if (newBank && prevBankScrollTop > 0) {
      newBank.scrollTop = prevBankScrollTop;
    }

    const resetFilterBtn = document.getElementById("btn-reset-notes-filter");
    if (resetFilterBtn) {
      resetFilterBtn.addEventListener("click", function () {
        activeFilter = "ALL";
        activeBlankKey = null;
        selectedBankWord = null;
        lastWrongAttempt = null;
        draggedBankWord = null;
        renderFilterBar();
        renderGuidedNotes();
      });
    }

    document.getElementById("btn-notes-rescramble").addEventListener("click", function () {
      window.playSound("flip");
      const prevOrder = bankEntries.map(function (e) { return e.norm; });
      lastWrongAttempt = null;
      for (let attempt = 0; attempt < 16; attempt++) {
        scrambleNonce++;
        wordScrambleRanks = Object.create(null);
        const nextEntries = orderScrambledBankEntries(scopedBankMap, chNum);
        const nextOrder = nextEntries.map(function (e) { return e.norm; });
        if (bankEntries.length < 3 || !arrayOrderEquals(prevOrder, nextOrder)) {
          break;
        }
      }
      renderGuidedNotes();
    });

    document.getElementById("btn-notes-reset").addEventListener("click", function () {
      window.playSound("click");
      state.solvedBlankKeys = [];
      Object.keys(wrongAttemptsByBlank).forEach(function (k) { delete wrongAttemptsByBlank[k]; });
      activeBlankKey = null;
      selectedBankWord = null;
      lastWrongAttempt = null;
      draggedBankWord = null;
      SHELL.save();
      SHELL.refreshHUD();
      SHELL.showToast("Study Guide answers reset!");
      renderFilterBar();
      renderGuidedNotes();
    });

    document.getElementById("btn-notes-print").addEventListener("click", function () {
      window.playSound("click");
      enterWorksheetPrintMode();
      window.print();
    });

    const togglePrintVocabBtn = document.getElementById("btn-notes-toggle-print-vocab");
    if (togglePrintVocabBtn) {
      togglePrintVocabBtn.addEventListener("click", function () {
        window.playSound("click");
        notesPrintVocab = !notesPrintVocab;
        syncNotesPrintVocabClass();
        togglePrintVocabBtn.className = "btn sm" + (notesPrintVocab ? " primary" : "");
        togglePrintVocabBtn.setAttribute("aria-pressed", notesPrintVocab ? "true" : "false");
        togglePrintVocabBtn.textContent = notesPrintVocab ? "📖 Print w/ Vocab: ON" : "📖 Print w/ Vocab: OFF";
      });
    }

    wireEmbeddedNotesVocabEvents();

    const openFiguresBtn = document.getElementById("btn-open-figures");
    if (openFiguresBtn) {
      openFiguresBtn.addEventListener("click", function () {
        window.playSound("click");
        openFiguresModal();
      });
    }

    const clearSelBtn = document.getElementById("btn-wb-clear-sel");
    if (clearSelBtn) {
      clearSelBtn.addEventListener("click", function () {
        window.playSound("click");
        selectedBankWord = null;
        activeBlankKey = null;
        lastWrongAttempt = null;
        renderGuidedNotes();
      });
    }

    host.querySelectorAll(".note-blank.is-unsolved[data-blank-key]").forEach(function (btn) {
      if (btn.classList.contains("is-locked")) return;
      btn.addEventListener("click", function () {
        const bKey = btn.getAttribute("data-blank-key");
        if (!bKey || state.solvedBlankKeys.indexOf(bKey) !== -1) return;
        if (isEntryLocked("blank:" + bKey)) {
          window.playSound("wrong");
          SHELL.showToast("🔒 Locked for " + getLockoutRemainingSec("blank:" + bKey) + "s — try another blank or review the section!");
          return;
        }
        if (selectedBankWord) {
          attemptBlankChoice(bKey, selectedBankWord);
          return;
        }
        window.playSound("click");
        activeBlankKey = (activeBlankKey === bKey ? null : bKey);
        lastWrongAttempt = null;
        renderGuidedNotes();
      });

      btn.addEventListener("dragover", function (e) {
        const bKey = btn.getAttribute("data-blank-key");
        if (!bKey || isEntryLocked("blank:" + bKey)) return;
        e.preventDefault();
        if (e.dataTransfer) {
          try {
            e.dataTransfer.dropEffect = "copy";
          } catch (err) {}
        }
        btn.classList.add("drag-over");
      });

      btn.addEventListener("dragleave", function () {
        btn.classList.remove("drag-over");
      });

      btn.addEventListener("drop", function (e) {
        e.preventDefault();
        btn.classList.remove("drag-over");
        const bKey = btn.getAttribute("data-blank-key");
        if (!bKey || state.solvedBlankKeys.indexOf(bKey) !== -1) {
          draggedBankWord = null;
          return;
        }
        if (isEntryLocked("blank:" + bKey)) {
          draggedBankWord = null;
          window.playSound("wrong");
          SHELL.showToast("🔒 Locked for " + getLockoutRemainingSec("blank:" + bKey) + "s — try another blank or review the section!");
          return;
        }
        const dtWord = (e.dataTransfer && typeof e.dataTransfer.getData === "function")
          ? e.dataTransfer.getData("text/plain")
          : "";
        const droppedWord = String(dtWord || draggedBankWord || "").trim();
        draggedBankWord = null;
        if (droppedWord) {
          attemptBlankChoice(bKey, droppedWord);
        }
      });
    });

    host.querySelectorAll(".wb-chip[data-wb-idx]").forEach(function (chip) {
      chip.addEventListener("click", function () {
        const idx = Number(chip.getAttribute("data-wb-idx"));
        const entry = bankEntries[idx];
        if (!entry || entry.exhausted) return;
        if (activeBlankKey && filteredBlankKeys[activeBlankKey] && state.solvedBlankKeys.indexOf(activeBlankKey) === -1) {
          attemptBlankChoice(activeBlankKey, entry.text);
          return;
        }
        window.playSound("click");
        lastWrongAttempt = null;
        if (selectedBankWord && normTerm(selectedBankWord) === entry.norm) {
          selectedBankWord = null;
        } else {
          selectedBankWord = entry.text;
        }
        renderGuidedNotes();
      });

      chip.addEventListener("dragstart", function (e) {
        const idx = Number(chip.getAttribute("data-wb-idx"));
        const entry = bankEntries[idx];
        if (!entry || entry.exhausted) {
          if (e && e.preventDefault) e.preventDefault();
          return;
        }
        draggedBankWord = entry.text;
        if (e && e.dataTransfer) {
          try {
            if (typeof e.dataTransfer.setData === "function") {
              e.dataTransfer.setData("text/plain", entry.text);
            }
            e.dataTransfer.effectAllowed = "copyMove";
          } catch (err) {}
        }
      });

      chip.addEventListener("dragend", function () {
        draggedBankWord = null;
        host.querySelectorAll(".note-blank.drag-over").forEach(function (el) {
          el.classList.remove("drag-over");
        });
      });
    });

    host.querySelectorAll(".note-context-btn[data-context-note-id]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const noteId = btn.getAttribute("data-context-note-id") || "";
        const displayNum = btn.getAttribute("data-context-num") || "";
        window.playSound("click");
        openContextQuoteModal(noteId, displayNum);
      });
    });
  }

  // === SUBTAB 1.2B: KEY VOCABULARY ===
  function getVocabMasteryStats() {
    const total = vocabList.length;
    let mastered = 0;
    for (let i = 0; i < total; i++) {
      if (state.masteredVocabIds.indexOf(vocabList[i].id) !== -1) mastered++;
    }
    return { mastered: mastered, total: total };
  }

  function updateVocabMasteredBadge() {
    const stats = getVocabMasteryStats();
    const badgeCls = "badge " + (stats.total > 0 && stats.mastered === stats.total ? "emerald" : "cyan");
    const badgeText = "✅ Mastered " + stats.mastered + " / " + stats.total + " Terms";
    ["vocab-mastered-badge", "notes-vocab-mastered-badge"].forEach(function (badgeId) {
      const badge = document.getElementById(badgeId);
      if (!badge) return;
      badge.className = badgeCls;
      badge.textContent = badgeText;
    });
  }

  function syncVocabMasteryUI(vId) {
    updateVocabMasteredBadge();
    if (!vId) return;
    const isMastered = state.masteredVocabIds.indexOf(vId) !== -1;
    const btnText = isMastered ? "✅ Mastered" : "✓ Mark Mastered (+5 ⚡)";
    document.querySelectorAll("[data-vocab-card], [data-notes-vocab-card]").forEach(function (cardEl) {
      const cardId = cardEl.getAttribute("data-vocab-card") || cardEl.getAttribute("data-notes-vocab-card");
      if (cardId === vId) {
        cardEl.classList.toggle("is-mastered", isMastered);
      }
    });
    document.querySelectorAll("[data-vocab-master], [data-notes-vocab-master]").forEach(function (btnEl) {
      const btnId = btnEl.getAttribute("data-vocab-master") || btnEl.getAttribute("data-notes-vocab-master");
      if (btnId === vId) {
        btnEl.classList.toggle("emerald", isMastered);
        btnEl.setAttribute("aria-pressed", isMastered ? "true" : "false");
        btnEl.textContent = btnText;
      }
    });
  }

  function toggleVocabMastered(vId) {
    if (!vId) return false;
    const existingIdx = state.masteredVocabIds.indexOf(vId);
    const nowMastered = existingIdx === -1;
    if (nowMastered) {
      state.masteredVocabIds.push(vId);
      window.playSound("correct");
    } else {
      state.masteredVocabIds.splice(existingIdx, 1);
      window.playSound("click");
    }
    SHELL.save();
    SHELL.refreshHUD();
    if (nowMastered && SHELL.markAwarded("vocab_" + vId)) {
      window.awardXP(5, "Vocabulary mastered");
    }
    syncVocabMasteryUI(vId);
    return nowMastered;
  }

  function revealVocabCardDefinition(vId, revealedMap, bodyEl) {
    if (!vId) return false;
    revealedMap[vId] = true;
    const item = vocabList.find(function (v) { return v.id === vId; });
    if (bodyEl) {
      bodyEl.innerHTML = '<p class="vocab-def">' + escHtml(item ? item.definition : "") + '</p>';
    }
    window.playSound("flip");
    return true;
  }

  function buildVocabPrintBannerHtml() {
    const chNum = DATA.chapter_num || DATA.chapter || "XX";
    const chTitle = DATA.title || DATA.chapter_title || "Chapter Vocabulary";
    const printEditionPrefix = (DATA.edition_label && String(DATA.edition_label).trim())
      ? (escHtml(String(DATA.edition_label).trim()) + " &bull; ")
      : "";
    return '<div class="print-only-banner">' +
      '<div class="print-title-row">' +
        '<h2>Ch. ' + escHtml(chNum) + ' Vocabulary — ' + escHtml(chTitle) + '</h2>' +
        '<span class="print-course-tag">' + printEditionPrefix + 'CTE HVAC/R &bull; CIP 47.0201</span>' +
      '</div>' +
      '<div class="print-student-grid">' +
        '<div class="print-field"><span class="print-field-lbl">Name:</span><span class="print-field-line"></span></div>' +
        '<div class="print-field"><span class="print-field-lbl">Period:</span><span class="print-field-line"></span></div>' +
        '<div class="print-field"><span class="print-field-lbl">Date:</span><span class="print-field-line"></span></div>' +
        '<div class="print-field"><span class="print-field-lbl">Terms:</span><span>' + escHtml(vocabList.length) + '</span></div>' +
      '</div>' +
      '<div class="print-directions"><strong>Directions:</strong> Review each key HVAC/R term, textbook section reference, and definition below to prepare for the chapter exam.</div>' +
    '</div>';
