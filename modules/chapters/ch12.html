  function getFilteredVocabList() {
    let list = vocabList;
    if (activeFilter === "EPA608") {
      list = list.filter(function (v) { return v.is_epa_608; });
    } else if (activeFilter === "PRACTICE") {
      list = list.filter(function (v) { return state.masteredVocabIds.indexOf(v.id) === -1; });
    } else if (activeFilter !== "ALL" && activeFilter !== "TRAP") {
      list = list.filter(function (v) { return v.section_id === activeFilter; });
    }
    const q = String(vocabState.search || "").trim().toLowerCase();
    if (q) {
      list = list.filter(function (v) {
        return v.term.toLowerCase().indexOf(q) !== -1 ||
          v.definition.toLowerCase().indexOf(q) !== -1 ||
          v.section_id.toLowerCase().indexOf(q) !== -1 ||
          v.section_title.toLowerCase().indexOf(q) !== -1 ||
          v.epa_608_category.toLowerCase().indexOf(q) !== -1 ||
          v.epa_608_topic.toLowerCase().indexOf(q) !== -1;
      });
    }
    return list;
  }

  function renderVocabCardHtml(v, opts) {
    const cfg = (opts && typeof opts === "object") ? opts : {};
    const embedded = Boolean(cfg.embedded);
    const isMastered = state.masteredVocabIds.indexOf(v.id) !== -1;
    const isPrinting = embedded
      ? Boolean(printRestoreState)
      : document.body.classList.contains("print-vocab-mode");
    const isMasked = embedded
      ? (notesVocabSelfCheck && !isPrinting && !notesVocabRevealed[v.id])
      : (vocabState.selfCheck && !isPrinting && !vocabState.revealedIds[v.id]);
    const cardCls = "vocab-card" + (embedded ? " notes-vocab-card" : "") + (v.is_epa_608 ? " is-epa608" : "") + (isMastered ? " is-mastered" : "");
    const secBadge = v.section_id
      ? ('<span class="badge cyan">Section ' + escHtml(v.section_id) + '</span>')
      : "";
    const pageBadge = v.page > 0
      ? ('<span class="badge muted">📖 p. ' + escHtml(v.page) + '</span>')
      : "";
    const epaBadge = v.is_epa_608 ? renderEpa608Badge(v) : "";
    const revealAttr = embedded ? "data-notes-vocab-reveal" : "data-vocab-reveal";
    const bodyAttr = embedded ? "data-notes-vocab-body" : "data-vocab-body";
    const cardAttr = embedded ? "data-notes-vocab-card" : "data-vocab-card";
    const masterAttr = embedded ? "data-notes-vocab-master" : "data-vocab-master";
    const bodyHtml = isMasked
      ? '<button type="button" class="vocab-reveal-btn" ' + revealAttr + '="' + escHtml(v.id) + '">🔒 Tap to reveal definition</button>'
      : '<p class="vocab-def">' + escHtml(v.definition) + '</p>';
    const masterBtnCls = "btn sm vocab-master-btn" + (isMastered ? " emerald" : "");
    const masterBtnText = isMastered ? "✅ Mastered" : "✓ Mark Mastered (+5 ⚡)";
    return '<article class="' + cardCls + '" ' + cardAttr + '="' + escHtml(v.id) + '">' +
      '<div class="vocab-card-head">' +
        '<h4 class="vocab-card-term">' + escHtml(v.term) + '</h4>' +
        '<div class="vocab-meta-row">' + secBadge + pageBadge + epaBadge + '</div>' +
      '</div>' +
      '<div class="vocab-card-body" ' + bodyAttr + '="' + escHtml(v.id) + '">' + bodyHtml + '</div>' +
      '<div class="vocab-card-foot">' +
        '<button type="button" class="' + masterBtnCls + '" ' + masterAttr + '="' + escHtml(v.id) + '" aria-pressed="' + (isMastered ? "true" : "false") + '">' + masterBtnText + '</button>' +
      '</div>' +
    '</article>';
  }

  function getEmbeddedVocabAllRevealed() {
    if (vocabList.length === 0) return false;
    for (let i = 0; i < vocabList.length; i++) {
      if (!notesVocabRevealed[vocabList[i].id]) return false;
    }
    return true;
  }

  function buildEmbeddedNotesVocabHtml() {
    if (vocabList.length === 0) return "";
    const stats = getVocabMasteryStats();
    const isPrinting = Boolean(printRestoreState);
    const isCollapsed = Boolean(notesVocabCollapsed) && !isPrinting;
    const allRevealed = notesVocabSelfCheck ? getEmbeddedVocabAllRevealed() : false;
    const revealAllBtnHtml = (notesVocabSelfCheck && !isPrinting)
      ? ('<button type="button" class="btn sm" id="btn-notes-vocab-reveal-all" data-reveal-action="' + (allRevealed ? "hide" : "reveal") + '">' +
          (allRevealed ? "🔒 Hide All" : "🔓 Reveal All") +
        '</button>')
      : "";
    const selfCheckBtnCls = "btn sm" + (notesVocabSelfCheck ? " amber" : "");
    const selfCheckBtnLabel = notesVocabSelfCheck ? "👁️ Self-Check: ON" : "👁️ Self-Check: Hide Definitions";
    const collapseBtnLabel = isCollapsed ? "▼ Expand" : "▲ Collapse";
    const masteredBadgeCls = "badge " + (stats.total > 0 && stats.mastered === stats.total ? "emerald" : "cyan");
    const cardsHtml = vocabList.map(function (v) {
      return renderVocabCardHtml(v, { embedded: true });
    }).join("");

    return '<section id="notes-embedded-vocab" class="notes-section-card notes-embedded-vocab' + (isCollapsed ? " is-collapsed" : "") + '">' +
      '<div class="notes-embedded-vocab-head">' +
        '<div class="notes-embedded-vocab-title-wrap">' +
          '<h3 class="notes-embedded-vocab-title">📖 Chapter Key Vocabulary Study Guide<span class="print-only-inline"> (' + escHtml(vocabList.length) + ' Terms)</span></h3>' +
          '<span class="badge muted" id="notes-vocab-count-badge">' + escHtml(vocabList.length) + ' ' + (vocabList.length === 1 ? "Term" : "Terms") + '</span>' +
          '<span class="' + masteredBadgeCls + '" id="notes-vocab-mastered-badge">✅ Mastered ' + escHtml(stats.mastered) + ' / ' + escHtml(stats.total) + ' Terms</span>' +
        '</div>' +
        '<div class="notes-vocab-actions">' +
          '<button type="button" class="btn sm" id="btn-notes-vocab-collapse" aria-expanded="' + (isCollapsed ? "false" : "true") + '">' + collapseBtnLabel + '</button>' +
          '<button type="button" class="' + selfCheckBtnCls + '" id="btn-notes-vocab-selfcheck" aria-pressed="' + (notesVocabSelfCheck ? "true" : "false") + '">' + selfCheckBtnLabel + '</button>' +
          revealAllBtnHtml +
          '<button type="button" class="btn sm primary" id="btn-notes-vocab-open-tab">🔎 Search &amp; A–Z Glossary Tab &rarr;</button>' +
        '</div>' +
      '</div>' +
      '<div class="notes-vocab-body' + (isCollapsed ? " is-collapsed" : "") + '" id="notes-vocab-body">' +
        '<div class="notes-vocab-grid">' + cardsHtml + '</div>' +
      '</div>' +
    '</section>';
  }

  function refreshEmbeddedNotesVocab() {
    const existing = document.getElementById("notes-embedded-vocab");
    if (!existing || !existing.parentNode) {
      renderGuidedNotes();
      return;
    }
    if (vocabList.length === 0) {
      existing.parentNode.removeChild(existing);
      return;
    }
    const tmp = document.createElement("div");
    tmp.innerHTML = buildEmbeddedNotesVocabHtml();
    const nextSection = tmp.firstElementChild;
    if (nextSection) {
      existing.parentNode.replaceChild(nextSection, existing);
      wireEmbeddedNotesVocabEvents();
    }
  }

  function wireEmbeddedNotesVocabEvents() {
    const secEl = document.getElementById("notes-embedded-vocab");
    if (!secEl) return;

    const collapseBtn = document.getElementById("btn-notes-vocab-collapse");
    if (collapseBtn) {
      collapseBtn.addEventListener("click", function () {
        window.playSound("click");
        notesVocabCollapsed = !notesVocabCollapsed;
        refreshEmbeddedNotesVocab();
      });
    }

    const selfCheckBtn = document.getElementById("btn-notes-vocab-selfcheck");
    if (selfCheckBtn) {
      selfCheckBtn.addEventListener("click", function () {
        window.playSound("flip");
        notesVocabSelfCheck = !notesVocabSelfCheck;
        notesVocabRevealed = Object.create(null);
        if (notesVocabSelfCheck && notesVocabCollapsed) {
          notesVocabCollapsed = false;
        }
        refreshEmbeddedNotesVocab();
      });
    }

    const revealAllBtn = document.getElementById("btn-notes-vocab-reveal-all");
    if (revealAllBtn) {
      revealAllBtn.addEventListener("click", function () {
        window.playSound("flip");
        const action = revealAllBtn.getAttribute("data-reveal-action");
        if (action === "hide") {
          notesVocabRevealed = Object.create(null);
        } else {
          vocabList.forEach(function (v) {
            notesVocabRevealed[v.id] = true;
          });
        }
        refreshEmbeddedNotesVocab();
      });
    }

    const openTabBtn = document.getElementById("btn-notes-vocab-open-tab");
    if (openTabBtn) {
      openTabBtn.addEventListener("click", function () {
        window.playSound("click");
        activateStudySubTab("subtab-vocab", true);
        if (typeof window.scrollTo === "function") {
          window.scrollTo(0, 0);
        }
      });
    }

    const bodyHost = document.getElementById("notes-vocab-body");
    if (bodyHost) {
      bodyHost.addEventListener("click", function (e) {
        const rawTarget = e && e.target ? e.target : null;
        const targetEl = rawTarget && rawTarget.nodeType === 1
          ? rawTarget
          : (rawTarget && rawTarget.parentElement ? rawTarget.parentElement : null);
        if (!targetEl || typeof targetEl.closest !== "function") return;

        const revealBtn = targetEl.closest("[data-notes-vocab-reveal]");
        if (revealBtn) {
          const vId = revealBtn.getAttribute("data-notes-vocab-reveal");
          const bodyEl = revealBtn.closest("[data-notes-vocab-body]");
          if (revealVocabCardDefinition(vId, notesVocabRevealed, bodyEl)) {
            const raBtn = document.getElementById("btn-notes-vocab-reveal-all");
            if (raBtn && getEmbeddedVocabAllRevealed()) {
              raBtn.setAttribute("data-reveal-action", "hide");
              raBtn.textContent = "🔒 Hide All";
            }
          }
          return;
        }

        const masterBtn = targetEl.closest("[data-notes-vocab-master]");
        if (masterBtn) {
          toggleVocabMastered(masterBtn.getAttribute("data-notes-vocab-master"));
        }
      });
    }
  }

  function syncVocabToolbarControls() {
    updateVocabMasteredBadge();
    const bannerHost = document.getElementById("vocab-print-banner-host");
    if (bannerHost) {
      bannerHost.innerHTML = buildVocabPrintBannerHtml();
    }
    const searchEl = document.getElementById("vocab-search-input");
    if (searchEl && searchEl.value !== vocabState.search) {
      searchEl.value = vocabState.search;
    }
    const sortBtn = document.getElementById("btn-vocab-sort");
    if (sortBtn) {
      const isAz = vocabState.sortMode === "az";
      sortBtn.className = "btn sm" + (isAz ? " primary" : "");
      sortBtn.textContent = isAz ? "🔤 A–Z" : "📑 By Section";
      sortBtn.setAttribute("aria-pressed", isAz ? "true" : "false");
    }
    const checkBtn = document.getElementById("btn-vocab-selfcheck");
    if (checkBtn) {
      const isHide = Boolean(vocabState.selfCheck);
      checkBtn.className = "btn sm" + (isHide ? " amber" : "");
      checkBtn.textContent = isHide ? "👁️ Show All Definitions" : "👁️ Self-Check: Hide Definitions";
      checkBtn.setAttribute("aria-pressed", isHide ? "true" : "false");
    }
  }

  function renderVocabularyResults() {
    const resultsHost = document.getElementById("vocab-results-host");
    if (!resultsHost) return;
    if (vocabList.length === 0) {
      resultsHost.innerHTML = '<div class="empty-card">No key vocabulary terms found for this chapter.</div>';
      return;
    }

    const filtered = getFilteredVocabList();
    let htmlOut = "";
    if (activeFilter === "TRAP") {
      htmlOut +=
        '<div class="vocab-notice-banner">' +
          '<span><strong>⚠️ Exam Traps Notice:</strong> Exam Traps apply to Study Guide &amp; Flip Cards. Showing all chapter vocabulary below.</span>' +
          '<button type="button" class="btn sm primary" id="btn-vocab-reset-filter">Show All Vocabulary</button>' +
        '</div>';
    }

    if (filtered.length === 0) {
      const qTrim = String(vocabState.search || "").trim();
      if (qTrim) {
        htmlOut += '<div class="empty-card"><p>No vocabulary terms match "' + escHtml(qTrim) + '".</p><button type="button" class="btn primary" id="btn-vocab-clear-search">Clear Search</button></div>';
      } else if (activeFilter === "PRACTICE") {
        htmlOut += '<div class="empty-card"><p>All chapter vocabulary terms are currently marked mastered! 🎉</p><button type="button" class="btn primary" id="btn-vocab-reset-filter">Show All Vocabulary</button></div>';
      } else if (activeFilter === "EPA608") {
        htmlOut += '<div class="empty-card"><p>No EPA 608 vocabulary terms in this chapter.</p><button type="button" class="btn primary" id="btn-vocab-reset-filter">Show All Vocabulary</button></div>';
      } else {
        htmlOut += '<div class="empty-card"><p>No vocabulary terms match the current section filter.</p><button type="button" class="btn primary" id="btn-vocab-reset-filter">Show All Vocabulary</button></div>';
      }
      resultsHost.innerHTML = htmlOut;
      return;
    }

    if (vocabState.sortMode === "az") {
      const sorted = filtered.slice().sort(function (a, b) {
        const cmp = a.term.toLowerCase().localeCompare(b.term.toLowerCase());
        return cmp !== 0 ? cmp : a.id.localeCompare(b.id);
      });
      htmlOut += '<div class="vocab-grid">' + sorted.map(function (v) { return renderVocabCardHtml(v); }).join("") + '</div>';
    } else {
      const orderedSectionIds = [];
      sections.forEach(function (s) { orderedSectionIds.push(s.id); });
      filtered.forEach(function (v) {
        if (orderedSectionIds.indexOf(v.section_id) === -1) orderedSectionIds.push(v.section_id);
      });
      orderedSectionIds.forEach(function (secId) {
        const items = filtered.filter(function (v) { return v.section_id === secId; });
        if (items.length === 0) return;
        const secMeta = sectionMap[secId];
        const secTitle = (secMeta && secMeta.title) || items[0].section_title || (secId ? ("Section " + secId) : "Chapter Vocabulary");
        const headingText = secId ? ("Section " + secId + " — " + secTitle) : secTitle;
        htmlOut +=
          '<section class="vocab-section-group">' +
            '<h3 class="vocab-section-heading">' +
              '<span class="vocab-section-heading-main">' + escHtml(headingText) + '</span>' +
              '<span class="badge muted">' + items.length + ' ' + (items.length === 1 ? "term" : "terms") + '</span>' +
            '</h3>' +
            '<div class="vocab-grid">' + items.map(function (v) { return renderVocabCardHtml(v); }).join("") + '</div>' +
          '</section>';
      });
    }

    resultsHost.innerHTML = htmlOut;
  }

  function mountVocabShell(host) {
    host.innerHTML =
      '<div id="vocab-print-banner-host"></div>' +
      '<div class="vocab-toolbar">' +
        '<div class="vocab-toolbar-left">' +
          '<strong class="vocab-toolbar-title">📖 Key Vocabulary</strong>' +
          '<span class="badge cyan" id="vocab-mastered-badge">✅ Mastered 0 / 0 Terms</span>' +
        '</div>' +
        '<div class="vocab-toolbar-actions">' +
          '<div class="vocab-search-wrap">' +
            '<input type="search" id="vocab-search-input" class="vocab-search-input" placeholder="Search terms or definitions..." aria-label="Search chapter vocabulary" />' +
          '</div>' +
          '<button type="button" class="btn sm" id="btn-vocab-sort">📑 By Section</button>' +
          '<button type="button" class="btn sm" id="btn-vocab-selfcheck">👁️ Self-Check: Hide Definitions</button>' +
          '<button type="button" class="btn sm emerald" id="btn-vocab-print">🖨️ Print Vocabulary Sheet</button>' +
        '</div>' +
      '</div>' +
      '<div id="vocab-results-host"></div>';

    const searchInput = document.getElementById("vocab-search-input");
    if (searchInput) {
      searchInput.value = vocabState.search;
      searchInput.addEventListener("input", function () {
        vocabState.search = searchInput.value;
        renderVocabularyResults();
      });
    }

    const sortBtn = document.getElementById("btn-vocab-sort");
    if (sortBtn) {
      sortBtn.addEventListener("click", function () {
        window.playSound("click");
        vocabState.sortMode = (vocabState.sortMode === "az") ? "section" : "az";
        syncVocabToolbarControls();
        renderVocabularyResults();
      });
    }

    const selfCheckBtn = document.getElementById("btn-vocab-selfcheck");
    if (selfCheckBtn) {
      selfCheckBtn.addEventListener("click", function () {
        window.playSound("flip");
        vocabState.selfCheck = !vocabState.selfCheck;
        vocabState.revealedIds = Object.create(null);
        syncVocabToolbarControls();
        renderVocabularyResults();
      });
    }

    const printBtn = document.getElementById("btn-vocab-print");
    if (printBtn) {
      printBtn.addEventListener("click", function () {
        window.playSound("click");
        enterVocabPrintMode();
        window.print();
      });
    }

    const resultsHost = document.getElementById("vocab-results-host");
    if (resultsHost) {
      resultsHost.addEventListener("click", function (e) {
        const rawTarget = e && e.target ? e.target : null;
        const targetEl = rawTarget && rawTarget.nodeType === 1
          ? rawTarget
          : (rawTarget && rawTarget.parentElement ? rawTarget.parentElement : null);
        if (!targetEl || typeof targetEl.closest !== "function") return;

        const revealBtn = targetEl.closest("[data-vocab-reveal]");
        if (revealBtn) {
          const vId = revealBtn.getAttribute("data-vocab-reveal");
          const bodyEl = revealBtn.closest("[data-vocab-body]");
          revealVocabCardDefinition(vId, vocabState.revealedIds, bodyEl);
          return;
        }

        const masterBtn = targetEl.closest("[data-vocab-master]");
        if (masterBtn) {
          toggleVocabMastered(masterBtn.getAttribute("data-vocab-master"));
          return;
        }

        if (targetEl.closest("#btn-vocab-reset-filter")) {
          window.playSound("click");
          activeFilter = "ALL";
          renderFilterBar();
          renderVocabulary();

  // === SUBTAB 1.3: TERM MATCH-UP ===
  const matchState = {
    batchIdx: 0,
    pairs: [],
    shuffledDefs: [],
    selectedTermId: null,
    selectedDefId: null,
    matchedIds: [],
    streak: 0,
    elapsedSec: 0,
    timerId: null,
    started: false,
    cleared: false
  };

  function stopMatchTimer() {
    if (matchState.timerId) {
      window.clearInterval(matchState.timerId);
      matchState.timerId = null;
    }
  }

  function formatSec(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function getFilteredMatchPairs() {
    if (activeFilter === "EPA608") {
      return matchPairs.filter(function (p) { return p.is_epa_608; });
    }
    if (activeFilter !== "ALL" && activeFilter !== "TRAP" && activeFilter !== "PRACTICE") {
      const secPool = matchPairs.filter(function (p) { return p.section_id === activeFilter; });
      if (secPool.length >= 2) return secPool;
    }
    return matchPairs;
  }

  function setupMatchRound(batchIndex) {
    stopMatchTimer();
    const pool = getFilteredMatchPairs();
    const batchSize = 8;
    const totalBatches = Math.max(1, Math.ceil(pool.length / batchSize));
    const safeBatch = batchIndex === "RANDOM" ? "RANDOM" : Math.max(0, Math.min(totalBatches - 1, Number(batchIndex) || 0));
    matchState.batchIdx = safeBatch;

    let roundPairs;
    if (safeBatch === "RANDOM") {
      roundPairs = shuffleArray(pool).slice(0, batchSize);
    } else {
      const start = safeBatch * batchSize;
      roundPairs = pool.slice(start, start + batchSize);
    }

    matchState.pairs = shuffleArray(roundPairs).map(function (p) { return Object.assign({}, p); });
    matchState.shuffledDefs = shuffleArray(roundPairs).map(function (p) { return Object.assign({}, p); });
    matchState.selectedTermId = null;
    matchState.selectedDefId = null;
    matchState.matchedIds = [];
    matchState.streak = 0;
    matchState.elapsedSec = 0;
    matchState.started = false;
    matchState.cleared = false;
  }

  function startMatchTimerIfNeeded() {
    if (matchState.started || matchState.cleared) return;
    matchState.started = true;
    matchState.timerId = window.setInterval(function () {
      matchState.elapsedSec++;
      const el = document.getElementById("match-timer-val");
      if (el) el.textContent = "⏱️ " + formatSec(matchState.elapsedSec);
    }, 1000);
  }

  function renderMatchUp(keepRound) {
    const host = document.getElementById("subtab-match");
    if (!host) return;
    if (matchPairs.length === 0) {
      host.innerHTML = '<div class="empty-card">No matching terminology pairs found for this chapter.</div>';
      return;
    }
    const pool = getFilteredMatchPairs();
    if (pool.length === 0) {
      stopMatchTimer();
      host.innerHTML = '<div class="empty-card"><p>No EPA 608 (ESCO v10) terminology pairs in this chapter.</p><button type="button" class="btn primary" id="btn-reset-match-filter">Show All Match Pairs</button></div>';
      const rb = document.getElementById("btn-reset-match-filter");
      if (rb) {
        rb.addEventListener("click", function () {
          activeFilter = "ALL";
          renderFilterBar();
          renderMatchUp(false);
        });
      }
      return;
    }
    if (!keepRound || matchState.pairs.length === 0) {
      setupMatchRound(matchState.batchIdx);
    }
    const totalBatches = Math.max(1, Math.ceil(pool.length / 8));
    let batchOptions = "";
    for (let b = 0; b < totalBatches; b++) {
      const startN = b * 8 + 1;
      const endN = Math.min(pool.length, (b + 1) * 8);
      batchOptions += '<option value="' + b + '" ' + (matchState.batchIdx === b ? "selected" : "") + '>Batch ' + (b + 1) + ' (' + startN + '–' + endN + ')</option>';
    }
    batchOptions += '<option value="RANDOM" ' + (matchState.batchIdx === "RANDOM" ? "selected" : "") + '>🔀 Random 8 Mix</option>';

    const bestText = state.highScores.bestMatchTimeSec != null
      ? ("🏆 Best: " + formatSec(state.highScores.bestMatchTimeSec))
      : "🏆 Best: --:--";

    let htmlStr =
      '<div class="match-toolbar">' +
        '<div class="match-stats">' +
          '<span class="badge cyan" id="match-timer-val">⏱️ ' + formatSec(matchState.elapsedSec) + '</span>' +
          '<span class="badge emerald">Matched: ' + matchState.matchedIds.length + ' / ' + matchState.pairs.length + '</span>' +
          '<span class="badge amber">🔥 Streak: ' + matchState.streak + '</span>' +
          '<span class="badge muted">' + bestText + '</span>' +
        '</div>' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
          '<select class="select-input" id="match-batch-select" aria-label="Select match batch">' + batchOptions + '</select>' +
          '<button type="button" class="btn sm primary" id="btn-match-reset">🔄 New Shuffle</button>' +
        '</div>' +
      '</div>' +
      '<div class="match-grid">' +
        '<div class="match-col"><div class="match-col-head">1. Select Key Term</div>' +
          matchState.pairs.map(function (p) {
            const isMatched = matchState.matchedIds.indexOf(p.id) !== -1;
            const isSel = matchState.selectedTermId === p.id;
            const epaCls = p.is_epa_608 ? " is-epa608" : "";
            const inner = p.is_epa_608
              ? '<span style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;width:100%;"><span>' + (isMatched ? "✅ " : "") + escHtml(p.term) + '</span>' + renderEpa608Badge(p) + '</span>'
              : ((isMatched ? "✅ " : "") + escHtml(p.term));
            return '<button type="button" class="match-card' + epaCls + (isMatched ? " matched" : (isSel ? " selected" : "")) + '" data-term-id="' + escHtml(p.id) + '" ' + (isMatched ? "disabled" : "") + '>' + inner + '</button>';
          }).join("") +
        '</div>' +
        '<div class="match-col"><div class="match-col-head">2. Match Functional Definition</div>' +
          matchState.shuffledDefs.map(function (p) {
            const isMatched = matchState.matchedIds.indexOf(p.id) !== -1;
            const isSel = matchState.selectedDefId === p.id;
            return '<button type="button" class="match-card ' + (isMatched ? "matched" : (isSel ? "selected" : "")) + '" data-def-id="' + escHtml(p.id) + '" ' + (isMatched ? "disabled" : "") + '>' + escHtml(p.definition) + '</button>';
          }).join("") +
        '</div>' +
      '</div>';

    if (matchState.cleared) {
      htmlStr +=
        '<div class="match-clear-banner">' +
          '<div><strong>🎉 Match-Up Round Cleared in ' + formatSec(matchState.elapsedSec) + '!</strong><div style="font-size:13px;color:#d1fae5;">Max streak: ' + matchState.streak + ' • Ready for another round?</div></div>' +
          '<button type="button" class="btn emerald" id="btn-match-again">Play Another Round</button>' +
        '</div>';
    }

    host.innerHTML = htmlStr;

    document.getElementById("match-batch-select").addEventListener("change", function (e) {
      window.playSound("click");
      setupMatchRound(e.target.value === "RANDOM" ? "RANDOM" : Number(e.target.value));
      renderMatchUp(true);
    });
    document.getElementById("btn-match-reset").addEventListener("click", function () {
      window.playSound("flip");
      setupMatchRound(matchState.batchIdx);
      renderMatchUp(true);
    });
    const againBtn = document.getElementById("btn-match-again");
    if (againBtn) {
      againBtn.addEventListener("click", function () {
        window.playSound("click");
        setupMatchRound(matchState.batchIdx === "RANDOM" ? "RANDOM" : (Number(matchState.batchIdx) + 1) % totalBatches);
        renderMatchUp(true);
      });
    }

    function attemptMatchPair() {
      if (!matchState.selectedTermId || !matchState.selectedDefId) return;
      const tId = matchState.selectedTermId;
      const dId = matchState.selectedDefId;
      let matchedPairId = null;

      if (tId === dId) {
        matchedPairId = tId;
      } else {
        const tPair = matchState.pairs.find(function (p) { return p.id === tId; });
        const dPair = matchState.shuffledDefs.find(function (p) { return p.id === dId; });
        if (tPair && dPair) {
          if (normTerm(tPair.term) === normTerm(dPair.term)) {
            const twinRight = matchState.shuffledDefs.find(function (p) { return p.id === tId; });
            if (twinRight) {
              twinRight.id = dId;
              twinRight.term = dPair.term;
            }
            dPair.id = tId;
            dPair.term = tPair.term;
            matchedPairId = tId;
          } else if (normTerm(tPair.definition) === normTerm(dPair.definition)) {
            const twinLeft = matchState.pairs.find(function (p) { return p.id === dId; });
            if (twinLeft) {
              twinLeft.id = tId;
              twinLeft.definition = tPair.definition;
            }
            tPair.id = dId;
            tPair.definition = dPair.definition;
            matchedPairId = dId;
          }
        }
      }

      if (matchedPairId !== null) {
        if (matchState.matchedIds.indexOf(matchedPairId) === -1) {
          matchState.matchedIds.push(matchedPairId);
        }
        matchState.streak++;
        matchState.selectedTermId = null;
        matchState.selectedDefId = null;
        if (matchState.matchedIds.length === matchState.pairs.length) {
          matchState.cleared = true;
          stopMatchTimer();
          window.playSound("fanfare");
          launchConfetti();
          if (state.highScores.bestMatchTimeSec == null || matchState.elapsedSec < state.highScores.bestMatchTimeSec) {
            state.highScores.bestMatchTimeSec = matchState.elapsedSec;
          }
          state.highScores.matchRoundsCleared = (state.highScores.matchRoundsCleared || 0) + 1;
          SHELL.save();
          const reward = 100 + Math.min(100, matchState.streak * 12);
          window.awardXP(reward, "Match-Up Cleared!");
        } else {
          window.playSound("correct");
        }
        renderMatchUp(true);
      } else {
        window.playSound("wrong");
        matchState.streak = 0;
        const termBtn = Array.prototype.find.call(host.querySelectorAll("[data-term-id]"), function (el) {
          return el.getAttribute("data-term-id") === tId;
        });
        const defBtn = Array.prototype.find.call(host.querySelectorAll("[data-def-id]"), function (el) {
          return el.getAttribute("data-def-id") === dId;
        });
        if (termBtn) termBtn.classList.add("flash-wrong");
        if (defBtn) defBtn.classList.add("flash-wrong");
        matchState.selectedTermId = null;
        matchState.selectedDefId = null;
        window.setTimeout(function () {
          renderMatchUp(true);
        }, 480);
      }
    }

    host.querySelectorAll("[data-term-id]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        startMatchTimerIfNeeded();
        window.playSound("click");
        const id = btn.getAttribute("data-term-id");
        matchState.selectedTermId = (matchState.selectedTermId === id) ? null : id;
        if (matchState.selectedTermId && matchState.selectedDefId) attemptMatchPair();
        else renderMatchUp(true);
      });
    });

    host.querySelectorAll("[data-def-id]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        startMatchTimerIfNeeded();
        window.playSound("click");
        const id = btn.getAttribute("data-def-id");
        matchState.selectedDefId = (matchState.selectedDefId === id) ? null : id;
        if (matchState.selectedTermId && matchState.selectedDefId) attemptMatchPair();
        else renderMatchUp(true);
      });
    });
  }

  // === BLOOKET CSV EXPORT ===
  function csvCell(val) {
    const s = String(val == null ? "" : val);
    if (/[",\r\n]/.test(s)) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  function exportBlooketCsv() {
    window.playSound("click");
    const rows = [];
    rows.push(['"Blooket\nImport Template"', "", "", "", "", "", "", ""].join(","));
    rows.push([
      "Question #",
      "Question Text",
      "Answer 1",
      "Answer 2",
      csvCell("Answer 3\n(Optional)"),
      csvCell("Answer 4\n(Optional)"),
      csvCell("Time Limit (sec)\n(Max: 300 seconds)"),
      csvCell("Correct Answer(s)\n(Only include Answer #)")
    ].join(","));

    const rawLimit = Number(DATA.blooket_export_limit);
    const exportLimit = (Number.isFinite(rawLimit) && rawLimit > 0) ? Math.floor(rawLimit) : 35;
    const exportList = blitzQuestions.slice(0, exportLimit);
    exportList.forEach(function (q, idx) {
      const opts = q.choices.slice();
      const correctText = opts[q.correctIndex] != null ? opts[q.correctIndex] : (opts[0] || "");
      const distractors = opts.filter(function (_, i) { return i !== q.correctIndex; });
      const ordered = [correctText, distractors[0] || "", distractors[1] || "", distractors[2] || ""];
      rows.push([
        idx + 1,
        csvCell(q.question),
        csvCell(ordered[0]),
        csvCell(ordered[1]),
        csvCell(ordered[2]),
        csvCell(ordered[3]),
        q.time_limit || 20,
        1
      ].join(","));
    });

    const csvText = rows.join("\r\n");
    const blob = new Blob([csvText], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const chNum = String(DATA.chapter_num || DATA.chapter || "XX").padStart(2, "0");
    let downloadName = (DATA.blooket_filename && String(DATA.blooket_filename).trim())
      ? String(DATA.blooket_filename).trim()
      : ("Ch" + chNum + "_Blooket_Study_Guide.csv");
    if (!/\.csv$/i.test(downloadName)) downloadName += ".csv";
    a.href = url;
    a.download = downloadName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    SHELL.showToast("Exported " + exportList.length + " questions to Blooket CSV!");
  }

      else if (arenaState.roundType === "full30") pool = pool.slice(0, 30);

    arenaState.queue = pool;
    arenaState.qIndex = 0;

  function getStreakMultiplier(streak) {
    if (streak >= 9) return 5;
    if (streak >= 6) return 4;
    if (streak >= 4) return 3;
    if (streak >= 2) return 2;
    return 1;
  }

  function prepareSoloQuestion() {
    stopSoloTimer();
    if (arenaState.qIndex >= arenaState.queue.length) {
      if (arenaState.roundType === "endless") {
        let pool = getFilteredBlitz(arenaState.sectionFilter);
        if (pool.length === 0) pool = blitzQuestions;
        arenaState.queue = arenaState.queue.concat(shuffleArray(pool));
      } else {
        finishSoloRun();
        return;
      }
    }
    const q = arenaState.queue[arenaState.qIndex];
    const indexedChoices = q.choices.map(function (c, i) {
      return { text: c, isCorrect: i === q.correctIndex };
    });
    arenaState.displayedChoices = shuffleArray(indexedChoices);
    arenaState.answered = false;
    arenaState.selectedDisplayIdx = -1;
    arenaState.pendingCrate = false;

    const van = getVanBonuses();
    const totalSec = (q.time_limit || 20) + van.sec;
    arenaState.totalTimeMs = totalSec * 1000;
    arenaState.timeLeftMs = arenaState.totalTimeMs;

    renderSoloQuestion();
    arenaState.timerId = window.setInterval(function () {
      arenaState.timeLeftMs -= 100;
      const bar = document.getElementById("solo-timer-bar");
      if (bar) {
        const pct = Math.max(0, (arenaState.timeLeftMs / arenaState.totalTimeMs) * 100);
        bar.style.width = pct + "%";
        if (pct < 25) bar.style.backgroundColor = "#f43f5e";
        else if (pct < 55) bar.style.backgroundColor = "#f59e0b";
        else bar.style.backgroundColor = "#38bdf8";
      }
      if (arenaState.timeLeftMs <= 0) {
        handleSoloAnswer(-1, true);
      }
    }, 100);
  }

  function handleSoloAnswer(displayIdx, timedOut) {
    if (arenaState.answered) return;
    stopSoloTimer();
    arenaState.answered = true;
    arenaState.selectedDisplayIdx = timedOut ? -1 : displayIdx;
    arenaState.answeredCount++;

    const q = arenaState.queue[arenaState.qIndex];
    const picked = (!timedOut && displayIdx >= 0) ? arenaState.displayedChoices[displayIdx] : null;
    const isCorrect = Boolean(picked && picked.isCorrect);

    if (isCorrect) {
      arenaState.correctCount++;
      arenaState.streak++;
      if (arenaState.streak > arenaState.maxStreak) arenaState.maxStreak = arenaState.streak;
      const van = getVanBonuses();
      const sMult = getStreakMultiplier(arenaState.streak);
      const speedBonus = Math.round((Math.max(0, arenaState.timeLeftMs) / arenaState.totalTimeMs) * 35);
      const doubleFactor = arenaState.doubleTurns > 0 ? 2 : 1;
      if (arenaState.doubleTurns > 0) arenaState.doubleTurns--;
      const earned = Math.round((50 + speedBonus) * sMult * (van.mult + arenaState.runMultBonus) * doubleFactor);
      arenaState.runBolts += earned;
      window.awardXP(earned, "Correct x" + sMult + (doubleFactor === 2 ? " (2x)" : ""));
      window.playSound("correct");
      if (arenaState.correctCount % 2 === 0) {
        arenaState.pendingCrate = true;
      }
    } else {
      window.playSound("wrong");
      if (arenaState.shields > 0) {
        arenaState.shields--;
        SHELL.showToast("🛡️ Streak Shield absorbed the miss! Streak saved.");
      } else {
        arenaState.streak = 0;
      }
      if (!arenaState.missedQuestions.some(function (mq) { return mq.id === q.id; })) {
        arenaState.missedQuestions.push(q);
      }
    }
    renderSoloQuestion();
  }

  function advanceSoloOrCrate() {
    if (arenaState.pendingCrate) {
      arenaState.pendingCrate = false;
      openMysteryCrateModal();
      return;
    }
    arenaState.qIndex++;
    prepareSoloQuestion();
  }

  function openMysteryCrateModal() {
    const root = document.getElementById("crate-modal-root");
    if (!root) return;
    window.playSound("crate");
    root.classList.remove("hidden");

    // Pick 3 random crate outcomes (favoring fun rewards, leak possible)
    const weightedPool = [
      CRATE_REWARDS[0], CRATE_REWARDS[1], CRATE_REWARDS[2],
      CRATE_REWARDS[3], CRATE_REWARDS[4], CRATE_REWARDS[0],
      CRATE_REWARDS[1], CRATE_REWARDS[2], CRATE_REWARDS[5]
    ];
    const hiddenRewards = shuffleArray(weightedPool).slice(0, 3);

    root.innerHTML =
      '<div class="modal-card">' +
        '<span class="badge amber">🧰 2-STREAK REWARD UNLOCKED</span>' +
        '<h2 style="margin:10px 0 4px 0;">Pick 1 of 3 Mystery HVAC Tool Crates!</h2>' +
        '<p style="color:var(--muted);font-size:13.5px;margin:0;">Tap a rugged service crate to claim your gear or bolt bonus.</p>' +
        '<div class="crates-row">' +
          '<button type="button" class="crate-btn" data-crate-pick="0"><span class="crate-icon">🧰</span><strong>Crate Alpha</strong></button>' +
          '<button type="button" class="crate-btn" data-crate-pick="1"><span class="crate-icon">🧰</span><strong>Crate Bravo</strong></button>' +
          '<button type="button" class="crate-btn" data-crate-pick="2"><span class="crate-icon">🧰</span><strong>Crate Charlie</strong></button>' +
        '</div>' +
        '<div id="crate-reveal-slot"></div>' +
      '</div>';

    root.querySelectorAll("[data-crate-pick]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const pick = Number(btn.getAttribute("data-crate-pick"));
        const reward = hiddenRewards[pick];
        root.querySelectorAll("[data-crate-pick]").forEach(function (b, idx) {
          b.disabled = true;
          const r = hiddenRewards[idx];
          b.innerHTML = '<span class="crate-icon">' + r.icon + '</span><strong>' + escHtml(r.title) + '</strong>';
          if (idx === pick) b.style.borderColor = "#38bdf8";
          else b.style.opacity = "0.55";
        });

        if (reward.id === "double") {
          arenaState.doubleTurns += 2;
          window.playSound("crate");
        } else if (reward.id === "bolts300") {
          arenaState.runBolts += 300;
          window.awardXP(300, "Mystery Crate");
          window.playSound("crate");
        } else if (reward.id === "shield") {
          arenaState.shields += 1;
          window.playSound("crate");
        } else if (reward.id === "mult25") {
          arenaState.runMultBonus += 0.25;
          window.playSound("crate");
        } else if (reward.id === "jackpot") {
          arenaState.runBolts += 600;
          window.awardXP(600, "Tool Crate Jackpot!");
          window.playSound("fanfare");
          launchConfetti();
        } else if (reward.id === "leak") {
          const loss = Math.round(arenaState.runBolts * 0.1);
          arenaState.runBolts = Math.max(0, arenaState.runBolts - loss);
          if (loss > 0) window.awardXP(-loss, "Schrader Leak (-10%)");
          window.playSound("spark");
        }

        const slot = document.getElementById("crate-reveal-slot");
        slot.innerHTML =
          '<div class="crate-result-box">' +
            '<div style="font-size:20px;font-weight:800;margin-bottom:4px;">' + reward.icon + ' ' + escHtml(reward.title) + '</div>' +
            '<div style="font-size:13.5px;color:#cbd5e1;margin-bottom:12px;">' + escHtml(reward.desc) + '</div>' +
            '<button type="button" class="btn primary" id="btn-crate-continue">Continue Quest ➡️</button>' +
          '</div>';
        document.getElementById("btn-crate-continue").addEventListener("click", function () {
          root.classList.add("hidden");
          arenaState.qIndex++;
          prepareSoloQuestion();
        });
      });
    });
  }

  function finishSoloRun() {
    stopSoloTimer();
    arenaState.phase = "summary";
    const pct = arenaState.answeredCount > 0 ? Math.round((arenaState.correctCount / arenaState.answeredCount) * 100) : 0;
    const prevBest = state.highScores[arenaState.roundType] || 0;
    const isNewBest = arenaState.runBolts > prevBest;
    if (isNewBest) state.highScores[arenaState.roundType] = arenaState.runBolts;
    if (pct > (state.highScores.bestPct || 0)) state.highScores.bestPct = pct;
    SHELL.save();
    SHELL.refreshHUD();
    if (pct >= 70) {
      window.playSound("fanfare");
      launchConfetti();
    }
    renderSoloSummary(isNewBest);
  }

    if (!stage) return;

      ? '<div style="margin-top:16px;text-align:left;"><h3 style="margin:0 0 8px 0;font-size:15px;">Missed Questions to Fix (' + arenaState.missedQuestions.length + '):</h3>' +

          '</div>';

      : '<div style="margin-top:14px;" class="badge emerald">🎯 100% Clean Run — Zero Missed Questions!</div>';

      '<div class="surface-card" style="max-width:780px;margin:0 auto;text-align:center;">' +
        (isNewBest ? '<div class="badge amber" style="margin-bottom:8px;">🏆 NEW HIGH SCORE!</div>' : '') +

        '<div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px 0;">' +

      startSoloRun(null);

  // === SMARTBOARD CLASSROOM HOST MODE ===
  function prepareHostChoices(q) {
    if (!q) return [];
    const opts = q.choices.map(function (c, i) {
      return { text: c, isCorrect: i === q.correctIndex };
    });
    return shuffleArray(opts);
  }

      stage.innerHTML = '<div class="empty-card">No quiz questions available for Host Mode.</div>';
      return;
    }
    if (arenaState.hostIndex >= pool.length) arenaState.hostIndex = 0;
    const q = pool[arenaState.hostIndex];
    if (!arenaState.hostChoices || arenaState.hostChoices._qid !== q.id) {
      arenaState.hostChoices = prepareHostChoices(q);

      arenaState.hostRevealed = false;
      arenaState.hostTimeLeftSec = arenaState.hostDurationSec;

      (epaHostCount > 0 ? '<option value="EPA608" ' + (arenaState.hostSection === "EPA608" ? "selected" : "") + '>' + escHtml((DATA.epa_pill_label && String(DATA.epa_pill_label).trim()) ? String(DATA.epa_pill_label).trim() : "🌿 EPA 608") + ' Only (' + epaHostCount + ')</option>' : '') +

      arenaState.hostSection = e.target.value;
      arenaState.hostIndex = 0;
      arenaState.hostChoices = [];
      renderHostMode();
    });
    document.getElementById("host-timer-select").addEventListener("change", function (e) {
      stopHostTimer();
      arenaState.hostDurationSec = Number(e.target.value);
      arenaState.hostTimeLeftSec = arenaState.hostDurationSec;
      renderHostMode();
    });
    document.getElementById("btn-host-start-timer").addEventListener("click", function () {
      if (arenaState.hostDurationSec === 0) return;
      stopHostTimer();
      window.playSound("click");
      arenaState.hostTimeLeftSec = arenaState.hostDurationSec;
      const pill = document.getElementById("host-timer-pill");
      if (pill) pill.textContent = "⏱️ " + arenaState.hostTimeLeftSec + "s";
      arenaState.hostTimerId = window.setInterval(function () {
        arenaState.hostTimeLeftSec--;
        const p = document.getElementById("host-timer-pill");
        if (p) p.textContent = "⏱️ " + Math.max(0, arenaState.hostTimeLeftSec) + "s";
        if (arenaState.hostTimeLeftSec <= 0) {
          stopHostTimer();
          window.playSound("spark");
        }
      }, 1000);
    });
    document.getElementById("btn-host-reveal").addEventListener("click", function () {
      stopHostTimer();
      arenaState.hostRevealed = true;
      window.playSound("correct");
      renderHostMode();
    });
    document.getElementById("btn-host-prev").addEventListener("click", function () {
      stopHostTimer();
      window.playSound("click");
      arenaState.hostIndex = (arenaState.hostIndex - 1 + pool.length) % pool.length;
      arenaState.hostChoices = [];
      renderHostMode();
    });
    document.getElementById("btn-host-next").addEventListener("click", function () {
      stopHostTimer();
      window.playSound("click");
      arenaState.hostIndex = (arenaState.hostIndex + 1) % pool.length;
      arenaState.hostChoices = [];
      renderHostMode();
    });
    document.getElementById("btn-reset-teams").addEventListener("click", function () {

      renderHostMode();
    });
    stage.querySelectorAll("[data-team-name]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        const idx = Number(inp.getAttribute("data-team-name"));
        state.teamNames[idx] = inp.value || ("Team " + (idx + 1));
        SHELL.save();
      });
    });
    stage.querySelectorAll("[data-team-add]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const idx = Number(btn.getAttribute("data-team-add"));
        const pts = Number(btn.getAttribute("data-pts"));
        state.teamScores[idx] = Math.max(0, (state.teamScores[idx] || 0) + pts);
        SHELL.save();
        window.playSound(pts > 0 ? "correct" : "click");
        renderHostMode();
      });
    });
  }

    const chNum = DATA.chapter_num || DATA.chapter || "XX";

      ? String(DATA.context_modal_heading)

        epaBannerEl.textContent = "";
        epaBannerEl.classList.add("hidden");

    bodyEl.classList.toggle("epa608-quote-highlight", Boolean(item.is_epa_608));
    bodyEl.textContent = item.context_quote;
    if (figWrapEl) {

  document.addEventListener("click", function (e) {
    const rawTarget = e && e.target ? e.target : null;
    const targetEl = rawTarget && rawTarget.nodeType === 1
      ? rawTarget
      : (rawTarget && rawTarget.parentElement ? rawTarget.parentElement : null);
    if (!targetEl || typeof targetEl.closest !== "function") return;
    const zoomTarget = targetEl.closest("img.note-diagram-img, img.flip-img, img.quiz-q-img");
    if (!zoomTarget) return;
    if (zoomTarget.classList && zoomTarget.classList.contains("flip-img")) {
      if (typeof e.stopPropagation === "function") e.stopPropagation();
    }
    if (typeof e.preventDefault === "function") e.preventDefault();
    openDiagramLightbox(zoomTarget);
  }, true);

  const lightboxCloseBtn = document.getElementById("diagram-lightbox-close");
  if (lightboxCloseBtn) {
    lightboxCloseBtn.addEventListener("click", closeDiagramLightbox);
  }
  const lightboxBackdrop = document.getElementById("diagram-lightbox-modal");
  if (lightboxBackdrop) {
    lightboxBackdrop.addEventListener("click", function (e) {
      if (e && e.target === lightboxBackdrop) {
        closeDiagramLightbox();
      }
    });
  }

  const contextCloseBtn = document.getElementById("context-quote-close");
  if (contextCloseBtn) {
    contextCloseBtn.addEventListener("click", closeContextQuoteModal);
  }
  const contextBackdrop = document.getElementById("context-quote-modal");
  if (contextBackdrop) {
    contextBackdrop.addEventListener("click", function (e) {
      if (e && e.target === contextBackdrop) {
        closeContextQuoteModal();
      }
    });
  }

  const figuresCloseBtn = document.getElementById("figures-modal-close");
  if (figuresCloseBtn) {
    figuresCloseBtn.addEventListener("click", closeFiguresModal);
  }
  const figuresBackdrop = document.getElementById("figures-drawer-modal");
  if (figuresBackdrop) {
    figuresBackdrop.addEventListener("click", function (e) {
      if (e && e.target === figuresBackdrop) {
        closeFiguresModal();
      }
    });
  }

  // === KEYBOARD SHORTCUTS ===
  document.addEventListener("keydown", function (e) {
    const lightboxEl = document.getElementById("diagram-lightbox-modal");
    const lightboxOpen = Boolean(lightboxEl && !lightboxEl.classList.contains("hidden"));
    if (lightboxOpen) {
      if (e.key === "Escape" || e.key === "Esc") {
        e.preventDefault();
        closeDiagramLightbox();
      }
      return;
    }
    const contextModalEl = document.getElementById("context-quote-modal");
    const contextModalOpen = Boolean(contextModalEl && !contextModalEl.classList.contains("hidden"));
    if (contextModalOpen) {
      if (e.key === "Escape" || e.key === "Esc") {
        e.preventDefault();
        closeContextQuoteModal();
      }
      return;
    }
    const figuresModalEl = document.getElementById("figures-drawer-modal");
    const figuresModalOpen = Boolean(figuresModalEl && !figuresModalEl.classList.contains("hidden"));
    if (figuresModalOpen) {
      if (e.key === "Escape" || e.key === "Esc") {
        e.preventDefault();
        closeFiguresModal();
      }
      return;
    }
    const tag = e.target && e.target.tagName ? e.target.tagName.toUpperCase() : "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    const modalOpen = !document.getElementById("crate-modal-root").classList.contains("hidden");
    if (modalOpen) return;

    if (activeTopTab === "tab-study" && activeSubTab === "subtab-cards") {
      if (e.code === "Space") {
        e.preventDefault();
        toggleCardFlip();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        stepCard(-1);
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        stepCard(1);
      }
    } else if (activeTopTab === "tab-arena" && arenaState.mode === "solo" && arenaState.phase === "playing") {
      if (!arenaState.answered && ["1", "2", "3", "4"].indexOf(e.key) !== -1) {
        const idx = Number(e.key) - 1;
        if (idx < arenaState.displayedChoices.length) {
          e.preventDefault();
          handleSoloAnswer(idx, false);
        }
      } else if (arenaState.answered && (e.key === "Enter" || e.code === "Space")) {
        e.preventDefault();
        advanceSoloOrCrate();
      }
    } else if (activeTopTab === "tab-arena" && arenaState.mode !== "solo") {
      const customMod = window.ARENA_MODES && window.ARENA_MODES[arenaState.mode];
      if (customMod && typeof customMod.onKeyDown === "function") {
        customMod.onKeyDown(e, getArenaContext());
      }
    }
  });

  // === PRINT HANDLERS ===
  function enterWorksheetPrintMode() {
    document.body.classList.remove("print-vocab-mode");
    closeDiagramLightbox();
    closeContextQuoteModal();
    closeFiguresModal();
    stopAllCustomArenaModes();
    if (!printRestoreState) {
      printRestoreState = {
        mode: "worksheet",
        topTab: activeTopTab,
        subTab: activeSubTab,
        filter: activeFilter,
        activeBlank: activeBlankKey,
        bankWord: selectedBankWord,
        wrongAttempt: lastWrongAttempt,
        notesVocabCollapsed: notesVocabCollapsed,
        notesVocabSelfCheck: notesVocabSelfCheck
      };
    }
    activeFilter = "ALL";
    activeBlankKey = null;
    selectedBankWord = null;
    lastWrongAttempt = null;
    notesVocabCollapsed = false;
    notesVocabSelfCheck = false;
    syncNotesPrintVocabClass();
    renderFilterBar();
    renderGuidedNotes();
  }

  function enterVocabPrintMode() {
    closeDiagramLightbox();
    closeContextQuoteModal();
    closeFiguresModal();
    stopAllCustomArenaModes();
    if (!printRestoreState) {
      printRestoreState = {
        mode: "vocab",
        topTab: activeTopTab,
        subTab: activeSubTab,
        filter: activeFilter,
        activeBlank: activeBlankKey,
        bankWord: selectedBankWord,
        wrongAttempt: lastWrongAttempt,
        vocabSelfCheck: vocabState.selfCheck,
        vocabSearch: vocabState.search
      };
    }
    document.body.classList.add("print-vocab-mode");
    activeFilter = "ALL";
    vocabState.selfCheck = false;
    vocabState.search = "";
    renderFilterBar();
    renderVocabulary();
  }

  function handleBeforePrint() {
    if ((activeTopTab === "tab-study" && activeSubTab === "subtab-vocab" && vocabList.length > 0) ||
        document.body.classList.contains("print-vocab-mode")) {
      enterVocabPrintMode();
    } else {
      enterWorksheetPrintMode();
    }
  }

  function handleAfterPrint() {
    document.body.classList.remove("print-vocab-mode");
    if (!printRestoreState) return;
    const prevMode = printRestoreState.mode || "worksheet";
    const prevTopTab = printRestoreState.topTab;
    const prevSubTab = printRestoreState.subTab;
    activeFilter = printRestoreState.filter;
    activeBlankKey = printRestoreState.activeBlank;
    selectedBankWord = printRestoreState.bankWord;
    lastWrongAttempt = printRestoreState.wrongAttempt || null;
    if (Object.prototype.hasOwnProperty.call(printRestoreState, "notesVocabCollapsed")) {
      notesVocabCollapsed = Boolean(printRestoreState.notesVocabCollapsed);
    }
    if (Object.prototype.hasOwnProperty.call(printRestoreState, "notesVocabSelfCheck")) {
      notesVocabSelfCheck = Boolean(printRestoreState.notesVocabSelfCheck);
    }
    if (Object.prototype.hasOwnProperty.call(printRestoreState, "vocabSelfCheck")) {
      vocabState.selfCheck = Boolean(printRestoreState.vocabSelfCheck);
    }
    if (Object.prototype.hasOwnProperty.call(printRestoreState, "vocabSearch")) {
      vocabState.search = String(printRestoreState.vocabSearch || "");
    }
    printRestoreState = null;
    if (prevMode === "vocab") {
      if (prevTopTab && prevTopTab !== activeTopTab) {
        switchTopTab(prevTopTab, true);
      }
      if (prevSubTab && prevSubTab !== activeSubTab) {
        activateStudySubTab(prevSubTab, false);
      }
    }
    renderFilterBar();
    renderGuidedNotes();
    if (activeSubTab !== "subtab-notes") {
      renderActiveStudySubTab();
    }
  }

  window.addEventListener("beforeprint", handleBeforePrint);
  window.addEventListener("afterprint", handleAfterPrint);
  if (typeof window.matchMedia === "function") {
    try {
      const printMql = window.matchMedia("print");
      if (printMql && typeof printMql.addEventListener === "function") {
        printMql.addEventListener("change", function (evt) {
          if (evt && evt.matches) {
            handleBeforePrint();
          } else {
            handleAfterPrint();
          }
        });
      }
    } catch (e) {}
  }

  // === MULTI-EDITION SWITCHER & HEADER CHROME ===
  function resetMatchState() {
    stopMatchTimer();
    matchState.batchIdx = 0;
    matchState.pairs = [];
    matchState.shuffledDefs = [];
    matchState.selectedTermId = null;
    matchState.selectedDefId = null;
    matchState.matchedIds = [];
    matchState.streak = 0;
    matchState.elapsedSec = 0;
    matchState.started = false;
    matchState.cleared = false;
  }

  function resetAllCustomArenaModes() {
    const reg = window.ARENA_MODES || {};
    Object.keys(reg).forEach(function (k) {
      const mod = reg[k];
      if (!mod) return;
      if (typeof mod.stop === "function") {
        try { mod.stop(); } catch (e) {}
      }
      if (typeof mod.reset === "function") {
        try { mod.reset(); } catch (e) {}
      }
    });
  }

  function resetArenaState() {
    stopSoloTimer();
    stopHostTimer();
    resetAllCustomArenaModes();
    arenaState.mode = "solo";
    arenaState.phase = "lobby";
    arenaState.sectionFilter = "ALL";
    arenaState.queue = [];
    arenaState.qIndex = 0;
    arenaState.displayedChoices = [];
    arenaState.answered = false;
    arenaState.selectedDisplayIdx = -1;
    arenaState.streak = 0;
    arenaState.maxStreak = 0;
    arenaState.correctCount = 0;
    arenaState.answeredCount = 0;
    arenaState.runBolts = 0;
    arenaState.shields = 0;
    arenaState.doubleTurns = 0;
    arenaState.runMultBonus = 0;
    arenaState.missedQuestions = [];
    arenaState.pendingCrate = false;
    arenaState.timeLeftMs = 20000;
    arenaState.totalTimeMs = 20000;
    arenaState.hostIndex = 0;
    arenaState.hostSection = "ALL";
    arenaState.hostTimeLeftSec = arenaState.hostDurationSec || 20;
    arenaState.hostRevealed = false;
    arenaState.hostChoices = [];
    const crateRoot = document.getElementById("crate-modal-root");
    if (crateRoot) {
      crateRoot.classList.add("hidden");
      crateRoot.innerHTML = "";
    }
    document.querySelectorAll("[data-arena-mode]").forEach(function (b) {
      b.classList.toggle("primary", b.getAttribute("data-arena-mode") === "solo");
    });
    const stage = document.getElementById("arena-stage");
    if (stage) stage.innerHTML = "";
  }

  function unmountTopicGame() {
    const mount = document.getElementById("topic-game-mount");
    if (mount && typeof mount._tg2Destroy === "function") {
      try { mount._tg2Destroy(); } catch (e) {}
    }
    if (mount) {
      mount.innerHTML = "";
    }
    topicGameMounted = false;
  }

  function renderEditionSwitcher() {
    const switcher = document.getElementById("edition-switcher");
    if (!switcher) return;
    if (!isMultiEditionMode()) {
      switcher.classList.add("hidden");
      switcher.innerHTML = "";
      return;
    }
    const order = getEditionOrder();
    switcher.classList.remove("hidden");
    switcher.innerHTML = order.map(function (edKey) {
      const edData = window.STUDY_EDITIONS[edKey] || {};
      const btnLabel = (edData.switcher_label && String(edData.switcher_label).trim())
        ? String(edData.switcher_label).trim()
        : ((edData.edition_label && String(edData.edition_label).trim())
          ? String(edData.edition_label).trim()
          : edKey);
      const btnTitle = (edData.switcher_title && String(edData.switcher_title).trim())
        ? String(edData.switcher_title).trim()
        : (edData.title || edData.chapter_title || edData.edition_label || edKey);
      const isActive = edKey === activeEditionKey;
      return '<button type="button" class="edition-btn' + (isActive ? " active" : "") + '" data-edition-key="' + escHtml(edKey) + '" title="' + escHtml(btnTitle) + '" aria-pressed="' + (isActive ? "true" : "false") + '">' + escHtml(btnLabel) + '</button>';
    }).join("");
    switcher.querySelectorAll("[data-edition-key]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const targetKey = btn.getAttribute("data-edition-key");
        if (targetKey && targetKey !== activeEditionKey) {
          window.playSound("click");
          switchStudyEdition(targetKey);
        }
      });
    });
  }

  function renderEditionScopeBanner() {
    const banner = document.getElementById("edition-scope-banner");
    if (!banner) return;
    const rawHtml = (DATA.edition_scope_html && String(DATA.edition_scope_html).trim())
      ? String(DATA.edition_scope_html).trim()
      : "";
    if ((!isMultiEditionMode() && !DATA.show_scope_banner) || !rawHtml) {
      banner.classList.add("hidden");
      banner.removeAttribute("data-edition");
      banner.innerHTML = "";
      return;
    }
    banner.setAttribute("data-edition", activeEditionKey || (DATA && DATA.edition_key) || "");
    banner.innerHTML = rawHtml;
    banner.classList.remove("hidden");
  }

  function updateHeaderAndEditionChrome() {
    const chBadge = formatChapterBadgeJs(DATA);
    const chTitle = String(DATA.title || DATA.chapter_title || "HVACR Study Hub");
    const kickerText = (DATA.kicker_text && String(DATA.kicker_text).trim())
      ? String(DATA.kicker_text).trim()
      : "CTE HVACR Study & Exam Arena";
    const badgeEl = document.getElementById("hdr-ch-badge");
    const titleEl = document.getElementById("hdr-title");
    const kickerEl = document.querySelector(".app-header .title-kicker");
    const exportBtn = document.getElementById("btn-export-blooket");
    if (badgeEl) badgeEl.textContent = chBadge;
    if (titleEl) titleEl.textContent = chTitle;
    if (kickerEl) kickerEl.textContent = kickerText;
    if (exportBtn) {
      exportBtn.textContent = (DATA.blooket_btn_label && String(DATA.blooket_btn_label).trim())
        ? String(DATA.blooket_btn_label).trim()
        : "⬇️ Export Blooket CSV";
    }
    if (DATA.page_title && String(DATA.page_title).trim()) {
      document.title = String(DATA.page_title).trim();
    } else if (isMultiEditionMode() && window.BASE_PAGE_TITLE) {
      document.title = (DATA.edition_label && String(DATA.edition_label).trim())
        ? (String(window.BASE_PAGE_TITLE) + " — " + String(DATA.edition_label).trim())
        : String(window.BASE_PAGE_TITLE);
    } else {
      document.title = chBadge + " — " + chTitle;
    }
    renderEditionSwitcher();
    renderEditionScopeBanner();
  }

  function switchStudyEdition(editionKey) {
    if (!window.STUDY_EDITIONS || !Object.prototype.hasOwnProperty.call(window.STUDY_EDITIONS, editionKey)) {
      return false;
    }
    printRestoreState = null;
    closeDiagramLightbox();
    closeContextQuoteModal();
    closeFiguresModal();
    stopLockoutTicker();
    resetMatchState();
    resetArenaState();
    unmountTopicGame();

    activeEditionKey = editionKey;
    window.ACTIVE_EDITION = editionKey;
    window.CHAPTER_DATA = window.STUDY_EDITIONS[editionKey];
    DATA = window.CHAPTER_DATA;
    if (window.EDITION_PREF_KEY && DATA.remember_edition !== false) {
      try { window.localStorage.setItem(window.EDITION_PREF_KEY, editionKey); } catch (e) {}
    }

    if (typeof SHELL.reloadState === "function") {
      SHELL.reloadState();
    }

    activeFilter = "ALL";
    cardCursor = 0;
    cardFlipped = false;
    activeBlankKey = null;
    selectedBankWord = null;
    lastWrongAttempt = null;
    draggedBankWord = null;
    wordScrambleRanks = Object.create(null);
    scrambleNonce = 1;
    lastWrongCardId = null;
    lastWrongScenarioId = null;
    clearObjectMap(wrongAttemptsByBlank);
    clearObjectMap(wrongCardChoices);
    clearObjectMap(wrongScenarioChoices);
    clearObjectMap(everWrongCardIds);
    clearObjectMap(everWrongScenarioIds);
    vocabState.search = "";
    vocabState.selfCheck = false;
    vocabState.revealedIds = Object.create(null);
    notesVocabCollapsed = false;
    notesVocabSelfCheck = false;
    notesVocabRevealed = Object.create(null);
    notesPrintVocab = true;
    syncNotesPrintVocabClass();
    const vocabHost = document.getElementById("subtab-vocab");
    if (vocabHost) vocabHost.innerHTML = "";

    hydrateDataset(DATA);
    ensureLockoutTicker();
    SHELL.refreshHUD();
    updateHeaderAndEditionChrome();
    syncVocabSubTabVisibility();
    renderFilterBar();
    renderActiveStudySubTab();
    renderArenaStage();
    if (activeTopTab === "tab-game") {
      ensureTopicGameMounted();
    }
    const label = (DATA.edition_label && String(DATA.edition_label).trim())
      ? String(DATA.edition_label).trim()
      : ((DATA.switcher_label && String(DATA.switcher_label).trim()) || editionKey);
    SHELL.showToast("Switched to " + label);
    return true;
  }

  window.switchStudyEdition = switchStudyEdition;

  // === URL DEEP-LINKING & HUB POSTMESSAGE ===
  const TOP_TAB_ALIASES = {
    "study": "tab-study",
    "tab-study": "tab-study",
    "arena": "tab-arena",
    "tab-arena": "tab-arena",
    "game": "tab-game",
    "tab-game": "tab-game"
  };

  const STUDY_SUBTAB_ALIASES = {
    "notes": "subtab-notes",
    "subtab-notes": "subtab-notes",
    "vocab": "subtab-vocab",
    "subtab-vocab": "subtab-vocab",
    "cards": "subtab-cards",
    "subtab-cards": "subtab-cards",
    "match": "subtab-match",
    "subtab-match": "subtab-match",
    "labs": "subtab-labs",
    "subtab-labs": "subtab-labs"
  };

  function normalizeDeepLinkParams(rawParams) {
    if (typeof window.URLSearchParams === "function") {
      if (rawParams instanceof window.URLSearchParams) return rawParams;
      if (typeof rawParams === "string") {
        return new window.URLSearchParams(rawParams.replace(/^\?/, ""));
      }
      const sp = new window.URLSearchParams();
      if (rawParams && typeof rawParams === "object") {
        Object.keys(rawParams).forEach(function (k) {
          if (rawParams[k] != null) sp.set(k, String(rawParams[k]));
        });
      }
      return sp;
    }
    return null;
  }

  function applyDeepLinkParams(rawParams, renderNow) {
    const params = normalizeDeepLinkParams(rawParams);
    if (!params) return;

    let filterChanged = false;
    let searchChanged = false;

    if (params.has("section")) {
      const secRaw = String(params.get("section") || "").trim();
      const secUpper = secRaw.toUpperCase();
      let resolvedFilter = null;
      if (secUpper === "ALL" || secUpper === "EPA608" || secUpper === "TRAP" || secUpper === "PRACTICE") {
        resolvedFilter = secUpper;
      } else if (Object.prototype.hasOwnProperty.call(sectionMap, secRaw)) {
        resolvedFilter = secRaw;
      }
      if (resolvedFilter && resolvedFilter !== activeFilter) {
        activeFilter = resolvedFilter;
        cardCursor = 0;
        cardFlipped = false;
        activeBlankKey = null;
        selectedBankWord = null;
        lastWrongAttempt = null;
        draggedBankWord = null;
        filterChanged = true;
      }
    }

    if (params.has("q")) {
      const nextQ = String(params.get("q") || "");
      if (nextQ !== vocabState.search) {
        vocabState.search = nextQ;
        searchChanged = true;
      }
      const searchInput = document.getElementById("vocab-search-input");
      if (searchInput && searchInput.value !== vocabState.search) {
        searchInput.value = vocabState.search;
      }
    }

    if (filterChanged) {
      renderFilterBar();
    }

    let requestedTab = null;
    if (params.has("tab")) {
      const tKey = String(params.get("tab") || "").trim().toLowerCase();
      if (Object.prototype.hasOwnProperty.call(TOP_TAB_ALIASES, tKey)) {
        requestedTab = TOP_TAB_ALIASES[tKey];
      }
    }

    let requestedSubTab = null;
    if (params.has("subtab")) {
      const sKey = String(params.get("subtab") || "").trim().toLowerCase();
      if (Object.prototype.hasOwnProperty.call(STUDY_SUBTAB_ALIASES, sKey)) {
        const mapped = STUDY_SUBTAB_ALIASES[sKey];
        requestedSubTab = (mapped === "subtab-vocab" && vocabList.length === 0)
          ? "subtab-notes"
          : mapped;
      }
    }

    if (requestedSubTab) {
      activateStudySubTab(requestedSubTab, false);
      if (renderNow) {
        switchTopTab("tab-study", true);
      } else {
        activeTopTab = "tab-study";
        document.querySelectorAll(".top-tab").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-tab") === "tab-study");
        });
        document.querySelectorAll(".tab-panel").forEach(function (p) {
          p.classList.toggle("active", p.id === "tab-study");
        });
      }
      return;
    }

    if (requestedTab) {
      if (renderNow) {
        switchTopTab(requestedTab, true);
      } else {
        activeTopTab = requestedTab;
      }
      return;
    }

    if (renderNow && (filterChanged || searchChanged) && activeTopTab === "tab-study") {
      renderActiveStudySubTab();
    }
  }

  window.addEventListener("message", function (e) {
    const data = e && e.data;
    if (!data || typeof data !== "object") return;
    if (data.type === "ish-preset") {
      const presetSource = (typeof data.query === "string" && data.query.length > 0)
        ? data.query
        : (data.params && typeof data.params === "object" ? data.params : "");
      applyDeepLinkParams(presetSource, true);
      const replyTarget = e.source || (window.parent && window.parent !== window ? window.parent : null);
      if (replyTarget && typeof replyTarget.postMessage === "function") {
        try {
          replyTarget.postMessage({ type: "ish-preset-ack", source: "chapter-study-guide" }, "*");
        } catch (err) {}
      }
    }
  });

  // === INITIAL BOOT ===
  ensureLockoutTicker();
  SHELL.refreshHUD();
  updateHeaderAndEditionChrome();
  syncVocabSubTabVisibility();
  renderFilterBar();
  if (typeof window.URLSearchParams === "function") {
    applyDeepLinkParams(new window.URLSearchParams(window.location.search), false);
  }
  if (activeTopTab !== "tab-study") {
    switchTopTab(activeTopTab, true);
  } else {
    renderActiveStudySubTab();
  }
  renderArenaStage();
  if (window.parent && window.parent !== window) {
    try {
      window.parent.postMessage({ type: "ish-ready", source: "chapter-study-guide" }, "*");
    } catch (e) {}
  }
})();

  </script>
</body>
