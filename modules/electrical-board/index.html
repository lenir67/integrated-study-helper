<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HVAC/R Electrical Theory Classroom Display Board</title>
  <style>
:root {
  --bg: #080f1e;
  --panel: #111b2e;
  --panel-elev: #17243d;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --border: #283754;
  --accent: #38bdf8;
  --accent-strong: #0284c7;
  --good: #22c55e;
  --warn: #f59e0b;
  --danger: #ef4444;
  --shadow: 0 10px 28px rgba(2, 6, 23, 0.45);
}

html.projector-light {
  --bg: #f1f5f9;
  --panel: #ffffff;
  --panel-elev: #f8fafc;
  --text: #0f172a;
  --muted: #475569;
  --border: #cbd5e1;
  --accent: #0284c7;
  --accent-strong: #0369a1;
  --shadow: 0 6px 20px rgba(15, 23, 42, 0.1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}

.hidden {
  display: none !important;
}

.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  max-width: 1760px;
  margin: 0 auto;
  padding: 12px 16px;
  gap: 12px;
}

/* Top Bar */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px 16px;
  box-shadow: var(--shadow);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, #0ea5e9, #2563eb);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 22px;
  font-weight: 900;
}

.brand h1 {
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.brand-sub {
  font-size: 0.78rem;
  color: var(--muted);
  font-weight: 600;
}

.module-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.module-tab {
  background: var(--panel-elev);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: all 0.15s ease;
}

.module-tab:hover {
  border-color: var(--accent);
}

.module-tab.active {
  background: var(--accent-strong);
  border-color: var(--accent);
  color: #ffffff;
}

.tab-num {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.18);
  display: grid;
  place-items: center;
  font-size: 0.75rem;
}

.top-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.btn-sm, .btn-xs, .preset-btn, .seg-btn {
  border: 1px solid var(--border);
  background: var(--panel-elev);
  color: var(--text);
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.15s ease;
}

.btn-sm {
  padding: 7px 12px;
  font-size: 0.82rem;
}

.btn-xs {
  padding: 4px 9px;
  font-size: 0.76rem;
}

.btn-accent {
  background: var(--accent-strong);
  border-color: var(--accent);
  color: #fff;
}

.btn-warn {
  background: #b45309;
  border-color: #f59e0b;
  color: #fff;
}

.btn-ghost:hover, .preset-btn:hover {
  border-color: var(--accent);
}

/* Presets Bar */
.preset-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 14px;
}

.preset-label {
  font-size: 0.78rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--accent);
}

.preset-btn {
  padding: 6px 11px;
  font-size: 0.8rem;
}

/* Guided Walkthrough Banner */
.walkthrough-banner {
  background: linear-gradient(135deg, rgba(14, 165, 233, 0.14), rgba(37, 99, 235, 0.1));
  border: 2px solid var(--accent);
  border-radius: 14px;
  padding: 12px 16px;
}

.wt-top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}

.wt-badge {
  background: var(--accent-strong);
  color: #fff;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.76rem;
  font-weight: 800;
}

.wt-title {
  font-size: 1.05rem;
  font-weight: 800;
  margin-left: 8px;
}

.wt-summary {
  font-size: 0.92rem;
  font-weight: 600;
  margin-bottom: 6px;
}

.wt-points {
  margin-left: 20px;
  font-size: 0.86rem;
  color: var(--muted);
  display: grid;
  gap: 2px;
}

.wt-watch {
  margin-top: 8px;
  padding: 6px 10px;
  border-radius: 8px;
  background: rgba(245, 158, 11, 0.14);
  border: 1px solid rgba(245, 158, 11, 0.4);
  font-size: 0.84rem;
}

/* KPI Strip */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 10px;
}

.kpi-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 12px;
  padding: 10px 14px;
  box-shadow: var(--shadow);
}

.kpi-card.good { border-left-color: var(--good); }
.kpi-card.warn { border-left-color: var(--warn); }
.kpi-card.danger { border-left-color: var(--danger); }
.kpi-card.info { border-left-color: var(--accent); }

.kpi-label {
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  font-weight: 800;
}

.kpi-value {
  font-size: 1.45rem;
  font-weight: 900;
  margin: 2px 0;
  letter-spacing: -0.02em;
}

.kpi-sub {
  font-size: 0.78rem;
  color: var(--muted);
  font-weight: 600;
}

/* Main Workspace */
.board-workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  gap: 14px;
  flex: 1;
  align-items: start;
}

.board-stage {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.visual-grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(430px, 1fr));
  gap: 12px;
}

.viz-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  box-shadow: var(--shadow);
}

.viz-title {
  font-size: 0.95rem;
  font-weight: 800;
  margin-bottom: 10px;
  color: var(--accent);
}

.viz-split {
  display: grid;
  grid-template-columns: 0.95fr 1.05fr;
  gap: 10px;
  align-items: center;
}

.viz-split-tight {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 10px;
  align-items: center;
  margin-top: 8px;
}

.board-svg-sm, .board-svg-md, .board-svg-lg, .board-svg-xl {
  width: 100%;
  height: auto;
  display: block;
}

.board-canvas {
  width: 100%;
  height: auto;
  border-radius: 10px;
  border: 1px solid var(--border);
  display: block;
}

.svg-wheel-text {
  font-size: 11px;
  font-weight: 800;
}

.svg-clickable {
  cursor: pointer;
}

.svg-clickable:hover {
  opacity: 0.88;
}

@keyframes dashFlow {
  to {
    stroke-dashoffset: -56;
  }
}

.flow-anim {
  animation: dashFlow 1.2s linear infinite;
}

/* Hazard & Meter Bars */
.hazard-box, .xfmr-status-bar, .diag-subcard {
  background: var(--panel-elev);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 10px;
  padding: 10px 12px;
  margin-top: 8px;
}

.hazard-box.severity-lethal, .hazard-box.severity-danger { border-left-color: var(--danger); }
.hazard-box.severity-warning, .hazard-box.severity-caution { border-left-color: var(--warn); }
.hazard-box.severity-safe { border-left-color: var(--good); }

.hazard-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: 0.84rem;
  font-weight: 700;
}

.meter-track {
  position: relative;
  height: 12px;
  background: rgba(100, 116, 139, 0.25);
  border-radius: 999px;
  margin: 7px 0;
  overflow: hidden;
}

.meter-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.25s ease;
}

.meter-fill.severity-safe { background: var(--good); }
.meter-fill.severity-caution, .meter-fill.severity-warning { background: var(--warn); }
.meter-fill.severity-danger, .meter-fill.severity-lethal { background: var(--danger); }

.meter-marker {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: #fff;
  opacity: 0.8;
}

.meter-marker.danger {
  background: #fca5a5;
}

.hazard-desc {
  font-size: 0.8rem;
  color: var(--muted);
}

.mini-kpi-stack {
  display: grid;
  gap: 6px;
}

.mini-kpi {
  background: var(--panel-elev);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
  display: flex;
  justify-content: space-between;
  font-size: 0.82rem;
}

.rotation-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--panel-elev);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 8px 12px;
  margin-top: 10px;
  font-size: 0.8rem;
}

.rot-badge {
  color: #fff;
  font-weight: 900;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 0.9rem;
}

.reasoning-box {
  background: var(--panel-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 0.8rem;
  display: grid;
  gap: 4px;
  margin-top: 8px;
}

.diag-blocks {
  display: grid;
  gap: 8px;
}

.starter-btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.tstat-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(115px, 1fr));
  gap: 6px;
  margin-top: 4px;
}

.tstat-chip {
  background: var(--panel-elev);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 0.74rem;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.tstat-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Right Controls Sidebar */
.controls-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  box-shadow: var(--shadow);
  position: sticky;
  top: 12px;
}

.ctrl-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.ctrl-group:last-child {
  border-bottom: none;
  margin-bottom: 0;
  padding-bottom: 0;
}

.ctrl-group h3 {
  font-size: 0.86rem;
  font-weight: 800;
  color: var(--accent);
}

.ctrl-group label {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.ctrl-group input[type="number"],
.ctrl-group select {
  background: var(--panel-elev);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 6px 8px;
  font-size: 0.85rem;
  font-weight: 700;
}

.ctrl-group input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
}

.ctrl-2col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.ctrl-3col {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
}

.seg-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.seg-btn {
  padding: 7px 8px;
  font-size: 0.8rem;
}

.seg-btn.active {
  background: var(--accent-strong);
  border-color: var(--accent);
  color: #fff;
}

.ctrl-help {
  font-size: 0.82rem;
  color: var(--muted);
}

/* Curriculum Matrix & Quiz */
.chapter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 10px;
}

.chapter-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
}

.chapter-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}

.ch-pill {
  background: rgba(56, 189, 248, 0.16);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 800;
}

.ch-meta {
  font-size: 0.76rem;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 6px;
}

.ch-outcomes {
  margin-left: 16px;
  font-size: 0.8rem;
  display: grid;
  gap: 3px;
}

.quiz-top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.quiz-ref {
  font-size: 0.8rem;
  color: var(--muted);
  font-weight: 700;
  margin-left: 8px;
}

.quiz-score {
  font-size: 0.9rem;
  font-weight: 800;
  color: var(--good);
}

.quiz-question {
  font-size: 1.15rem;
  font-weight: 800;
  margin-bottom: 12px;
}

.quiz-choices {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  gap: 8px;
}

.quiz-choice {
  text-align: left;
  background: var(--panel-elev);
  color: var(--text);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}

.quiz-choice:hover:not(:disabled) {
  border-color: var(--accent);
}

.quiz-choice.correct {
  border-color: var(--good);
  background: rgba(34, 197, 94, 0.16);
}

.quiz-choice.wrong {
  border-color: var(--danger);
  background: rgba(239, 68, 68, 0.16);
}

.choice-letter {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--border);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.quiz-explain {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 0.88rem;
}

.quiz-explain.ok {
  background: rgba(34, 197, 94, 0.14);
  border: 1px solid var(--good);
}

.quiz-explain.bad {
  background: rgba(239, 68, 68, 0.14);
  border: 1px solid var(--danger);
}

.quiz-nav {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

@media (max-width: 1120px) {
  .board-workspace {
    grid-template-columns: 1fr;
  }
  .controls-panel {
    position: static;
  }
  .viz-split, .viz-split-tight {
    grid-template-columns: 1fr;
  }
}

@media print {
  .no-print {
    display: none !important;
  }
  body {
    background: #fff;
    color: #000;
  }
}

/* Custom Circuit Builder & Virtual Digital Multimeter */
.cb-layout {
  display: grid;
  grid-template-columns: 1.55fr 0.95fr;
  gap: 12px;
  align-items: start;
}

.cb-header-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.cb-header-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.cb-alert-banner {
  padding: 8px 12px;
  border-radius: 9px;
  font-size: 0.84rem;
  margin-bottom: 8px;
  border: 1px solid var(--danger);
  background: rgba(239, 68, 68, 0.16);
  color: var(--text);
}

.hop-strip-wrap {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

.hop-strip-label {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 6px;
}

.hop-chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.hop-chip {
  background: var(--panel-elev);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 9px;
  font-size: 0.76rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.hop-chip.active, .hop-chip:hover {
  border-color: var(--accent);
  background: rgba(56, 189, 248, 0.16);
}

.dmm-mode-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 10px;
}

.dmm-mode-btn {
  background: var(--panel-elev);
  color: var(--text);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 8px 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-weight: 800;
  font-size: 0.78rem;
}

.dmm-mode-btn .dmm-sym {
  font-size: 1.2rem;
  line-height: 1;
}

.dmm-mode-btn.active.mode-v {
  border-color: #ef4444;
  background: rgba(239, 68, 68, 0.18);
}

.dmm-mode-btn.active.mode-a {
  border-color: #f59e0b;
  background: rgba(245, 158, 11, 0.18);
}

.dmm-mode-btn.active.mode-ohm {
  border-color: #22c55e;
  background: rgba(34, 197, 94, 0.18);
}

.dmm-lcd {
  background: linear-gradient(180deg, #0b1628 0%, #0f1d33 100%);
  border: 2px solid #334155;
  border-radius: 12px;
  padding: 12px;
  color: #f8fafc;
}

html.projector-light .dmm-lcd {
  background: #e2e8f0;
  border-color: #64748b;
  color: #0f172a;
}

.dmm-lcd.warning-live {
  border-color: var(--danger);
  box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.25);
}

.dmm-lcd.beep-on {
  border-color: var(--good);
}

.dmm-lcd-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.75rem;
  opacity: 0.88;
}

.dmm-beep-pill {
  background: #16a34a;
  color: #fff;
  padding: 2px 7px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 0.72rem;
}

.dmm-lcd-target {
  font-size: 0.82rem;
  font-weight: 700;
  margin-top: 4px;
  color: var(--accent);
}

.dmm-lcd-value {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 2.35rem;
  font-weight: 900;
  line-height: 1.15;
  margin: 4px 0;
  letter-spacing: -0.02em;
}

.dmm-live-warn {
  margin: 6px 0;
  padding: 6px 8px;
  border-radius: 8px;
  background: rgba(239, 68, 68, 0.22);
  border: 1px solid #ef4444;
  color: #fecaca;
  font-size: 0.76rem;
  font-weight: 800;
}

html.projector-light .dmm-live-warn {
  color: #991b1b;
  background: rgba(239, 68, 68, 0.14);
}

.dmm-lcd-sub {
  font-size: 0.78rem;
  opacity: 0.85;
}

.cb-probe-section {
  margin-top: 10px;
}

.cb-target-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 5px;
  max-height: 175px;
  overflow-y: auto;
}

.cb-target-btn {
  text-align: left;
  background: var(--panel-elev);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 0.78rem;

  <script>
/**
 * HVAC/R Electrical Theory Simulation & Calculation Engine
 * Aligned to MRAC 2025 Chapters 13-19, Year 1 Deck 02, Year 2 Deck 06,
 * and Labs 05-08, 17, 64-67 (Michigan CTE CIP 47.0201 Domains B1-B5).
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) {
    module.exports = api;
  }
  root.HVACTheory = api;
}(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  function num(v, fallback = 0) {
    const n = Number(v);
    return Number.isFinite(n) ? n : fallback;
  }

  function clamp(v, min, max) {
    return Math.min(max, Math.max(min, v));
  }

  function round(v, decimals = 2) {
    if (!Number.isFinite(v)) return v;
    const f = Math.pow(10, decimals);
    return Math.round(v * f) / f;
  }

  /**
   * 1. Ohm's Law & Watt's Law Solver
   * Accepts any two of { V, I, R, P } (or knownPair hint: 'VI', 'VR', 'IR', 'PV', 'PI', 'PR').
   */
  function solveOhmsAndWatts(params = {}) {
    const has = (k) => params[k] !== undefined && params[k] !== null && params[k] !== '' && Number.isFinite(Number(params[k]));
    let pair = params.knownPair;
    if (!pair) {
      if (has('V') && has('I')) pair = 'VI';
      else if (has('V') && has('R')) pair = 'VR';
      else if (has('I') && has('R')) pair = 'IR';
      else if (has('P') && has('V')) pair = 'PV';
      else if (has('P') && has('I')) pair = 'PI';
      else if (has('P') && has('R')) pair = 'PR';
      else pair = 'VI';
    }

    let V = 0;
    let I = 0;
    let R = 0;
    let P = 0;
    const formulasUsed = [];

    const inV = Math.max(0, num(params.V, 240));
    const inI = Math.max(0, num(params.I, 10));
    const inR = Math.max(0.001, num(params.R, 24));
    const inP = Math.max(0, num(params.P, 2400));

    switch (pair) {
      case 'VI':
        V = inV;
        I = inI;
        R = I > 0 ? V / I : Infinity;
        P = V * I;
        formulasUsed.push('R = E / I', 'P = E × I');
        break;
      case 'VR':
        V = inV;
        R = inR;
        I = V / R;
        P = (V * V) / R;
        formulasUsed.push('I = E / R', 'P = E² / R');
        break;
      case 'IR':
        I = inI;
        R = inR;
        V = I * R;
        P = I * I * R;
        formulasUsed.push('E = I × R', 'P = I² × R');
        break;
      case 'PV':
        P = inP;
        V = Math.max(0.001, inV);
        I = P / V;
        R = (V * V) / Math.max(0.0001, P);
        formulasUsed.push('I = P / E', 'R = E² / P');
        break;
      case 'PI':
        P = inP;
        I = Math.max(0.0001, inI);
        V = P / I;
        R = P / (I * I);
        formulasUsed.push('E = P / I', 'R = P / I²');
        break;
      case 'PR':
        P = inP;
        R = inR;
        I = Math.sqrt(P / R);
        V = Math.sqrt(P * R);
        formulasUsed.push('I = √(P / R)', 'E = √(P × R)');
        break;
      default:
        V = inV;
        I = inI;
        R = I > 0 ? V / I : Infinity;
        P = V * I;
        formulasUsed.push('R = E / I', 'P = E × I');
    }

    const P_kw = P / 1000;
    const btuPerHr = P_kw * 3413;
    const horsepower = P / 746;

    return {
      knownPair: pair,
      V: round(V, 3),
      I: round(I, 4),
      R: Number.isFinite(R) ? round(R, 3) : Infinity,
      P_watts: round(P, 2),
      P_kw: round(P_kw, 4),
      btuPerHr: round(btuPerHr, 1),
      horsepower: round(horsepower, 3),
      formulasUsed
    };
  }

  /**
   * 2. Human Electrical Shock Hazard Classification (Deck 02 Slide 2 / Ch. 13)
   */
  function evaluateShockHazard(currentAmps) {
    const amps = Math.max(0, num(currentAmps, 0));
    const currentMa = amps * 1000;
    let level = 'IMPERCEPTIBLE';
    let label = 'Imperceptible (< 1 mA)';
    let physiologicalEffect = 'Below human perception threshold.';
    let severity = 'safe';

    if (currentMa >= 50) {
      level = 'LETHAL_FIBRILLATION';
      label = 'Lethal Ventricular Fibrillation (≥ 50 mA)';
      physiologicalEffect = '50–100 mA across the heart causes ventricular fibrillation and cardiac arrest within seconds.';
      severity = 'lethal';
    } else if (currentMa >= 20) {
      level = 'RESPIRATORY_PARALYSIS';
      label = 'Respiratory Paralysis (20–50 mA)';
      physiologicalEffect = 'Severe chest muscle contraction; victim cannot breathe.';
      severity = 'danger';
    } else if (currentMa >= 5) {
      level = 'PAINFUL_FREEZE';
      label = 'Muscular Freeze / Can\'t Let Go (5–20 mA)';
      physiologicalEffect = 'Painful shock; involuntary muscle contraction prevents releasing conductor.';
      severity = 'warning';
    } else if (currentMa >= 1) {
      level = 'MILD_TINGLING';
      label = 'Mild Tingling (1–5 mA)';
      physiologicalEffect = 'Faint sensation; approaches 5 mA Class A GFCI trip point.';
      severity = 'caution';
    }

    return {
      currentAmps: round(amps, 4),
      currentMa: round(currentMa, 2),
      level,
      label,
      physiologicalEffect,
      severity,
      gfciTrips: currentMa >= 5,
      lethalZone: currentMa >= 50
    };
  }

  /**
   * 3. Step-Down Control Transformer & 3A Fuse Solver (Deck 02 Slide 6 & Slide 10)
   */
  function solveTransformer(params = {}) {
    const Vpri = Math.max(1, num(params.Vpri, 120));
    const Vsec = Math.max(1, num(params.Vsec, 24));
    const vaRating = Math.max(1, num(params.vaRating, 40));
    const loadAmps = Math.max(0, num(params.loadAmps, 1.0));
    const fuseAmps = Math.max(0.1, num(params.fuseAmps, 3.0));

    const turnsRatio = Vpri / Vsec;
    const maxSafeAmps = vaRating / Vsec;
    const operatingVA = Vsec * loadAmps;
    const primaryAmps = operatingVA / Vpri;
    const loadPct = (operatingVA / vaRating) * 100;
    const fuseBlown = loadAmps > fuseAmps;
    const overloaded = operatingVA > vaRating;

    let status = 'NORMAL';
    let message = 'Transformer operating within continuous VA rating.';
    if (fuseBlown) {
      status = 'FUSE_BLOWN';
      message = `${fuseAmps}A control fuse opens immediately to save transformer windings.`;
    } else if (overloaded) {
      status = 'OVERLOADED_WINDING';
      message = `Operating at ${round(operatingVA, 1)} VA (> ${vaRating} VA limit). Winding overheats and burns varnish!`;
    }

    return {
      Vpri,
      Vsec,
      vaRating,
      loadAmps: round(loadAmps, 3),
      fuseAmps,
      turnsRatio: round(turnsRatio, 2),
      turnsRatioLabel: `${round(turnsRatio, 2)}:1`,
      maxSafeAmps: round(maxSafeAmps, 2),
      operatingVA: round(operatingVA, 2),
      primaryAmps: round(primaryAmps, 3),
      loadPct: round(loadPct, 1),
      fuseBlown,
      overloaded,
      status,
      message
    };
  }

  /**
   * 4. Series Circuit & Open-Switch / Pitted-Contact Voltage Solver (LAB-05 & LAB-06)
   */
  function solveSeriesCircuit(params = {}) {
    const supplyV = Math.max(0, num(params.supplyV, 24));
    const rawComponents = Array.isArray(params.components) ? params.components : [];

    let firstOpenIdx = -1;
    let totalClosedR = 0;

    for (let i = 0; i < rawComponents.length; i++) {
      const c = rawComponents[i];
      const closed = c.closed !== false;
      const r = Math.max(0, num(c.R_ohm, c.role === 'switch' ? 0.02 : 12));
      if (!closed && firstOpenIdx === -1) {
        firstOpenIdx = i;
      }
      if (closed) {
        totalClosedR += r;
      }
    }

    const allClosed = firstOpenIdx === -1;
    const R_total = allClosed ? totalClosedR : Infinity;
    const I_total = allClosed && totalClosedR > 0 ? supplyV / totalClosedR : 0;

    let runningV = supplyV;
    const components = rawComponents.map((c, idx) => {
      const closed = c.closed !== false;
      const role = c.role || 'load';
      const r = Math.max(0, num(c.R_ohm, role === 'switch' ? 0.02 : 12));
      const vBefore = runningV;
      let voltageDrop = 0;

      if (allClosed) {
        voltageDrop = I_total * r;
      } else if (idx === firstOpenIdx) {
        voltageDrop = supplyV;
      } else {
        voltageDrop = 0;
      }

      const vAfter = Math.max(0, vBefore - voltageDrop);
      runningV = vAfter;

      const pitted = role === 'switch' && closed && voltageDrop > 0.2;
      let status = 'DE_ENERGIZED';
      if (!closed) {
        status = 'OPEN';
      } else if (pitted) {
        status = 'PITTED_CONTACT';
      } else if (allClosed) {
        status = 'ENERGIZED';
      }

      return {
        id: c.id || `c_${idx}`,
        name: c.name || `Component ${idx + 1}`,
        role,
        closed,
        R_ohm: closed ? round(r, 3) : Infinity,
        voltageDrop: round(voltageDrop, 3),
        voltageToCommonBefore: round(vBefore, 3),
        voltageToCommonAfter: round(vAfter, 3),
        powerWatts: round(I_total * voltageDrop, 3),
        status
      };
    });

    return {
      supplyV,
      allClosed,
      R_total: Number.isFinite(R_total) ? round(R_total, 3) : Infinity,
      I_total: round(I_total, 4),
      totalPowerWatts: round(supplyV * I_total, 3),
      firstOpenComponent: firstOpenIdx >= 0 ? components[firstOpenIdx].id : null,
      components
    };
  }

  /**
   * 5. Parallel Circuit Solver (Deck 02 Slide 4 & LAB-05 Part 3)
   */
  function solveParallelCircuit(params = {}) {
    const supplyV = Math.max(0, num(params.supplyV, 240));
    const rawBranches = Array.isArray(params.branches) ? params.branches : [];

    let totalAmps = 0;
    let totalWatts = 0;
    let minActiveR = Infinity;

    const branches = rawBranches.map((b, idx) => {
      const switchClosed = b.switchClosed !== false;
      const faultMode = b.faultMode || 'none';
      const r = Math.max(0.01, num(b.R_ohm, 24));
      const active = switchClosed && faultMode !== 'open';
      const currentAmps = active ? supplyV / r : 0;
      const powerWatts = active ? supplyV * currentAmps : 0;

      if (active) {
        totalAmps += currentAmps;
        totalWatts += powerWatts;
        if (r < minActiveR) minActiveR = r;
      }

      return {
        id: b.id || `b_${idx}`,
        name: b.name || `Branch ${idx + 1}`,
        active,
        switchClosed,
        faultMode,
        R_ohm: round(r, 3),
        voltageDrop: active ? round(supplyV, 2) : 0,
        currentAmps: round(currentAmps, 3),
        powerWatts: round(powerWatts, 2),
        status: active ? 'ENERGIZED' : (faultMode === 'open' ? 'OPEN_LOAD' : 'SWITCH_OPEN')
      };
    });

    const activeCount = branches.filter((b) => b.active).length;
    const R_total = totalAmps > 0 ? supplyV / totalAmps : Infinity;

    return {
      supplyV,
      activeCount,
      I_total: round(totalAmps, 3),
      R_total: Number.isFinite(R_total) ? round(R_total, 3) : Infinity,
      P_totalWatts: round(totalWatts, 2),
      minActiveR: Number.isFinite(minActiveR) ? round(minActiveR, 3) : Infinity,
      rTotalLessThanSmallest: activeCount >= 2 ? R_total < minActiveR : true,
      branches
    };
  }

  /**
   * 6. Hopscotch Ladder Troubleshooting Diagnostic Simulator (LAB-06 Step 5)
   */
  function solveHopscotchDiagnostic(params = {}) {
    const supplyV = Math.max(0, num(params.supplyV, 24));
    const faultTarget = params.faultTarget || 'none';
    const pittedTarget = params.pittedTarget || 'none';
    const coolingCall = params.coolingCall !== false;

    const chain = [
      { id: 'fuse', name: '3A Control Fuse', role: 'switch', R_ohm: 0.02, closed: faultTarget !== 'fuse' },
      { id: 'hp', name: 'High-Pressure Switch (NC)', role: 'switch', R_ohm: pittedTarget === 'hp' ? 3.5 : 0.02, closed: faultTarget !== 'hp' },
      { id: 'lp', name: 'Low-Pressure Switch (NC)', role: 'switch', R_ohm: pittedTarget === 'lp' ? 3.5 : 0.02, closed: faultTarget !== 'lp' },
      { id: 'hl', name: 'Limit / Float Safety (NC)', role: 'switch', R_ohm: pittedTarget === 'hl' ? 3.5 : 0.02, closed: faultTarget !== 'hl' },
      { id: 'tstat_y', name: 'Thermostat Cool Call (Y)', role: 'switch', R_ohm: pittedTarget === 'tstat_y' ? 3.5 : 0.02, closed: coolingCall && faultTarget !== 'tstat_y' },
      { id: 'coil', name: 'Contactor Coil (CC)', role: 'load', R_ohm: 18.0, closed: faultTarget !== 'coil' }
    ];

    const seriesResult = solveSeriesCircuit({ supplyV, components: chain });
    const cMap = {};
    for (const c of seriesResult.components) {
      cMap[c.id] = c;
    }

    const testPoints = [
      { id: 'TP1', label: 'Transformer R (24V Hot)', voltageToCommon: round(supplyV, 2) },
      { id: 'TP2', label: 'After 3A Fuse', voltageToCommon: cMap.fuse.voltageToCommonAfter },
      { id: 'TP3', label: 'After High-Pressure Switch', voltageToCommon: cMap.hp.voltageToCommonAfter },
      { id: 'TP4', label: 'After Low-Pressure Switch', voltageToCommon: cMap.lp.voltageToCommonAfter },
      { id: 'TP5', label: 'After Limit / Float Safety', voltageToCommon: cMap.hl.voltageToCommonAfter },
      { id: 'TP6', label: 'After Thermostat Y / Coil (+)', voltageToCommon: cMap.tstat_y.voltageToCommonAfter },
      { id: 'TP7', label: 'Contactor Coil Common (C)', voltageToCommon: cMap.coil.voltageToCommonAfter }
    ];

    const acrossSwitchReadings = seriesResult.components.map((c) => ({
      id: c.id,
      name: c.name,
      voltageAcross: c.voltageDrop,
      status: c.status
    }));

    return {
      supplyV,
      faultTarget,
      pittedTarget,
      coolingCall,
      contactorEnergized: seriesResult.allClosed,
      currentAmps: seriesResult.I_total,
      testPoints,
      acrossSwitchReadings,
      diagnosedFault: seriesResult.firstOpenComponent
    };
  }

  /**
   * 7. AC Sine Wave, Inductive/Capacitive Reactance & Power Factor (Ch. 14)
   */
  function solveACPowerAndReactance(params = {}) {
    const Vrms = Math.max(0, num(params.Vrms, 240));
    const freqHz = Math.max(1, num(params.freqHz, 60));
    const R_ohm = Math.max(0.01, num(params.R_ohm, 12));
    const L_mH = Math.max(0, num(params.L_mH, 25));
    const C_uF = Math.max(0, num(params.C_uF, 0));

    const Vpeak = Vrms * Math.SQRT2;
    const Vpp = Vpeak * 2;
    const Vavg = Vpeak * 0.637;
    const rmsFactor = Math.SQRT1_2;

    const XL_ohm = 2 * Math.PI * freqHz * (L_mH / 1000);
    const XC_ohm = C_uF > 0 ? 1e6 / (2 * Math.PI * freqHz * C_uF) : 0;
    const X_net = XL_ohm - XC_ohm;
    const Z_ohm = Math.hypot(R_ohm, X_net);

    const Irms = Z_ohm > 0 ? Vrms / Z_ohm : 0;
    const Ipeak = Irms * Math.SQRT2;

    const phaseAngleRad = Math.atan2(X_net, R_ohm);
    const phaseAngleDeg = phaseAngleRad * (180 / Math.PI);
    const powerFactor = Math.cos(phaseAngleRad);

    const apparentPowerVA = Vrms * Irms;
    const truePowerW = apparentPowerVA * powerFactor;
    const reactivePowerVAR = apparentPowerVA * Math.abs(Math.sin(phaseAngleRad));

    let circuitNature = 'RESISTIVE';
    if (phaseAngleDeg > 1.0) circuitNature = 'INDUCTIVE_ELI';
    else if (phaseAngleDeg < -1.0) circuitNature = 'CAPACITIVE_ICE';

    return {
      Vrms: round(Vrms, 2),
      Vpeak: round(Vpeak, 2),
      Vpp: round(Vpp, 2),
      Vavg: round(Vavg, 2),
      rmsFactor: round(rmsFactor, 4),
      freqHz,
      R_ohm: round(R_ohm, 3),
      L_mH,
      C_uF,
      XL_ohm: round(XL_ohm, 3),
      XC_ohm: round(XC_ohm, 3),
      X_net: round(X_net, 3),
      Z_ohm: round(Z_ohm, 3),
      Irms: round(Irms, 3),
      Ipeak: round(Ipeak, 3),
      phaseAngleDeg: round(phaseAngleDeg, 2),
      powerFactor: round(powerFactor, 4),
      powerFactorPct: round(powerFactor * 100, 1),
      apparentPowerVA: round(apparentPowerVA, 1),
      truePowerW: round(truePowerW, 1),
      reactivePowerVAR: round(reactivePowerVAR, 1),
      circuitNature
    };
  }

  /**
   * 8. Three-Phase Power, Rotation & NEMA MG-1 Voltage Imbalance (Deck 06 Slides 4-6 & LAB-66)
   */
  function solveThreePhaseSystem(params = {}) {
    const systemType = params.systemType || 'wye_480';
    const defaults = {
      wye_208: { VLL: 208, VLN: 120, label: '208Y/120V 3-Phase 4-Wire Wye' },
      wye_480: { VLL: 480, VLN: 277, label: '480Y/277V 3-Phase 4-Wire Wye' },
      delta_240: { VLL: 240, VLN: 120, highLegV: 208, label: '240V 3-Phase High-Leg Delta (Wild Leg B)' }
    };
    const spec = defaults[systemType] || defaults.wye_480;

    const V12 = Math.max(0, num(params.V12, spec.VLL));
    const V23 = Math.max(0, num(params.V23, spec.VLL));
    const V31 = Math.max(0, num(params.V31, spec.VLL));
    const lineAmps = Math.max(0, num(params.lineAmps, 20));
    const powerFactor = clamp(num(params.powerFactor, 0.85), 0.1, 1.0);
    const phaseSequence = params.phaseSequence === 'CBA' ? 'CBA' : 'ABC';

    const Vavg = (V12 + V23 + V31) / 3;
    const deviations = [
      Math.abs(V12 - Vavg),
      Math.abs(V23 - Vavg),
      Math.abs(V31 - Vavg)
    ];
    const maxDeviation = Math.max(...deviations);
    const pctVoltageImbalance = Vavg > 0 ? (maxDeviation / Vavg) * 100 : 0;
    const pctCurrentImbalance = 7 * pctVoltageImbalance;
    const windingTempRiseC = 2 * Math.pow(pctVoltageImbalance, 2);
    const windingTempRiseF = windingTempRiseC * 1.8;

    let nemaStatus = 'GOOD';
    let nemaMessage = 'Within 1.0% NEMA MG-1 balanced threshold; 100% motor capacity available.';
    let nemaDeratingFactor = 1.0;

    if (pctVoltageImbalance > 5.0) {
      nemaStatus = 'DO_NOT_OPERATE';
      nemaMessage = 'CRITICAL (> 5.0% imbalance): NEMA prohibits operation! Severe stator overheating imminent.';
      nemaDeratingFactor = 0;
    } else if (pctVoltageImbalance > 2.0) {
      nemaStatus = 'DERATE_REQUIRED';
      nemaMessage = 'WARNING (2.0%–5.0% imbalance): Motor must be derated per NEMA MG-1 curve.';
      nemaDeratingFactor = round(clamp(1.0 - (pctVoltageImbalance - 1.0) * 0.065, 0.72, 0.96), 2);
    } else if (pctVoltageImbalance > 1.0) {
      nemaStatus = 'CAUTION';
      nemaMessage = 'CAUTION (1.0%–2.0% imbalance): Monitor phase currents and winding temperature.';
      nemaDeratingFactor = round(clamp(1.0 - (pctVoltageImbalance - 1.0) * 0.04, 0.96, 1.0), 2);
    }

    const lineToNeutralV = systemType === 'delta_240' ? 120 : Vavg / Math.sqrt(3);
    const threePhasePowerVA = Math.sqrt(3) * Vavg * lineAmps;
    const threePhasePowerW = threePhasePowerVA * powerFactor;
    const scrollCompressorSafe = phaseSequence === 'ABC';

    return {
      systemType,
      systemLabel: spec.label,
      V12: round(V12, 1),
      V23: round(V23, 1),
      V31: round(V31, 1),
      Vavg: round(Vavg, 2),
      deviations: deviations.map((d) => round(d, 2)),
      maxDeviation: round(maxDeviation, 2),
      pctVoltageImbalance: round(pctVoltageImbalance, 2),
      pctCurrentImbalance: round(pctCurrentImbalance, 1),
      windingTempRiseC: round(windingTempRiseC, 2),
      windingTempRiseF: round(windingTempRiseF, 2),
      nemaStatus,
      nemaMessage,
      nemaDeratingFactor,
      nominalVLL: spec.VLL,
      nominalVLN: round(lineToNeutralV, 1),
      highLegVolts: systemType === 'delta_240' ? 208 : null,
      lineAmps: round(lineAmps, 2),
      powerFactor: round(powerFactor, 2),
      threePhasePowerVA: round(threePhasePowerVA, 1),
      threePhasePowerW: round(threePhasePowerW, 1),
      threePhasePowerKw: round(threePhasePowerW / 1000, 2),
      phaseSequence,
      scrollCompressorSafe,
      rotationWarning: scrollCompressorSafe
        ? 'Clockwise (A-B-C): Normal forward scroll/screw compression & oil pump rotation.'
        : 'REVERSE ROTATION (C-B-A): Scroll compressor will NOT pump, cavitate (>85 dBA), starve oil, and seize! Swap any two line leads.'
    };
  }

  /**
   * 9A. AC Motor Synchronous Speed & Rotor Slip (Ch. 16)
   */
  function solveMotorSpeedAndWindings(params = {}) {
    const freqHz = Math.max(1, num(params.freqHz, 60));
    const poles = Math.max(2, num(params.poles, 4));
    const syncSpeedRpm = (120 * freqHz) / poles;
    const actualRpm = clamp(num(params.actualRpm, syncSpeedRpm * 0.96), 0, syncSpeedRpm);
    const slipRpm = Math.max(0, syncSpeedRpm - actualRpm);
    const slipPct = syncSpeedRpm > 0 ? (slipRpm / syncSpeedRpm) * 100 : 0;

    return {
      freqHz,
      poles,
      motorType: params.motorType || 'PSC',
      syncSpeedRpm: round(syncSpeedRpm, 0),
      actualRpm: round(actualRpm, 0),
      slipRpm: round(slipRpm, 0),
      slipPct: round(slipPct, 2)
    };
  }

  /**
   * 9B. Unmarked Hermetic Compressor Terminal Identification (C, S, R) (Deck 06 Slide 2 & LAB-64)
   */
  function identifyCompressorTerminals(params = {}) {
    const R_12 = num(params.R_12, Infinity);
    const R_23 = num(params.R_23, Infinity);
    const R_13 = num(params.R_13, Infinity);
    const R_ground_Mohm = num(params.R_ground_Mohm, 500);

    const groundFault = R_ground_Mohm < 1.0;
    const pairs = [
      { key: '1-2', pins: ['1', '2'], other: '3', r: R_12 },
      { key: '2-3', pins: ['2', '3'], other: '1', r: R_23 },
      { key: '1-3', pins: ['1', '3'], other: '2', r: R_13 }
    ];

    const hasOpen = pairs.some((p) => !Number.isFinite(p.r) || p.r > 5000);
    const hasShort = pairs.some((p) => p.r <= 0.05);

    if (hasOpen) {
      return {
        status: 'OPEN_WINDING',
        groundFault,
        pinMap: { '1': '?', '2': '?', '3': '?' },
        commonPin: null,
        startPin: null,
        runPin: null,
        R_CR: null,
        R_CS: null,
        R_SR: null,
        sumCheckExpected: null,
        sumError: null,
        reasoningSteps: [
          'One or more terminal pairs read OL (Open / Infinite Ω).',
          'Check if internal thermal overload is tripped (allow compressor to cool) or replace compressor for open stator winding.'
        ]
      };
    }

    if (hasShort) {
      return {
        status: 'SHORTED_WINDING',
        groundFault,
        pinMap: { '1': '?', '2': '?', '3': '?' },
        commonPin: null,
        startPin: null,
        runPin: null,
        R_CR: null,
        R_CS: null,
        R_SR: null,
        sumCheckExpected: null,
        sumError: null,
        reasoningSteps: [
          'Near-zero resistance (≤ 0.05 Ω) detected between terminals indicating shorted stator turns.',
          'Condemn compressor motor.'
        ]
      };
    }

    const sorted = [...pairs].sort((a, b) => b.r - a.r);
    const highestPair = sorted[0];
    const commonPin = highestPair.other;

    const legsFromCommon = pairs.filter((p) => p.pins.includes(commonPin));
    const legA = legsFromCommon[0];
    const legB = legsFromCommon[1];

    const startLeg = legA.r >= legB.r ? legA : legB;
    const runLeg = legA.r >= legB.r ? legB : legA;

    const startPin = startLeg.pins.find((p) => p !== commonPin);
    const runPin = runLeg.pins.find((p) => p !== commonPin);

    const R_CS = round(startLeg.r, 2);
    const R_CR = round(runLeg.r, 2);
    const R_SR = round(highestPair.r, 2);
    const sumCheckExpected = round(R_CS + R_CR, 2);
    const sumError = round(Math.abs(sumCheckExpected - R_SR), 2);
    const sumValid = sumError <= Math.max(0.3, 0.1 * R_SR);

    const pinMap = {};
    pinMap[commonPin] = 'C';
    pinMap[startPin] = 'S';
    pinMap[runPin] = 'R';

    const reasoningSteps = [
      `Rule 1: Highest resistance pair is Pins ${highestPair.key} (${R_SR} Ω) → these two must be Start (S) and Run (R).`,
      `Rule 2: The remaining third terminal is Pin ${commonPin} → COMMON (C).`,
      `Rule 3: From Common (Pin ${commonPin}), higher resistance goes to Pin ${startPin} (${R_CS} Ω) → START (S).`,
      `Rule 4: From Common (Pin ${commonPin}), lower resistance goes to Pin ${runPin} (${R_CR} Ω) → RUN (R).`,
      `Verification: R(C-S) + R(C-R) = ${R_CS} + ${R_CR} = ${sumCheckExpected} Ω vs measured R(S-R) = ${R_SR} Ω (${sumValid ? 'PASS' : 'WINDING MISMATCH'}).`
    ];

    if (groundFault) {
      reasoningSteps.push(`CRITICAL: Ground test is ${R_ground_Mohm} MΩ (< 1.0 MΩ). Winding is shorted to chassis ground!`);
    }

    return {
      status: groundFault ? 'GROUND_FAULT' : (sumValid ? 'IDENTIFIED' : 'WINDING_ANOMALY'),
      groundFault,
      pinMap,
      commonPin,
      startPin,
      runPin,
      R_CR,
      R_CS,
      R_SR,
      sumCheckExpected,
      sumError,
      sumValid,
      reasoningSteps
    };
  }

  /**
   * 10A. Capacitor Tolerance, Live MFD Calculation & Series/Parallel Sizing (LAB-07 & LAB-19)
   */
  function evaluateCapacitor(params = {}) {
    const ratedUf = Math.max(0.1, num(params.ratedUf, 45));
    const measuredUf = Math.max(0, num(params.measuredUf, ratedUf));
    const tolerancePct = Math.max(1, num(params.tolerancePct, 6));
    const startAmps = Math.max(0, num(params.startAmps, 0));
    const capVolts = Math.max(0, num(params.capVolts, 0));
    const secondUf = Math.max(0, num(params.secondUf, 0));
    const comboMode = params.comboMode || 'single';

    const minUf = ratedUf * (1 - tolerancePct / 100);
    const maxUf = ratedUf * (1 + tolerancePct / 100);
    const pctError = ((measuredUf - ratedUf) / ratedUf) * 100;
    const liveCalculatedUf = capVolts > 0 ? (2652 * startAmps) / capVolts : null;

    const seriesCombinedUf = secondUf > 0 ? (ratedUf * secondUf) / (ratedUf + secondUf) : null;
    const parallelCombinedUf = secondUf > 0 ? (ratedUf + secondUf) : null;

    let condition = 'GOOD';
    let message = `Within ±${tolerancePct}% tolerance (${round(minUf, 2)}–${round(maxUf, 2)} µF).`;
    if (measuredUf <= 0.1) {
      condition = 'OPEN_DEAD';
      message = 'Open / zero capacitance. Compressor or fan will draw LRA and fail to start!';
    } else if (measuredUf < minUf) {
      condition = 'WEAK_REPLACE';
      message = `Below minimum allowable ${round(minUf, 2)} µF (-${tolerancePct}%). Condemn and replace capacitor.`;
    } else if (measuredUf > maxUf) {
      condition = 'OVER_TOLERANCE';
      message = `Exceeds +${tolerancePct}% upper limit (${round(maxUf, 2)} µF). Replace to avoid excess winding current.`;
    }

    return {
      ratedUf: round(ratedUf, 2),
      measuredUf: round(measuredUf, 2),
      tolerancePct,
      minUf: round(minUf, 2),
      maxUf: round(maxUf, 2),
      pctError: round(pctError, 2),
      liveCalculatedUf: liveCalculatedUf !== null ? round(liveCalculatedUf, 2) : null,
      comboMode,
      secondUf: round(secondUf, 2),
      seriesCombinedUf: seriesCombinedUf !== null ? round(seriesCombinedUf, 2) : null,
      parallelCombinedUf: parallelCombinedUf !== null ? round(parallelCombinedUf, 2) : null,
      condition,
      message
    };
  }

  /**
   * 10B. IEEE Standard 43 Megohmmeter Insulation & Polarization Index Evaluator (LAB-65)
   */
  function evaluateMeggerTest(params = {}) {
    const testVoltageDC = num(params.testVoltageDC, 500);
    const resistanceMohm = Math.max(0, num(params.resistanceMohm, 500));
    const motorTempC = num(params.motorTempC, 40);
    const r1MinMohm = params.r1MinMohm !== undefined && params.r1MinMohm !== null ? num(params.r1MinMohm, null) : null;
    const r10MinMohm = params.r10MinMohm !== undefined && params.r10MinMohm !== null ? num(params.r10MinMohm, null) : null;

    let status = 'PRISTINE';
    let label = '> 100 MΩ: Pristine Insulation';
    let action = 'Clean, dry stator winding insulation. Approved for operation.';

    if (resistanceMohm < 1.0) {
      status = 'GROUND_FAULT';
      label = '< 1.0 MΩ: Dead Ground Fault';
      action = 'Catastrophic winding insulation breakdown; will trip breaker immediately. Replace motor/compressor.';
    } else if (resistanceMohm < 20.0) {
      status = 'CRITICAL_DEGRADATION';
      label = '1–20 MΩ: Critical Motor Failure Imminent';
      action = 'Severe enamel degradation; schedule immediate replacement before burnout.';
    } else if (resistanceMohm <= 100.0) {
      status = 'WARNING_MOISTURE';
      label = '20–100 MΩ: Warning (Moisture / Acid Contamination)';
      action = 'Perform acid test, change POE oil / filter-drier, and re-test after dehydration.';
    }

    const normalized40CMohm = resistanceMohm * Math.pow(2, (motorTempC - 40) / 10);
    let polarizationIndex = null;
    let piStatus = null;
    if (r1MinMohm && r1MinMohm > 0 && r10MinMohm !== null) {
      polarizationIndex = round(r10MinMohm / r1MinMohm, 2);
      piStatus = polarizationIndex >= 2.0 ? 'EXCELLENT_DRY' : (polarizationIndex >= 1.5 ? 'MARGINAL' : 'CONTAMINATED_WET');
    }

    return {
      testVoltageDC,
      resistanceMohm: round(resistanceMohm, 2),
      motorTempC,
      normalized40CMohm: round(normalized40CMohm, 2),
      status,
      label,
      action,
      polarizationIndex,
      piStatus
    };
  }

  /**
   * 10C. Combined Capacitor, Potential Relay Back-EMF & Megger Helper
   */
  function solveCapacitorAndMegger(params = {}) {
    const capResult = evaluateCapacitor(params);
    const meggerResult = evaluateMeggerTest(params);
    const motorRpmPct = clamp(num(params.motorRpmPct, 82), 0, 100);
    const lineVolts = Math.max(120, num(params.lineVolts, 240));
    const backEmfVolts = motorRpmPct === 0 ? 0 : round(lineVolts * (0.45 + 1.15 * (motorRpmPct / 100)), 1);
    const pickupVolts = round(lineVolts * 1.25, 0); // e.g., ~300 VAC on 240V unit
    const startContactsOpen = backEmfVolts >= pickupVolts;

    return {
      capacitor: capResult,
      megger: meggerResult,
      potentialRelay: {
        lineVolts,
        motorRpmPct,
        backEmfVolts,
        pickupVolts,
        contacts12State: startContactsOpen ? 'OPEN (Start Cap Dropped Out)' : 'CLOSED (Start Cap Engaged)'
      }
    };
  }

  /**
   * 11A. Pressure / Temperature Control Cut-In, Cut-Out & Differential Solver (Ch. 17)
   */
  function solvePressureSwitch(params = {}) {
    const mode = params.mode || 'low_pressure';
    let cutInPsig = params.cutInPsig !== undefined ? num(params.cutInPsig, null) : null;
    let cutOutPsig = params.cutOutPsig !== undefined ? num(params.cutOutPsig, null) : null;
    let differentialPsig = params.differentialPsig !== undefined ? num(params.differentialPsig, null) : null;
    const currentPsig = num(params.currentPsig, 65);

    if (mode === 'low_pressure') {
      if (cutInPsig === null) cutInPsig = 55;
      if (cutOutPsig === null && differentialPsig !== null) cutOutPsig = cutInPsig - differentialPsig;
      if (cutOutPsig === null) cutOutPsig = 25;
      differentialPsig = Math.abs(cutInPsig - cutOutPsig);
    } else if (mode === 'high_pressure') {
      if (cutOutPsig === null) cutOutPsig = 610;
      if (cutInPsig === null && differentialPsig !== null) cutInPsig = cutOutPsig - differentialPsig;
      if (cutInPsig === null) cutInPsig = 460;
      differentialPsig = Math.abs(cutOutPsig - cutInPsig);
    } else {
      // fan_cycling (closes on pressure rise)
      if (cutInPsig === null) cutInPsig = 325;
      if (cutOutPsig === null && differentialPsig !== null) cutOutPsig = cutInPsig - differentialPsig;
      if (cutOutPsig === null) cutOutPsig = 245;
      differentialPsig = Math.abs(cutInPsig - cutOutPsig);
    }

    let contactsClosed = true;
    let zoneLabel = 'DEADBAND / HOLDING PREVIOUS STATE';
    if (mode === 'low_pressure') {
      if (currentPsig <= cutOutPsig) {
        contactsClosed = false;
        zoneLabel = 'OPEN (Tripped on Low Suction Pressure)';
      } else if (currentPsig >= cutInPsig) {
        contactsClosed = true;
        zoneLabel = 'CLOSED (Above Cut-In)';
      } else {
        contactsClosed = params.prevClosed !== false;
        zoneLabel = contactsClosed ? 'CLOSED (Inside Differential Band)' : 'OPEN (Waiting to Reach Cut-In)';
      }
    } else if (mode === 'high_pressure') {
      if (currentPsig >= cutOutPsig) {
        contactsClosed = false;
        zoneLabel = 'OPEN (Tripped on High Head Pressure)';
      } else if (currentPsig <= cutInPsig) {
        contactsClosed = true;
        zoneLabel = 'CLOSED (Below Cut-In Reset)';
      } else {
        contactsClosed = params.prevClosed !== false;
        zoneLabel = contactsClosed ? 'CLOSED (Inside Differential Band)' : 'OPEN (Waiting to Cool Below Reset)';
      }
    } else {
      if (currentPsig >= cutInPsig) {
        contactsClosed = true;
        zoneLabel = 'CLOSED (Condenser Fan Running)';
      } else if (currentPsig <= cutOutPsig) {
        contactsClosed = false;
        zoneLabel = 'OPEN (Condenser Fan Cycled Off)';
      } else {
        contactsClosed = params.prevClosed !== false;
        zoneLabel = contactsClosed ? 'CLOSED (Inside Differential Band)' : 'OPEN (Inside Differential Band)';
      }
    }

    return {
      mode,
      cutInPsig: round(cutInPsig, 1),
      cutOutPsig: round(cutOutPsig, 1),
      differentialPsig: round(differentialPsig, 1),
      currentPsig: round(currentPsig, 1),
      contactsClosed,
      contactState: contactsClosed ? 'CLOSED' : 'OPEN',
      zoneLabel
    };
  }

  /**
   * 11B. NEC Article 430.32 Thermal & Electronic Overload Sizing (Deck 06 Slides 9-10 & LAB-67)
   */
  function solveOverloadSizing(params = {}) {
    const motorFla = Math.max(0.1, num(params.motorFla, 22.0));
    const serviceFactor = Math.max(1.0, num(params.serviceFactor, 1.15));
    const tripClass = num(params.tripClass, 10);

    const multiplier = serviceFactor >= 1.15 ? 1.25 : 1.15;
    const multiplierPct = Math.round(multiplier * 100);
    const maxOverloadAmps = motorFla * multiplier;
    const maxTripSecondsAt600Pct = tripClass === 10 ? 10 : (tripClass === 30 ? 30 : 20);
    const lockedRotor600PctAmps = motorFla * 6;

    return {
      motorFla: round(motorFla, 2),
      serviceFactor: round(serviceFactor, 2),
      multiplier,
      multiplierPct,
      maxOverloadAmps: round(maxOverloadAmps, 2),
      tripClass,
      maxTripSecondsAt600Pct,
      lockedRotor600PctAmps: round(lockedRotor600PctAmps, 1),
      necRule: serviceFactor >= 1.15
        ? 'NEC 430.32: SF ≥ 1.15 allows up to 125% of nameplate FLA.'
        : 'NEC 430.32: SF = 1.00 limits overload setting to 115% of nameplate FLA.'
    };
  }

  /**
   * 11C. 3-Wire Seal-In Magnetic Motor Starter (LVP) vs. 2-Wire Control (LVR) (Deck 06 Slide 8 & LAB-67)
   */
  function simulateThreeWireStarter(state = {}) {
    const mode = state.mode === '2wire_lvr' ? '2wire_lvr' : '3wire_lvp';
    const powerAvailable = state.powerAvailable !== false;
    const stopButtonPressed = Boolean(state.stopButtonPressed);
    const startButtonPressed = Boolean(state.startButtonPressed);
    const maintainedSwitchClosed = state.maintainedSwitchClosed !== undefined ? Boolean(state.maintainedSwitchClosed) : startButtonPressed;
    const prevAuxSealed = Boolean(state.auxSealed);
    const overloadTripped = Boolean(state.overloadTripped);
    const controlVolts = Math.max(12, num(state.controlVolts, 120));
    const sealedVA = Math.max(1, num(state.sealedVA, 22));
    const inrushMultiplier = clamp(num(state.inrushMultiplier, 8), 6, 10);

    let coilEnergized = false;
    let auxSealed = false;
    let starterState = 'STOPPED';
    let safetyAlert = '';

    if (!powerAvailable) {
      coilEnergized = false;
      auxSealed = false;
      starterState = 'POWER_OUTAGE';
      safetyAlert = mode === '3wire_lvp'
        ? 'Power lost: Holding contact dropped out (LVP armed — will NOT auto-restart when power returns).'
        : 'Power lost: Contactor opened, but 2-wire thermostat remains closed (LVR — WILL auto-restart when power returns!).';
    } else if (overloadTripped) {
      coilEnergized = false;
      auxSealed = false;
      starterState = 'OVERLOAD_TRIPPED';
      safetyAlert = 'OLR contacts 95-96 OPEN: Coil de-energized to protect motor windings.';
    } else if (mode === '3wire_lvp') {
      if (stopButtonPressed) {
        coilEnergized = false;
        auxSealed = false;
        starterState = 'STOPPED_BY_BTN';
        safetyAlert = 'Stop button (NC) pressed: Seal-in path broken safely.';
      } else if (startButtonPressed || prevAuxSealed) {
        coilEnergized = true;
        auxSealed = true;
        starterState = startButtonPressed ? 'RUNNING_START_HELD' : 'RUNNING_SEALED_IN';
        safetyAlert = 'LVP Active: Auxiliary holding contact (2-3) seals coil around Start button.';
      } else {
        coilEnergized = false;
        auxSealed = false;
        starterState = 'READY_IDLE';
        safetyAlert = 'Safe idle state: Operator must press Start to energize motor.';
      }
    } else {
      // 2-wire LVR
      if (maintainedSwitchClosed) {
        coilEnergized = true;
        auxSealed = false;
        starterState = 'RUNNING_2WIRE_LVR';
        safetyAlert = '2-Wire LVR: Motor runs whenever control switch is closed and auto-restarts after outages.';
      } else {
        coilEnergized = false;
        auxSealed = false;
        starterState = 'STOPPED_2WIRE';
        safetyAlert = '2-Wire control switch open.';
      }
    }

    const inrushVA = sealedVA * inrushMultiplier;
    const controlVA = coilEnergized ? sealedVA : 0;
    const controlAmps = controlVA / controlVolts;

    return {
      mode,
      powerAvailable,
      stopButtonPressed,
      startButtonPressed,
      maintainedSwitchClosed,
      overloadTripped,
      coilEnergized,
      mainContactsClosed: coilEnergized,
      auxSealed,
      starterState,
      controlVolts,
      controlVA: round(controlVA, 1),
      controlAmps: round(controlAmps, 3),
      inrushVA: round(inrushVA, 1),
      sealedVA: round(sealedVA, 1),
      safetyAlert
    };
  }

  /**
   * 11D. Thermistor (NTC/PTC) & Furnace Flame Rectification Solver (Ch. 15)
   */
  function solveThermistorAndFlame(params = {}) {
    const tempF = clamp(num(params.tempF, 77), -40, 250);
    const r25Ohms = Math.max(100, num(params.r25Ohms, 10000));
    const betaK = Math.max(1000, num(params.betaK, 3950));
    const type = params.type === 'PTC' ? 'PTC' : 'NTC';
    const flameMicroAmpsDC = Math.max(0, num(params.flameMicroAmpsDC, 3.8));
    const rodAreaRatio = Math.max(1, num(params.rodAreaRatio, 4.0));

    const tempC = (tempF - 32) * (5 / 9);
    const tempK = tempC + 273.15;
    const refK = 298.15; // 25°C / 77°F

    let thermistorOhms = r25Ohms;
    if (type === 'NTC') {
      thermistorOhms = r25Ohms * Math.exp(betaK * ((1 / tempK) - (1 / refK)));
    } else {
      thermistorOhms = r25Ohms * Math.exp(-betaK * 0.45 * ((1 / tempK) - (1 / refK)));
    }

    let flameStatus = 'GOOD_FLAME_PROVEN';
    let flameMessage = 'Strong half-wave rectified DC signal (≥ 2.0 µA DC); gas valve stays energized.';
    if (flameMicroAmpsDC < 1.0) {
      flameStatus = 'LOCKOUT_WEAK_OR_NO_FLAME';
      flameMessage = 'Signal < 1.0 µA DC: Control board drops gas valve and locks out after Trial for Ignition.';
    } else if (flameMicroAmpsDC < 2.0) {
      flameStatus = 'MARGINAL_CLEAN_ROD';
      flameMessage = 'Marginal signal (1.0–1.9 µA DC): Clean oxidized flame rod with fine abrasive pad or check burner ground.';
    }

    return {
      type,
      tempF: round(tempF, 1),
      tempC: round(tempC, 1),
      r25Ohms,
      thermistorOhms: round(thermistorOhms, 0),
      thermistorKOhms: round(thermistorOhms / 1000, 2),
      flameMicroAmpsDC: round(flameMicroAmpsDC, 2),
      rodAreaRatio: round(rodAreaRatio, 1),
      flameStatus,
      flameMessage
    };
  }

  function solveControlsAndElectronics(params = {}) {
    return {
      pressureSwitch: solvePressureSwitch(params.pressureSwitch || params),
      overload: solveOverloadSizing(params.overload || params),
      starter: simulateThreeWireStarter(params.starter || params),
      electronics: solveThermistorAndFlame(params.electronics || params)
    };
  }

  /**
   * 12. Interactive Circuit Builder Catalog & Multi-Topology V / A / Ω Solver
   */
  const BUILDER_COMPONENT_CATALOG = [
    { typeId: 'spst_switch', name: 'SPST Toggle Switch', category: 'switch', defaultOhms: 0.02, nominalVolts: 24, maxAmps: null, icon: '⏻', description: 'Manual single-pole control switch' },

    { typeId: 'contactor_coil', name: '24V Contactor Coil', category: 'load', defaultOhms: 16.0, nominalVolts: 24, maxAmps: null, icon: '🔌', description: '2-pole contactor holding coil' },
    { typeId: 'gas_valve', name: '24V Gas Valve Solenoid', category: 'load', defaultOhms: 48.0, nominalVolts: 24, maxAmps: null, icon: '🔥', description: '24V redundant gas valve coil (0.5A)' },
    { typeId: 'bulb_120v', name: '120V / 60W Test Lamp', category: 'load', defaultOhms: 240.0, nominalVolts: 120, maxAmps: null, icon: '🔆', description: 'Line-voltage incandescent test bulb' },

    { typeId: 'cond_fan', name: '240V Condenser Fan Motor', category: 'load', defaultOhms: 160.0, nominalVolts: 240, maxAmps: null, icon: '☢️', description: 'Outdoor PSC fan motor (~1.5A @ 240V)' },
    { typeId: 'compressor', name: '240V Hermetic Compressor', category: 'load', defaultOhms: 20.0, nominalVolts: 240, maxAmps: null, icon: '⚙️', description: 'Condensing unit compressor load' },
    { typeId: 'heat_strip_5kw', name: '240V / 5 kW Heat Strip', category: 'load', defaultOhms: 11.52, nominalVolts: 240, maxAmps: null, icon: '♨️', description: 'Nichrome resistance strip (20.8A @ 240V)' },
    { typeId: 'resistor_custom', name: 'Custom Resistor', category: 'load', defaultOhms: 10.0, nominalVolts: 24, maxAmps: null, icon: '〰️', description: 'Adjustable bench test resistor' }
  ];

  function getCatalogItem(typeId) {
    return BUILDER_COMPONENT_CATALOG.find((c) => c.typeId === typeId) || BUILDER_COMPONENT_CATALOG[BUILDER_COMPONENT_CATALOG.length - 1];
  }

  function solveCustomTopologyPass(topology, appliedV, slotsMeta, blownFuseIds) {
    const resolved = slotsMeta.map((s) => {
      const autoBlown = blownFuseIds.has(s.id) || Boolean(s.blown);
      let effectiveOhms = s.baseOhms;
      if (autoBlown || s.state === 'open') effectiveOhms = Infinity;
      else if (s.state === 'shorted') effectiveOhms = 0.05;
      else if (s.state === 'pitted') effectiveOhms = s.baseOhms + 4.0;
      else effectiveOhms = Math.max(0.01, s.baseOhms);
      return {
        ...s,
        autoBlown,
        effectiveOhms,
        voltageDrop: 0,
        currentAmps: 0,
        powerWatts: 0,
        nodeVoltageBefore: appliedV,
        nodeVoltageAfter: 0,
        status: 'DE_ENERGIZED'
      };
    });

    let R_eq = Infinity;
    let I_total = 0;
    let V_parallel_bus = 0;
    const nodes = [{ id: 'N0', label: 'Source Hot', voltageToCommon: round(appliedV, 2) }];

    if (topology === 'series') {
      const firstOpenIdx = resolved.findIndex((s) => !Number.isFinite(s.effectiveOhms));
      if (firstOpenIdx === -1 && resolved.length > 0) {
        R_eq = resolved.reduce((acc, s) => acc + s.effectiveOhms, 0);
        I_total = appliedV > 0 && R_eq > 0 ? appliedV / R_eq : 0;
        let vNode = appliedV;
        resolved.forEach((s, idx) => {
          s.nodeVoltageBefore = round(vNode, 3);
          s.voltageDrop = round(I_total * s.effectiveOhms, 3);
          s.currentAmps = round(I_total, 4);
          s.powerWatts = round(I_total * s.voltageDrop, 2);
          vNode = Math.max(0, vNode - s.voltageDrop);
          s.nodeVoltageAfter = round(vNode, 3);
          nodes.push({ id: `N${idx + 1}`, label: `After ${s.displayName}`, voltageToCommon: round(vNode, 2) });
        });
      } else {
        R_eq = Infinity;
        I_total = 0;
        let pastOpen = false;
        resolved.forEach((s, idx) => {
          if (!pastOpen && idx === firstOpenIdx) {
            s.nodeVoltageBefore = round(appliedV, 3);
            s.voltageDrop = round(appliedV, 3);
            s.nodeVoltageAfter = 0;
            pastOpen = true;
          } else if (!pastOpen) {
            s.nodeVoltageBefore = round(appliedV, 3);
            s.voltageDrop = 0;
            s.nodeVoltageAfter = round(appliedV, 3);
          } else {
            s.nodeVoltageBefore = 0;
            s.voltageDrop = 0;
            s.nodeVoltageAfter = 0;
          }
          nodes.push({ id: `N${idx + 1}`, label: `After ${s.displayName}`, voltageToCommon: round(s.nodeVoltageAfter, 2) });
        });
      }
    } else if (topology === 'parallel') {
      const active = resolved.filter((s) => Number.isFinite(s.effectiveOhms));
      const invR = active.reduce((acc, s) => acc + 1 / s.effectiveOhms, 0);
      R_eq = invR > 0 ? 1 / invR : Infinity;
      resolved.forEach((s) => {
        s.nodeVoltageBefore = round(appliedV, 3);
        s.nodeVoltageAfter = 0;
        s.voltageDrop = round(appliedV, 3);
        if (Number.isFinite(s.effectiveOhms) && appliedV > 0) {
          s.currentAmps = round(appliedV / s.effectiveOhms, 4);
          s.powerWatts = round(appliedV * s.currentAmps, 2);
        } else {
          s.currentAmps = 0;
          s.powerWatts = 0;
        }
        I_total += s.currentAmps;
      });
      V_parallel_bus = appliedV;
      nodes.push({ id: 'N1', label: 'Parallel Bus Common (0V)', voltageToCommon: 0 });
    } else {
      // series_parallel
      const trunk = resolved.filter((s) => s.group === 'series');
      const bank = resolved.filter((s) => s.group !== 'series');
      const firstOpenTrunk = trunk.findIndex((s) => !Number.isFinite(s.effectiveOhms));
      const activeBank = bank.filter((s) => Number.isFinite(s.effectiveOhms));
      const invBankR = activeBank.reduce((acc, s) => acc + 1 / s.effectiveOhms, 0);
      const R_bank = bank.length === 0 ? 0 : (invBankR > 0 ? 1 / invBankR : Infinity);

      if (firstOpenTrunk === -1 && Number.isFinite(R_bank) && (trunk.length + bank.length > 0)) {
        const R_trunk = trunk.reduce((acc, s) => acc + s.effectiveOhms, 0);
        R_eq = R_trunk + R_bank;
        I_total = appliedV > 0 && R_eq > 0 ? appliedV / R_eq : 0;
        let vNode = appliedV;
        trunk.forEach((s, idx) => {
          s.nodeVoltageBefore = round(vNode, 3);
          s.voltageDrop = round(I_total * s.effectiveOhms, 3);
          s.currentAmps = round(I_total, 4);
          s.powerWatts = round(I_total * s.voltageDrop, 2);
          vNode = Math.max(0, vNode - s.voltageDrop);
          s.nodeVoltageAfter = round(vNode, 3);
          nodes.push({ id: `N${idx + 1}`, label: `After ${s.displayName}`, voltageToCommon: round(vNode, 2) });
        });
        V_parallel_bus = round(vNode, 3);
        bank.forEach((s) => {
          s.nodeVoltageBefore = V_parallel_bus;
          s.nodeVoltageAfter = 0;
          s.voltageDrop = V_parallel_bus;
          if (Number.isFinite(s.effectiveOhms) && V_parallel_bus > 0) {
            s.currentAmps = round(V_parallel_bus / s.effectiveOhms, 4);
            s.powerWatts = round(V_parallel_bus * s.currentAmps, 2);
          }
        });
      } else if (firstOpenTrunk >= 0) {
        R_eq = Infinity;
        I_total = 0;
        V_parallel_bus = 0;
        let pastOpen = false;
        trunk.forEach((s, idx) => {
          if (!pastOpen && idx === firstOpenTrunk) {
            s.nodeVoltageBefore = round(appliedV, 3);
            s.voltageDrop = round(appliedV, 3);
            s.nodeVoltageAfter = 0;
            pastOpen = true;
          } else if (!pastOpen) {
            s.nodeVoltageBefore = round(appliedV, 3);
            s.voltageDrop = 0;
            s.nodeVoltageAfter = round(appliedV, 3);
          } else {
            s.nodeVoltageBefore = 0;
            s.voltageDrop = 0;
            s.nodeVoltageAfter = 0;
          }
          nodes.push({ id: `N${idx + 1}`, label: `After ${s.displayName}`, voltageToCommon: round(s.nodeVoltageAfter, 2) });
        });
        bank.forEach((s) => {
          s.nodeVoltageBefore = 0;
          s.nodeVoltageAfter = 0;
          s.voltageDrop = 0;
        });
      } else {
        // Trunk closed, all parallel branches open
        R_eq = Infinity;
        I_total = 0;
        V_parallel_bus = appliedV;
        trunk.forEach((s, idx) => {
          s.nodeVoltageBefore = round(appliedV, 3);
          s.voltageDrop = 0;
          s.nodeVoltageAfter = round(appliedV, 3);
          nodes.push({ id: `N${idx + 1}`, label: `After ${s.displayName}`, voltageToCommon: round(appliedV, 2) });
        });
        bank.forEach((s) => {
          s.nodeVoltageBefore = round(appliedV, 3);
          s.nodeVoltageAfter = 0;
          s.voltageDrop = round(appliedV, 3);
        });
      }
    }

    // Assign readable status for every slot
    resolved.forEach((s) => {
      if (s.autoBlown) {
        s.status = 'FUSE_BLOWN';
      } else if (s.state === 'open') {
        s.status = 'OPEN';
      } else if (s.state === 'shorted' && appliedV > 0 && s.currentAmps > 0) {
        s.status = 'SHORTED';
      } else if (s.state === 'pitted' && appliedV > 0 && s.voltageDrop > 0.2) {
        s.status = 'PITTED_DROP';
      } else if (appliedV > 0 && s.currentAmps > 0) {
        s.status = 'ENERGIZED';
      } else {
        s.status = 'DE_ENERGIZED';
      }
    });

    return {
      R_eq: Number.isFinite(R_eq) ? round(R_eq, 3) : Infinity,
      I_total: round(I_total, 4),
      P_totalWatts: round(appliedV * I_total, 2),
      V_parallel_bus: round(V_parallel_bus, 2),
      slots: resolved,
      nodes
    };
  }

  function solveCustomCircuit(config = {}) {
    const topology = ['series', 'parallel', 'series_parallel'].includes(config.topology) ? config.topology : 'series';
    const supplyV = clamp(num(config.supplyV, 24), 1, 600);
    const disconnectOn = config.disconnectOn !== false;
    const rawSlots = Array.isArray(config.slots) ? config.slots : [];
    const meter = config.meter || { mode: 'V', targetId: 'source' };

    const slotsMeta = rawSlots.map((s, idx) => {
      const cat = getCatalogItem(s.typeId);
      const baseOhms = s.R_ohm !== undefined && s.R_ohm !== null && s.R_ohm !== '' ? Math.max(0.01, num(s.R_ohm, cat.defaultOhms)) : cat.defaultOhms;
      const defaultGroup = (cat.category === 'switch' || cat.category === 'fuse') ? 'series' : 'parallel';
      return {
        id: s.id || `slot_${idx + 1}`,
        typeId: cat.typeId,
        displayName: s.customName || cat.name,
        category: cat.category,
        icon: cat.icon,
        maxAmps: cat.maxAmps,
        baseOhms: round(baseOhms, 3),
        state: s.state || 'normal',
        blown: Boolean(s.blown),
        group: s.group === 'series' || s.group === 'parallel' ? s.group : defaultGroup
      };
    });

    const blownFuseIds = new Set(slotsMeta.filter((s) => s.blown).map((s) => s.id));
    const appliedV = disconnectOn ? supplyV : 0;

    let pass = solveCustomTopologyPass(topology, appliedV, slotsMeta, blownFuseIds);
    let fuseTripped = blownFuseIds.size > 0;

    if (disconnectOn && appliedV > 0) {
      for (let iter = 0; iter <= slotsMeta.length; iter++) {
        let trippedThisPass = false;
        for (const s of pass.slots) {
          if (s.category === 'fuse' && s.maxAmps && !blownFuseIds.has(s.id) && s.state !== 'open' && s.currentAmps > s.maxAmps) {
            blownFuseIds.add(s.id);
            trippedThisPass = true;
            fuseTripped = true;
          }
        }
        if (!trippedThisPass) break;
        pass = solveCustomTopologyPass(topology, appliedV, slotsMeta, blownFuseIds);
      }
    }

    // Compute true de-energized equivalent circuit resistance regardless of disconnect state
    const resistPass = solveCustomTopologyPass(topology, 0, slotsMeta, blownFuseIds);
    const R_eq_true = resistPass.R_eq;

    // Virtual Digital Multimeter Readout
    const mMode = ['V', 'A', 'OHM'].includes(meter.mode) ? meter.mode : 'V';
    const targetId = meter.targetId || 'source';
    const targetSlot = pass.slots.find((s) => s.id === targetId);
    const hopNode = targetId.startsWith('hop:') ? pass.nodes.find((n) => n.id === targetId.slice(4)) : null;

    let meterValue = 0;
    let unit = 'VAC';
    let targetLabel = 'Main Power Supply';
    let displayText = '0.00 VAC';
    let liveCircuitWarning = false;
    let continuityBeep = false;
    let subtext = '';

    if (mMode === 'V') {
      unit = 'VAC';
      if (hopNode) {
        meterValue = hopNode.voltageToCommon;
        targetLabel = `${hopNode.id}: ${hopNode.label} → COM`;
        subtext = disconnectOn ? 'Hopscotch mode: Black COM lead on Return/Common.' : 'Disconnect OFF (0 VAC).';
      } else if (targetSlot) {
        meterValue = targetSlot.voltageDrop;
        targetLabel = `Across ${targetSlot.displayName}`;
        if (disconnectOn && (targetSlot.status === 'OPEN' || targetSlot.status === 'FUSE_BLOWN') && targetSlot.voltageDrop > 0) {
          subtext = `Full ${targetSlot.voltageDrop}V dropped across open device!`;
        } else if (targetSlot.status === 'PITTED_DROP') {
          subtext = `High contact drop (>0.2V) indicates pitted/burnt contacts.`;
        } else {
          subtext = disconnectOn ? 'Measuring potential difference across terminals.' : 'Disconnect OFF (0 VAC).';
        }
      } else {
        meterValue = disconnectOn ? supplyV : 0;
        targetLabel = 'Supply Rails (Hot to Common)';
        subtext = disconnectOn ? `Live source voltage: ${supplyV} VAC.` : 'Disconnect OFF (LOTO Safe Zero-Energy).';
      }
      displayText = `${round(meterValue, 2).toFixed(2)} ${unit}`;
    } else if (mMode === 'A') {
      unit = 'A';
      if (targetSlot) {
        meterValue = targetSlot.currentAmps;
        targetLabel = `Clamp Around ${targetSlot.displayName}`;
        subtext = disconnectOn ? `Branch/component load current.` : 'Disconnect OFF (0.00 A).';
      } else {
        meterValue = pass.I_total;
        targetLabel = 'Clamp on Main Line Feeder';
        subtext = disconnectOn ? `Total source amperage drawn from ${supplyV}V supply.` : 'Disconnect OFF (0.00 A).';
      }
      displayText = `${round(meterValue, 2).toFixed(2)} ${unit}`;
    } else {
      unit = 'Ω';
      liveCircuitWarning = disconnectOn && supplyV > 0;
      const rawOhms = targetSlot ? targetSlot.effectiveOhms : R_eq_true;
      targetLabel = targetSlot ? `Resistance of ${targetSlot.displayName}` : 'Total Circuit R_eq';
      if (liveCircuitWarning) {
        meterValue = NaN;
        displayText = 'ERR! LIVE V';
        subtext = 'SAFETY ALERT: Turn Disconnect OFF (0V) before measuring Ω!';
      } else if (!Number.isFinite(rawOhms)) {
        meterValue = Infinity;
        displayText = 'OL (Open)';
        subtext = 'Infinite resistance — open switch, blown fuse, or open winding.';
      } else {
        meterValue = round(rawOhms, 2);
        continuityBeep = rawOhms < 25;
        displayText = `${meterValue} Ω`;
        subtext = continuityBeep ? '🔊 Continuity Beep (< 25 Ω)' : 'Measured load resistance with power OFF.';
      }
    }

    return {
      topology,
      supplyV,
      disconnectOn,
      appliedV,
      fuseTripped,
      autoBlownFuseIds: Array.from(blownFuseIds),
      R_eq: R_eq_true,
      I_total: pass.I_total,
      P_totalWatts: pass.P_totalWatts,
      V_parallel_bus: pass.V_parallel_bus,
      slots: pass.slots,
      nodes: pass.nodes,
      meterReadout: {
        mode: mMode,
        targetId,
        targetLabel,
        value: meterValue,
        unit,
        displayText,
        liveCircuitWarning,
        continuityBeep,
        subtext
      }
    };
  }

  return {
    solveOhmsAndWatts,
    evaluateShockHazard,
    solveTransformer,
    solveSeriesCircuit,
    solveParallelCircuit,
    solveHopscotchDiagnostic,
    solveACPowerAndReactance,
    solveThreePhaseSystem,
    solveMotorSpeedAndWindings,
    identifyCompressorTerminals,
    evaluateCapacitor,
    evaluateMeggerTest,
    solveCapacitorAndMegger,
    solvePressureSwitch,
    solveOverloadSizing,
    simulateThreeWireStarter,
    solveThermistorAndFlame,
    solveControlsAndElectronics,
    BUILDER_COMPONENT_CATALOG,
    solveCustomCircuit
  };
}));

              <line x1="396" y1="55" x2="494" y2="${c2.closed ? 55 : 34}" stroke="${c2.closed ? '#22c55e' : '#ef4444'}" stroke-width="5" />
              <circle cx="396" cy="55" r="5" fill="currentColor" /><circle cx="494" cy="55" r="5" fill="currentColor" />
              <text x="445" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="currentColor">SW2 (${c2.closed ? 'CLOSED' : 'OPEN'}) • Drop: ${c2.voltageDrop}V</text>
            </g>

            <!-- Lamp 1 -->
            <circle cx="660" cy="116" r="34" fill="${res.allClosed ? '#f59e0b' : 'var(--panel-elev)'}" fill-opacity="${res.allClosed ? 0.35 : 1}" stroke="#f59e0b" stroke-width="3" />
            <text x="660" y="114" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor">L1 (${l1.R_ohm}Ω)</text>

            <!-- Lamp 2 -->
            <circle cx="660" cy="204" r="34" fill="${res.allClosed ? '#f59e0b' : 'var(--panel-elev)'}" fill-opacity="${res.allClosed ? 0.35 : 1}" stroke="#f59e0b" stroke-width="3" />
            <text x="660" y="202" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor">L2 (${l2.R_ohm}Ω)</text>
            <text x="660" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#fbbf24">${l2.voltageDrop} V</text>

    }

    if (subMode === 'parallel') {
      const res = theory.solveParallelCircuit({
        supplyV: ch.supplyV === 24 ? 240 : ch.supplyV,
        branches: [
          { id: 'b1', name: 'Compressor', R_ohm: ch.r1, switchClosed: ch.b1Closed },
          { id: 'b2', name: 'Condenser Fan', R_ohm: ch.r2, switchClosed: ch.b2Closed },

      });
      const svgHtml = `

          <!-- Virtual Classroom DMM Meter Display -->

  /**
   * 3. BOARD 3: AC POWER, REACTANCE & 3-PHASE POWER QUALITY
   */
  function renderAc3PhaseVisual(state, theory) {
    const ac = theory.solveACPowerAndReactance(state.ac);
    const tp = theory.solveThreePhaseSystem(state.threePhase);

    const rotColor = tp.scrollCompressorSafe ? '#22c55e' : '#ef4444';
    const nemaColor = tp.nemaStatus === 'GOOD' ? '#22c55e' : tp.nemaStatus === 'CAUTION' ? '#eab308' : '#ef4444';

    // Power Triangle SVG coordinates
    const scale = 140 / Math.max(1, ac.apparentPowerVA);
    const baseW = Math.max(30, ac.truePowerW * scale);
    const heightQ = Math.max(4, ac.reactivePowerVAR * scale);
    const triX0 = 40, triY0 = 175;
    const triX1 = triX0 + baseW;
    const triY1 = ac.phaseAngleDeg >= 0 ? triY0 - heightQ : triY0 + Math.min(45, heightQ);

    const svgHtml = `
      <div class="visual-grid-2">
        <!-- Left: Live AC Oscilloscope + Power Triangle -->
        <div class="viz-card">
          <div class="viz-title">Single-Phase AC Oscilloscope &amp; Power Triangle (${esc(ac.circuitNature.replace('_', ' '))})</div>
          <canvas id="canvas-ac-scope" width="520" height="230" class="board-canvas"></canvas>
          <div class="viz-split-tight">
            <svg viewBox="0 0 250 200" class="board-svg-sm" aria-label="AC Power Triangle">
              <polygon points="${triX0},${triY0} ${triX1.toFixed(1)},${triY0} ${triX1.toFixed(1)},${triY1.toFixed(1)}" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2.5" />
              <line x1="${triX0}" y1="${triY0}" x2="${triX1.toFixed(1)}" y2="${triY0}" stroke="#22c55e" stroke-width="3.5" />
              <line x1="${triX1.toFixed(1)}" y1="${triY0}" x2="${triX1.toFixed(1)}" y2="${triY1.toFixed(1)}" stroke="#f59e0b" stroke-width="3.5" />
              <line x1="${triX0}" y1="${triY0}" x2="${triX1.toFixed(1)}" y2="${triY1.toFixed(1)}" stroke="#38bdf8" stroke-width="3.5" />
              <text x="${((triX0 + triX1) / 2).toFixed(1)}" y="${triY0 + 18}" text-anchor="middle" font-size="11" font-weight="800" fill="#22c55e">True: ${ac.truePowerW} W</text>
              <text x="${triX1.toFixed(1)}" y="${((triY0 + triY1) / 2).toFixed(1)}" dx="6" font-size="10.5" font-weight="800" fill="#f59e0b">${ac.reactivePowerVAR} VAR</text>
              <text x="125" y="24" text-anchor="middle" font-size="12" font-weight="800" fill="#38bdf8">Apparent: ${ac.apparentPowerVA} VA | PF = ${ac.powerFactor}</text>
            </svg>
            <div class="mini-kpi-stack">
              <div class="mini-kpi"><span>V_peak (±)</span><strong>${ac.Vpeak} V</strong></div>
              <div class="mini-kpi"><span>X_L / X_C</span><strong>${ac.XL_ohm} / ${ac.XC_ohm} Ω</strong></div>
              <div class="mini-kpi"><span>Impedance Z</span><strong>${ac.Z_ohm} Ω</strong></div>
              <div class="mini-kpi"><span>Phase θ</span><strong>${ac.phaseAngleDeg}°</strong></div>
            </div>
          </div>
        </div>

        <!-- Right: 3-Phase 120° Sine Wave + Rotating Field + NEMA Imbalance -->
        <div class="viz-card">
          <div class="viz-title">Three-Phase 120° Power Quality &amp; Scroll Rotation (${esc(tp.systemLabel)})</div>
          <canvas id="canvas-3phase" width="520" height="230" class="board-canvas"></canvas>

          <div class="rotation-banner" style="border-color:${rotColor}">
            <div class="rot-badge" style="background:${rotColor}">${tp.phaseSequence}</div>
            <div>
              <strong>${tp.scrollCompressorSafe ? 'Forward Rotation OK' : 'REVERSE SCROLL HAZARD'}</strong>
              <p>${esc(tp.rotationWarning)}</p>
            </div>
            <button class="btn-sm btn-accent" data-action="swap-phase-leads">⇄ Swap L1 &amp; L2</button>
          </div>

          <div class="xfmr-status-bar" style="margin-top:10px;">
            <div class="hazard-top">
              <span>NEMA MG-1 Imbalance: <strong style="color:${nemaColor}">${tp.pctVoltageImbalance}%</strong> (Current Imb: ~${tp.pctCurrentImbalance}%)</span>
              <strong style="color:${nemaColor}">+${tp.windingTempRiseC}°C (+${tp.windingTempRiseF}°F) | Derate: ${tp.nemaDeratingFactor}×</strong>
            </div>
            <div class="meter-track">
              <div class="meter-fill" style="width:${Math.min(100, tp.pctVoltageImbalance * 16)}%; background:${nemaColor}"></div>
