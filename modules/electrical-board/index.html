  /**
   * 6. BOARD 3: CUSTOM CIRCUIT BUILDER & VIRTUAL DIGITAL MULTIMETER (V / A / OHM)
   */
  function renderCircuitBuilderVisual(state, theory) {
    const cfg = state.builder;
    const res = theory.solveCustomCircuit(cfg);
    const meter = cfg.meter || { mode: 'V', targetId: 'source' };
    const mr = res.meterReadout;
    const slots = res.slots || [];
    const activeFlow = res.disconnectOn && !res.fuseTripped && res.I_total > 0.005;
    const speedSec = activeFlow ? Math.max(0.32, Math.min(2.8, 3.2 / Math.sqrt(Math.max(0.15, res.I_total)))) : 0;

    function statusMeta(slot) {
      if (slot.blown || slot.autoBlown) {
        return { label: 'BLOWN (OL)', border: '#ef4444', fill: 'rgba(239,68,68,0.18)', badgeBg: '#ef4444', textColor: '#fca5a5' };
      }
      if (slot.state === 'open') {
        return { label: 'OPEN (OL)', border: '#f59e0b', fill: 'rgba(245,158,11,0.16)', badgeBg: '#d97706', textColor: '#fde68a' };
      }
      if (slot.state === 'shorted') {
        return { label: 'SHORTED', border: '#ef4444', fill: 'rgba(239,68,68,0.26)', badgeBg: '#dc2626', textColor: '#fecaca' };
      }
      if (slot.state === 'pitted') {
        return { label: 'PITTED (+Ω)', border: '#f97316', fill: 'rgba(249,115,22,0.18)', badgeBg: '#ea580c', textColor: '#fed7aa' };
      }
      if (activeFlow && slot.currentAmps > 0.005) {
        return { label: slot.category === 'load' ? 'RUNNING' : 'CLOSED', border: '#22c55e', fill: 'rgba(34,197,94,0.14)', badgeBg: '#16a34a', textColor: '#bbf7d0' };
      }
      return { label: slot.category === 'load' ? 'IDLE' : 'CLOSED', border: '#38bdf8', fill: 'rgba(56,189,248,0.1)', badgeBg: '#0284c7', textColor: '#bae6fd' };
    }

    function fmtOhms(val) {
      return Number.isFinite(val) ? `${Number(val).toFixed(val < 10 ? 2 : 1)}Ω` : 'OL (∞)';
    }

    function renderSlotBox(slot, x, y, w, h) {
      const st = statusMeta(slot);
      const isProbed = meter.targetId === slot.id;
      const strokeW = isProbed ? 3.5 : 2;
      const ringColor = isProbed ? '#38bdf8' : st.border;
      const shortName = String(slot.displayName || '').length > 17
        ? `${String(slot.displayName).slice(0, 16)}…`
        : String(slot.displayName || '');

      let probeOverlay = '';
      if (isProbed) {
        if (meter.mode === 'V') {
          probeOverlay = `
            <circle cx="${x + 12}" cy="${y - 4}" r="6" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
            <text x="${x + 12}" y="${y - 1}" text-anchor="middle" fill="#fff" font-size="8" font-weight="800">+</text>
            <circle cx="${x + w - 12}" cy="${y - 4}" r="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
            <text x="${x + w - 12}" y="${y - 1}" text-anchor="middle" fill="#fff" font-size="8" font-weight="800">-</text>
            <rect x="${x + w / 2 - 22}" y="${y - 16}" width="44" height="14" rx="4" fill="#38bdf8"/>
            <text x="${x + w / 2}" y="${y - 6}" text-anchor="middle" fill="#082f49" font-size="9" font-weight="900">V PROBE</text>
          `;
        } else if (meter.mode === 'A') {
          probeOverlay = `
            <rect x="${x - 8}" y="${y + h / 2 - 14}" width="12" height="28" rx="4" fill="none" stroke="#f59e0b" stroke-width="3"/>
            <rect x="${x + w / 2 - 26}" y="${y - 16}" width="52" height="14" rx="4" fill="#f59e0b"/>
            <text x="${x + w / 2}" y="${y - 6}" text-anchor="middle" fill="#451a03" font-size="9" font-weight="900">AMP CLAMP</text>
          `;
        } else {
          probeOverlay = `
            <circle cx="${x + 12}" cy="${y - 4}" r="6" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
            <circle cx="${x + w - 12}" cy="${y - 4}" r="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
            <rect x="${x + w / 2 - 24}" y="${y - 16}" width="48" height="14" rx="4" fill="#22c55e"/>
            <text x="${x + w / 2}" y="${y - 6}" text-anchor="middle" fill="#052e16" font-size="9" font-weight="900">Ω PROBE</text>
          `;
        }
      }

      return `
        <g class="svg-clickable" data-cb-action="builder-probe-slot" data-slot-id="${esc(slot.id)}">
          ${isProbed ? `<rect x="${x - 4}" y="${y - 4}" width="${w + 8}" height="${h + 8}" rx="12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 3"/>` : ''}
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${st.fill}" stroke="${ringColor}" stroke-width="${strokeW}"/>
          <rect x="${x}" y="${y}" width="${w}" height="22" rx="10" fill="${st.badgeBg}" opacity="0.9"/>
          <text x="${x + 8}" y="${y + 15}" fill="#ffffff" font-size="10.5" font-weight="800">${esc(slot.icon || '')} ${esc(st.label)}</text>
          <text x="${x + w - 8}" y="${y + 15}" text-anchor="end" fill="#ffffff" font-size="10" font-weight="800">${esc(fmtOhms(slot.effectiveOhms))}</text>
          <text x="${x + w / 2}" y="${y + 40}" text-anchor="middle" fill="var(--text)" font-size="11.5" font-weight="800">${esc(shortName)}</text>
          <text x="${x + w / 2}" y="${y + 57}" text-anchor="middle" fill="var(--muted)" font-size="10.5" font-weight="700">
            ${slot.voltageDrop.toFixed(1)}V • ${slot.currentAmps.toFixed(2)}A • ${slot.powerWatts.toFixed(0)}W
          </text>
          ${probeOverlay}
        </g>
        <g class="svg-clickable" data-cb-action="builder-cycle-state" data-slot-id="${esc(slot.id)}">
          <rect x="${x + w / 2 - 42}" y="${y + h + 4}" width="84" height="18" rx="9" fill="var(--panel-elev)" stroke="var(--border)" stroke-width="1"/>
          <text x="${x + w / 2}" y="${y + h + 16}" text-anchor="middle" fill="var(--accent)" font-size="9.5" font-weight="800">Fault: ${esc((slot.blown || slot.autoBlown) ? 'blown' : slot.state)}</text>
        </g>
      `;
    }

    function wireSeg(x1, y1, x2, y2, hot, branchActive, branchAmps) {
      const baseColor = hot ? '#ef4444' : '#475569';
      const animSpeed = branchActive && branchAmps > 0.005
        ? Math.max(0.32, Math.min(2.8, 3.2 / Math.sqrt(Math.max(0.15, branchAmps))))
        : 0;
      const baseLine = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${baseColor}" stroke-width="4" stroke-linecap="round"/>`;
      const flowLine = animSpeed
        ? `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fde047" stroke-width="2.5" stroke-dasharray="7 9" class="flow-anim" style="animation-duration:${animSpeed.toFixed(2)}s" stroke-linecap="round"/>`
        : '';
      return baseLine + flowLine;
    }

    // Build Dynamic SVG Schematic based on topology
    let svgHeight = 360;
    let bodySvg = '';
    const supplyBoxColor = res.disconnectOn ? '#ef4444' : '#64748b';
    const sourceSelected = meter.targetId === 'source';

    // Power Supply + Clickable Disconnect Switch on the left (x=18..195)
    const supplySvg = `
      <g class="svg-clickable" data-cb-action="builder-probe-slot" data-slot-id="source">
        ${sourceSelected ? '<rect x="14" y="66" width="118" height="196" rx="14" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5 3"/>' : ''}
        <rect x="18" y="70" width="110" height="188" rx="12" fill="var(--panel-elev)" stroke="${sourceSelected ? '#38bdf8' : supplyBoxColor}" stroke-width="2.5"/>
        <text x="73" y="96" text-anchor="middle" fill="var(--muted)" font-size="10.5" font-weight="800">POWER SUPPLY</text>
        <text x="73" y="128" text-anchor="middle" fill="${res.disconnectOn ? '#f87171' : 'var(--muted)'}" font-size="24" font-weight="900">${res.supplyV}V</text>
        <text x="73" y="148" text-anchor="middle" fill="var(--text)" font-size="11" font-weight="700">I_tot: ${res.I_total}A</text>
        <text x="73" y="165" text-anchor="middle" fill="var(--text)" font-size="11" font-weight="700">R_eq: ${Number.isFinite(res.R_eq) ? res.R_eq + 'Ω' : '∞ Ω'}</text>
        <text x="73" y="182" text-anchor="middle" fill="var(--good)" font-size="11" font-weight="700">${res.P_totalWatts} W</text>
        <rect x="28" y="198" width="90" height="22" rx="6" fill="rgba(239,68,68,0.16)" stroke="#ef4444" stroke-width="1"/>
        <text x="73" y="213" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="800">L1 / HOT BUS</text>
        <rect x="28" y="226" width="90" height="22" rx="6" fill="rgba(56,189,248,0.14)" stroke="#38bdf8" stroke-width="1"/>
        <text x="73" y="241" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="800">L2 / COMMON</text>
      </g>
      <!-- Clickable LOTO Disconnect Knife Switch -->
      <g class="svg-clickable" data-cb-action="builder-toggle-disconnect">
        <line x1="128" y1="92" x2="150" y2="92" stroke="${res.disconnectOn ? '#ef4444' : '#64748b'}" stroke-width="4"/>
        <circle cx="152" cy="92" r="5" fill="${res.disconnectOn ? '#ef4444' : '#94a3b8'}"/>
        <circle cx="198" cy="92" r="5" fill="${res.disconnectOn && !res.fuseTripped ? '#ef4444' : '#94a3b8'}"/>
        <line x1="152" y1="92" x2="${res.disconnectOn ? 198 : 186}" y2="${res.disconnectOn ? 92 : 66}" stroke="${res.disconnectOn ? '#22c55e' : '#f59e0b'}" stroke-width="5" stroke-linecap="round"/>
        <rect x="136" y="34" width="78" height="26" rx="7" fill="${res.disconnectOn ? 'rgba(34,197,94,0.2)' : 'rgba(245,158,11,0.22)'}" stroke="${res.disconnectOn ? '#22c55e' : '#f59e0b'}" stroke-width="1.5"/>
        <text x="175" y="51" text-anchor="middle" fill="${res.disconnectOn ? '#4ade80' : '#fbbf24'}" font-size="10.5" font-weight="900">${res.disconnectOn ? 'DISC: ON' : 'LOTO: OFF'}</text>
      </g>
    `;

    if (slots.length === 0) {
      bodySvg = `
        <rect x="230" y="90" width="650" height="160" rx="14" fill="var(--panel-elev)" stroke="var(--border)" stroke-dasharray="6 4"/>
        <text x="555" y="165" text-anchor="middle" fill="var(--muted)" font-size="15" font-weight="800">No components in circuit — click "+ Add Component" in the right panel or pick a preset above.</text>
      `;
    } else if (res.topology === 'series') {
      const perRow = Math.min(4, Math.max(1, slots.length));
      const twoRows = slots.length > 4;
      svgHeight = twoRows ? 410 : 335;
      const topY = 92;
      const bottomY = twoRows ? 356 : 250;
      const row2Y = 230;
      const startX = 218;
      const availW = 670;
      const slotW = twoRows ? 148 : Math.min(165, Math.floor((availW - (slots.length - 1) * 18) / slots.length));
      const gap = twoRows ? 24 : Math.max(16, Math.floor((availW - slotW * slots.length) / Math.max(1, slots.length - 1)));
      const slotH = 68;

      // Wire from Disconnect to Row 1 first slot
      const firstX = startX;
      bodySvg += wireSeg(198, topY, firstX, topY, res.disconnectOn, activeFlow, res.I_total);

      const row1Count = twoRows ? 4 : slots.length;
      for (let i = 0; i < row1Count; i++) {
        const s = slots[i];
        const sx = startX + i * (slotW + gap);
        const sy = topY - slotH / 2;
        if (i > 0) {
          const prevX = startX + (i - 1) * (slotW + gap) + slotW;
          const prevHot = res.disconnectOn && s.nodeVoltageBefore > 1;
          bodySvg += wireSeg(prevX, topY, sx, topY, prevHot, activeFlow, res.I_total);
          bodySvg += `<circle cx="${(prevX + sx) / 2}" cy="${topY}" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5"/>`;
        }
        bodySvg += renderSlotBox(s, sx, sy, slotW, slotH);
      }

      const lastRow1EndX = startX + (row1Count - 1) * (slotW + gap) + slotW;
      const rightBusX = 894;
      if (!twoRows) {
        const afterLastHot = res.disconnectOn && (slots[slots.length - 1].nodeVoltageAfter > 1);
        bodySvg += wireSeg(lastRow1EndX, topY, rightBusX, topY, afterLastHot, activeFlow, res.I_total);
        bodySvg += wireSeg(rightBusX, topY, rightBusX, bottomY, afterLastHot, activeFlow, res.I_total);
        bodySvg += `<line x1="${rightBusX}" y1="${bottomY}" x2="128" y2="${bottomY}" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>`;
        if (activeFlow) {
          bodySvg += `<line x1="${rightBusX}" y1="${bottomY}" x2="128" y2="${bottomY}" stroke="#fde047" stroke-width="2.5" stroke-dasharray="7 9" class="flow-anim" style="animation-duration:${speedSec.toFixed(2)}s"/>`;
        }
      } else {
        const dropHot = res.disconnectOn && slots[3].nodeVoltageAfter > 1;
        bodySvg += wireSeg(lastRow1EndX, topY, rightBusX, topY, dropHot, activeFlow, res.I_total);
        bodySvg += wireSeg(rightBusX, topY, rightBusX, row2Y, dropHot, activeFlow, res.I_total);
        // Row 2 slots (rendered left-to-right visually or right-to-left along snake — let's do right-to-left snake so Hopscotch order stays intuitive!)
        const row2Count = slots.length - 4;
        let prevSnakeX = rightBusX;
        for (let j = 0; j < row2Count; j++) {
          const s = slots[4 + j];
          const sx = rightBusX - 24 - (j + 1) * slotW - j * 20;
          const sy = row2Y - slotH / 2;
          const segHot = res.disconnectOn && s.nodeVoltageBefore > 1;
          bodySvg += wireSeg(prevSnakeX, row2Y, sx + slotW, row2Y, segHot, activeFlow, res.I_total);
          bodySvg += renderSlotBox(s, sx, sy, slotW, slotH);
          prevSnakeX = sx;
        }
        const finalHot = res.disconnectOn && slots[slots.length - 1].nodeVoltageAfter > 1;
        bodySvg += wireSeg(prevSnakeX, row2Y, 175, row2Y, finalHot, activeFlow, res.I_total);
        bodySvg += wireSeg(175, row2Y, 175, bottomY, finalHot, activeFlow, res.I_total);
        bodySvg += `<line x1="175" y1="${bottomY}" x2="128" y2="${bottomY}" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>`;
      }
      bodySvg += `<text x="530" y="${bottomY + 18}" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="800">RETURN / COMMON BUS (0 V Reference for Hopscotch Method)</text>`;
    } else if (res.topology === 'parallel') {
      svgHeight = 365;
      const topY = 92;
      const bottomY = 310;
      const n = slots.length;
      const startX = 225;
      const spanW = 665;
      const colStep = spanW / Math.max(1, n);
      const slotW = Math.min(156, Math.max(82, colStep - 16));
      const slotH = 74;
      const topHot = res.disconnectOn && !res.fuseTripped;

      const lastColX = startX + (n - 1) * colStep + slotW / 2;
      bodySvg += wireSeg(198, topY, lastColX, topY, topHot, activeFlow, res.I_total);
      bodySvg += `<line x1="128" y1="${bottomY}" x2="${lastColX}" y2="${bottomY}" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>`;

      slots.forEach((s, i) => {
        const cx = startX + i * colStep + slotW / 2;
        const sx = cx - slotW / 2;
        const sy = 152;
        const branchOn = res.disconnectOn && !res.fuseTripped && s.currentAmps > 0.005;
        bodySvg += wireSeg(cx, topY, cx, sy, topHot, branchOn, s.currentAmps);
        bodySvg += `<circle cx="${cx}" cy="${topY}" r="4.5" fill="${topHot ? '#ef4444' : '#64748b'}"/>`;
        bodySvg += renderSlotBox(s, sx, sy, slotW, slotH);
        bodySvg += wireSeg(cx, sy + slotH + 22, cx, bottomY, branchOn, branchOn, s.currentAmps);
        bodySvg += `<circle cx="${cx}" cy="${bottomY}" r="4.5" fill="#38bdf8"/>`;
      });

      bodySvg += `<text x="545" y="${topY - 12}" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="800">PARALLEL HOT RAIL (${res.appliedV}V Constant Across Healthy Branches)</text>`;
      bodySvg += `<text x="545" y="${bottomY + 20}" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="800">COMMON RETURN RAIL (I_total = ${res.I_total}A = Sum of Branch Currents)</text>`;
    } else {
      // series_parallel combination circuit
      svgHeight = 385;
      const topY = 92;
      const bottomY = 326;
      const seriesSlots = slots.filter((s) => s.group === 'series');
      const parallelSlots = slots.filter((s) => s.group !== 'series');

      const trunkStartX = 212;
      const trunkSpan = seriesSlots.length ? Math.min(340, seriesSlots.length * 145) : 50;
      const busStartX = trunkStartX + trunkSpan + 24;
      const sSlotW = seriesSlots.length ? Math.min(144, Math.floor((trunkSpan - 12 * Math.max(0, seriesSlots.length - 1)) / seriesSlots.length)) : 120;
      const sSlotH = 66;

      bodySvg += wireSeg(198, topY, trunkStartX, topY, res.disconnectOn, activeFlow, res.I_total);
      bodySvg += `<rect x="${trunkStartX - 6}" y="22" width="${Math.max(120, trunkSpan + 8)}" height="22" rx="6" fill="rgba(245,158,11,0.16)" stroke="#f59e0b"/>`;
      bodySvg += `<text x="${trunkStartX + trunkSpan / 2}" y="37" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="800">SERIES TRUNK (${res.I_total}A)</text>`;

      let cursorX = trunkStartX;
      seriesSlots.forEach((s, idx) => {
        if (idx > 0) {
          bodySvg += wireSeg(cursorX, topY, cursorX + 12, topY, res.disconnectOn && s.nodeVoltageBefore > 1, activeFlow, res.I_total);
          cursorX += 12;
        }
        bodySvg += renderSlotBox(s, cursorX, topY - sSlotH / 2, sSlotW, sSlotH);
        cursorX += sSlotW;
      });

      const busHot = res.disconnectOn && !res.fuseTripped && res.V_parallel_bus > 1;
      const pAvailW = Math.max(220, 895 - busStartX);
      const pCount = Math.max(1, parallelSlots.length);
      const pStep = pAvailW / pCount;
      const pSlotW = Math.min(152, Math.max(88, pStep - 14));
      const pSlotH = 72;

      bodySvg += `<rect x="${busStartX}" y="22" width="${Math.max(160, 895 - busStartX)}" height="22" rx="6" fill="rgba(56,189,248,0.14)" stroke="#38bdf8"/>`;
      bodySvg += `<text x="${busStartX + (895 - busStartX) / 2}" y="37" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="800">PARALLEL BUS (${res.V_parallel_bus.toFixed(1)}V Shared)</text>`;

      const lastPcx = parallelSlots.length
        ? busStartX + (parallelSlots.length - 1) * pStep + pSlotW / 2
        : busStartX + 120;
      bodySvg += wireSeg(cursorX, topY, lastPcx, topY, busHot, activeFlow, res.I_total);
      bodySvg += `<line x1="128" y1="${bottomY}" x2="${lastPcx}" y2="${bottomY}" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>`;

      if (!parallelSlots.length) {
        bodySvg += wireSeg(lastPcx, topY, lastPcx, bottomY, busHot, activeFlow, res.I_total);
        bodySvg += `<text x="${busStartX + 110}" y="200" text-anchor="middle" fill="var(--muted)" font-size="12" font-weight="700">Set slots to "Parallel Bus" in controls</text>`;
      } else {
        parallelSlots.forEach((s, idx) => {
          const cx = busStartX + idx * pStep + pSlotW / 2;
          const sx = cx - pSlotW / 2;
          const sy = 158;
          const branchOn = busHot && s.currentAmps > 0.005;
          bodySvg += wireSeg(cx, topY, cx, sy, busHot, branchOn, s.currentAmps);
          bodySvg += `<circle cx="${cx}" cy="${topY}" r="4.5" fill="${busHot ? '#ef4444' : '#64748b'}"/>`;
          bodySvg += renderSlotBox(s, sx, sy, pSlotW, pSlotH);
          bodySvg += wireSeg(cx, sy + pSlotH + 22, cx, bottomY, branchOn, branchOn, s.currentAmps);
          bodySvg += `<circle cx="${cx}" cy="${bottomY}" r="4.5" fill="#38bdf8"/>`;
        });
      }
      bodySvg += `<text x="530" y="${bottomY + 20}" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="800">COMMON RETURN BUS (L2 / C = 0V Reference)</text>`;
    }

    const hopNodesHtml = (res.nodes || []).map((nd) => {
      const targetKey = `hop:${nd.id}`;
      const isSelected = meter.targetId === targetKey;
      return `
        <button class="hop-chip ${isSelected ? 'active' : ''}" data-cb-action="builder-probe-node" data-node-id="${esc(nd.id)}">
          <span>${esc(nd.label)}</span>
          <strong>${nd.voltageToCommon.toFixed(1)} V</strong>
        </button>`;
    }).join('');

    const targetButtonsHtml = [
      `<button class="cb-target-btn ${meter.targetId === 'source' ? 'active' : ''}" data-cb-action="builder-probe-slot" data-slot-id="source">⚡ Source / Total Bus</button>`,
      ...slots.map((s) =>
        `<button class="cb-target-btn ${meter.targetId === s.id ? 'active' : ''}" data-cb-action="builder-probe-slot" data-slot-id="${esc(s.id)}">${esc(s.icon || '')} ${esc(s.displayName)}</button>`
      )
    ].join('');

    const svgHtml = `
      <div class="cb-layout">
        <div class="viz-card">
          <div class="cb-header-row">
            <div class="viz-title" style="margin-bottom:0">Interactive HVAC Circuit Bench — ${esc(res.topology.replace('_', '-').toUpperCase())} (${res.supplyV}V)</div>
            <div class="cb-header-actions">
              <button class="btn-sm ${res.disconnectOn ? 'btn-good' : 'btn-warn'}" data-cb-action="builder-toggle-disconnect">
                ${res.disconnectOn ? '⚡ Disconnect: ON (Live)' : '🔒 Disconnect: OFF (LOTO)'}
              </button>
              ${res.fuseTripped ? `<button class="btn-sm btn-danger" data-cb-action="builder-reset-fuses">↺ Replace Blown Fuses</button>` : ''}
            </div>
          </div>

          ${res.fuseTripped ? `
            <div class="cb-alert-banner danger">
              <strong>💥 OVERCURRENT TRIPPED!</strong> Circuit current exceeded fuse rating and opened the circuit. Find/fix the shorted load, then click <strong>Replace Blown Fuses</strong>.
            </div>` : ''}

          <svg viewBox="0 0 920 ${svgHeight}" class="board-svg-xl" aria-label="Custom Circuit Builder Schematic">
            ${supplySvg}
            ${bodySvg}
          </svg>

          <div class="hop-strip-wrap">
            <div class="hop-strip-label">Hopscotch Voltage Reference Points (Black Lead on Common L2/C — Click Any Point to Probe):</div>
            <div class="hop-chip-row">${hopNodesHtml}</div>
          </div>
        </div>

        <div class="viz-card dmm-card">
          <div class="viz-title">Virtual Digital Multimeter (DMM)</div>
          <div class="dmm-mode-row">
            <button class="dmm-mode-btn ${meter.mode === 'V' ? 'active mode-v' : ''}" data-cb-action="builder-meter-mode" data-mode="V">
              <span class="dmm-sym">V</span>
              <span>Voltage</span>
            </button>
            <button class="dmm-mode-btn ${meter.mode === 'A' ? 'active mode-a' : ''}" data-cb-action="builder-meter-mode" data-mode="A">
              <span class="dmm-sym">A</span>
              <span>Amperage</span>
            </button>
            <button class="dmm-mode-btn ${meter.mode === 'OHM' ? 'active mode-ohm' : ''}" data-cb-action="builder-meter-mode" data-mode="OHM">
              <span class="dmm-sym">Ω</span>
              <span>Resistance</span>
            </button>
          </div>

          <div class="dmm-lcd ${mr.liveCircuitWarning ? 'warning-live' : ''} ${mr.continuityBeep ? 'beep-on' : ''}">
            <div class="dmm-lcd-top">
              <span>MODE: <strong>${esc(mr.mode === 'OHM' ? 'OHMS (Ω)' : mr.mode === 'A' ? 'AMP CLAMP (A)' : 'VOLTS (V)')}</strong></span>
              ${mr.continuityBeep ? '<span class="dmm-beep-pill">🔊 BEEP &lt;25Ω</span>' : ''}
            </div>
            <div class="dmm-lcd-target">${esc(mr.targetLabel)}</div>
            <div class="dmm-lcd-value">${esc(mr.displayText)}</div>
            ${mr.liveCircuitWarning ? `
              <div class="dmm-live-warn">
                ⚠ DANGER: LIVE CIRCUIT! Turn Disconnect OFF (LOTO) before measuring Resistance (Ω) to avoid blowing the meter fuse!
              </div>` : ''}
            <div class="dmm-lcd-sub">${esc(mr.subtext)}</div>
          </div>

          <div class="cb-probe-section">
            <div class="hop-strip-label">Click Component on Diagram or Pick Target Below:</div>
            <div class="cb-target-grid">${targetButtonsHtml}</div>
          </div>

          <div class="diag-subcard" style="margin-top:10px;font-size:0.78rem">
            <div><strong>V (Volts):</strong> Measured in <em>parallel</em> across load or open switch (Power ON).</div>
            <div><strong>A (Amps):</strong> Clamp around <em>one wire</em>. Constant in Series; adds up in Parallel.</div>
            <div><strong>Ω (Ohms):</strong> Measured with power <strong>OFF (LOTO)</strong>. <code>0Ω</code> = Closed/Short, <code>OL</code> = Open.</div>
          </div>
        </div>
      </div>`;

    return { svgHtml, res };
  }

  return {
    renderOhmWattVisual,
    renderCircuitsHopscotchVisual,
    renderCircuitBuilderVisual,
    renderAc3PhaseVisual,
    drawAc3PhaseCanvases,
    renderMotorsCapsVisual,
    renderControlsStartersVisual
  };
}));

  </script>

/**

(function () {

  let audioCtx = null;
  function playTone(freq, duration = 0.06, type = 'triangle') {
    if (!state.soundEnabled) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (_) {
      // Ignore browser autoplay restrictions
    }
  }

  const ALLOWED_TABS = [
    'ohm_watt',
    'circuits_hopscotch',

  function applyElectricalPresetPayload({ tab, theme, walkthrough }) {

        applyPreset(s.boardTab, s.presetId);
        return true;
      }
    } else if (walkthrough === false || walkthrough === '0' || walkthrough === 'false') {
      state.walkthroughActive = false;
    }
    return false;
  }

  function applyPreset(tabId, presetId) {
    const list = Curriculum.BOARD_PRESETS[tabId] || [];
    const preset = list.find((p) => p.id === presetId);
    if (!preset) return;
    const p = preset.params;

    if (tabId === 'ohm_watt') {
      Object.assign(state.ohm, p);
    } else if (tabId === 'circuits_hopscotch') {
      Object.assign(state.circuits, p);
    } else if (tabId === 'circuit_builder') {
      state.builder.topology = p.topology || 'series';
      state.builder.supplyV = p.supplyV !== undefined ? p.supplyV : 24;
      state.builder.disconnectOn = p.disconnectOn !== false;
      state.builder.meter = p.meter ? { ...p.meter } : { mode: 'V', targetId: 'source' };
      state.builder.slots = (p.slots || []).map((s, i) => ({
        id: s.id || `s${i + 1}`,
        typeId: s.typeId,
        customName: s.customName || '',
        R_ohm: s.R_ohm,
        state: s.state || 'normal',
        blown: Boolean(s.blown),
        group: s.group || (i < 2 ? 'series' : 'parallel')
      }));
      state.builder.nextSlotId = state.builder.slots.length + 10;
    } else if (tabId === 'ac_3phase') {
      state.ac = { Vrms: p.Vrms, freqHz: p.freqHz, R_ohm: p.R_ohm, L_mH: p.L_mH, C_uF: p.C_uF };
      state.threePhase = {
        systemType: p.systemType,
        V12: p.V12,
        V23: p.V23,
        V31: p.V31,
        lineAmps: p.lineAmps,
        powerFactor: p.powerFactor,
        phaseSequence: p.phaseSequence
      };
    } else if (tabId === 'motors_caps') {
      Object.assign(state.motors, p);
    } else if (tabId === 'controls_starters') {
      state.controls.starter.mode = p.mode === '2wire_lvr' ? '2wire_lvr' : '3wire_lvp';
      state.controls.motorFla = p.motorFla;
      state.controls.serviceFactor = p.serviceFactor;
      state.controls.tripClass = p.tripClass;
      state.controls.psMode = p.psMode;
      state.controls.cutInPsig = p.cutInPsig;
      state.controls.cutOutPsig = p.cutOutPsig;
      state.controls.currentPsig = p.currentPsig;
      state.controls.psPrevClosed = true;
      state.controls.tempF = p.tempF;
      state.controls.flameMicroAmpsDC = p.flameMicroAmpsDC;
      state.controls.rodAreaRatio = p.rodAreaRatio !== undefined ? p.rodAreaRatio : 4.0;
    }
    playTone(540, 0.05);
    render(true);
  }

  function renderPresetStrip() {
    const strip = document.getElementById('preset-strip');
    const presets = Curriculum.BOARD_PRESETS[state.activeTab] || [];
    if (!presets.length) {
      strip.innerHTML = '';
      strip.classList.add('hidden');
      return;
    }
    strip.classList.remove('hidden');
    strip.innerHTML = `<span class="preset-label">Curriculum Presets:</span>` + presets.map((pr) =>
      `<button class="preset-btn" data-preset="${pr.id}" title="${pr.source}">${pr.label}</button>`
    ).join('');
  }

  function renderWalkthroughBanner() {
    const banner = document.getElementById('walkthrough-banner');
    if (!state.walkthroughActive) {
      banner.classList.add('hidden');
      return;
    }
    banner.classList.remove('hidden');
    const slide = Curriculum.WALKTHROUGH_SLIDES[state.walkthroughIdx];
    document.getElementById('wt-step-badge').textContent = `Slide ${slide.step} of ${Curriculum.WALKTHROUGH_SLIDES.length} • ${slide.chapterRef}`;
    document.getElementById('wt-title').textContent = slide.title;
    document.getElementById('wt-summary').textContent = slide.summary;
    document.getElementById('wt-points').innerHTML = slide.points.map((pt) => `<li>${pt}</li>`).join('');
    document.getElementById('wt-watch').innerHTML = `<strong>👀 Watch on the Board:</strong> ${slide.watchOnBoard}`;
  }

  function renderKpis(items) {
    document.getElementById('kpi-strip').innerHTML = items.map((k) => `
      <div class="kpi-card ${k.tone || ''}">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value">${k.value}</div>
        <div class="kpi-sub">${k.sub}</div>
      </div>
    `).join('');
  }

  function syncControlReadouts(extraMap = {}) {
    const body = document.getElementById('controls-body');
    body.querySelectorAll('[data-display]').forEach((el) => {
      const key = el.dataset.display;
      if (extraMap[key] !== undefined) {
        el.textContent = extraMap[key];
      }
    });
    body.querySelectorAll('[data-bind]').forEach((el) => {
      if (el === document.activeElement) return;
      const key = el.dataset.bind;
      if (extraMap[key] !== undefined) {
        el.value = extraMap[key];
      }
    });
  }

          <label>System Pressure: <strong data-display="psigLabel">${state.controls.currentPsig} psig</strong>
            <input type="range" min="0" max="650" step="5" data-bind="controls.currentPsig" value="${state.controls.currentPsig}" />
          </label>
          <label>Flame Signal: <strong data-display="flameLabel">${state.controls.flameMicroAmpsDC} µA DC</strong>
            <input type="range" min="0" max="7" step="0.1" data-bind="controls.flameMicroAmpsDC" value="${state.controls.flameMicroAmpsDC}" />
          </label>
          <label>Burner-to-Rod Ground Ratio: <strong data-display="rodRatioLabel">${state.controls.rodAreaRatio}:1</strong>
            <input type="range" min="1" max="6" step="0.5" data-bind="controls.rodAreaRatio" value="${state.controls.rodAreaRatio}" />
          </label>
          <label>NTC Sensor Temp: <strong data-display="tempLabel">${state.controls.tempF}°F</strong>
            <input type="range" min="0" max="180" step="1" data-bind="controls.tempF" value="${state.controls.tempF}" />
          </label>
        </div>
      `;
    }

    return `
      <div class="ctrl-group">
        <h3>Instructor Classroom Mode</h3>
        <p class="ctrl-help">Project any Chapter 13–19 theory board directly from the Chapter Matrix on the left, or poll students on the 15 exam-aligned review questions above.</p>
        <button class="btn-sm btn-accent" style="width:100%;margin-top:8px;" id="btn-start-wt-from-tab">▶ Launch 10-Slide Guided Walkthrough</button>
      </div>
    `;
  }

  function renderCurriculumQuizTab() {
    const stage = document.getElementById('board-stage');
    const q = Curriculum.BOARD_QUIZ_QUESTIONS[state.quizIdx];
    const selected = state.quizAnswered[q.id];
    const answeredCount = Object.keys(state.quizAnswered).length;

    const chaptersHtml = Curriculum.CHAPTER_MAP.map((ch) => `
      <div class="chapter-card">
        <div class="chapter-head">
          <span class="ch-pill">Ch. ${ch.chapter}</span>
          <strong>${ch.title}</strong>
          <button class="btn-xs btn-accent" data-launch-tab="${ch.boardTab}">Open Board →</button>
        </div>
        <div class="ch-meta">${ch.deck} • Labs: ${ch.labs.join(', ')} • ${ch.cteCodes}</div>
        <ul class="ch-outcomes">${ch.outcomes.map((o) => `<li>${o}</li>`).join('')}</ul>
      </div>
    `).join('');

    const quizHtml = `
      <div class="viz-card quiz-card">
        <div class="quiz-top">
          <div>
            <span class="ch-pill">Classroom Board Quiz • Question ${state.quizIdx + 1} / ${Curriculum.BOARD_QUIZ_QUESTIONS.length}</span>
            <span class="quiz-ref">${q.chapter}</span>
          </div>
          <div class="quiz-score">Score: ${state.quizScore} / ${answeredCount} answered</div>
        </div>
        <h3 class="quiz-question">${q.question}</h3>
        <div class="quiz-choices">
          ${q.choices.map((c, idx) => {
            let cls = 'quiz-choice';
            if (selected !== undefined) {
              if (idx === q.answerIndex) cls += ' correct';
              else if (idx === selected) cls += ' wrong';
            }
            return `<button class="${cls}" data-quiz-choice="${idx}" ${selected !== undefined ? 'disabled' : ''}>
              <span class="choice-letter">${String.fromCharCode(65 + idx)}</span>
              <span>${c}</span>
            </button>`;
          }).join('')}
        </div>
        ${selected !== undefined ? `
          <div class="quiz-explain ${selected === q.answerIndex ? 'ok' : 'bad'}">
            <strong>${selected === q.answerIndex ? '✓ Correct!' : '✕ Review Explanation:'}</strong> ${q.explanation}
          </div>` : ''}
        <div class="quiz-nav">
          <button class="btn-sm btn-ghost" id="btn-quiz-prev">← Previous</button>

          <button class="btn-sm btn-ghost" id="btn-quiz-reset">Reset Quiz</button>
        </div>
      </div>

    stage.innerHTML = `${quizHtml}<div class="chapter-grid">${chaptersHtml}</div>`;
    renderKpis([

      { label: 'Curriculum Decks', value: 'Decks 02 & 06', sub: 'Year 1 Q2 & Year 2 Q6', tone: 'info' },
      { label: 'Hands-On Labs', value: 'Labs 05–08, 17, 64–67', sub: 'MI CTE CIP 47.0201 B1–B5', tone: 'good' },
      { label: 'Board Quiz Score', value: `${state.quizScore}/${Curriculum.BOARD_QUIZ_QUESTIONS.length}`, sub: `${answeredCount} Completed`, tone: 'warn' }
    ]);

  function render(rebuildControls = false) {
    document.querySelectorAll('.module-tab').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.tab === state.activeTab);
    });

    renderPresetStrip();
    renderWalkthroughBanner();
    if (rebuildControls) {
      document.getElementById('controls-body').innerHTML = buildControlsHtml();
    }

    const stage = document.getElementById('board-stage');

    if (state.activeTab === 'ohm_watt') {
      const { svgHtml, ow, shock, xfmr } = Renderer.renderOhmWattVisual(state, Theory, Curriculum);
      state.ohm.V = ow.V;
      state.ohm.I = ow.I;
      state.ohm.R = Number.isFinite(ow.R) ? ow.R : state.ohm.R;
      state.ohm.P = ow.P_watts;
      stage.innerHTML = svgHtml;
      renderKpis([
        { label: 'Voltage (E)', value: `${ow.V} VAC`, sub: 'Electromotive Force', tone: 'danger' },
        { label: 'Current (I)', value: `${ow.I} A`, sub: `${shock.currentMa} mA Shock Check`, tone: shock.lethalZone ? 'danger' : 'info' },
        { label: 'Resistance (R)', value: `${Number.isFinite(ow.R) ? ow.R + ' Ω' : '∞ Ω'}`, sub: `Formulas: ${ow.formulasUsed.join(' | ')}`, tone: 'warn' },
        { label: 'Power / Heat', value: `${ow.P_kw} kW`, sub: `${ow.P_watts} W • ${ow.btuPerHr} BTU/hr`, tone: 'good' },

      ]);
      syncControlReadouts({
        'ohm.V': ow.V,
        'ohm.I': ow.I,
        'ohm.R': Number.isFinite(ow.R) ? ow.R : 0,
        'ohm.P': ow.P_watts,
        xfmrAmpsLabel: `${state.ohm.xfmrAmps} A`,
        fuseAmpsLabel: `${state.ohm.fuseAmps} A`
      });
    } else if (state.activeTab === 'circuits_hopscotch') {
      const { svgHtml, result } = Renderer.renderCircuitsHopscotchVisual(state, Theory);
      stage.innerHTML = svgHtml;
      const sub = state.circuits.subMode;

        const tp = result.testPoints[state.circuits.probeTpIndex ?? 3] || result.testPoints[0];
        renderKpis([
          { label: 'Control Supply', value: '24.0 VAC', sub: 'Class 2 Transformer R-C', tone: 'info' },
          { label: 'DMM Reading', value: `${tp.voltageToCommon.toFixed(1)} VAC`, sub: `${tp.id}: ${tp.label}`, tone: tp.voltageToCommon >= 20 ? 'warn' : 'info' },
          { label: 'Contactor Coil', value: result.contactorEnergized ? 'ENERGIZED' : 'OPEN / OFF', sub: `${result.currentAmps} A Loop`, tone: result.contactorEnergized ? 'good' : 'danger' },
          { label: 'Fault Diagnosis', value: result.diagnosedFault ? result.diagnosedFault.toUpperCase() : 'NO OPEN FAULT', sub: state.circuits.pittedTarget !== 'none' ? `Pitted Contact: ${state.circuits.pittedTarget.toUpperCase()}` : 'Hopscotch Black on C', tone: result.diagnosedFault ? 'danger' : 'good' }
        ]);
      } else {
        renderKpis([
          { label: 'Topology', value: sub.toUpperCase(), sub: sub === 'series' ? 'Single Path • I Constant' : 'Multi-Branch • V Constant', tone: 'info' },
          { label: 'Supply Voltage', value: `${result.supplyV} V`, sub: 'Line / Control Bus', tone: 'warn' },
          { label: 'Total Resistance', value: Number.isFinite(result.R_total) ? `${result.R_total} Ω` : '∞ Ω (OPEN)', sub: sub === 'parallel' ? `Smallest R: ${result.minActiveR} Ω` : 'R1 + R2 Additive', tone: 'info' },
          { label: 'Total Current', value: `${result.I_total} A`, sub: `${result.totalPowerWatts || result.P_totalWatts} W Total`, tone: result.I_total > 0 ? 'good' : 'danger' }
        ]);
      }
    } else if (state.activeTab === 'circuit_builder') {
      const { svgHtml, res } = Renderer.renderCircuitBuilderVisual(state, Theory);
      if (res.autoBlownFuseIds && res.autoBlownFuseIds.length) {
        for (const fid of res.autoBlownFuseIds) {
          const targetSlot = state.builder.slots.find((s) => s.id === fid);
          if (targetSlot && !targetSlot.blown) {
            targetSlot.blown = true;
          }
        }
      }
      stage.innerHTML = svgHtml;
      const mr = res.meterReadout;
      renderKpis([
        { label: 'Circuit Supply', value: `${res.supplyV} V`, sub: res.disconnectOn ? `${res.topology.replace('_', '-').toUpperCase()} • LIVE` : 'DISCONNECT OFF (LOTO)', tone: res.disconnectOn ? 'warn' : 'info' },
        { label: 'DMM Readout', value: mr.displayText, sub: `${mr.mode}: ${mr.targetLabel}`, tone: mr.liveCircuitWarning ? 'danger' : (mr.continuityBeep ? 'good' : 'info') },
        { label: 'Total Current', value: `${res.I_total} A`, sub: `${res.P_totalWatts} W Total`, tone: res.fuseTripped ? 'danger' : (res.I_total > 0 ? 'good' : 'warn') },
        { label: 'Equivalent R', value: Number.isFinite(res.R_eq) ? `${res.R_eq} Ω` : '∞ Ω (OPEN)', sub: res.fuseTripped ? 'Fuse Blown (Circuit Open)' : `${res.slots.length} Component(s)`, tone: res.fuseTripped ? 'danger' : 'info' }
      ]);
      syncControlReadouts({
        'cb.supplyV': `${res.supplyV} V`
      });
    } else if (state.activeTab === 'ac_3phase') {
      const { svgHtml, ac, tp } = Renderer.renderAc3PhaseVisual(state, Theory);
      stage.innerHTML = svgHtml;
      Renderer.drawAc3PhaseCanvases(state, Theory, state.phaseTick);
      renderKpis([
        { label: 'RMS / Peak AC', value: `${ac.Vrms}V / ${ac.Vpeak}V`, sub: `RMS = 0.707 × Peak • ${ac.freqHz} Hz`, tone: 'info' },
        { label: 'Power Factor', value: `${ac.powerFactor} (${ac.powerFactorPct}%)`, sub: `${ac.truePowerW} W / ${ac.apparentPowerVA} VA`, tone: ac.powerFactor >= 0.85 ? 'good' : 'warn' },
        { label: '3Ø Average V', value: `${tp.Vavg} VAC`, sub: `Max ΔV: ${tp.maxDeviation}V (${tp.systemType.toUpperCase()})`, tone: 'info' },
        { label: 'NEMA Imbalance', value: `${tp.pctVoltageImbalance}%`, sub: `Current Imb: ~${tp.pctCurrentImbalance}% • +${tp.windingTempRisePct}% Temp Rise`, tone: tp.nemaStatus === 'GOOD' ? 'good' : tp.nemaStatus === 'CAUTION' ? 'warn' : 'danger' },
        { label: 'Phase Sequence', value: tp.phaseSequence, sub: tp.scrollCompressorSafe ? 'Scroll Safe (CW)' : 'REVERSE HAZARD (CCW)', tone: tp.scrollCompressorSafe ? 'good' : 'danger' }
      ]);
      syncControlReadouts({
        acRLabel: `${state.ac.R_ohm} Ω`,
        acLLabel: `${state.ac.L_mH} mH`,
        acCLabel: `${state.ac.C_uF} µF`,
        'threePhase.phaseSequence': tp.phaseSequence
      });
    } else if (state.activeTab === 'motors_caps') {
      const { svgHtml, csr, combined, spd } = Renderer.renderMotorsCapsVisual(state, Theory);
      stage.innerHTML = svgHtml;
      renderKpis([
        { label: 'C-S-R Assignment', value: csr.commonPin ? `1:${csr.pinMap['1']}  2:${csr.pinMap['2']}  3:${csr.pinMap['3']}` : csr.status, sub: csr.commonPin ? `C-R:${csr.R_CR}Ω + C-S:${csr.R_CS}Ω = ${csr.sumCheckExpected}Ω` : 'Fault Detected', tone: csr.status === 'IDENTIFIED' ? 'good' : 'danger' },
        { label: 'Run Capacitor', value: `${combined.capacitor.measuredUf} / ${combined.capacitor.ratedUf} µF`, sub: `${combined.capacitor.condition} (±${combined.capacitor.tolerancePct}%)`, tone: combined.capacitor.condition === 'GOOD' ? 'good' : 'danger' },
        { label: 'Potential Relay', value: `${combined.potentialRelay.backEmfVolts} VAC`, sub: combined.potentialRelay.contacts12State, tone: combined.potentialRelay.backEmfVolts >= combined.potentialRelay.pickupVolts ? 'good' : 'warn' },
        { label: 'Megger (IEEE 43)', value: `${combined.megger.resistanceMohm} MΩ`, sub: `@ ${combined.megger.testVoltageDC}V DC • ${combined.megger.status}`, tone: combined.megger.status === 'PRISTINE' ? 'good' : combined.megger.status === 'WARNING_MOISTURE' ? 'warn' : 'danger' },
        { label: 'Sync / Rotor RPM', value: `${spd.syncSpeedRpm} / ${spd.actualRpm}`, sub: `${spd.poles}-Pole • ${spd.slipPct}% Slip`, tone: 'info' }
      ]);
      syncControlReadouts({
        rpmPctLabel: `${state.motors.motorRpmPct}% Sync Speed`,
        meggerLabel: `${state.motors.resistanceMohm} MΩ`
      });
    } else if (state.activeTab === 'controls_starters') {
      const { svgHtml, starter, ol, ps, elec } = Renderer.renderControlsStartersVisual(state, Theory, Curriculum);
      state.controls.psPrevClosed = ps.contactsClosed;
      stage.innerHTML = svgHtml;
      renderKpis([
        { label: 'Starter Control', value: starter.coilEnergized ? 'ENERGIZED' : 'DROPPED OUT', sub: starter.mode === '3wire_lvp' ? '3-Wire LVP Safety' : '2-Wire LVR Auto-Restart', tone: starter.coilEnergized ? 'good' : 'warn' },
        { label: 'NEC 430.32 Max Trip', value: `${ol.maxOverloadAmps} A`, sub: `${ol.multiplierPct}% × ${ol.motorFla}A (Class ${ol.tripClass})`, tone: 'info' },
        { label: 'Pressure Switch', value: ps.contactState, sub: `Diff: ${ps.differentialPsig} psi @ ${ps.currentPsig} psig`, tone: ps.contactsClosed ? 'good' : 'danger' },
        { label: 'Flame Rectification', value: `${elec.flameMicroAmpsDC} µA DC`, sub: elec.flameStatus.replace(/_/g, ' '), tone: elec.flameStatus === 'GOOD_FLAME_PROVEN' ? 'good' : elec.flameStatus === 'MARGINAL_CLEAN_ROD' ? 'warn' : 'danger' },
        { label: 'NTC Thermistor', value: `${elec.thermistorKOhms} kΩ`, sub: `@ ${elec.tempF}°F (${elec.tempC}°C)`, tone: 'info' }
      ]);
      syncControlReadouts({
        psigLabel: `${state.controls.currentPsig} psig`,
        flameLabel: `${elec.flameMicroAmpsDC} µA DC`,
        rodRatioLabel: `${state.controls.rodAreaRatio}:1`,
        tempLabel: `${state.controls.tempF}°F`
      });
    } else if (state.activeTab === 'curriculum_quiz') {
      renderCurriculumQuizTab();
    }
  }

  function setNested(path, rawVal, isBool) {
    const parts = path.split('.');
    let obj = state;
    for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
    const key = parts[parts.length - 1];
    if (isBool) obj[key] = rawVal === 'true' || rawVal === true;
    else obj[key] = isNaN(Number(rawVal)) || rawVal === '' ? rawVal : Number(rawVal);
  }

  function bindGlobalEvents() {
    document.querySelectorAll('.module-tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.activeTab = btn.dataset.tab;
        playTone(480, 0.04);
        render(true);
      });
    });

    document.getElementById('btn-theme-toggle').addEventListener('click', () => {
      applyElectricalTheme(state.projectorMode ? 'dark' : 'light');
      playTone(620, 0.05);
    });

    document.getElementById('btn-sound-toggle').addEventListener('click', () => {
      state.soundEnabled = !state.soundEnabled;
      document.getElementById('btn-sound-toggle').textContent = state.soundEnabled ? '🔊 Sound On' : '🔇 Sound Off';
    });

    document.getElementById('btn-walkthrough-toggle').addEventListener('click', () => {
      state.walkthroughActive = !state.walkthroughActive;
      if (state.walkthroughActive) {
        const s = Curriculum.WALKTHROUGH_SLIDES[state.walkthroughIdx];
        state.activeTab = s.boardTab;
        applyPreset(s.boardTab, s.presetId);
      } else {
        render(false);
      }
    });

    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.().catch(() => {});
      }
    });

    document.getElementById('wt-prev').addEventListener('click', () => {
      state.walkthroughIdx = (state.walkthroughIdx - 1 + Curriculum.WALKTHROUGH_SLIDES.length) % Curriculum.WALKTHROUGH_SLIDES.length;
      const s = Curriculum.WALKTHROUGH_SLIDES[state.walkthroughIdx];
      state.activeTab = s.boardTab;
      applyPreset(s.boardTab, s.presetId);
    });

    document.getElementById('wt-next').addEventListener('click', () => {
      state.walkthroughIdx = (state.walkthroughIdx + 1) % Curriculum.WALKTHROUGH_SLIDES.length;
      const s = Curriculum.WALKTHROUGH_SLIDES[state.walkthroughIdx];
      state.activeTab = s.boardTab;
      applyPreset(s.boardTab, s.presetId);
    });

    document.getElementById('wt-close').addEventListener('click', () => {
      state.walkthroughActive = false;
      render(false);
    });

    document.getElementById('preset-strip').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-preset]');
      if (btn) applyPreset(state.activeTab, btn.dataset.preset);
    });

    document.getElementById('controls-body').addEventListener('input', (e) => {
      const el = e.target;
      if (!el.dataset.bind) return;
      setNested(el.dataset.bind, el.value, el.dataset.bool === 'true');
      if (el.dataset.bind === 'controls.psMode') {
        state.controls.psPrevClosed = true;
        if (el.value === 'low_pressure') { state.controls.cutInPsig = 55; state.controls.cutOutPsig = 25; }
        else if (el.value === 'high_pressure') { state.controls.cutInPsig = 460; state.controls.cutOutPsig = 610; }
        else { state.controls.cutInPsig = 325; state.controls.cutOutPsig = 245; }
      }
      render(el.dataset.rebuild === 'true');
    });

    document.getElementById('controls-body').addEventListener('click', (e) => {
      const modeBtn = e.target.closest('[data-circuit-mode]');
      if (modeBtn) {
        state.circuits.subMode = modeBtn.dataset.circuitMode;
        playTone(440, 0.04);
        render(true);
        return;
      }
      const launchCtrlBtn = e.target.closest('[data-launch-tab]');
      if (launchCtrlBtn) {
        state.activeTab = launchCtrlBtn.dataset.launchTab;
        playTone(560, 0.05);
        render(true);
        return;
      }
      const cbVoltsBtn = e.target.closest('[data-cb-volts]');
      if (cbVoltsBtn) {
        const rawV = Number(cbVoltsBtn.dataset.cbVolts);
        state.builder.supplyV = Number.isFinite(rawV) ? rawV : 24;
        playTone(460, 0.04);
        render(true);
        return;
      }
      const cbDiscBtn = e.target.closest('[data-cb-disconnect]');
      if (cbDiscBtn) {
        state.builder.disconnectOn = cbDiscBtn.dataset.cbDisconnect === 'true';
        playTone(380, 0.05);
        render(true);
        return;
      }
      const cbTopoBtn = e.target.closest('[data-cb-topology]');
      if (cbTopoBtn) {
        const nextTopo = cbTopoBtn.dataset.cbTopology;
        state.builder.topology = nextTopo;
        if (nextTopo === 'series_parallel' && state.builder.slots.length >= 2) {
          const hasSeries = state.builder.slots.some((s) => s.group === 'series');
          const hasParallel = state.builder.slots.some((s) => s.group === 'parallel');
          if (!hasSeries || !hasParallel) {
            state.builder.slots.forEach((s, i) => {
              s.group = i < Math.ceil(state.builder.slots.length / 2) ? 'series' : 'parallel';
            });
          }
        }
        playTone(440, 0.04);
        render(true);
        return;
      }
      const cbRemoveBtn = e.target.closest('[data-cb-remove]');
      if (cbRemoveBtn && state.builder.slots.length > 1) {
        const idx = Number(cbRemoveBtn.dataset.cbRemove);
        const removed = state.builder.slots[idx];
        state.builder.slots.splice(idx, 1);
        if (removed && state.builder.meter.targetId === removed.id) {
          state.builder.meter.targetId = 'source';
        }
        playTone(340, 0.04);
        render(true);
        return;
      }
      if (e.target.closest('#btn-cb-add-slot') && state.builder.slots.length < 8) {
        const sel = document.getElementById('cb-add-type');
        const typeId = sel ? sel.value : 'contactor_coil';
        const catItem = (Theory.BUILDER_COMPONENT_CATALOG || []).find((c) => c.typeId === typeId) || { defaultOhms: 16 };
        const id = `s${state.builder.nextSlotId++}`;
        state.builder.slots.push({
          id,
          typeId,
          customName: '',
          R_ohm: catItem.defaultOhms,
          state: 'normal',
          blown: false,
          group: state.builder.slots.length < 2 ? 'series' : 'parallel'
        });
        playTone(580, 0.04);
        render(true);
        return;
      }
      if (e.target.closest('#btn-cb-reset-fuses')) {
        state.builder.slots.forEach((s) => { s.blown = false; });
        playTone(640, 0.06);
        render(true);
        return;
      }
      if (e.target.closest('#btn-toggle-csr')) {
        state.motors.revealCsr = !state.motors.revealCsr;
        playTone(580, 0.05);
        render(true);
        return;
      }
      if (e.target.closest('#btn-start-wt-from-tab')) {
        state.walkthroughActive = true;
        state.walkthroughIdx = 0;
        const s = Curriculum.WALKTHROUGH_SLIDES[0];
        state.activeTab = s.boardTab;
        applyPreset(s.boardTab, s.presetId);
      }
    });

    document.getElementById('controls-body').addEventListener('input', (e) => {
      if (e.target.id === 'cb-supply-v') {
        const rawV = e.target.value === '' ? 24 : Number(e.target.value);
        const v = Number.isFinite(rawV) ? Math.max(0, Math.min(600, rawV)) : 24;
        state.builder.supplyV = v;
        document.querySelectorAll('[data-cb-volts]').forEach((btn) => {
          btn.classList.toggle('active', Number(btn.dataset.cbVolts) === v);
        });
        render(false);
        return;
      }
      if (e.target.matches('[data-cb-slot-prop="R_ohm"]')) {
        const idx = Number(e.target.dataset.slotIdx);
        const val = Number(e.target.value);
        if (state.builder.slots[idx] && Number.isFinite(val) && val > 0) {
          state.builder.slots[idx].R_ohm = val;
          render(false);
        }
      }
    });

    document.getElementById('controls-body').addEventListener('change', (e) => {
      if (!e.target.matches('[data-cb-slot-prop]')) return;
      const idx = Number(e.target.dataset.slotIdx);
      const prop = e.target.dataset.cbSlotProp;
      const slot = state.builder.slots[idx];
      if (!slot || prop === 'R_ohm') return;
      if (prop === 'typeId') {
        slot.typeId = e.target.value;
        const catItem = (Theory.BUILDER_COMPONENT_CATALOG || []).find((c) => c.typeId === slot.typeId) || { defaultOhms: 10 };
        slot.R_ohm = catItem.defaultOhms;
        slot.customName = '';
        slot.blown = false;
      } else if (prop === 'state') {
        slot.state = e.target.value;
        if (slot.state === 'normal') {
          slot.blown = false;
        }
      } else if (prop === 'group') {
        slot.group = e.target.value;
      }
      playTone(460, 0.04);
      render(true);
    });

    document.getElementById('board-stage').addEventListener('click', (e) => {
      const cbEl = e.target.closest('[data-cb-action]');
      if (!cbEl) return;
      const act = cbEl.dataset.cbAction;
      if (act === 'builder-toggle-disconnect') {
        state.builder.disconnectOn = !state.builder.disconnectOn;
        playTone(380, 0.05);
        render(true);
      } else if (act === 'builder-reset-fuses') {
        state.builder.slots.forEach((s) => { s.blown = false; });
        playTone(640, 0.06);
        render(true);
      } else if (act === 'builder-meter-mode') {
        state.builder.meter.mode = cbEl.dataset.mode || 'V';
        const preview = Theory.solveCustomCircuit(state.builder);
        playTone(preview.meterReadout && preview.meterReadout.continuityBeep ? 880 : 520, 0.06);
        render(false);
      } else if (act === 'builder-probe-slot') {
        state.builder.meter.targetId = cbEl.dataset.slotId || 'source';
        const preview = Theory.solveCustomCircuit(state.builder);
        playTone(preview.meterReadout && preview.meterReadout.continuityBeep ? 880 : 540, 0.05);
        render(false);
      } else if (act === 'builder-probe-node') {
        state.builder.meter.mode = 'V';
        state.builder.meter.targetId = `hop:${cbEl.dataset.nodeId}`;
        playTone(580, 0.04);
        render(false);
      } else if (act === 'builder-cycle-state') {
        const slot = state.builder.slots.find((s) => s.id === cbEl.dataset.slotId);
        if (slot) {
          const order = ['normal', 'open', 'pitted', 'shorted'];
          const next = order[(order.indexOf(slot.state) + 1) % order.length];
          slot.state = next;
          if (next === 'normal') slot.blown = false;
          playTone(460, 0.05);
          render(true);
        }
      }
    });

    document.getElementById('board-stage').addEventListener('click', (e) => {
      const actEl = e.target.closest('[data-action]');
      if (actEl) {
        const action = actEl.dataset.action;
        if (action === 'toggle-series-sw1') state.circuits.sw1Closed = !state.circuits.sw1Closed;
        else if (action === 'toggle-series-sw2') state.circuits.sw2Closed = !state.circuits.sw2Closed;
        else if (action === 'toggle-parallel-b1') state.circuits.b1Closed = !state.circuits.b1Closed;
        else if (action === 'toggle-parallel-b2') state.circuits.b2Closed = !state.circuits.b2Closed;
        else if (action === 'toggle-parallel-b3') state.circuits.b3Closed = !state.circuits.b3Closed;
        else if (action === 'select-tp') state.circuits.probeTpIndex = Number(actEl.dataset.tp);
        else if (action === 'toggle-hop-fault') {
          const t = actEl.dataset.target;
          state.circuits.faultTarget = state.circuits.faultTarget === t ? 'none' : t;
        } else if (action === 'swap-phase-leads') {
          state.threePhase.phaseSequence = state.threePhase.phaseSequence === 'ABC' ? 'CBA' : 'ABC';
        } else if (action === 'starter-start') {
          state.controls.starter.stopButtonPressed = false;
          state.controls.starter.startButtonPressed = true;
          const res = Theory.simulateThreeWireStarter(state.controls.starter);
          state.controls.starter.auxSealed = res.auxSealed;
          state.controls.starter.startButtonPressed = false;
          state.controls.starter.maintainedSwitchClosed = true;
        } else if (action === 'starter-stop') {
          state.controls.starter.stopButtonPressed = true;
          state.controls.starter.startButtonPressed = false;
          state.controls.starter.auxSealed = false;
          state.controls.starter.maintainedSwitchClosed = false;
          state.controls.starter.stopButtonPressed = false;
        } else if (action === 'starter-power') {
          state.controls.starter.powerAvailable = !state.controls.starter.powerAvailable;
          const res = Theory.simulateThreeWireStarter(state.controls.starter);
          state.controls.starter.auxSealed = res.auxSealed;
        } else if (action === 'starter-ol') {
          state.controls.starter.overloadTripped = !state.controls.starter.overloadTripped;
          const res = Theory.simulateThreeWireStarter(state.controls.starter);
          state.controls.starter.auxSealed = res.auxSealed;
        }
        playTone(510, 0.05);
        render(false);
        return;
      }

      const launchBtn = e.target.closest('[data-launch-tab]');
      if (launchBtn) {
        state.activeTab = launchBtn.dataset.launchTab;
        playTone(500, 0.04);
        render(true);
        return;
      }

      const choiceBtn = e.target.closest('[data-quiz-choice]');
      if (choiceBtn) {
        const q = Curriculum.BOARD_QUIZ_QUESTIONS[state.quizIdx];
        const idx = Number(choiceBtn.dataset.quizChoice);
        if (state.quizAnswered[q.id] === undefined) {
          state.quizAnswered[q.id] = idx;
          if (idx === q.answerIndex) {
            state.quizScore += 1;
            playTone(760, 0.08);
          } else {
            playTone(220, 0.12, 'sawtooth');
          }
          render(false);
        }
        return;
      }

      if (e.target.closest('#btn-quiz-prev')) {
        state.quizIdx = (state.quizIdx - 1 + Curriculum.BOARD_QUIZ_QUESTIONS.length) % Curriculum.BOARD_QUIZ_QUESTIONS.length;
        render(false);
      } else if (e.target.closest('#btn-quiz-next')) {
        state.quizIdx = (state.quizIdx + 1) % Curriculum.BOARD_QUIZ_QUESTIONS.length;
        render(false);
      } else if (e.target.closest('#btn-quiz-reset')) {
        state.quizIdx = 0;
        state.quizScore = 0;
        state.quizAnswered = {};
        render(false);
      }
    });
  }

  function animate() {
    state.phaseTick = (state.phaseTick + 0.045) % (Math.PI * 200);
    if (state.activeTab === 'ac_3phase') {
      Renderer.drawAc3PhaseCanvases(state, Theory, state.phaseTick);
    }
    window.requestAnimationFrame(animate);
  }

  function init() {
    bindGlobalEvents();
    let handledByPreset = false;
    try {
      const qs = new URLSearchParams(window.location.search);
      handledByPreset = applyElectricalPresetPayload({
        tab: qs.get('tab'),
        theme: qs.get('theme') || 'light',
        walkthrough: qs.get('walkthrough')
      });
    } catch (_) {
      applyElectricalTheme('light');
    }
    if (!handledByPreset) {
      render(true);
    }
    window.addEventListener('message', (event) => {
      if (!event || !event.data || typeof event.data !== 'object') return;
      if (event.data.type === 'ish-theme') {
        applyElectricalTheme(event.data.theme);
        return;
      }
      if (event.data.type !== 'ish:setElectricalPreset') return;
      const didPresetRender = applyElectricalPresetPayload(event.data);
      if (!didPresetRender) {
        render(true);
      }
    });
    window.requestAnimationFrame(animate);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

  </script>
</body>
</html>
